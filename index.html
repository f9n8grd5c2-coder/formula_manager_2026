      major: { id: 'major', label: 'Evoluzione', cost: 15.5, races: 3, gain: 4.6, desc: 'Grande sviluppo ad alto impatto' }

function formatLapTime(sec) {
  if (!sec || typeof sec !== 'number' || !isFinite(sec) || sec >= 890 || sec <= 0) return '--:--.---';
  const totalMs = Math.round(sec * 1000);
  const mins = Math.floor(totalMs / 60000);
  const remMs = totalMs % 60000;
  const wholeSecs = Math.floor(remMs / 1000);
  const millis = remMs % 1000;
  return `${mins}:${String(wholeSecs).padStart(2, '0')}.${String(millis).padStart(3, '0')}`;
}

function getEstimatedStints(track, rules) {
  const trackDegMult = track.tyreDeg === 3 ? 1.24 : track.tyreDeg === 2 ? 1.0 : 0.84;
  const ruleMult = (rules && rules.extraDegMultiplier) ? rules.extraDegMultiplier : 1.0;

  const calcRange = (compoundKey) => {
    const comp = TYRE_COMPOUNDS[compoundKey];
    const rate = comp.degRate * trackDegMult * ruleMult;
    const avgLaps = Math.max(5, Math.round(66 / rate));
    const minLaps = Math.max(4, Math.min(Math.max(6, track.laps - 4), avgLaps - 2));
    const maxLaps = Math.max(minLaps + 2, Math.min(Math.max(8, track.laps - 3), avgLaps + 2));
    return `${minLaps}-${maxLaps}`;
  };

  return { S: calcRange('S'), M: calcRange('M'), H: calcRange('H') };
}

function getMoodMeta(moodValue) {
  const val = Math.max(0, Math.min(100, Number(moodValue ?? 65)));
  if (val >= 82) return { label: 'Euforico', emoji: '🔥', color: 'text-emerald-400', bg: 'bg-emerald-950/50 border-emerald-500/40', paceDelta: -0.35, degMult: 0.90 };
  if (val >= 62) return { label: 'Motivato', emoji: '😄', color: 'text-sky-300', bg: 'bg-sky-950/40 border-sky-500/35', paceDelta: -0.15, degMult: 0.96 };
  if (val >= 42) return { label: 'Neutro', emoji: '😐', color: 'text-slate-300', bg: 'bg-slate-800/70 border-slate-600/40', paceDelta: 0.0, degMult: 1.0 };
  if (val >= 22) return { label: 'Teso', emoji: '😟', color: 'text-amber-300', bg: 'bg-amber-950/50 border-amber-500/40', paceDelta: 0.22, degMult: 1.07 };
  return { label: 'Frustrato', emoji: '😡', color: 'text-red-400', bg: 'bg-red-950/60 border-red-500/45', paceDelta: 0.45, degMult: 1.15 };
}

function getAffinityScore(driver, team, allDrivers = []) {
  if (!driver || !team) return 65;
  let score = 62;

  if (!driver.preferredDna || driver.preferredDna === 'balanced' || team.dna === 'balanced') {
    score += 5;
  } else if (driver.preferredDna === team.dna) {
    score += 12;
  } else {
    score -= 7;
  }

  if (driver.role === 'lead') {
    score += team.prestige >= 85 ? 8 : 3;
  } else if (driver.role === 'support') {
    score += driver.acceptsSupport ? 8 : -16;
  } else {
    score += 4;
  }

  const mate = allDrivers.find(d => d.teamId === team.id && d.id !== driver.id);
  if (mate && gameState?.rivalries) {
    const riv = getRivalryValue(driver.id, mate.id);
    if (riv >= 65) score -= 10;
    else if (riv >= 40) score -= 4;
  }

  score += Math.round(((driver.mood ?? 65) - 65) * 0.25);
  return Math.max(20, Math.min(99, score));
}

function getRivalryKey(idA, idB) {
  return [idA, idB].sort().join('__');
}

function getRivalryValue(idA, idB) {
  if (!gameState?.rivalries || !idA || !idB || idA === idB) return 0;
  return gameState.rivalries[getRivalryKey(idA, idB)] || 0;
}

function bumpRivalry(idA, idB, delta, note = '') {
  if (!gameState || !idA || !idB || idA === idB) return;
  gameState.rivalries = gameState.rivalries || {};
  const key = getRivalryKey(idA, idB);
  const prev = gameState.rivalries[key] || 0;
  const next = Math.max(0, Math.min(100, Math.round(prev + delta)));
  gameState.rivalries[key] = next;

  const dA = gameState.drivers.find(d => d.id === idA);
  const dB = gameState.drivers.find(d => d.id === idB);
  if (dA && dB && next - prev >= 8 && note) {
    pushMediaQuote('Rivalità', `${dA.code} vs ${dB.code} (${next}/100): ${note}`);
  }
}

function pushMediaQuote(sourceTag, text) {
  if (!gameState) return;
  gameState.mediaFeed = gameState.mediaFeed || [];
  gameState.mediaFeed.unshift({
    id: `m_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
    round: gameState.round,
    source: sourceTag,
    text
  });
  if (gameState.mediaFeed.length > 45) gameState.mediaFeed.length = 45;
  gameState.newsFeed.unshift(`🗞️ [${sourceTag}] ${text}`);
}

function checkTransferRequestStatus(driver) {
  if (!driver) return;
  const shouldRequest = (driver.mood ?? 65) <= 28 || (!driver.acceptsSupport && driver.role === 'support');
  if (shouldRequest && !driver.transferRequest) {
    driver.transferRequest = true;
    if (driver.teamId === gameState.userTeamId) {
      pushMediaQuote('Pilota', `${driver.name} ha comunicato al muretto di voler valutare altre opzioni sul mercato se la situazione non cambia.`);
    }
  } else if (!shouldRequest && (driver.mood ?? 65) >= 55 && driver.role !== 'support') {
    driver.transferRequest = false;
  }
}

function adjustDriverMood(driverId, delta, reasonText = '') {
  if (!gameState) return;
  const driver = gameState.drivers.find(d => d.id === driverId);
  if (!driver) return;
  const prev = driver.mood ?? 65;
      const next = Math.max(0, Math.min(100, Math.round(prev + delta)));
      driver.mood = next;
      checkTransferRequestStatus(driver);
      const diff = next - prev;
      if (driver.teamId === gameState.userTeamId && Math.abs(diff) >= 2 && reasonText) {
        const sign = diff > 0 ? `+${diff}` : `${diff}`;
        gameState.newsFeed.unshift(`UMORE ${driver.code} (${sign} -> ${next}/100):${reasonText}`);
      }
    }

      const baseBrake = Math.max(1, Math.min(10, 11 - track.topSpeed));
      const baseRide = Math.max(1, Math.min(10, track.tyreDeg === 3 ? 6 : (track.downforce >= 8 ? 5 : 7)));
      const baseDiff = Math.max(1, Math.min(10, track.tyreDeg === 3 ? 6 : 5));

      const targetD1 = {
        wing: track.downforce,
        susp: baseSusp,
        brake: baseBrake,
        ride: baseRide,
        diff: baseDiff
      };
      const targetD2 = {

        susp: Math.max(1, Math.min(10, baseSusp + (baseSusp < 8 ? 1 : -1))),

        const p = parseFloat(dot.getAttribute('data-track-progress') || '0');

        const pt = pathEl.getPointAtLength(normalized * totalLen);
        dot.setAttribute('cx', pt.x.toFixed(1));
        dot.setAttribute('cy', pt.y.toFixed(1));
      });

    function runPracticeSession() {
      const fp = gameState.weekend.fp;
      if (fp.session > 3) return;
      const targetsMap = gameState.weekend.driverTargets || {
        d1: gameState.weekend.targets,
        d2: gameState.weekend.targets
      };

      ['d1', 'd2'].forEach(slot => {
        const data = fp[slot];
        if (!data) return;
        const t = targetsMap[slot] || gameState.weekend.targets;
        const diffWing = data.wing - t.wing;
        const diffSusp = data.susp - t.susp;
        const diffBrake = data.brake - t.brake;
        const diffRide = (data.ride ?? 5) - (t.ride ?? 5);
        const diffDiff = (data.diff ?? 5) - (t.diff ?? 5);

        const totalError = Math.abs(diffWing) + Math.abs(diffSusp) + Math.abs(diffBrake) + Math.abs(diffRide) + Math.abs(diffDiff);
        const rawConf = Math.max(30, Math.min(100, 100 - totalError * 4.5));
        const improved = rawConf > data.confidence || (data.lastError !== null && totalError < data.lastError);
        data.confidence = Math.max(data.confidence, rawConf);
        data.lastError = totalError;
        data.fpRunsDone += 1;

        const userDrivers = getUserDrivers();
        const drvObj = slot === 'd1' ? userDrivers[0] : userDrivers[1];
        if (drvObj) {
          adjustDriverMood(drvObj.id, improved ? 2 : -1, improved ? 'Progresso assetto nelle prove libere' : 'Assetto ancora da sistemare nelle FP');
        }

        const sentences = [];
        if (diffWing === 0) {
          sentences.push('Ali bilanciate: carico e velocità di punta sono in linea con il tracciato.');
        } else if (diffWing < -1) {
          sentences.push('Poca deportanza nei curvoni: serve alzare l’incidenza delle ali.');
        } else if (diffWing < 0) {
          sentences.push('Manca un leggero carico aerodinamico in curva: prova ad aggiungere 1 tacca di ala.');
        } else if (diffWing > 1) {
          sentences.push('Ali troppo cariche e penalizzanti sui rettilinei: conviene scaricare l’incidenza.');
        } else {
          sentences.push('Leggero eccesso di ala: un piccolo scarico aiuta in allungo.');
        }

        if (diffSusp === 0) {
          sentences.push('Sospensioni ben accordate sui cordoli.');
        } else if (diffSusp < 0) {
          sentences.push('Sospensioni troppo morbide: irrigidisci per maggiore reattività.');
        } else {
          sentences.push('Sospensioni troppo rigide: ammorbidisci per assorbire meglio i cordoli.');
        }

        if (diffRide < -1) {
          sentences.push('Altezza da terra troppo bassa: la vettura tocca il fondo e rischia usura eccessiva.');
        } else if (diffRide > 1) {
          sentences.push('Altezza/pressioni troppo alte: si perde efficienza aerodinamica.');
        }

        if (diffDiff < -1) {
          sentences.push('Differenziale troppo aperto in uscita curva: chiudilo leggermente per migliorare la trazione.');
        } else if (diffDiff > 1) {
          sentences.push('Differenziale troppo chiuso: tende a spingere il muso largo in uscita.');
        }

        if (diffBrake < 0) {
          sentences.push('Freni troppo arretrati: sposta il bilanciamento più avanti in staccata.');
        } else if (diffBrake > 0) {
          sentences.push('Freni troppo sbilanciati sull’anteriore: arretra leggermente per evitare bloccaggi.');
        }

        data.feedback = sentences.join(' ');
      });

      fp.runsLeftInSession = (fp.runsLeftInSession ?? 3) - 1;
      if (fp.runsLeftInSession <= 0) {
        if (fp.session < 3) {
          fp.session += 1;
          fp.runsLeftInSession = 3;
          showToast(`Sessione FP${fp.session - 1} terminata: inizia FP${fp.session} (3 run)!`, 'info');
        } else {
          fp.session = 4;
          fp.runsLeftInSession = 0;
          showToast('Tutte le sessioni di Prove Libere completate!', 'success');
        }
      } else {
        showToast(`Run completato! Restano ${fp.runsLeftInSession} run in FP${fp.session}.`, 'info');
      }

      saveGame();
      renderApp();
    }

    function startQualifying() {
      stopAllLoops();
      const track = CALENDAR_2026[gameState.round - 1];
      const fp = gameState.weekend.fp;
      const userDrivers = getUserDrivers();
      const weather = Math.random() < track.rainChance * 0.55 ? 'wet' : 'dry';
      const initialGrip = weather === 'wet' ? 54 : 68;

      const entries = gameState.drivers.map(d => {
        const isUser = d.teamId === gameState.userTeamId;
        let confBonus = 0.65;
        let plan = 'race';
        if (isUser) {
          const slot = userDrivers[0]?.id === d.id ? fp.d1 : fp.d2;
          confBonus = (slot?.confidence || 45) / 100;
          plan = slot?.plan || 'race';
        }
        return {
          driverId: d.id,
          name: d.name,
          code: d.code,
          number: d.number,
          teamId: d.teamId,
          isUser,
          bestTime: 999,
          eliminated: false,
          eliminatedIn: null,
          status: 'BOX',
          runTimer: 0,
          progress: 0,
          selectedTyre: weather === 'wet' ? 'I' : 'S',
          confBonus,
          plan,
          aiRunsLeft: isUser ? 0 : 2
        };
      });

      gameState.weekend.phase = 'quali';
      gameState.weekend.quali = {
        roundName: 'Q1',
        cutoff: 16,
        timeLeft: 1080,
        speed: 1,
        weather,
        trackGrip: initialGrip,
        entries

      saveGame();
      renderApp();
    }

    function setQualiSpeed(spd) {
      if (!gameState.weekend?.quali) return;

      saveGame();
      renderApp();

    function selectQualiTyre(driverId, tyreCode) {
      const q = gameState.weekend?.quali;
      if (!q) return;
      const entry = q.entries.find(e => e.driverId === driverId);
      if (!entry || entry.status !== 'BOX') return;
      entry.selectedTyre = tyreCode;
      saveGame();
      renderApp();
    }

    function sendDriverOutQuali(driverId) {
      const q = gameState.weekend?.quali;
      if (!q || q.timeLeft <= 60) return;
      const entry = q.entries.find(e => e.driverId === driverId);
      if (!entry || entry.eliminated || entry.status !== 'BOX') return;
      entry.status = 'OUT_LAP';
      entry.runTimer = 0;
      entry.progress = 0.02;
      showToast(`${entry.code} esce dai box con gomma ${TYRE_COMPOUNDS[entry.selectedTyre].name}!`, 'info');
      saveGame();
      renderApp();
    }

    function tickQualiSecond() {
      const q = gameState.weekend?.quali;
      if (!q || gameState.weekend.phase !== 'quali' || q.speed === 0) return;
      const track = CALENDAR_2026[gameState.round - 1];
      const step = q.speed * 4;
      q.timeLeft = Math.max(0, q.timeLeft - step);

      q.entries.forEach(entry => {
        if (entry.eliminated || entry.isUser) return;
        if (entry.status === 'BOX' && entry.aiRunsLeft > 0) {
          if ((q.timeLeft < 860 && entry.aiRunsLeft === 2) || (q.timeLeft < 340 && entry.aiRunsLeft === 1)) {
            if (Math.random() < 0.25) {
              entry.aiRunsLeft -= 1;
              entry.selectedTyre = q.weather === 'wet' ? 'I' : 'S';
              entry.status = 'OUT_LAP';
              entry.runTimer = 0;
            }
          }
        }
      });

      const activeCarsOnTrack = q.entries.filter(e => !e.eliminated && e.status !== 'BOX').length;

      const currentGrip = q.trackGrip ?? (q.weather === 'wet' ? 54 : 68);
      const gripGain = activeCarsOnTrack * 0.035 * (q.weather === 'wet' ? 0.35 : 1.0);
      const weatherGripDelta = q.weather === 'wet' ? -0.06 : 0.01;
      q.trackGrip = Math.max(38, Math.min(100, Number((currentGrip + gripGain + weatherGripDelta).toFixed(1))));

      q.entries.forEach(entry => {
        if (entry.eliminated || entry.status === 'BOX') return;
        entry.runTimer += step;

        if (entry.status === 'OUT_LAP') {
          if (entry.runTimer >= 85) {
            entry.status = 'HOT_LAP';
            entry.runTimer = 0;
            entry.progress = 0.01;
          }
        } else if (entry.status === 'HOT_LAP') {
          if (entry.runTimer >= track.baseLap) {
            const driver = gameState.drivers.find(d => d.id === entry.driverId);
            const team = getTeam(entry.teamId);
            const moodMeta = getMoodMeta(driver.mood ?? 65);
            const comp = TYRE_COMPOUNDS[entry.selectedTyre];
            const carPerf = (team.aero * 0.42 + team.pu * 0.35 + team.chassis * 0.23);
            const carDelta = (90 - carPerf) * 0.09;
            const driverDelta = (90 - driver.pace) * 0.06;
            const setupDelta = entry.isUser ? -(entry.confBonus * 0.42) - (entry.plan === 'quali' ? 0.28 : 0) : -0.25;
            const gripDelta = ((82 - q.trackGrip) * 0.024);
            const trafficPenalty = Math.max(0, (activeCarsOnTrack - 6) * 0.06);
            let weatherPenalty = 0;
            if (q.weather === 'wet' && comp.wet === 0) weatherPenalty = driver.trait === 'wet_ace' ? 6.2 : 8.5;
            if (q.weather === 'dry' && comp.wet > 0) weatherPenalty = 4.2;

            const lap = track.baseLap + carDelta + driverDelta + setupDelta + moodMeta.paceDelta + comp.paceBonus + gripDelta + trafficPenalty + weatherPenalty + (Math.random() - 0.5) * 0.28;
            if (lap < entry.bestTime) entry.bestTime = lap;

            entry.status = 'IN_LAP';
            entry.runTimer = 0;
            entry.progress = 0.01;
          }
        } else if (entry.status === 'IN_LAP') {
          if (entry.runTimer >= 80) {
            entry.status = 'BOX';
            entry.runTimer = 0;
            entry.progress = 0;
          }
        }
      });

      if (q.timeLeft <= 0) {
        q.speed = 0;
        const active = q.entries.filter(e => !e.eliminated).sort((a, b) => a.bestTime - b.bestTime);
        if (q.roundName === 'Q1') {
          active.slice(16).forEach(e => { e.eliminated = true; e.eliminatedIn = 'Q1'; e.status = 'BOX'; });
        } else if (q.roundName === 'Q2') {
          active.slice(10).forEach(e => { e.eliminated = true; e.eliminatedIn = 'Q2'; e.status = 'BOX'; });
        }
      }

      saveGame();
      renderApp();
    }

    function advanceQualiSession() {
      const q = gameState.weekend?.quali;
      if (!q) return;
      q.entries.forEach(e => { e.status = 'BOX'; e.runTimer = 0; e.progress = 0; });
      if (q.roundName === 'Q1') {
        q.roundName = 'Q2';
        q.cutoff = 10;
        q.timeLeft = 900;
        q.speed = 1;
        q.trackGrip = Math.min(100, Number(((q.trackGrip ?? 75) + 4.5).toFixed(1)));
        q.entries.filter(e => !e.eliminated).forEach(e => { e.bestTime = 999; e.aiRunsLeft = e.isUser ? 0 : 2; });
      } else if (q.roundName === 'Q2') {
        q.roundName = 'Q3';
        q.cutoff = 10;
        q.timeLeft = 720;
        q.speed = 1;
        q.trackGrip = Math.min(100, Number(((q.trackGrip ?? 82) + 4.0).toFixed(1)));
        q.entries.filter(e => !e.eliminated).forEach(e => { e.bestTime = 999; e.aiRunsLeft = e.isUser ? 0 : 2; });
      }
      saveGame();
      renderApp();
    }

    function startQualiSmoothLoop() {
      stopAllLoops();
      const q = gameState?.weekend?.quali;
      if (!q || gameState.weekend.phase !== 'quali') return;

      const track = CALENDAR_2026[gameState.round - 1];
      syncTrackCarPositions('fm-quali-svg');
      lastAnimTimestamp = performance.now();

      const animateQuali = (now) => {
        const dt = Math.min(0.1, (now - lastAnimTimestamp) / 1000);
        lastAnimTimestamp = now;

        const curQ = gameState?.weekend?.quali;
        if (curQ && curQ.speed > 0 && gameState.weekend.phase === 'quali') {
          const simSec = dt * curQ.speed * 4;
          curQ.entries.forEach(entry => {
            if (entry.eliminated || entry.status === 'BOX') return;
            const segDur = entry.status === 'HOT_LAP' ? track.baseLap : (entry.status === 'OUT_LAP' ? 85 : 80);
            entry.progress = (((entry.progress || 0) + simSec / segDur) % 1 + 1) % 1;
            const dot = document.getElementById(`quali-dot-${entry.driverId}`);
            if (dot) dot.setAttribute('data-track-progress', entry.progress.toFixed(4));
          });
          syncTrackCarPositions('fm-quali-svg');
        }
        animFrameId = requestAnimationFrame(animateQuali);
      };
      animFrameId = requestAnimationFrame(animateQuali);

      const ms = q.speed > 0 ? Math.max(250, 1000 / q.speed) : 1000;
      simTimer = setInterval(() => {
        if (gameState?.weekend?.quali && gameState.weekend.quali.speed > 0 && gameState.weekend.phase === 'quali') {
          tickQualiSecond();
        }
      }, ms);
    }

    function openPreRaceStrategy() {
      stopAllLoops();
      const q = gameState.weekend.quali;
      const track = CALENDAR_2026[gameState.round - 1];
      const active = q.entries.filter(e => !e.eliminated).sort((a, b) => a.bestTime - b.bestTime);
      const elimQ2 = q.entries.filter(e => e.eliminatedIn === 'Q2').sort((a, b) => a.bestTime - b.bestTime);
      const elimQ1 = q.entries.filter(e => e.eliminatedIn === 'Q1').sort((a, b) => a.bestTime - b.bestTime);
      const gridOrder = [...active, ...elimQ2, ...elimQ1];

      const makePlanForDriver = (driverId) => {
        const gridIdx = gridOrder.findIndex(e => e.driverId === driverId);
        const gridPos = gridIdx >= 0 ? gridIdx + 1 : 12;
        const stops = track.tyreDeg === 3 ? 2 : (track.laps >= 68 ? 2 : 1);
        const pit1 = Math.max(5, Math.min(track.laps - 8, Math.round(track.laps / (stops + 1))));
        const pit2 = Math.max(pit1 + 6, Math.min(track.laps - 4, Math.round((track.laps * 2) / (stops + 1))));
        const pit3 = Math.max(pit2 + 5, Math.min(track.laps - 2, Math.round((track.laps * 3) / (stops + 1))));
        return {
          driverId,
          gridPos,
          startTyre: track.tyreDeg === 3 ? 'M' : 'S',
          stopsCount: stops,
          pitLaps: [pit1, pit2, pit3],
          stintTyres: ['M', 'H', 'S', 'H'],
          initialPace: 'balanced'
        };
      };

      const userDrivers = getUserDrivers();
      gameState.weekend.preRaceStrategy = {
        d1: userDrivers[0] ? makePlanForDriver(userDrivers[0].id) : null,
        d2: userDrivers[1] ? makePlanForDriver(userDrivers[1].id) : null
      };
      gameState.weekend.phase = 'strategy';
      saveGame();
      renderApp();
    }

            <div class="flex items-center justify-between text-[11px] font-mono-num mt-2 bg-f1bg p-2 rounded-xl border border-f1border/70">
              <span class="text-slate-400">Durata Stint:</span>
              <span class="text-red-400 font-bold">S: ${stints.S}g</span>
              <span class="text-amber-300 font-bold">M: ${stints.M}g</span>
              <span class="text-slate-200 font-bold">H: ${stints.H}g</span>
            </div>
          </div>

          ${renderDriverStrategyCard(userDrivers[0], 'd1')}
          ${renderDriverStrategyCard(userDrivers[1], 'd2')}

          <button onclick="launchRaceFromStrategy()" class="w-full py-4 rounded-xl bg-f1red hover:bg-red-600 font-extrabold text-sm text-white shadow-lg shadow-f1red/25">
            🚦 CONFERMA STRATEGIA & SPEGNI I SEMAFORI →
          </button>
        </div>
      `;
    }
    function launchRaceFromStrategy() {
      stopAllLoops();
      const track = CALENDAR_2026[gameState.round - 1];
      const q = gameState.weekend.quali;
      const stratObj = gameState.weekend.preRaceStrategy;
      const userDrivers = getUserDrivers();

      let gridOrder = [];
      if (q && q.entries) {
        const active = q.entries.filter(e => !e.eliminated).sort((a, b) => a.bestTime - b.bestTime);
        const elimQ2 = q.entries.filter(e => e.eliminatedIn === 'Q2').sort((a, b) => a.bestTime - b.bestTime);
        const elimQ1 = q.entries.filter(e => e.eliminatedIn === 'Q1').sort((a, b) => a.bestTime - b.bestTime);
        gridOrder = [...active, ...elimQ2, ...elimQ1];
      } else {
        gridOrder = [...gameState.drivers].sort((a, b) => b.ovr - a.ovr).map(d => ({ driverId: d.id }));
      }

      const initialWeather = q?.weather === 'wet' ? 'wet' : (Math.random() < track.rainChance * 0.45 ? 'damp' : 'dry');

      const cars = gridOrder.map((entry, idx) => {
        const driver = gameState.drivers.find(d => d.id === entry.driverId) || gameState.drivers[idx];
        const team = getTeam(driver.teamId);
        const isUser = driver.teamId === gameState.userTeamId;
        const slotKey = userDrivers[0]?.id === driver.id ? 'd1' : (userDrivers[1]?.id === driver.id ? 'd2' : null);
        const userPlan = slotKey ? stratObj?.[slotKey] : null;
        const fpSlot = slotKey ? gameState.weekend.fp?.[slotKey] : null;

        const startTyre = initialWeather === 'wet'
          ? 'W'
          : (initialWeather === 'damp'
            ? 'I'
            : (userPlan?.startTyre || (track.tyreDeg === 3 ? 'M' : 'S')));

        const plannedStops = userPlan
          ? userPlan.stopsCount
          : (track.tyreDeg === 3 ? 2 : (track.laps >= 68 ? 2 : 1));

        const pitLap1 = userPlan?.pitLaps?.[0] || Math.max(5, Math.min(track.laps - 7, Math.round(track.laps / (plannedStops + 1))));
        const pitLap2 = userPlan?.pitLaps?.[1] || Math.max(pitLap1 + 6, Math.min(track.laps - 4, Math.round((track.laps * 2) / (plannedStops + 1))));
        const pitLap3 = userPlan?.pitLaps?.[2] || Math.max(pitLap2 + 5, Math.min(track.laps - 2, Math.round((track.laps * 3) / (plannedStops + 1))));

        return {
          driverId: driver.id,
          name: driver.name,
          code: driver.code,
          number: driver.number,
          teamId: driver.teamId,
          isUser,
          gridPos: idx + 1,
          pos: idx + 1,
          lap: 1,
          progress: Math.max(0.01, (1 - idx * 0.012 + 1) % 1),
          gapToLeader: idx * 0.35,
          lastLap: 0,
          bestLap: 999,
          tyre: startTyre,
          tyreWear: 0,
          pitStops: 0,
          plannedStops,
          pitLaps: [pitLap1, pitLap2, pitLap3],
          stintTyres: userPlan?.stintTyres || ['H', 'M', 'H', 'S'],
          paceMode: isUser ? (userPlan?.initialPace || 'balanced') : 'balanced',
          fpPlan: fpSlot?.plan || 'race',
          confBonus: isUser ? ((fpSlot?.confidence || 45) / 100) : 0.65,
          retired: false,
          pitAnim: { mode: 'none', t: 0, targetTyre: null }
        };
      });

      const banner = initialWeather === 'wet'
        ? { type: 'rain', title: 'PIOGGIA IN CORSO', detail: 'Asfalto bagnato al via: monitora mescole Intermedie e Wet.' }
        : (initialWeather === 'damp'
          ? { type: 'rain', title: 'ASFALTO UMIDO', detail: 'Possibile finestra per gomme Intermedie se l’umidità sale.' }
          : null);

      gameState.weekend.phase = 'race';
      gameState.weekend.race = {
        lap: 1,
        totalLaps: track.laps,
        weather: initialWeather,
        safetyCar: 'NONE',
        scLapsLeft: 0,
        speed: 1,
        radioOpen: false,
        radioFilter: 'all',
        alertBanner: banner,
        logs: [
          `Semafori spenti a ${track.name}! Meteo iniziale: ${initialWeather === 'wet' ? 'Bagnato' : initialWeather === 'damp' ? 'Umido' : 'Asciutto'}.`
        ],
        cars
      };

      saveGame();
      renderApp();
    }

    function dismissRaceAlert() {
      if (!gameState?.weekend?.race) return;
      gameState.weekend.race.alertBanner = null;
      renderApp();
    }

    function setRaceSpeed(spd) {
      if (!gameState.weekend?.race) return;
      gameState.weekend.race.speed = spd;
      saveGame();
      renderApp();
    }

    function setRacePace(driverId, mode) {
      const r = gameState.weekend?.race;
      if (!r) return;
      const car = r.cars.find(c => c.driverId === driverId && !c.retired);
      if (!car) return;
      car.paceMode = mode;
      const lbl = mode === 'push' ? 'Attacco' : mode === 'conserve' ? 'Conservativo' : 'Bilanciato';
      r.logs.unshift(`G${r.lap} • ${car.code}: ritmo impostato su ${lbl}.`);
      saveGame();
      renderApp();
    }

    function orderPitStop(driverId, tyreCode) {
      const r = gameState.weekend?.race;
      if (!r) return;
      const car = r.cars.find(c => c.driverId === driverId && !c.retired);
      if (!car) return;
      car.pitAnim = { mode: 'pit_in', t: 0, targetTyre: tyreCode };
      r.logs.unshift(`G${r.lap} • BOX BOX per ${car.code} -> gomme ${TYRE_COMPOUNDS[tyreCode].name}!`);
      saveGame();
      renderApp();
    }

    function toggleRaceRadio() {
      if (!gameState.weekend?.race) return;
      gameState.weekend.race.radioOpen = !gameState.weekend.race.radioOpen;
      renderApp();
    }

    function setRaceRadioFilter(flt) {
      if (!gameState.weekend?.race) return;
      gameState.weekend.race.radioFilter = flt;
      renderApp();
    }

    function computeCarLapSeconds(car, race, track) {
      const driver = gameState.drivers.find(d => d.id === car.driverId);
      const team = getTeam(car.teamId);
      const moodMeta = getMoodMeta(driver?.mood ?? 65);
      const comp = TYRE_COMPOUNDS[car.tyre] || TYRE_COMPOUNDS.M;
      const carPerf = (team.aero * 0.40 + team.pu * 0.36 + team.chassis * 0.24);
      const carDelta = (90 - carPerf) * 0.085;
      const driverDelta = (90 - (driver?.pace ?? 82)) * 0.055;
      const paceDelta = car.paceMode === 'push' ? -0.42 : (car.paceMode === 'conserve' ? 0.45 : 0);
      const wearDelta = (car.tyreWear / 100) * 2.25;
      const setupDelta = car.isUser ? -(car.confBonus * 0.35) - (car.fpPlan === 'race' ? 0.22 : 0) : -0.18;

      let weatherDelta = 0;
      if (race.weather === 'wet') {
        if (comp.wet === 2) weatherDelta = -0.3;
        else if (comp.wet === 1) weatherDelta = 0.6;
        else weatherDelta = driver?.trait === 'wet_ace' ? 5.8 : 8.2;
      } else if (race.weather === 'damp') {
        if (comp.wet === 1) weatherDelta = -0.2;
        else if (comp.wet === 2) weatherDelta = 1.8;
        else weatherDelta = 1.4;
      } else {
        if (comp.wet > 0) weatherDelta = 3.8;
      }

      const scDelta = race.safetyCar === 'SC' ? 14.0 : (race.safetyCar === 'VSC' ? 6.5 : 0);
      const noise = (Math.random() - 0.5) * 0.32;
      return Math.max(58.0, track.baseLap + carDelta + driverDelta + paceDelta + wearDelta + setupDelta + moodMeta.paceDelta + comp.paceBonus + weatherDelta + scDelta + noise);
    }

    function tickRaceLap() {
      const r = gameState.weekend?.race;
      if (!r || gameState.weekend.phase !== 'race') return;
      const track = CALENDAR_2026[gameState.round - 1];

      if (r.safetyCar !== 'NONE') {
        r.scLapsLeft -= 1;
        if (r.scLapsLeft <= 0) {
          const wasSC = r.safetyCar === 'SC';
          r.safetyCar = 'NONE';
          r.alertBanner = {
            type: 'sc',
            title: 'BANDIERA VERDE • GARA RIPRESA',
            detail: wasSC ? 'Safety Car rientrata ai box: via libera al sorpasso!' : 'Virtual Safety Car terminata: ritmo pieno ristabilito.'
          };
          r.logs.unshift(`🟢 G${r.lap} • Bandiera verde! ${wasSC ? 'Safety Car rientrata.' : 'VSC terminata.'}`);
        }
      } else if (r.lap > 3 && r.lap < r.totalLaps - 2) {
        const roll = Math.random();
        if (roll < 0.045) {
          r.safetyCar = 'VSC';
          r.scLapsLeft = 2;
          r.alertBanner = {
            type: 'sc',
            title: '⚠️ VIRTUAL SAFETY CAR (VSC)',
            detail: 'Ritmo ridotto in pista: finestra pit stop vantaggiosa per risparmiare tempo.'
          };
          r.logs.unshift(`🟡 G${r.lap} • VIRTUAL SAFETY CAR in pista! Pit stop più economici.`);
        } else if (roll < 0.075) {
          r.safetyCar = 'SC';
          r.scLapsLeft = 3;
          r.alertBanner = {
            type: 'sc',
            title: '🚨 SAFETY CAR IN PISTA',
            detail: 'Gruppo compattato dietro la Safety Car: pit stop strategici a rischio minimo!'
          };
          r.logs.unshift(`🚨 G${r.lap} • SAFETY CAR in pista! Gruppo compattato.`);
        }
      }

      if (Math.random() < track.rainChance * 0.085) {
        if (r.weather === 'dry') {
          r.weather = 'damp';
          r.alertBanner = {
            type: 'rain',
            title: '🌧️ ARRIVA LA PIOGGIA • ASFALTO UMIDO',
            detail: 'Gocce sul tracciato: valuta le gomme Intermedie (I) se la pista si bagna ulteriormente.'
          };
          r.logs.unshift(`🌧️ G${r.lap} • Meteo in cambiamento: asfalto umido su alcuni settori!`);
        } else if (r.weather === 'damp') {
          r.weather = 'wet';
          r.alertBanner = {
            type: 'rain',
            title: '⛈️ PIOGGIA INTENSA • PISTA BAGNATA',
            detail: 'Asfalto bagnato: mescole Intermedie o Wet obbligatorie per evitare crolli di prestazione!'
          };
          r.logs.unshift(`⛈️ G${r.lap} • Pioggia decisa sul circuito! Valuta gomme Intermedie o Wet.`);
        }
      } else if (r.weather !== 'dry' && Math.random() < 0.09) {
        r.weather = r.weather === 'wet' ? 'damp' : 'dry';
        r.alertBanner = {
          type: 'rain',
          title: r.weather === 'dry' ? '☀️ PISTA IN ASCIUGATURA (SLICK)' : '🌤️ PIOGGIA IN ATTENUAZIONE',
          detail: r.weather === 'dry' ? 'Traiettoria asciutta: le gomme slick tornano rapidamente più veloci.' : 'Pioggia in calo: asfalto ancora umido.'
        };
        r.logs.unshift(`🌤️ G${r.lap} • Il meteo migliora: ${r.weather === 'dry' ? 'pista asciutta' : 'asfalto umido'}.`);
      }

      const activeCars = r.cars.filter(c => !c.retired);
      const leaderBefore = [...activeCars].sort((a, b) => a.gapToLeader - b.gapToLeader)[0];
      const leaderLapSec = leaderBefore ? computeCarLapSeconds(leaderBefore, r, track) : track.baseLap;

      activeCars.forEach(car => {
        const driver = gameState.drivers.find(d => d.id === car.driverId);
        const team = getTeam(car.teamId);
        const moodMeta = getMoodMeta(driver?.mood ?? 65);
        const comp = TYRE_COMPOUNDS[car.tyre] || TYRE_COMPOUNDS.M;
        const trackDegMult = track.tyreDeg === 3 ? 1.24 : track.tyreDeg === 2 ? 1.0 : 0.84;
        const ruleDegMult = gameState.rules?.extraDegMultiplier || 1.0;
        const paceDegMult = car.paceMode === 'push' ? 1.32 : (car.paceMode === 'conserve' ? 0.72 : 1.0);
        const traitDegMult = driver?.trait === 'attacker' ? 1.08 : (driver?.trait === 'tactician' ? 0.92 : 1.0);
        const mgmtFactor = Math.max(0.75, 1.15 - ((driver?.tyreMgmt ?? 82) - 70) * 0.004);
        const fpTyreFactor = car.isUser && car.fpPlan === 'tyre' ? 0.86 : 1.0;

        car.tyreWear = Math.min(100, car.tyreWear + comp.degRate * trackDegMult * ruleDegMult * paceDegMult * traitDegMult * mgmtFactor * fpTyreFactor * moodMeta.degMult);

        if (!car.isUser && car.pitAnim.mode === 'none') {
          const nextStopIdx = car.pitStops;
          const scheduledLap = car.pitLaps?.[nextStopIdx];
          const needWetSwap = (r.weather === 'wet' && comp.wet === 0) || (r.weather === 'dry' && comp.wet > 0);
          if (needWetSwap || car.tyreWear >= 76 || (scheduledLap && r.lap >= scheduledLap && car.pitStops < car.plannedStops)) {
            let nextTyre = car.stintTyres?.[nextStopIdx] || (car.tyre === 'S' ? 'M' : 'H');
            if (r.weather === 'wet') nextTyre = 'I';
            else if (r.weather === 'dry' && TYRE_COMPOUNDS[nextTyre]?.wet > 0) nextTyre = car.tyreWear > 55 ? 'H' : 'M';
            car.pitAnim = { mode: 'pit_in', t: 0, targetTyre: nextTyre };
          }
        }

        if (car.pitAnim.mode === 'pit_in') {
          car.pitStops += 1;
          car.tyre = car.pitAnim.targetTyre || 'H';
          car.tyreWear = 0;
          car.pitAnim = { mode: 'pit_out', t: 0.25, targetTyre: null };
          const pitLoss = r.safetyCar === 'SC' ? 11.5 : (r.safetyCar === 'VSC' ? 16.0 : 21.5);
          car.gapToLeader += pitLoss;
          if (car.isUser) {
            r.logs.unshift(`🔧 G${r.lap} • ${car.code} monta gomme ${TYRE_COMPOUNDS[car.tyre].name} (Sosta #${car.pitStops}).`);
          }
        } else if (car.pitAnim.mode === 'pit_out') {
          car.pitAnim = { mode: 'none', t: 0, targetTyre: null };
        }

        const lapSec = computeCarLapSeconds(car, r, track);
        car.lastLap = lapSec;
        if (lapSec < car.bestLap) car.bestLap = lapSec;

        if (car.driverId !== leaderBefore?.driverId) {
          const deltaVsLeader = (lapSec - leaderLapSec) * (r.safetyCar === 'SC' ? 0.25 : 1.0);
          car.gapToLeader = Math.max(0.2, car.gapToLeader + deltaVsLeader);
        } else {
          car.gapToLeader = 0;
        }

        if (Math.random() < 0.0032 * (110 - (team.rel ?? 82)) * 0.045) {
          car.retired = true;
          r.logs.unshift(`💥 G${r.lap} • RITIRO per ${car.code} (${team.name}) per problema tecnico!`);
          if (car.isUser) {
            adjustDriverMood(car.driverId, -6, 'Ritiro tecnico in gara');
          }
        }
      });

      const remaining = r.cars.filter(c => !c.retired);
      if (remaining.length > 0) {
        remaining.sort((a, b) => a.gapToLeader - b.gapToLeader);
        const minGap = remaining[0].gapToLeader;
        remaining.forEach((c, idx) => {
          c.gapToLeader = Number((c.gapToLeader - minGap).toFixed(2));
          c.pos = idx + 1;
        });
      }

      const uCars = r.cars.filter(c => c.isUser && !c.retired);
      if (uCars.length === 2 && Math.abs(uCars[0].gapToLeader - uCars[1].gapToLeader) < 0.8 && r.lap > 4) {
        bumpRivalry(uCars[0].driverId, uCars[1].driverId, 1.5, `Ruota a ruota in casa ${getUserTeam().name}`);
      }

      if (r.lap >= r.totalLaps) {
        finishRaceAndSeason();
        return;
      }

      r.lap += 1;
      saveGame();
      renderApp();
    }

    function startRaceSmoothLoop() {
      stopAllLoops();
      const r = gameState?.weekend?.race;
      if (!r || gameState.weekend.phase !== 'race') return;

      const track = CALENDAR_2026[gameState.round - 1];
      syncTrackCarPositions('fm-race-svg');
      lastAnimTimestamp = performance.now();

      const animateRace = (now) => {
        const dt = Math.min(0.1, (now - lastAnimTimestamp) / 1000);
        lastAnimTimestamp = now;

        const curR = gameState?.weekend?.race;
        if (curR && curR.speed > 0 && gameState.weekend.phase === 'race') {
          const activeCars = curR.cars.filter(c => !c.retired).sort((a, b) => a.pos - b.pos);
          const leader = activeCars[0];
          const lapDurationSimSec = Math.max(1.2, 6.2 / curR.speed);
          const dProg = dt / lapDurationSimSec;

          if (leader) {
            leader.progress = (((leader.progress || 0) + dProg) % 1 + 1) % 1;
            const visualLapSec = Math.max(55, track.baseLap);
            const scVisualFactor = curR.safetyCar === 'SC' ? 0.25 : 1.0;

            activeCars.forEach(car => {
              const dot = document.getElementById(`race-dot-${car.driverId}`);
              if (car.pitAnim?.mode === 'pit_in' || car.pitAnim?.mode === 'pit_out') {
                car.pitAnim.t = Math.min(1, (car.pitAnim.t || 0) + dt * 1.4);
                const pt = getPitLaneCoord(car);
                if (dot && pt) {
                  dot.setAttribute('data-pit-mode', car.pitAnim.mode);
                  dot.setAttribute('cx', pt.x.toFixed(1));
                  dot.setAttribute('cy', pt.y.toFixed(1));
                }
              } else {
                if (dot) dot.setAttribute('data-pit-mode', 'none');
                if (car.driverId === leader.driverId) {
                  car.progress = leader.progress;
                } else {
                  const cappedGapSec = Math.min(car.gapToLeader || 0, visualLapSec * 0.52) * scVisualFactor;
                  const lapLag = cappedGapSec / visualLapSec;
                  car.progress = (((leader.progress - lapLag) % 1) + 1) % 1;
                }
                if (dot) dot.setAttribute('data-track-progress', car.progress.toFixed(4));
              }
            });
            syncTrackCarPositions('fm-race-svg');
          }
        }

        animFrameId = requestAnimationFrame(animateRace);
      };
      animFrameId = requestAnimationFrame(animateRace);

      const ms = r.speed > 0 ? Math.max(220, 4800 / r.speed) : 2000;
      simTimer = setInterval(() => {
        if (gameState?.weekend?.race && gameState.weekend.race.speed > 0 && gameState.weekend.phase === 'race') {
          tickRaceLap();
        }
      }, ms);
    }

    function renderRaceView() {
      const r = gameState.weekend.race;
      const track = CALENDAR_2026[gameState.round - 1];
      const orderedCars = [...r.cars].sort((a, b) => {
        if (a.retired && !b.retired) return 1;
        if (!a.retired && b.retired) return -1;
        return a.pos - b.pos;
      });
      const leader = orderedCars.find(c => !c.retired) || orderedCars[0];
      const userCarsFixed = r.cars.filter(c => c.isUser).sort((a, b) => a.gridPos - b.gridPos);

      const dotsHtml = orderedCars.filter(c => !c.retired).map(c => {
        const t = getTeam(c.teamId);
        const mode = c.pitAnim?.mode || 'none';
        const pitPt = (mode === 'pit_in' || mode === 'pit_out') ? getPitLaneCoord(c) : null;
        return `<circle id="race-dot-${c.driverId}" cx="${pitPt ? pitPt.x.toFixed(1) : '150'}" cy="${pitPt ? pitPt.y.toFixed(1) : '130'}" r="${c.isUser ? 5.2 : 3.6}" fill="${t.color}" stroke="${c.isUser ? '#ffffff' : '#0b0e14'}" stroke-width="1.2" data-pit-mode="${mode}" data-track-progress="${(c.progress || 0).toFixed(4)}"/>`;
      }).join('');

      const weatherBadge = r.weather === 'wet'
        ? '<span class="px-2 py-0.5 rounded bg-blue-600/30 border border-blue-400/50 text-blue-200 text-[10px] font-bold">⛈️ BAGNATO</span>'
        : (r.weather === 'damp'
          ? '<span class="px-2 py-0.5 rounded bg-emerald-600/30 border border-emerald-400/50 text-emerald-200 text-[10px] font-bold">🌧️ UMIDO</span>'
          : '<span class="px-2 py-0.5 rounded bg-amber-500/20 border border-amber-400/40 text-amber-200 text-[10px] font-bold">☀️ ASCIUTTO</span>');

      const scBadge = r.safetyCar === 'SC'
        ? '<span class="px-2 py-0.5 rounded bg-red-600 text-white text-[10px] font-extrabold animate-pulse">🚨 SAFETY CAR</span>'
        : (r.safetyCar === 'VSC'
          ? '<span class="px-2 py-0.5 rounded bg-amber-500 text-black text-[10px] font-extrabold">⚠️ VSC</span>'
          : '');

      const alertBannerHtml = r.alertBanner ? `
        <div class="p-3 rounded-2xl border-2 flex items-start justify-between gap-2 shadow-lg ${r.alertBanner.type === 'rain' ? 'bg-sky-950/90 border-sky-400 text-sky-100' : 'bg-amber-950/90 border-amber-400 text-amber-100'}">
          <div>
            <div class="text-xs font-black uppercase tracking-wide">${r.alertBanner.title}</div>
            <div class="text-[11px] opacity-95 mt-0.5 leading-snug">${r.alertBanner.detail}</div>
          </div>
          <button onclick="dismissRaceAlert()" class="px-2 py-1 rounded-lg bg-black/35 text-[10px] font-bold shrink-0">OK</button>
        </div>
      ` : '';

      const radioFilter = r.radioFilter || 'all';
      const filteredLogs = r.logs.filter(line => {
        if (radioFilter === 'alert') return line.includes('🌧️') || line.includes('⛈️') || line.includes('🌤️') || line.includes('SAFETY CAR') || line.includes('VSC') || line.includes('Bandiera verde');
        if (radioFilter === 'team') return userCarsFixed.some(uc => line.includes(uc.code));
        return true;
      });

      return `
        <div class="p-3.5 space-y-3">
          <div class="bg-f1card border border-f1border rounded-2xl p-3 flex items-center justify-between gap-2">
            <div>
              <div class="flex items-center gap-1.5 flex-wrap">
                <span class="text-xs font-mono-num font-black text-white">GIRO ${r.lap}/${r.totalLaps}</span>
                ${weatherBadge}
                ${scBadge}
              </div>
              <div class="text-[10px] text-slate-400 mt-0.5">${track.flag} ${track.name} • Leader: <strong class="text-white">${leader?.code || '-'}</strong></div>
            </div>
            <div class="flex items-center gap-1">
              ${[0, 1, 2, 4, 8].map(s => `
                <button onclick="setRaceSpeed(${s})" class="px-2 py-1.5 rounded-lg text-[10px] font-mono-num font-bold ${r.speed === s ? 'bg-f1red text-white' : 'bg-f1bg text-slate-400 border border-f1border'}">
                  ${s === 0 ? '⏸' : s + 'x'}

    function finishRaceAndSeason() {
      stopAllLoops();
      const r = gameState.weekend.race;
      const track = CALENDAR_2026[gameState.round - 1];
      const ordered = [...r.cars].sort((a, b) => {
        if (a.retired && !b.retired) return 1;
        if (!a.retired && b.retired) return -1;
        return a.pos - b.pos;
      });

      const ptsTable = gameState.rules?.pointsTop12
        ? [25, 18, 15, 12, 10, 8, 6, 5, 4, 3, 2, 1]
        : [25, 18, 15, 12, 10, 8, 6, 4, 2, 1];

      const classification = ordered.map((c, idx) => {
        const drv = gameState.drivers.find(d => d.id === c.driverId);
        const tm = getTeam(c.teamId);
        const pts = !c.retired && idx < ptsTable.length ? ptsTable[idx] : 0;

        if (drv) {
          drv.points = (drv.points || 0) + pts;
          if (!c.retired && idx === 0) drv.wins = (drv.wins || 0) + 1;
          if (!c.retired && idx < 3) drv.podiums = (drv.podiums || 0) + 1;

          if (c.isUser) {
            if (!c.retired && idx < 3) adjustDriverMood(drv.id, 8, `Podio a ${track.name} (P${idx + 1})`);
            else if (!c.retired && idx < 10) adjustDriverMood(drv.id, 3, `A punti a ${track.name} (P${idx + 1})`);
            else if (!c.retired) adjustDriverMood(drv.id, -3, `Gara difficile fuori dai punti (P${idx + 1})`);
          }
        }
        if (tm) {
          tm.points = (tm.points || 0) + pts;
          if (!c.retired && idx === 0) tm.wins = (tm.wins || 0) + 1;
          if (!c.retired && idx < 3) tm.podiums = (tm.podiums || 0) + 1;
        }

        return {
          pos: c.retired ? 'RIT' : idx + 1,
          driverId: c.driverId,
          name: c.name,
          code: c.code,
          teamId: c.teamId,
          isUser: c.isUser,
          pts,
          bestLap: c.bestLap,
          pitStops: c.pitStops
        };
      });

      const winner = classification[0];
      if (winner) {
        pushMediaQuote('Stampa', `${winner.name} trionfa nel GP di ${track.name} con un passo impeccabile.`);
      }

      gameState.weekend.phase = 'summary';
      gameState.weekend.results = {
        round: gameState.round,
        trackName: track.name,
        classification
      };

      saveGame();
      renderApp();
    }

    function nextRoundOrEndSeason() {
      stopAllLoops();
      if (gameState.round < CALENDAR_2026.length) {
        gameState.round += 1;
        gameState.weekend = initWeekendState(gameState.round, gameState.userTeamId, gameState.drivers);
        generatePaddockPressForRound(gameState.round);
        gameState.activeTab = 'hub';
        saveGame();
        renderApp();
      } else {
        applyEndOfSeasonProgression();
      }
    }

    function applyEndOfSeasonProgression() {
      const sortedTeams = [...gameState.teams].sort((a, b) => b.points - a.points);
      const userRank = sortedTeams.findIndex(t => t.id === gameState.userTeamId) + 1;
      const userTeam = getUserTeam();
      const prize = Math.max(22, (12 - userRank) * 6.5);
      userTeam.budget = Number((userTeam.budget + prize).toFixed(1));

      gameState.drivers.forEach(d => {
        d.age += 1;
        const pot = d.potential ?? d.ovr;
        const pointsFactor = Math.min(8, Math.floor((d.points || 0) / 45));
        const moodFactor = ((d.mood ?? 65) - 65) / 25;

        if (d.age <= 26) {
          d.potential = Math.min(99, pot + Math.max(0, Math.round(pointsFactor * 0.4 + moodFactor)));
          if (d.ovr < d.potential) {
            const growth = Math.max(0, Math.min(3, Math.round(1 + pointsFactor * 0.25 + moodFactor * 0.5)));
            d.ovr = Math.min(d.potential, d.ovr + growth);
            d.pace = Math.min(99, d.pace + growth);
            d.cons = Math.min(99, d.cons + Math.max(0, growth - 1));
          }
        } else if (d.age >= 35) {
          d.potential = Math.max(d.ovr - 2, pot - 1);
          const decline = d.age >= 39 ? 2 : 1;
          d.ovr = Math.max(70, d.ovr - decline);
          d.pace = Math.max(70, d.pace - decline);
        } else {
          if (d.ovr < pot && (d.points || 0) >= 80) {
            d.ovr = Math.min(pot, d.ovr + 1);
            d.pace = Math.min(99, d.pace + 1);
          }
        }

        d.points = 0;
        d.wins = 0;
        d.podiums = 0;
        d.contract = Math.max(1, (d.contract || 1) - 1);
      });

      gameState.teams.forEach(t => {
        t.points = 0;
        t.wins = 0;
        t.podiums = 0;
      });

      gameState.season += 1;
      gameState.round = 1;
      gameState.weekend = initWeekendState(1, gameState.userTeamId, gameState.drivers);
      generatePaddockPressForRound(1);
      gameState.activeTab = 'hub';
      showToast(`Stagione conclusa! Hai chiuso P${userRank} (€${prize.toFixed(1)}M premio). Benvenuto nel ${gameState.season}!`, 'success');
      saveGame();
      renderApp();
    }

      if (uDrivers.length <= 1) {
        showToast('Devi mantenere almeno 1 pilota in rosa!', 'danger');
        return;
      }
      const drv = gameState.drivers.find(d => d.id === driverId);
      if (!drv) return;
      const fa = gameState.freeAgents.find(x => x.id === drv.id);
      if (!fa) {
        gameState.freeAgents.push({ ...drv, teamId: null, role: 'co_lead' });
      }
      drv.teamId = 'vcarb';
      drv.role = 'co_lead';
      adjustDriverMood(drv.id, -10, 'Svincolato dalla squadra');
      showToast(`${drv.name} svincolato dalla rosa.`, 'info');
      saveGame();
      renderApp();
    }

    function signDriverFromMarket(driverId, fee) {
      const team = getUserTeam();
      const uDrivers = getUserDrivers();
      if (uDrivers.length >= 2) {
        showToast('Hai già 2 piloti in rosa: svincolane uno prima di ingaggiare.', 'danger');
        return;
      }
      if (team.budget < fee) {
        showToast('Budget insufficiente per l’ingaggio!', 'danger');
        return;
      }

      const offeredRole = gameState.marketOfferedRole || 'co_lead';
      const drv = gameState.drivers.find(d => d.id === driverId);
      if (!drv) return;

      if (offeredRole === 'support' && !drv.acceptsSupport && drv.ovr >= 85) {
        showToast(`${drv.name} rifiuta il ruolo di 2ª Guida! Offrigli 1ª Guida o Pari Livello.`, 'danger');
        return;
      }

      const prevTeam = getTeam(drv.teamId);
      if (prevTeam && prevTeam.id !== team.id) {
        const replacement = gameState.freeAgents.pop() || { ...INITIAL_DRIVERS[21], id: `fa_${Date.now()}`, name: 'Pilota Riserva', code: 'RSV', number: 99, ovr: 76, potential: 80, pace: 76, cons: 76, tyreMgmt: 76, age: 24, salary: 1.5, mood: 60, trait: 'team_player', preferredDna: 'balanced', acceptsSupport: true };
        replacement.teamId = prevTeam.id;
        replacement.role = 'co_lead';
        gameState.drivers.push(replacement);
      }

      team.budget = Number((team.budget - fee).toFixed(1));
      drv.teamId = team.id;
      drv.role = offeredRole;
      drv.transferRequest = false;
      adjustDriverMood(drv.id, 7, `Nuovo contratto con ${team.name} (${getRoleLabel(offeredRole)})`);
      pushMediaQuote('Mercato', `${drv.name} firma per ${team.name} con ruolo di ${getRoleLabel(offeredRole)}.`);
      showToast(`${drv.name} ingaggiato in ${team.name}!`, 'success');
      saveGame();
      renderApp();
    }

    function renderStandingsView() {
      const sortedDrivers = [...gameState.drivers].sort((a, b) => (b.points || 0) - (a.points || 0) || b.ovr - a.ovr);
      const sortedTeams = [...gameState.teams].sort((a, b) => (b.points || 0) - (a.points || 0) || b.aero - a.aero);

      return `
        <div class="p-4 space-y-3.5">
          <div class="bg-f1card border border-f1border rounded-2xl p-3.5 space-y-2">
            <h3 class="text-xs font-bold uppercase tracking-wider text-f1red">Classifica Costruttori</h3>
            ${sortedTeams.map((t, idx) => `
              <div class="flex items-center justify-between text-xs px-2 py-1.5 rounded-xl ${t.id === gameState.userTeamId ? 'bg-slate-800 font-bold text-white' : 'text-slate-300'}">
                <div class="flex items-center gap-2">
                  <span class="font-mono-num w-5 text-slate-400">${idx + 1}</span>
                  <span class="w-2.5 h-2.5 rounded-full" style="background:${t.color}"></span>
                  <span>${t.name}</span>
                  <span class="text-[9px] px-1.5 py-0.5 rounded bg-f1bg text-slate-400">${t.hierarchy === '1st_2nd' ? '1ª/2ª' : 'PARI'}</span>
                </div>
                <span class="font-mono-num font-extrabold text-amber-300">${t.points || 0} pt</span>
              </div>
            `).join('')}
          </div>

          <div class="bg-f1card border border-f1border rounded-2xl p-3.5 space-y-1.5">
            <h3 class="text-xs font-bold uppercase tracking-wider text-f1red">Classifica Piloti (22)</h3>
            ${sortedDrivers.map((d, idx) => {
              const tm = getTeam(d.teamId);
              const mood = getMoodMeta(d.mood);
              return `
                <div class="flex items-center justify-between text-xs px-2 py-1.5 rounded-xl ${d.teamId === gameState.userTeamId ? 'bg-slate-800 font-bold text-white' : 'text-slate-300'}">
                  <div class="flex items-center gap-2 min-w-0">
                    <span class="font-mono-num w-5 text-slate-400">${idx + 1}</span>
                    <span class="w-2 h-2 rounded-full shrink-0" style="background:${tm.color}"></span>
                    <span class="truncate">${d.name}</span>
                    <span class="text-[10px]">${mood.emoji}</span>
                  </div>
                  <div class="flex items-center gap-2 font-mono-num">
                    <span class="text-[10px] text-sky-300">POT ${d.potential ?? d.ovr}</span>
                    <span class="font-extrabold text-amber-300">${d.points || 0} pt</span>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function renderApp() {
      const root = document.getElementById('app');
      if (!root) return;

      if (!gameState) {
        stopAllLoops();
        root.innerHTML = renderTeamSelectScreen();
        return;
      }

      let bodyHtml = '';
      if (gameState.activeTab === 'hub') bodyHtml = renderHubView();
      else if (gameState.activeTab === 'weekend') bodyHtml = renderWeekendView();
      else if (gameState.activeTab === 'rnd') bodyHtml = renderRndView();
      else if (gameState.activeTab === 'market') bodyHtml = renderMarketView();
      else if (gameState.activeTab === 'standings') bodyHtml = renderStandingsView();
      else bodyHtml = renderHubView();

      root.innerHTML = `
        ${renderTopHeader()}
        <main class="flex-1 overflow-y-auto no-scrollbar pb-20">
          ${bodyHtml}
        </main>
        ${renderBottomNav()}
      `;

      if (gameState.activeTab === 'weekend' && gameState.weekend?.phase === 'quali') {
        startQualiSmoothLoop();
      } else if (gameState.activeTab === 'weekend' && gameState.weekend?.phase === 'race') {
        startRaceSmoothLoop();
      } else {
        stopAllLoops();
      }
    }

    (function boot() {
      const saved = loadGame();
      if (saved && saved.teams && saved.drivers) {
        gameState = saved;
      }
      renderApp();
    })();
  </script>
</body>
</html>
