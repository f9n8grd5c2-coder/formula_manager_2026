    /**
     * =========================================================================
     * HELPER: ESTIMATED TYRE STINT LIFE PER GP
     * =========================================================================
     */
    function getEstimatedStints(track, rules) {
      const trackDegMult = track.tyreDeg === 3 ? 1.25 : track.tyreDeg === 2 ? 1.0 : 0.80;
      const ruleMult = (rules && rules.extraDegMultiplier) ? rules.extraDegMultiplier : 1.0;

      const calcRange = (compoundKey) => {
        const rate = TYRE_COMPOUNDS[compoundKey].degRate * trackDegMult * ruleMult;
        // Effective stint before ~72% wear cliff
        const avgLaps = Math.round(72 / rate);
        const minLaps = Math.max(5, Math.min(track.laps, avgLaps - 2));
        const maxLaps = Math.max(minLaps + 2, Math.min(track.laps, avgLaps + 2));
        return `${minLaps}-${maxLaps}`;
      };

      return {
        S: calcRange('S'),
        M: calcRange('M'),
        H: calcRange('H')
      };
    }

    /**
     * =========================================================================
     * GLOBAL GAME STATE & REAL-TIME ANIMATION LOOP (requestAnimationFrame)

    let gameState = null;
    let rafHandle = null;
    let lastFrameTimestamp = 0;

    function startAnimationLoop() {
      if (rafHandle) cancelAnimationFrame(rafHandle);
      lastFrameTimestamp = performance.now();

      const loop = (now) => {
        const dt = Math.min(0.1, (now - lastFrameTimestamp) / 1000); // cap dt at 100ms
        lastFrameTimestamp = now;

        if (gameState && gameState.activeTab === 'weekend') {
          if (gameState.weekend.phase === 'quali' && gameState.weekend.quali && gameState.weekend.quali.speed > 0) {
            tickQualiRealTime(dt);
          } else if (gameState.weekend.phase === 'race' && gameState.weekend.race && gameState.weekend.race.speed > 0) {
            tickRaceRealTime(dt);
          }
        }

        rafHandle = requestAnimationFrame(loop);
      };
      rafHandle = requestAnimationFrame(loop);
    }

      const userDrivers = drivers.filter(d => d.teamId === userTeamId);
      const d1 = userDrivers[0];
      const d2 = userDrivers[1];

      const targetWing = track.downforce;
      const targetSusp = Math.max(1, Math.min(10, Math.round((track.downforce + (10 - track.topSpeed)) / 2)));
      const targetBrake = Math.max(1, Math.min(10, 11 - track.topSpeed));

      const makeDriverSetup = () => ({
        wing: 5,
        susp: 5,
        brake: 5,
        confidence: 45,
        plan: 'race',
        fpRunsDone: 0,
        feedback: 'Nessun dato telemetrico ancora raccolto. Regola ala, sospensioni e bilanciamento freni ed esegui il primo run in pista per valutare il comportamento della vettura.'
      });

      return {
        round: roundNum,
        phase: 'fp',
        targets: { wing: targetWing, susp: targetSusp, brake: targetBrake },
        fp: {
          session: 1,
          d1: d1 ? makeDriverSetup() : null,
          d2: d2 ? makeDriverSetup() : null
        },
        quali: null,
        race: null,
        results: null
      };
    }

    function saveGame() {
      if (!gameState) return;
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(gameState));
      } catch (e) {
        console.warn('Salvataggio locale non riuscito:', e);
      }
    }

    function loadGame() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          gameState = JSON.parse(raw);
          return true;
        }
      } catch (e) {
        console.warn('Errore caricamento salvataggio:', e);
      }
      return false;
    }

        warning: 'bg-amber-950/95 border-amber-500 text-amber-100',

      const el = document.createElement('div');
      el.className = `pointer-events-auto px-4 py-3 rounded-xl border shadow-xl text-xs font-medium flex items-center justify-between gap-2 transition-all duration-300 ${colors[type] || colors.info}`;

      container.appendChild(el);

    function formatLapTime(seconds) {
      if (!seconds || seconds >= 900) return 'NO TIME';
      const mins = Math.floor(seconds / 60);
      const secs = (seconds % 60).toFixed(3).padStart(6, '0');
      return `${mins}:${secs}`;
    }

    function formatClock(totalSeconds) {
      const s = Math.max(0, Math.ceil(totalSeconds));
      const mins = Math.floor(s / 60);
      const secs = (s % 60).toString().padStart(2, '0');
      return `${mins}:${secs}`;
    }

    /**
     * Computes exact (x, y) coordinates on either the main SVG path or the Pit Lane path.
     */
    function computeCarSvgPosition(progress, pitState) {
      // Pit Lane states: 'pit_in' (0..1), 'pit_stop' (stationary at box), 'pit_out' (0..1), or 'track'
      if (pitState && pitState.mode === 'pit_in') {
        const t = pitState.t;
        return { x: 224 + (204 - 224) * t, y: 132 + (154 - 132) * t };
      }
      if (pitState && pitState.mode === 'pit_stop') {
        const t = pitState.t;
        return { x: 204 + (150 - 204) * t, y: 154 };
      }
      if (pitState && pitState.mode === 'pit_out') {
        const t = pitState.t;
        if (t < 0.7) {
          const sub = t / 0.7;
          return { x: 150 + (96 - 150) * sub, y: 154 };
        } else {
          const sub = (t - 0.7) / 0.3;
          return { x: 96 + (76 - 96) * sub, y: 154 + (132 - 154) * sub };
        }
      }

      const pathEl = document.getElementById('active-track-path');
      if (pathEl && typeof pathEl.getTotalLength === 'function') {
        const len = pathEl.getTotalLength();
        // Offset so progress=0 corresponds closely to Start/Finish line near the end/start of path
        const norm = ((progress % 1) + 1) % 1;
        const pt = pathEl.getPointAtLength(norm * len);
        return { x: pt.x, y: pt.y };
      }

      // Fallback oval
      const angle = progress * Math.PI * 2;
      return { x: 150 + Math.cos(angle) * 105, y: 80 + Math.sin(angle) * 45 };
    }

    /**

      const phase = gameState.weekend.phase;
      if (phase === 'fp') return renderPracticeView();
      if (phase === 'quali') return renderQualifyingView();
      if (phase === 'race') return renderRaceView();

        <div class="p-4 space-y-4">

            <div>
              <span class="text-[10px] font-bold uppercase tracking-wider text-f1red">Fase 1 • Prove Libere</span>
              <h2 class="text-lg font-extrabold text-white">Sessione FP${Math.min(3, fp.session)} di 3</h2>
            </div>
            <div class="text-right text-[11px] text-slate-400">
              <div>Carico ideale: <strong class="text-white">${track.downforce}/10</strong></div>

          ${renderDriverSetupCard(d1, 'd1', fp.d1)}
          ${renderDriverSetupCard(d2, 'd2', fp.d2)}

          <div class="grid grid-cols-2 gap-2.5 pt-1">

              <button onclick="runPracticeSession()" class="py-3.5 px-3 rounded-xl bg-sky-600 hover:bg-sky-500 active:scale-[0.99] font-bold text-xs text-white shadow-lg">
                ESEGUI RUN FP${fp.session}
              </button>

              <div class="py-3.5 px-3 rounded-xl bg-slate-800 text-slate-400 text-center text-xs font-semibold">

              </div>

            <button onclick="startQualifying()" class="py-3.5 px-3 rounded-xl bg-f1red hover:bg-red-600 active:scale-[0.99] font-bold text-xs text-white shadow-lg">
              VAI ALLE QUALIFICHE →

    function updateFpSlider(slotKey, prop, val) {
      gameState.weekend.fp[slotKey][prop] = parseInt(val, 10);
      saveGame();
      renderApp();
    }

    function updateFpPlan(slotKey, plan) {
      gameState.weekend.fp[slotKey].plan = plan;
      saveGame();
      renderApp();
    }

    function runPracticeSession() {
      const fp = gameState.weekend.fp;
      const targets = gameState.weekend.targets;

      ['d1', 'd2'].forEach(slot => {
        const data = fp[slot];
        if (!data) return;
        const diffWing = data.wing - targets.wing;
        const diffSusp = data.susp - targets.susp;
        const diffBrake = data.brake - targets.brake;
        const totalError = Math.abs(diffWing) + Math.abs(diffSusp) + Math.abs(diffBrake);

        const rawConf = Math.max(30, Math.min(100, 100 - totalError * 6));
        data.confidence = Math.max(data.confidence, rawConf);
        data.fpRunsDone += 1;

        // Build complete multi-sentence analysis covering Wing, Suspensions, and Brake/Gearbox
        const sentences = [];

        // 1. Wing feedback
        if (diffWing === 0) {
          sentences.push('Il carico aerodinamico delle ali è centrato al millimetro: ottima velocità di punta e aderenza nei curvoni veloci.');
        } else if (diffWing < -2) {
          sentences.push('In curva veloce e nei cambi di direzione l’anteriore scivola troppo per mancanza di deportanza: serve aumentare decisamente l’incidenza delle ali.');
        } else if (diffWing < 0) {
          sentences.push('Manca ancora un pizzico di carico aerodinamico in percorrenza di curva: prova ad aggiungere 1 o 2 tacche di ala.');
        } else if (diffWing > 2) {
          sentences.push('Abbiamo troppa resistenza aerodinamica sui rettilinei e veniamo sverniciati in allungo: bisogna scaricare sensibilmente le ali.');
        } else {
          sentences.push('La macchina è ben piantata ma siamo leggermente lenti sul dritto: prova a ridurre di poco l’incidenza dell’ala.');
        }

        // 2. Suspension feedback
        if (diffSusp === 0) {
          sentences.push('Le sospensioni assorbono perfettamente i cordoli garantendo trazione immediata in uscita.');
        } else if (diffSusp < 0) {
          sentences.push('L’assetto meccanico risulta troppo morbido e la vettura rolla nei cambi di direzione: irrigidisci un po’ le sospensioni per renderla più reattiva.');
        } else {
          sentences.push('Le sospensioni sono troppo rigide e la monoposto saltella sui cordoli perdendo trazione: prova ad ammorbidirle leggermente.');
        }

        // 3. Brake & Balance feedback
        if (diffBrake === 0) {
          sentences.push('Bilanciamento freni e rapporti del cambio sono impeccabili in ogni staccata.');
        } else if (diffBrake < 0) {
          sentences.push('In ingresso curva il posteriore tende a scappare in staccata: sposta il bilanciamento freni più in avanti (valore più alto).');
        } else {
          sentences.push('Tendo a bloccare l’anteriore nelle frenate più violente: arretra leggermente il bilanciamento freni (valore più basso).');
        }

        data.feedback = sentences.join(' ');
      });

      if (fp.session < 3) {
        fp.session += 1;
        showToast(`Run completato! Analisi telemetrica aggiornata per FP${fp.session}.`, 'info');
      } else {
        fp.session = 4;
        showToast('Tutte le sessioni di Prove Libere completate!', 'success');
      }

      saveGame();
      renderApp();
    }

    /**
     * =========================================================================
     * 3. WEEKEND ENGINE: PHASE 2 - QUALIFICHE REAL-TIME CON MAPPA E SCELTA GOMME
     * =========================================================================
     */
    function startQualifying() {
      const track = CALENDAR_2026[gameState.round - 1];
      const userDrivers = getUserDrivers();
      const fp = gameState.weekend.fp;
      const startWeather = Math.random() < track.rainChance * 0.5 ? 'rain' : 'dry';

      const entries = gameState.drivers.map((d, idx) => {
        const isUser = d.teamId === gameState.userTeamId;
        const team = getTeam(d.teamId);
        let confBonus = 0.65;
        let plan = 'race';
        if (isUser) {
          const slot = userDrivers[0]?.id === d.id ? fp.d1 : fp.d2;
          confBonus = (slot?.confidence || 50) / 100;
          plan = slot?.plan || 'race';
        }

        return {
          driverId: d.id,
          name: d.name,
          code: d.code,
          number: d.number,
          teamId: d.teamId,
          color: team.color,
          isUser,
          bestTime: 999,
          eliminated: false,
          eliminatedIn: null,
          // Real-time track run state: 'garage' | 'outlap' | 'hotlap' | 'inlap'
          runPhase: 'garage',
          lapProgress: 0,
          pitAnim: { mode: 'none', t: 0 },
          selectedTyre: startWeather === 'rain' ? 'I' : 'S',
          tyreSetsUsed: 0,
          runsCompleted: 0,
          confBonus,
          plan,
          aiNextReleaseTime: isUser ? 9999 : (18 * 60) - (15 + idx * 14 + Math.random() * 45)
        };
      });

      gameState.weekend.phase = 'quali';
      gameState.weekend.quali = {
        subSession: 'Q1',
        timeLeftSec: 18 * 60, // 18:00 in seconds
        speed: 1, // starts running in real-time!
        trackGrip: 20,
        weather: startWeather,
        entries
      };

      saveGame();
      renderApp();
    }

    function setQualiSpeed(speed) {
      if (!gameState.weekend.quali) return;
      gameState.weekend.quali.speed = speed;
      renderApp();
    }

    function setQualiDriverTyre(driverId, tyreCode) {
      const q = gameState.weekend.quali;
      const entry = q?.entries.find(e => e.driverId === driverId);
      if (!entry || entry.runPhase !== 'garage') return;
      entry.selectedTyre = tyreCode;
      saveGame();
      renderApp();
    }

    function releaseDriverQuali(driverId) {
      const q = gameState.weekend.quali;
      if (!q || q.subSession === 'DONE') return;
      const entry = q.entries.find(e => e.driverId === driverId);
      if (!entry || entry.eliminated || entry.runPhase !== 'garage') return;

      if (q.timeLeftSec < 95) {
        showToast(`${entry.code}: Troppo poco tempo per completare il giro di lancio prima della bandiera a scacchi!`, 'warning');
        return;
      }

      entry.runPhase = 'outlap';
      entry.lapProgress = 0.02;
      entry.pitAnim = { mode: 'pit_out', t: 0 };
      entry.tyreSetsUsed += 1;

      if (entry.isUser) {
        showToast(`${entry.code} esce dai box con gomme ${TYRE_COMPOUNDS[entry.selectedTyre].name}!`, 'info');
      }
      saveGame();
      renderApp();
    }

    function tickQualiRealTime(dt) {
      const q = gameState.weekend.quali;
      if (!q || q.subSession === 'DONE' || q.speed <= 0) return;

      const track = CALENDAR_2026[gameState.round - 1];
      // Time multiplier: at 1x, 1 real second = 8 session seconds (18 min session takes ~2m15s; at 4x ~33s; at 8x ~16s)
      const simDeltaSec = dt * 8 * q.speed;
      q.timeLeftSec = Math.max(0, q.timeLeftSec - simDeltaSec);

      // Track grip evolves as rubber is laid down
      const carsOnTrack = q.entries.filter(e => !e.eliminated && e.runPhase !== 'garage');
      q.trackGrip = Math.min(100, q.trackGrip + (0.04 + carsOnTrack.length * 0.015) * simDeltaSec);

      // Check AI release triggers
      q.entries.forEach(entry => {
        if (entry.eliminated || entry.isUser || entry.runPhase !== 'garage') return;
        if (q.timeLeftSec <= entry.aiNextReleaseTime && q.timeLeftSec > 105) {
          entry.selectedTyre = q.weather === 'rain' ? 'I' : 'S';
          entry.runPhase = 'outlap';
          entry.lapProgress = 0.02;
          entry.pitAnim = { mode: 'pit_out', t: 0 };
          // Schedule a second run later in the session
          entry.aiNextReleaseTime = q.timeLeftSec - (260 + Math.random() * 140);
        }
      });

      // Advance all active cars on track smoothly
      const lapDurationSec = track.baseLap * 0.55; // Scaled visual lap duration in session seconds
      carsOnTrack.forEach(entry => {
        // Pit exit animation
        if (entry.pitAnim && entry.pitAnim.mode === 'pit_out') {
          entry.pitAnim.t += simDeltaSec / 5;
          if (entry.pitAnim.t >= 1) {
            entry.pitAnim = { mode: 'none', t: 0 };
          }
          return;
        }

        // Pit entry animation
        if (entry.pitAnim && entry.pitAnim.mode === 'pit_in') {
          entry.pitAnim.t += simDeltaSec / 5;
          if (entry.pitAnim.t >= 1) {
            entry.pitAnim = { mode: 'none', t: 0 };
            entry.runPhase = 'garage';
            entry.lapProgress = 0;
          }
          return;
        }

        entry.lapProgress += simDeltaSec / lapDurationSec;

        if (entry.lapProgress >= 1) {
          entry.lapProgress -= 1;
          if (entry.runPhase === 'outlap') {
            entry.runPhase = 'hotlap';
          } else if (entry.runPhase === 'hotlap') {
            // Complete Hot Lap & Record Time!
            const driver = gameState.drivers.find(d => d.id === entry.driverId);
            const team = getTeam(entry.teamId);
            const comp = TYRE_COMPOUNDS[entry.selectedTyre];

            const carPerf = (team.aero * 0.45 + team.pu * 0.35 + team.chassis * 0.20);
            const carDelta = (90 - carPerf) * 0.095;
            const driverDelta = (90 - driver.ovr) * 0.065;
            const setupDelta = entry.isUser ? -(entry.confBonus * 0.45) - (entry.plan === 'quali' ? 0.25 : 0) : -0.25;
            const gripDelta = -(q.trackGrip / 100) * 0.80;

            // Tyre & weather match
            let tyreDelta = comp.paceBonus;
            if (q.weather === 'rain' && comp.wet === 0) tyreDelta += 9.5;
            if (q.weather === 'dry' && comp.wet > 0) tyreDelta += 5.5;
            const weatherBase = q.weather === 'rain' ? 7.2 : 0;

            // Live traffic penalty proportional to active cars currently on track
            const trafficCount = Math.max(0, carsOnTrack.length - 1);
            const trafficPenalty = (trafficCount / 20) * (0.25 + Math.random() * 0.55);
            const variance = (Math.random() - 0.5) * 0.28;

            const lapTime = track.baseLap + carDelta + driverDelta + setupDelta + gripDelta + tyreDelta + weatherBase + trafficPenalty + variance;
            entry.runsCompleted += 1;

            if (lapTime < entry.bestTime) {
              entry.bestTime = lapTime;
              if (entry.isUser) {
                showToast(`⏱️ ${entry.code}: Giro veloce in ${formatLapTime(lapTime)} (${comp.name})!`, 'success');
              }
            } else if (entry.isUser) {
              showToast(`${entry.code}: Tempo ${formatLapTime(lapTime)} (nessun miglioramento).`, 'info');
            }

            entry.runPhase = 'inlap';
          } else if (entry.runPhase === 'inlap') {
            entry.pitAnim = { mode: 'pit_in', t: 0 };
          }
        }
      });

      // Update SVG car dots directly at 60fps without rebuilding entire DOM every frame
      updateQualiSvgDots();

      // Periodically refresh HUD clock & timing tower (~4 times/sec)
      if (!q._lastUiSync || performance.now() - q._lastUiSync > 250) {
        q._lastUiSync = performance.now();
        if (q.timeLeftSec <= 0) {
          finishQualiSubSession();
          return;
        }
        renderApp();
      }
    }

    function updateQualiSvgDots() {
      const q = gameState.weekend.quali;
      const layer = document.getElementById('svg-cars-layer');
      if (!q || !layer) return;

      const activeCars = q.entries.filter(e => !e.eliminated && e.runPhase !== 'garage');
      layer.innerHTML = activeCars.map(c => {
        const pt = computeCarSvgPosition(c.lapProgress, c.pitAnim);
        const isHot = c.runPhase === 'hotlap';
        return `
          <g transform="translate(${pt.x.toFixed(1)}, ${pt.y.toFixed(1)})">
            <circle r="${c.isUser ? 7.5 : 4.5}" fill="${c.color}" stroke="${isHot ? '#a855f7' : (c.isUser ? '#ffffff' : '#0d1117')}" stroke-width="${isHot ? 2.2 : 1.5}" />
            ${c.isUser ? `<text y="-10" text-anchor="middle" fill="#ffffff" font-size="7" font-weight="800">${c.code}</text>` : ''}
          </g>
        `;
      }).join('');
    }

    function finishQualiSubSession() {
      const q = gameState.weekend.quali;
      const track = CALENDAR_2026[gameState.round - 1];

      // Guarantee AI drivers who got stuck in traffic at least set a valid banker lap
      q.entries.forEach(entry => {
        if (!entry.eliminated && !entry.isUser && entry.bestTime >= 900) {
          const driver = gameState.drivers.find(d => d.id === entry.driverId);
          const team = getTeam(entry.teamId);
          const carPerf = (team.aero * 0.45 + team.pu * 0.35 + team.chassis * 0.20);
          entry.bestTime = track.baseLap + (90 - carPerf) * 0.10 + (90 - driver.ovr) * 0.07 + (q.weather === 'rain' ? 7.5 : 0) + Math.random() * 0.4;
        }
        entry.runPhase = 'garage';
        entry.pitAnim = { mode: 'none', t: 0 };
      });

      const active = q.entries.filter(e => !e.eliminated).sort((a, b) => a.bestTime - b.bestTime);

      if (q.subSession === 'Q1') {
        active.slice(16).forEach(e => { e.eliminated = true; e.eliminatedIn = 'Q1'; });
        active.slice(0, 16).forEach((e, idx) => {
          e.bestTime = 999;
          e.aiNextReleaseTime = (15 * 60) - (15 + idx * 14 + Math.random() * 40);
        });
        q.subSession = 'Q2';
        q.timeLeftSec = 15 * 60;
        q.speed = 1;
        q.trackGrip = 50;
        showToast('Fine Q1! Eliminati P17-P22. Parte il cronometro della Q2 (16 piloti)!', 'info');
      } else if (q.subSession === 'Q2') {
        active.slice(10).forEach(e => { e.eliminated = true; e.eliminatedIn = 'Q2'; });
        active.slice(0, 10).forEach((e, idx) => {
          e.bestTime = 999;
          e.aiNextReleaseTime = (12 * 60) - (12 + idx * 14 + Math.random() * 35);
        });
        q.subSession = 'Q3';
        q.timeLeftSec = 12 * 60;
        q.speed = 1;
        q.trackGrip = 75;
        showToast('Fine Q2! Top 10 al Q3 Shootout!', 'info');
      } else if (q.subSession === 'Q3') {
        q.subSession = 'DONE';
        q.speed = 0;
        showToast('Qualifiche concluse! Griglia di partenza confermata.', 'success');
      }

      saveGame();
      renderApp();
    }

          <!-- USER DRIVERS TYRE SELECTOR & RELEASE CONTROLS -->

          <!-- TIMING TOWER -->
          <div class="bg-f1card border border-f1border rounded-2xl overflow-hidden">

                      <span class="text-[11px] text-slate-400 truncate max-w-[100px]">${entry.name}</span>
                    </div>
                    <div class="flex items-center gap-2 font-mono-num font-semibold text-slate-200">
                      <span class="w-4 h-4 rounded-full flex items-center justify-center text-[9px] font-extrabold" style="background-color:${tc.color}; color:${tc.text}">${tc.short}</span>
                      <span>${formatLapTime(entry.bestTime)}</span>

    }

    /**
     * =========================================================================
     * 4. WEEKEND ENGINE: PHASE 3 - GARA LIVE FLUIDA CON PIT LANE ANIMATA
     * =========================================================================
     */
    function initRaceFromQuali() {
      const q = gameState.weekend.quali;
      const track = CALENDAR_2026[gameState.round - 1];
      const active = q.entries.filter(e => !e.eliminated).sort((a, b) => a.bestTime - b.bestTime);
      const elimQ2 = q.entries.filter(e => e.eliminatedIn === 'Q2').sort((a, b) => a.bestTime - b.bestTime);
      const elimQ1 = q.entries.filter(e => e.eliminatedIn === 'Q1').sort((a, b) => a.bestTime - b.bestTime);
      const gridOrder = [...active, ...elimQ2, ...elimQ1];

      const startWeather = Math.random() < track.rainChance * 0.45 ? 'light_rain' : 'dry';

      const cars = gridOrder.map((entry, idx) => {
        const driver = gameState.drivers.find(d => d.id === entry.driverId);
        const team = getTeam(entry.teamId);
        const startComp = entry.isUser
          ? (startWeather === 'dry' ? 'M' : 'I')
          : (startWeather === 'dry' ? (idx < 10 && Math.random() > 0.5 ? 'S' : 'M') : 'I');

        return {
          driverId: driver.id,
          name: driver.name,
          code: driver.code,
          number: driver.number,
          teamId: team.id,
          color: team.color,
          isUser: entry.isUser,
          pos: idx + 1,
          totalTime: idx * 0.35,
          lastLapTime: track.baseLap,
          tyre: startComp,
          tyreWear: 0,
          fuel: 100,
          paceMode: 'balanced',
          ersMode: 'balanced',
          pitRequested: false,
          nextTyre: startWeather === 'dry' ? 'H' : 'I',
          pitsDone: 0,
          dnf: false,
          dnfReason: '',
          confBonus: entry.confBonus || 0.6,
          plan: entry.plan || 'race',
          // Smooth continuous 60fps progress & pit lane animation state
          progressOnLap: Math.max(0.01, 0.99 - idx * 0.016),
          pitAnim: { mode: 'none', t: 0, pendingComp: null }
        };
      });

      gameState.weekend.phase = 'race';
      gameState.weekend.race = {
        lap: 1,
        totalLaps: track.laps,
        speed: 0, // 0 = paused, 1 = 1x Strategic (6s/lap), 2 = 2x, 4 = 4x, 8 = 8x
        lapFraction: 0, // 0..1 continuous progress of current lap
        weather: startWeather,
        trackWater: startWeather === 'dry' ? 0 : 40,
        safetyCar: 'NONE',
        scLapsRemaining: 0,
        fastestLap: { driverId: null, code: '-', time: 999 },
        radioLog: [`Giro 1/${track.laps}: Semaforo verde a ${track.name}!`],
        cars
      };

      saveGame();
      renderApp();
    }

    function setRaceSpeed(speed) {
      if (!gameState.weekend.race) return;
      gameState.weekend.race.speed = speed;
      renderApp();
    }

    function pauseRace() {
      setRaceSpeed(0);
    }

    function setDriverRaceControl(driverId, field, value) {
      const race = gameState.weekend.race;
      if (!race) return;
      const car = race.cars.find(c => c.driverId === driverId);
      if (!car) return;
      car[field] = value;

      if (field === 'pitRequested' && value === true) {
        const userCars = race.cars.filter(c => c.isUser && c.pitRequested);
        if (userCars.length > 1) {
          showToast('⚠️ Attenzione: Entrambi i piloti richiamati nello stesso giro (rischio Double Stack)!', 'warning');
        }
      }
      saveGame();
      renderApp();
    }

    /**
     * Smooth 60fps Race Tick: moves cars continuously around the circuit and through
     * the Pit Entry -> Pit Box -> Pit Exit path, triggering lap simulation every 1.0 lapFraction.
     */
    function tickRaceRealTime(dt) {
      const race = gameState.weekend.race;
      if (!race || race.speed <= 0) return;

      // At 1x Strategic, 1 lap takes 6.0 seconds; at 2x = 3.0s; at 4x = 1.5s; at 8x = 0.75s
      const lapDurationSec = 6.0 / race.speed;
      const deltaFrac = dt / lapDurationSec;
      race.lapFraction += deltaFrac;

      const leader = race.cars.find(c => !c.dnf) || race.cars[0];

      race.cars.forEach(car => {
        if (car.dnf) return;

        // If car is currently animating through Pit Lane
        if (car.pitAnim && car.pitAnim.mode !== 'none') {
          if (car.pitAnim.mode === 'pit_in') {
            car.pitAnim.t += deltaFrac * 4.5;
            if (car.pitAnim.t >= 1) {
              car.pitAnim.mode = 'pit_stop';
              car.pitAnim.t = 0;
            }
          } else if (car.pitAnim.mode === 'pit_stop') {
            car.pitAnim.t += deltaFrac * 3.8; // Stationary service in pit stall
            if (car.pitAnim.t >= 1) {
              car.pitAnim.mode = 'pit_out';
              car.pitAnim.t = 0;
            }
          } else if (car.pitAnim.mode === 'pit_out') {
            car.pitAnim.t += deltaFrac * 4.5;
            if (car.pitAnim.t >= 1) {
              car.pitAnim.mode = 'none';
              car.pitAnim.t = 0;
              car.progressOnLap = 0.04; // Rejoins main straight after pit exit
            }
          }
          return;
        }

        // Smooth visual track movement scaled by pace and gap to leader
        const gapFactor = leader ? Math.max(0.92, Math.min(1.04, 1 - (car.totalTime - leader.totalTime) * 0.0006)) : 1;
        const speedFactor = race.safetyCar !== 'NONE' ? 0.78 : (car.paceMode === 'push' ? 1.03 : car.paceMode === 'conserve' ? 0.97 : 1.0) * gapFactor;
        car.progressOnLap = (car.progressOnLap + deltaFrac * speedFactor) % 1;
      });

      updateRaceSvgDots();

      if (race.lapFraction >= 1) {
        race.lapFraction -= 1;
        simulateRaceLap();
      }
    }

    function updateRaceSvgDots() {
      const race = gameState.weekend.race;
      const layer = document.getElementById('svg-cars-layer');
      if (!race || !layer) return;

      const activeCars = race.cars.filter(c => !c.dnf).slice().reverse();
      layer.innerHTML = activeCars.map(c => {
        const pt = computeCarSvgPosition(c.progressOnLap, c.pitAnim);
        const inPit = c.pitAnim && c.pitAnim.mode !== 'none';
        return `
          <g transform="translate(${pt.x.toFixed(1)}, ${pt.y.toFixed(1)})">
            <circle r="${c.isUser ? 7.5 : 4.5}" fill="${c.color}" stroke="${inPit ? '#f59e0b' : (c.isUser ? '#ffffff' : '#0d1117')}" stroke-width="${c.isUser ? 2 : 1.2}" />
            ${c.isUser ? `<text y="-10" text-anchor="middle" fill="#ffffff" font-size="7" font-weight="800">${c.code}</text>` : ''}
          </g>
        `;
      }).join('');
    }

    function simulateRaceLap() {
      const race = gameState.weekend.race;
      if (!race) return;

      const track = CALENDAR_2026[gameState.round - 1];
      const degMult = gameState.rules.extraDegMultiplier || 1.0;

      // 1. Dynamic Weather Evolution
      if (Math.random() < track.rainChance * 0.08) {
        if (race.weather === 'dry') {
          race.weather = 'light_rain';
          race.radioLog.unshift(`Giro ${race.lap}: 🌦️ Prime gocce di pioggia sul tracciato!`);
          showToast(`Giro ${race.lap}: Inizia a piovere! Valuta le gomme Intermedie.`, 'warning');
        } else if (race.weather === 'light_rain' && Math.random() < 0.45) {
          race.weather = 'heavy_rain';
          race.radioLog.unshift(`Giro ${race.lap}: ⛈️ Pioggia intensa! Pista allagata.`);
        } else if (race.weather !== 'dry' && Math.random() < 0.5) {
          race.weather = 'dry';
          race.radioLog.unshift(`Giro ${race.lap}: ☀️ Smette di piovere, la traiettoria si asciuga.`);
        }
      }

      if (race.weather === 'dry') race.trackWater = Math.max(0, race.trackWater - 12);
      if (race.weather === 'light_rain') race.trackWater = Math.min(60, Math.max(30, race.trackWater + 10));
      if (race.weather === 'heavy_rain') race.trackWater = Math.min(100, race.trackWater + 18);

      // 2. Safety Car / VSC Logic
      if (race.safetyCar !== 'NONE') {
        race.scLapsRemaining -= 1;
        if (race.scLapsRemaining <= 0) {
          race.safetyCar = 'NONE';
          race.radioLog.unshift(`Giro ${race.lap}: 🟢 Bandiera Verde! La gara riparte.`);
        }
      } else if (race.lap > 2 && race.lap < race.totalLaps - 3 && Math.random() < 0.032) {
        race.safetyCar = Math.random() < 0.65 ? 'SC' : 'VSC';
        race.scLapsRemaining = race.safetyCar === 'SC' ? 3 : 2;
        race.radioLog.unshift(`Giro ${race.lap}: 🟡 ${race.safetyCar === 'SC' ? 'SAFETY CAR IN PISTA!' : 'VIRTUAL SAFETY CAR!'}`);
        showToast(`Giro ${race.lap}: ${race.safetyCar === 'SC' ? 'Safety Car!' : 'Virtual Safety Car!'} Occasione per Pit Stop.`, 'warning');
      }

      // 3. Simulate Each Car
      let doubleStackCounter = 0;

      race.cars.forEach(car => {
        if (car.dnf) return;

        const driver = gameState.drivers.find(d => d.id === car.driverId);
        const team = getTeam(car.teamId);

        // Mechanical DNF Check
        const dnfProb = ((100 - team.rel) * 0.00025) + (car.paceMode === 'push' ? 0.0012 : 0.0003);
        if (Math.random() < dnfProb) {
          car.dnf = true;
          car.dnfReason = Math.random() > 0.5 ? 'Problema Power Unit' : 'Guasto Idraulico';
          race.radioLog.unshift(`Giro ${race.lap}: ❌ Ritiro per ${car.code} (${car.dnfReason})`);
          if (car.isUser) showToast(`RITIRO! ${car.name} fuori gara (${car.dnfReason})!`, 'danger');
          return;
        }

        // AI Strategy Decisions
        if (!car.isUser) {
          if (race.trackWater >= 65 && car.tyre !== 'W') {
            car.pitRequested = true;
            car.nextTyre = 'W';
          } else if (race.trackWater >= 25 && race.trackWater < 65 && car.tyre !== 'I') {
            car.pitRequested = true;
            car.nextTyre = 'I';
          } else if (race.trackWater < 20 && (car.tyre === 'I' || car.tyre === 'W')) {
            car.pitRequested = true;
            car.nextTyre = 'M';
          } else if (car.tyreWear >= 68 && race.lap < race.totalLaps - 3) {
            car.pitRequested = true;
            car.nextTyre = (race.totalLaps - race.lap) <= 16 ? 'S' : 'H';
          }
          car.paceMode = car.tyreWear > 55 ? 'conserve' : 'balanced';
        }

        // Pit Stop Execution + Trigger Visual Pit Lane Animation
        let pitLoss = 0;
        if (car.pitRequested) {
          pitLoss = race.safetyCar !== 'NONE' ? 12.5 : 21.5;
          if (car.isUser) {
            doubleStackCounter += 1;
            if (doubleStackCounter > 1) pitLoss += 4.5;
          }
          car.tyre = car.nextTyre;
          car.tyreWear = 0;
          car.pitsDone += 1;
          car.pitRequested = false;
          car.pitAnim = { mode: 'pit_in', t: 0 };

          if (car.isUser) {
            race.radioLog.unshift(`Giro ${race.lap}: 🔧 Pit Stop ${car.code} -> Gomme ${TYRE_COMPOUNDS[car.tyre].name}`);
          }
        }

        // Calculate Lap Time
        const comp = TYRE_COMPOUNDS[car.tyre];
        const carPerf = (team.aero * 0.4 + team.pu * 0.35 + team.chassis * 0.25);
        const carDelta = (90 - carPerf) * 0.085;
        const driverDelta = (90 - driver.ovr) * 0.055;
        const setupDelta = car.isUser ? -(car.confBonus * 0.35) - (car.plan === 'race' ? 0.20 : 0) : -0.22;

        const paceMod = car.paceMode === 'push' ? -0.45 : car.paceMode === 'conserve' ? 0.45 : 0;
        const ersMod = car.ersMode === 'overtake' ? -0.35 : car.ersMode === 'harvest' ? 0.30 : 0;
        const wearPenalty = car.tyreWear > 60 ? Math.pow((car.tyreWear - 60) * 0.14, 1.45) : (car.tyreWear * 0.018);

        let weatherMismatch = 0;
        if (race.trackWater >= 65 && comp.wet < 2) weatherMismatch = comp.wet === 1 ? 3.5 : 14.0;
        else if (race.trackWater >= 25 && race.trackWater < 65 && comp.wet === 0) weatherMismatch = 7.5;
        else if (race.trackWater < 15 && comp.wet > 0) weatherMismatch = comp.wet === 2 ? 9.0 : 4.5;

        const fuelSaving = -((100 - car.fuel) * 0.015);
        const variance = (Math.random() - 0.5) * 0.35;

        let lapTime = track.baseLap + carDelta + driverDelta + setupDelta + paceMod + ersMod + comp.paceBonus + wearPenalty + weatherMismatch + fuelSaving + pitLoss + variance;

        if (race.safetyCar === 'SC') {
          lapTime = track.baseLap * 1.32 + pitLoss;
        } else if (race.safetyCar === 'VSC') {
          lapTime = track.baseLap * 1.18 + pitLoss;
        }

        car.lastLapTime = lapTime;
        car.totalTime += lapTime;

        if (race.safetyCar === 'NONE' && pitLoss === 0 && lapTime < race.fastestLap.time) {
          race.fastestLap = { driverId: car.driverId, code: car.code, time: lapTime };
        }

        const trackDegMult = track.tyreDeg === 3 ? 1.25 : track.tyreDeg === 2 ? 1.0 : 0.80;
        const paceWearMult = car.paceMode === 'push' ? 1.35 : car.paceMode === 'conserve' ? 0.72 : 1.0;
        const planWearMult = (car.isUser && car.plan === 'tyre') ? 0.85 : 1.0;
        const scWearMult = race.safetyCar !== 'NONE' ? 0.35 : 1.0;

        car.tyreWear = Math.min(100, car.tyreWear + (comp.degRate * trackDegMult * paceWearMult * planWearMult * scWearMult * degMult));
        car.fuel = Math.max(0, car.fuel - (100 / race.totalLaps) * (car.paceMode === 'push' ? 1.04 : 0.98));
      });

      // 4. Sort Standings
      const activeCars = race.cars.filter(c => !c.dnf).sort((a, b) => a.totalTime - b.totalTime);
      const dnfCars = race.cars.filter(c => c.dnf);

      if (race.safetyCar === 'SC' && activeCars.length > 1) {
        for (let i = 1; i < activeCars.length; i++) {
          const maxGap = i * 0.65;
          if (activeCars[i].totalTime - activeCars[0].totalTime > maxGap) {
            activeCars[i].totalTime = activeCars[0].totalTime + maxGap;
          }
        }
      }

      const newOrder = [...activeCars, ...dnfCars];
      newOrder.forEach((c, idx) => { c.pos = idx + 1; });
      race.cars = newOrder;

      // 5. Check Race Finish
      if (race.lap >= race.totalLaps) {
        pauseRace();
        concludeRace();
        return;
      }

      race.lap += 1;
      saveGame();
      renderApp();
    }

    function concludeRace() {
      const race = gameState.weekend.race;
      const track = CALENDAR_2026[gameState.round - 1];
      const ptsTable = gameState.rules.pointsTop12 ? EXTRA_POINTS_SYSTEM : POINTS_SYSTEM;

      race.cars.forEach((car, idx) => {
        if (car.dnf) return;
        const driver = gameState.drivers.find(d => d.id === car.driverId);
        const team = getTeam(car.teamId);
        let pts = ptsTable[idx] || 0;

        if (idx < 10 && race.fastestLap.driverId === car.driverId) {
          pts += 1;
        }

        driver.points += pts;
        team.points += pts;
        if (idx === 0) { driver.wins += 1; team.wins += 1; }
        if (idx < 3) { driver.podiums += 1; team.podiums += 1; }
      });

      const userCars = race.cars.filter(c => c.isUser && !c.dnf);
      const bestUserPos = userCars.length ? Math.min(...userCars.map(c => c.pos)) : 20;
      const raceRevenue = Number((4.5 + Math.max(0, (15 - bestUserPos) * 0.45)).toFixed(1));
      const userTeam = getUserTeam();
      userTeam.budget = Number((userTeam.budget + raceRevenue).toFixed(1));

      // Progress R&D pending upgrades
      gameState.pendingUpgrades.forEach(upg => { upg.roundsLeft -= 1; });
      const completedUpgrades = gameState.pendingUpgrades.filter(u => u.roundsLeft <= 0);
      completedUpgrades.forEach(u => {
        const t = getTeam(u.teamId);
        t[u.area] = Math.min(99, t[u.area] + u.boost);
        if (t.id === gameState.userTeamId) {
          gameState.newsFeed.unshift(`Sviluppo ${u.tierName} completato! +${u.boost} in ${u.area.toUpperCase()} installato sulla vettura.`);
        }
      });
      gameState.pendingUpgrades = gameState.pendingUpgrades.filter(u => u.roundsLeft > 0);

      // AI teams occasionally develop their cars
      gameState.teams.forEach(t => {
        if (t.id !== gameState.userTeamId && Math.random() < 0.35) {
          const areas = ['aero', 'pu', 'chassis', 'rel'];
          const area = areas[Math.floor(Math.random() * areas.length)];
          t[area] = Math.min(99, t[area] + 1);
        }
      });

      if (gameState.round % 6 === 0 && bestUserPos <= userTeam.objective + 2) {
        generateTeamPrincipalOffer();
      }

      const winner = race.cars[0];
      gameState.newsFeed.unshift(`R${gameState.round} ${track.name}: Vittoria per ${winner.name} (${getTeam(winner.teamId).name})!`);

      gameState.weekend.phase = 'summary';
      gameState.weekend.results = {
        podium: race.cars.slice(0, 3),
        fullResults: race.cars,
        fastestLap: race.fastestLap,
        raceRevenue
      };

      saveGame();
      renderApp();
    }

    function startUpgrade(area, tierName, cost, boost, rounds) {
      const team = getUserTeam();
      if (team.budget < cost || (gameState.budgetCap - team.capSpent) < cost) {
        showToast('Fondi o margine Budget Cap insufficienti!', 'danger');
        return;
      }
      if (gameState.pendingUpgrades.some(u => u.teamId === team.id && u.area === area)) {
        showToast('C’è già uno sviluppo attivo in questo reparto!', 'warning');
        return;
      }

      team.budget = Number((team.budget - cost).toFixed(1));
      team.capSpent = Number((team.capSpent + cost).toFixed(1));
      gameState.pendingUpgrades.push({
        id: Date.now(),
        teamId: team.id,
        area,
        tierName,
        boost,
        cost,
        roundsLeft: rounds,
        totalRounds: rounds
      });
      showToast(`Sviluppo ${tierName} (${area.toUpperCase()}) avviato! Consegna tra ${rounds} GP.`, 'success');
      saveGame();
      renderApp();
    }

    function generateTeamPrincipalOffer() {
      const currentTeam = getUserTeam();
      const candidates = gameState.teams.filter(t => t.id !== currentTeam.id);
      const target = candidates[Math.floor(Math.random() * candidates.length)];
      if (gameState.jobOffers.some(o => o.teamId === target.id)) return;

      gameState.jobOffers.push({
        teamId: target.id,
        objective: target.objective,
        message: `Il CdA di ${target.name} è impressionato dal tuo lavoro e ti offre il ruolo di Team Principal!`
      });
    }

      const newTeam = getTeam(newTeamId);
      gameState.userTeamId = newTeamId;
      gameState.jobOffers = [];
      gameState.weekend = initWeekendState(gameState.round, newTeamId, gameState.drivers);
      gameState.newsFeed.unshift(`CLAMOROSO! Hai lasciato la tua squadra per diventare Team Principal di ${newTeam.name}!`);
      showToast(`Benvenuto in ${newTeam.name}!`, 'success');
      saveGame();
      renderApp();
    }

    function signDriverModal(driverId, isFreeAgent) {
      const driver = isFreeAgent
        ? gameState.freeAgents.find(d => d.id === driverId)
        : gameState.drivers.find(d => d.id === driverId);
      const userDrivers = getUserDrivers();
      const team = getUserTeam();
      const buyout = isFreeAgent ? 0 : Number((driver.salary * 0.8).toFixed(1));
      const totalCost = Number((driver.salary + buyout).toFixed(1));

      openModal(`
        <h3 class="text-base font-extrabold text-white mb-1">Ingaggia ${driver.name}</h3>
        <p class="text-xs text-slate-400 mb-3">OVR ${driver.ovr} • Età ${driver.age} • Stipendio: €${driver.salary}M/anno ${buyout > 0 ? `+ Penale €${buyout}M` : ''}</p>
        <div class="text-xs text-slate-300 bg-f1bg p-3 rounded-xl border border-f1border mb-4">
          Costo totale operazione: <strong class="text-emerald-400 font-mono-num">€${totalCost}M</strong> (Budget attuale: €${team.budget}M).<br/>
          Scegli quale pilota attuale sostituire:
        </div>
        <div class="space-y-2 mb-4">
          ${userDrivers.map(ud => `
            <button onclick="executeDriverSigning('${driver.id}', '${ud.id}', ${isFreeAgent}, ${totalCost})" class="w-full p-3 rounded-xl bg-f1bg hover:bg-slate-800 border border-f1border flex items-center justify-between text-left">
              <div>
                <div class="text-xs font-bold text-white">Sostituisci ${ud.name}</div>
                <div class="text-[11px] text-slate-400">OVR ${ud.ovr} • Attuale #${ud.number}</div>
              </div>
              <span class="text-xs font-bold text-f1red">FIRMA →</span>
            </button>
          `).join('')}
        </div>
        <button onclick="closeModal()" class="w-full py-2.5 rounded-xl bg-slate-800 text-xs font-bold text-slate-300">Annulla</button>
      `);
    }

    function executeDriverSigning(newDriverId, oldDriverId, isFreeAgent, cost) {
      const team = getUserTeam();
      if (team.budget < cost) {
        showToast('Budget insufficiente per completare l\'ingaggio!', 'danger');
        closeModal();
        return;
      }

      const oldDriver = gameState.drivers.find(d => d.id === oldDriverId);
      const oldTeamId = oldDriver.teamId;

      if (isFreeAgent) {
        const idx = gameState.freeAgents.findIndex(d => d.id === newDriverId);
        const newDriver = gameState.freeAgents.splice(idx, 1)[0];
        newDriver.teamId = oldTeamId;
        newDriver.contract = 2;

        oldDriver.teamId = null;
        gameState.freeAgents.push(oldDriver);

        const dIdx = gameState.drivers.findIndex(d => d.id === oldDriverId);
        gameState.drivers[dIdx] = newDriver;
      } else {
        const newDriver = gameState.drivers.find(d => d.id === newDriverId);
        const otherTeamId = newDriver.teamId;
        newDriver.teamId = oldTeamId;
        newDriver.contract = 2;
        oldDriver.teamId = otherTeamId;
      }

      team.budget = Number((team.budget - cost).toFixed(1));
      gameState.weekend = initWeekendState(gameState.round, gameState.userTeamId, gameState.drivers);
      gameState.newsFeed.unshift(`MERCATO PILOTI: ${team.name} ha ingaggiato ufficialmente ${gameState.drivers.find(d => d.id === newDriverId).name}!`);
      closeModal();
      showToast('Contratto firmato con successo!', 'success');
      saveGame();
      renderApp();
    }

    function renderMarketView() {
      const allDrivers = [...gameState.drivers].sort((a, b) => b.ovr - a.ovr);

            ${gameState.jobOffers.length === 0 ? `

          <!-- FREE AGENTS -->
          <div class="bg-f1card border border-f1border rounded-2xl p-4">

            <div class="space-y-2">
              ${gameState.freeAgents.map(fa => `
                <div class="flex items-center justify-between bg-f1bg p-2.5 rounded-xl border border-f1border/60">

          </div>

          <!-- ALL GRID DRIVERS -->
          <div class="bg-f1card border border-f1border rounded-2xl p-4">
            <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2.5">Tutti i Piloti Sotto Contratto</h3>
            <div class="divide-y divide-f1border/50 max-h-80 overflow-y-auto">
              ${allDrivers.map(d => {
                const t = getTeam(d.teamId);
                const isMine = d.teamId === gameState.userTeamId;
                return `
                  <div class="py-2.5 flex items-center justify-between text-xs">
                    <div>
                      <div class="font-bold text-white flex items-center gap-1.5">
                        <span class="w-2 h-2 rounded-full" style="background-color:${t.color}"></span>
                        <span>${d.name}</span>
                        <span class="font-mono-num text-amber-300">OVR ${d.ovr}</span>
                      </div>
                      <div class="text-[10px] text-slate-400">${t.name} • Età ${d.age} • €${d.salary}M</div>
                    </div>
                    ${isMine ? `
                      <span class="text-[10px] font-bold px-2 py-1 rounded bg-slate-800 text-slate-300">TUO PILOTA</span>
                    ` : `
                      <button onclick="signDriverModal('${d.id}', false)" class="px-2.5 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold">
                        Offerta
                      </button>
                    `}
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        </div>
      `;
    }

    /**
     * =========================================================================
     * 7. STANDINGS VIEW (DRIVERS & CONSTRUCTORS)
     * =========================================================================
     */
    function renderStandingsView() {
      const sortedDrivers = [...gameState.drivers].sort((a, b) => b.points - a.points || b.wins - a.wins);
      const sortedTeams = [...gameState.teams].sort((a, b) => b.points - a.points || b.wins - a.wins);

      return `
        <div class="p-4 space-y-4">
          <!-- CONSTRUCTORS -->
          <div class="bg-f1card border border-f1border rounded-2xl overflow-hidden">
            <div class="px-4 py-3 bg-slate-900 border-b border-f1border flex justify-between items-center">
              <h2 class="text-xs font-extrabold uppercase tracking-wider text-white">Campionato Costruttori ${gameState.season}</h2>

            </div>
            <div class="divide-y divide-f1border/50">
              ${sortedTeams.map((t, idx) => `
                <div class="px-4 py-2.5 flex items-center justify-between text-xs ${t.id === gameState.userTeamId ? 'bg-white/10 font-bold' : ''}">

                    <span class="w-4 font-mono-num text-slate-400">${idx + 1}</span>

          <!-- DRIVERS -->
          <div class="bg-f1card border border-f1border rounded-2xl overflow-hidden">
            <div class="px-4 py-3 bg-slate-900 border-b border-f1border flex justify-between items-center">
              <h2 class="text-xs font-extrabold uppercase tracking-wider text-white">Campionato Piloti ${gameState.season}</h2>
              <span class="text-[10px] text-slate-400">Punti</span>
            </div>
            <div class="divide-y divide-f1border/50">
              ${sortedDrivers.map((d, idx) => {
                const t = getTeam(d.teamId);
                return `
                  <div class="px-4 py-2 flex items-center justify-between text-xs ${d.teamId === gameState.userTeamId ? 'bg-white/10 font-bold' : ''}">
                    <div class="flex items-center gap-2">
                      <span class="w-5 font-mono-num text-slate-400">${idx + 1}</span>
                      <span class="w-1 h-4 rounded-full" style="background-color:${t.color}"></span>
                      <span class="text-white">${d.name}</span>
                      <span class="text-[10px] text-slate-500">${t.short}</span>

    /**
     * =========================================================================
     * 8. OFF-SEASON: FIA REGULATION VOTE, DYNAMIC OVR & PRIZE PAYOUTS
     * =========================================================================
     */
    function renderOffSeasonView() {
      const sortedTeams = [...gameState.teams].sort((a, b) => b.points - a.points || b.wins - a.wins);
      const championTeam = sortedTeams[0];
      const sortedDrivers = [...gameState.drivers].sort((a, b) => b.points - a.points || b.wins - a.wins);
      const championDriver = sortedDrivers[0];

      return `
        <div class="p-4 space-y-4">
          <div class="bg-f1card border border-f1border rounded-2xl p-4 text-center">
            <span class="text-[10px] font-bold uppercase tracking-wider text-amber-400">Fine Stagione ${gameState.season}</span>
            <h2 class="text-xl font-extrabold text-white mt-1">Campioni del Mondo ${gameState.season}</h2>
            <div class="grid grid-cols-2 gap-2.5 mt-3">
              <div class="bg-f1bg p-3 rounded-xl border border-f1border">
                <div class="text-[10px] text-slate-400">Campione Piloti</div>
                <div class="text-sm font-bold text-white mt-0.5">${championDriver.name}</div>
                <div class="text-xs font-mono-num text-amber-300">${championDriver.points} pt</div>
              </div>
              <div class="bg-f1bg p-3 rounded-xl border border-f1border">
                <div class="text-[10px] text-slate-400">Campione Costruttori</div>
                <div class="text-sm font-bold text-white mt-0.5">${championTeam.name}</div>
                <div class="text-xs font-mono-num text-amber-300">${championTeam.points} pt</div>
              </div>
            </div>
          </div>

          <!-- FIA REGULATION VOTE -->
          <div class="bg-f1card border border-f1border rounded-2xl p-4 space-y-3">
            <h3 class="text-sm font-extrabold text-white">🏛️ Consiglio Mondiale FIA: Vota il Regolamento ${gameState.season + 1}</h3>
            <p class="text-xs text-slate-400">Il tuo voto influenzerà l'esito della votazione tra le 11 scuderie:</p>
            <div class="space-y-2.5">
              ${FIA_REGULATION_PROPOSALS.slice(0, 3).map(prop => `
                <button onclick="executeOffSeasonTransition('${prop.id}')" class="w-full text-left bg-f1bg hover:bg-slate-800 border border-f1border hover:border-f1red rounded-xl p-3 transition">
                  <div class="text-xs font-bold text-white">${prop.title}</div>
                  <div class="text-[11px] text-slate-400 mt-1">${prop.desc}</div>
                  <div class="text-[10px] font-bold text-f1red mt-2">VOTA QUESTA PROPOSTA E INIZIA STAGIONE ${gameState.season + 1} →</div>
                </button>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function executeOffSeasonTransition(votedRuleId) {
      const sortedTeams = [...gameState.teams].sort((a, b) => b.points - a.points || b.wins - a.wins);

      const passed = Math.random() < 0.72;
      if (passed) {
        if (votedRuleId === 'aero_reset') {
          gameState.teams.forEach(t => { t.aero = Math.max(65, Math.round(t.aero * 0.88)); });
          gameState.newsFeed.unshift(`FIA REGOLAMENTO: Approvato il Reset Aerodinamico (-12% carico a tutte le vetture)!`);
        } else if (votedRuleId === 'cap_increase') {
          gameState.budgetCap += 20;
          gameState.newsFeed.unshift(`FIA REGOLAMENTO: Budget Cap aumentato a €${gameState.budgetCap}M!`);
        } else if (votedRuleId === 'points_top12') {
          gameState.rules.pointsTop12 = true;
          gameState.newsFeed.unshift(`FIA REGOLAMENTO: Zona punti estesa fino al 12° posto!`);
        }
      } else {
        gameState.newsFeed.unshift(`FIA REGOLAMENTO: La proposta votata è stata respinta dalla maggioranza delle scuderie.`);
      }

      sortedTeams.forEach((team, idx) => {
        const prize = Number((65 - idx * 3.5).toFixed(1));
        team.budget = Number((team.budget * 0.35 + prize).toFixed(1));
        team.capSpent = 0;
        team.points = 0;
        team.wins = 0;
        team.podiums = 0;
        team.objective = Math.max(1, Math.min(11, idx + 1));
      });

      gameState.drivers.forEach((driver, idx) => {
        driver.age += 1;
        driver.contract = Math.max(1, driver.contract - 1);

        if (driver.age <= 24 && driver.ovr < driver.potential) {
          driver.ovr = Math.min(driver.potential, driver.ovr + (driver.points > 40 ? 2 : 1));
        } else if (driver.age >= 38) {
          driver.ovr = Math.max(72, driver.ovr - 2);
        }

        if (driver.age >= 43 && Math.random() < 0.65 && gameState.freeAgents.length > 0) {
          const rookie = gameState.freeAgents.shift();
          rookie.teamId = driver.teamId;
          rookie.contract = 2;
          rookie.points = 0;
          rookie.wins = 0;
          rookie.podiums = 0;
          gameState.newsFeed.unshift(`RITIRO: ${driver.name} lascia la F1! Al suo posto debutta il giovane ${rookie.name}.`);
          gameState.drivers[idx] = rookie;
          return;
        }

        driver.points = 0;
        driver.wins = 0;
        driver.podiums = 0;
      });

      generateTeamPrincipalOffer();

      gameState.season += 1;
      gameState.round = 1;
      gameState.weekend = initWeekendState(1, gameState.userTeamId, gameState.drivers);
      gameState.activeTab = 'hub';

      saveGame();
      showToast(`Benvenuto nella Stagione ${gameState.season}!`, 'success');
      renderApp();
    }

    /**
     * =========================================================================
     * 9. SETTINGS & SAVE EXPORT/IMPORT MODAL
     * =========================================================================
     */
    function openSettingsModal() {
      const jsonStr = JSON.stringify(gameState);
      openModal(`
        <h3 class="text-base font-extrabold text-white mb-1">Salvataggio & Opzioni</h3>
        <p class="text-xs text-slate-400 mb-3">I tuoi progressi vengono salvati automaticamente nella memoria del telefono.</p>

        <div class="space-y-2.5 mb-4">
          <button onclick="copySaveToClipboard()" class="w-full py-2.5 rounded-xl bg-sky-600 hover:bg-sky-500 text-xs font-bold text-white">
            📋 Copia Codice Salvataggio (Backup)
          </button>
          <button onclick="confirmResetCareer()" class="w-full py-2.5 rounded-xl bg-red-950 border border-red-600 text-xs font-bold text-red-300">
            🗑️ Nuova Carriera (Cancella Dati)
          </button>
        </div>

        <textarea id="save-backup-area" class="w-full h-20 bg-f1bg border border-f1border rounded-xl p-2 text-[10px] font-mono-num text-slate-400 mb-3" readonly>${jsonStr}</textarea>

        <button onclick="closeModal()" class="w-full py-2.5 rounded-xl bg-slate-800 text-xs font-bold text-white">Chiudi</button>
      `);
    }

    function copySaveToClipboard() {
      const el = document.getElementById('save-backup-area');
      if (!el) return;
      el.select();
      try {
        document.execCommand('copy');
        showToast('Backup salvataggio copiato negli appunti!', 'success');
      } catch (e) {
        showToast('Impossibile copiare automaticamente.', 'warning');
      }
    }

    function confirmResetCareer() {
      localStorage.removeItem(STORAGE_KEY);
      gameState = null;
      closeModal();
      renderTeamSelection();
    }

    // Boot App & Start Smooth 60fps Animation Loop
    window.addEventListener('DOMContentLoaded', () => {
      renderApp();
      startAnimationLoop();
    });
  </script>
</body>
