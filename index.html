<!DOCTYPE html>
<html lang="it" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0b0e14" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Formula Manager 2026</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace']
          },
          colors: {
            f1bg: '#0b0e14',
            f1card: '#131822',
            f1border: '#232b3b',
            f1red: '#e10600'
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="bg-f1bg text-slate-100 min-h-screen flex flex-col items-center">
  <div id="app" class="w-full max-w-md md:max-w-3xl lg:max-w-6xl min-h-screen flex flex-col bg-f1bg relative shadow-2xl border-x border-f1border/40"></div>

  <script src="js/config.js"></script>
  <script src="js/state.js"></script>
  <script src="js/management.js"></script>
  <script src="js/weekend.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
