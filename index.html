      { round: 24, dateLabel: '27-29 Nov', name: 'Qatar', circuit: 'Lusail', flag: '🇶🇦', laps: 57, baseLap: 84.3, downforce: 9, topSpeed: 8, tyreDeg: 3, rainChance: 0.02, hasSprint: false, path: 'M 150,130 L 76,130 C 42,130 42,92 68,72 L 126,34 C 182,24 246,38 262,72 C 272,98 252,126 212,130 Z' }
    ];

    const TYRE_COMPOUNDS = {
      S: { id: 'S', name: 'Soft', short: 'S', color: '#ff3b30', text: '#ffffff', paceBonus: -1.15, degRate: 4.35, wet: 0 },
      M: { id: 'M', name: 'Medium', short: 'M', color: '#ffcc00', text: '#000000', paceBonus: -0.45, degRate: 2.75, wet: 0 },
      H: { id: 'H', name: 'Hard', short: 'H', color: '#f2f2f7', text: '#000000', paceBonus: 0.10, degRate: 1.85, wet: 0 },
      I: { id: 'I', name: 'Inter', short: 'I', color: '#34c759', text: '#ffffff', paceBonus: 1.75, degRate: 2.25, wet: 1 },
      W: { id: 'W', name: 'Wet', short: 'W', color: '#007aff', text: '#ffffff', paceBonus: 3.30, degRate: 1.75, wet: 2 }
    };

    const RND_TIERS = {
      minor: { id: 'minor', label: 'Minore', cost: 4.5, races: 1, gain: 1.4, desc: 'Aggiornamento rapido a basso costo' },
      standard: { id: 'standard', label: 'Standard', cost: 9.0, races: 2, gain: 2.8, desc: 'Pacchetto bilanciato su 2 GP' },
      major: { id: 'major', label: 'Evoluzione', cost: 15.5, races: 3, gain: 4.6, desc: 'Grande sviluppo ad alto impatto' }
    };

    function formatLapTime(sec) {
      if (!sec || typeof sec !== 'number' || !isFinite(sec) || sec >= 890 || sec <= 0) return '--:--.---';
      const totalMs = Math.round(sec * 1000);
      const mins = Math.floor(totalMs / 60000);
      const remMs = totalMs % 60000;
      const wholeSecs = Math.floor(remMs / 1000);
      const millis = remMs % 1000;
      return `${mins}:${String(wholeSecs).padStart(2, '0')}.${String(millis).padStart(3, '0')}`;
    }

    function getEstimatedStints(track, rules) {
      const trackDegMult = track.tyreDeg === 3 ? 1.24 : track.tyreDeg === 2 ? 1.0 : 0.84;
      const ruleMult = (rules && rules.extraDegMultiplier) ? rules.extraDegMultiplier : 1.0;

      const calcRange = (compoundKey) => {
        const comp = TYRE_COMPOUNDS[compoundKey];
        const rate = comp.degRate * trackDegMult * ruleMult;
        const avgLaps = Math.max(5, Math.round(66 / rate));
        const minLaps = Math.max(4, Math.min(Math.max(6, track.laps - 4), avgLaps - 2));
        const maxLaps = Math.max(minLaps + 2, Math.min(Math.max(8, track.laps - 3), avgLaps + 2));
        return `${minLaps}-${maxLaps}`;
      };

      return { S: calcRange('S'), M: calcRange('M'), H: calcRange('H') };
    }

    function getMoodMeta(moodValue) {
      const val = Math.max(0, Math.min(100, Number(moodValue ?? 65)));
      if (val >= 82) return { label: 'Euforico', emoji: '🔥', color: 'text-emerald-400', bg: 'bg-emerald-950/50 border-emerald-500/40', paceDelta: -0.35, degMult: 0.90 };
      if (val >= 62) return { label: 'Motivato', emoji: '😄', color: 'text-sky-300', bg: 'bg-sky-950/40 border-sky-500/35', paceDelta: -0.15, degMult: 0.96 };
      if (val >= 42) return { label: 'Neutro', emoji: '😐', color: 'text-slate-300', bg: 'bg-slate-800/70 border-slate-600/40', paceDelta: 0.0, degMult: 1.0 };
      if (val >= 22) return { label: 'Teso', emoji: '😟', color: 'text-amber-300', bg: 'bg-amber-950/50 border-amber-500/40', paceDelta: 0.22, degMult: 1.07 };
      return { label: 'Frustrato', emoji: '😡', color: 'text-red-400', bg: 'bg-red-950/60 border-red-500/45', paceDelta: 0.45, degMult: 1.15 };
    }

    function getRoleLabel(role) {
      if (role === 'lead') return '1ª Guida';
      if (role === 'support') return '2ª Guida';
      return 'Pari Livello';
    }

    function getAffinityScore(driver, team, allDrivers = []) {
      if (!driver || !team) return 65;
      let score = 62;

      if (!driver.preferredDna || driver.preferredDna === 'balanced' || team.dna === 'balanced') {
        score += 5;
      } else if (driver.preferredDna === team.dna) {
        score += 12;
      } else {
        score -= 7;
      }

      if (driver.role === 'lead') {
        score += team.prestige >= 85 ? 8 : 3;
      } else if (driver.role === 'support') {
        score += driver.acceptsSupport ? 8 : -16;
      } else {
        score += 4;
      }

      const mate = allDrivers.find(d => d.teamId === team.id && d.id !== driver.id);
      if (mate && gameState && gameState.rivalries) {
        const riv = getRivalryValue(driver.id, mate.id);
        if (riv >= 65) score -= 10;
        else if (riv >= 40) score -= 4;
      }

      score += Math.round(((driver.mood ?? 65) - 65) * 0.25);
      return Math.max(20, Math.min(99, score));
    }

    function getRivalryKey(idA, idB) {
      return [idA, idB].sort().join('__');
    }

    function getRivalryValue(idA, idB) {
      if (!gameState || !gameState.rivalries || !idA || !idB || idA === idB) return 0;
      return gameState.rivalries[getRivalryKey(idA, idB)] || 0;
    }

    function bumpRivalry(idA, idB, delta, note = '') {
      if (!gameState || !idA || !idB || idA === idB) return;
      gameState.rivalries = gameState.rivalries || {};
      const key = getRivalryKey(idA, idB);
      const prev = gameState.rivalries[key] || 0;
      const next = Math.max(0, Math.min(100, Math.round(prev + delta)));
      gameState.rivalries[key] = next;

      const dA = gameState.drivers.find(d => d.id === idA);
      const dB = gameState.drivers.find(d => d.id === idB);
      if (dA && dB && next - prev >= 6 && note) {
        pushMediaQuote('Rivalita', `${dA.code} vs ${dB.code} (${next}/100): ${note}`);
      }
    }

    function pushMediaQuote(sourceTag, text) {
      if (!gameState) return;
      gameState.mediaFeed = gameState.mediaFeed || [];
      gameState.mediaFeed.unshift({
        id: `m_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
        round: gameState.round,
        source: sourceTag,
        text
      });
      if (gameState.mediaFeed.length > 50) gameState.mediaFeed.length = 50;
      gameState.newsFeed.unshift(`[${sourceTag}] ${text}`);
    }

    function checkTransferRequestStatus(driver) {
      if (!driver) return;
      const shouldRequest = (driver.mood ?? 65) <= 28 || (!driver.acceptsSupport && driver.role === 'support');
      if (shouldRequest && !driver.transferRequest) {
        driver.transferRequest = true;
        if (driver.teamId === gameState.userTeamId) {
          pushMediaQuote('Pilota', `${driver.name} ha comunicato al muretto di voler valutare altre opzioni sul mercato se la situazione non cambia.`);
        }
      } else if (!shouldRequest && (driver.mood ?? 65) >= 55 && driver.role !== 'support') {
        driver.transferRequest = false;
      }
    }

    function adjustDriverMood(driverId, delta, reasonText = '') {
      if (!gameState) return;
      const driver = gameState.drivers.find(d => d.id === driverId);
      if (!driver) return;
      const prev = driver.mood ?? 65;
      const next = Math.max(0, Math.min(100, Math.round(prev + delta)));
      driver.mood = next;
      checkTransferRequestStatus(driver);
      const diff = next - prev;
      if (driver.teamId === gameState.userTeamId && Math.abs(diff) >= 2 && reasonText) {
        const sign = diff > 0 ? `+${diff}` : `${diff}`;
        gameState.newsFeed.unshift(`UMORE ${driver.code} (${sign} -> ${next}/100): ${reasonText}`);
      }
    }

    function generatePaddockPressForRound(roundNum) {
      if (!gameState) return;
      const track = CALENDAR_2026[roundNum - 1] || CALENDAR_2026[0];
      const userTeam = getUserTeam();
      const uDrivers = getUserDrivers();
      const sortedTeams = [...gameState.teams].sort((a, b) => b.points - a.points);
      const rivalTeam = sortedTeams.find(t => t.id !== userTeam.id) || sortedTeams[0];
      const rivalDriver = gameState.drivers.find(d => d.teamId === rivalTeam.id);

      const pressureLvl = Math.min(100, Math.max(25, Math.round(userTeam.fanPassion * 0.65 + (11 - userTeam.objective) * 3.5)));
      gameState.paddockPressure = pressureLvl;

      const fanLines = [
        `Pressione mediatica al ${pressureLvl}%: i tifosi di ${userTeam.name} chiedono un weekend senza sbavature a ${track.name}.`,
        `Conferenza stampa pre-GP: i giornalisti incalzano ${userTeam.name} sugli obiettivi a ${track.circuit} (obiettivo Top ${userTeam.objective}).`
      ];
      pushMediaQuote('Stampa Pre-GP', fanLines[roundNum % fanLines.length]);

      if (rivalTeam && rivalDriver) {
        pushMediaQuote('Team Principal', `${rivalTeam.tpName} (${rivalTeam.name}): "A ${track.name} metteremo pressione a ${userTeam.name} fin dal venerdi."`);
        bumpRivalry(uDrivers[0]?.id, rivalDriver.id, 4, `Dichiarazioni accese alla vigilia di ${track.name}`);
      }

      if (uDrivers.length === 2) {
        const [dA, dB] = uDrivers;
        const internalRiv = getRivalryValue(dA.id, dB.id);
        if (internalRiv >= 30 || userTeam.hierarchy === 'equal') {
          pushMediaQuote('Paddock', `Riflettori puntati sul box ${userTeam.name}: ${dA.code} e ${dB.code} partono alla pari e vogliono imporsi subito.`);
        }
      }
    }

    function generatePostSessionPress(sessionType, payload = {}) {
      if (!gameState) return;
      const track = CALENDAR_2026[gameState.round - 1] || CALENDAR_2026[0];
      const userTeam = getUserTeam();
      const uDrivers = getUserDrivers();

      if (sessionType === 'quali' && payload.gridOrder) {
        const bestUserIdx = payload.gridOrder.findIndex(e => e.teamId === userTeam.id);
        const bestPos = bestUserIdx >= 0 ? bestUserIdx + 1 : 15;
        if (bestPos <= 3) {
          gameState.paddockPressure = Math.max(20, (gameState.paddockPressure || 65) - 8);
          pushMediaQuote('Stampa Qualifiche', `Exploit ${userTeam.name} a ${track.name}: prima/seconda fila conquistata! Entusiasmo alle stelle nel paddock.`);
          uDrivers.forEach(d => adjustDriverMood(d.id, 3, 'Ottima qualifica acclamata dalla stampa'));
        } else if (bestPos > userTeam.objective * 2 + 4) {
          gameState.paddockPressure = Math.min(100, (gameState.paddockPressure || 65) + 10);
          pushMediaQuote('Stampa Qualifiche', `Sabato amaro per ${userTeam.name} (miglior piazzamento P${bestPos}): la stampa critica l'assetto scelto.`);
          uDrivers.forEach(d => adjustDriverMood(d.id, -3, 'Pressione mediatica dopo qualifica deludente'));
        } else {
          pushMediaQuote('Stampa Qualifiche', `Qualifiche solide per ${userTeam.name} a ${track.name}: miglior vettura in P${bestPos}, tutto aperto per domenica.`);
        }
      }

      if (sessionType === 'race' && payload.classification) {
        const uRows = payload.classification.filter(r => r.isUser);
        const bestRow = uRows[0];
        const bestPos = typeof bestRow?.pos === 'number' ? bestRow.pos : 22;

        if (bestPos === 1) {
          gameState.paddockPressure = Math.max(15, (gameState.paddockPressure || 65) - 15);
          pushMediaQuote('Stampa Post-GP', `TRIONFO ${userTeam.name}! ${bestRow.name} domina a ${track.name} e zittisce ogni critica nel paddock.`);
        } else if (bestPos <= 3) {
          gameState.paddockPressure = Math.max(20, (gameState.paddockPressure || 65) - 10);
          pushMediaQuote('Stampa Post-GP', `Podio pesante per ${userTeam.name} con ${bestRow.name} (P${bestPos}): strategia promossa a pieni voti.`);
        } else if (bestPos <= 10) {
          pushMediaQuote('Stampa Post-GP', `Zona punti per ${userTeam.name} a ${track.name} (P${bestPos}). Il muretto porta a casa punti preziosi.`);
        } else {
          gameState.paddockPressure = Math.min(100, (gameState.paddockPressure || 65) + 12);
          pushMediaQuote('Stampa Post-GP', `Domenica da dimenticare per ${userTeam.name} fuori dai punti a ${track.name}: sale la pressione sul Team Principal.`);
        }

        if (uRows.length === 2 && typeof uRows[0].pos === 'number' && typeof uRows[1].pos === 'number') {
          if (Math.abs(uRows[0].pos - uRows[1].pos) === 1) {
            bumpRivalry(uRows[0].driverId, uRows[1].driverId, 5, `Arrivo in scia P${uRows[0].pos}-P${uRows[1].pos} a ${track.name}`);
          }
        }
      }
    }

    function showToast(msg, type = 'info') {
      const existing = document.getElementById('fm-toast');
      if (existing) existing.remove();
      const colors = {
        info: 'bg-slate-800 border-sky-500/60 text-sky-100',
        success: 'bg-emerald-950 border-emerald-500/70 text-emerald-100',
        danger: 'bg-red-950 border-red-500/70 text-red-100'
      };
      const div = document.createElement('div');
      div.id = 'fm-toast';
      div.className = `fixed top-3 left-1/2 -translate-x-1/2 z-50 px-3.5 py-2 rounded-xl border text-xs font-bold shadow-xl max-w-[92vw] text-center ${colors[type] || colors.info}`;
      div.textContent = msg;
      document.body.appendChild(div);
      setTimeout(() => div.remove(), 3200);

    function seedInitialRivalries(drivers) {
      const map = {};
      const pairs = [
        ['lec', 'ham', 28],
        ['ver', 'nor', 45],
        ['nor', 'pia', 34],
        ['rus', 'ant', 22],
        ['alo', 'str', 20],
        ['gas', 'oco', 48],
        ['sai', 'alb', 18],
        ['tsu', 'had', 20]
      ];
      pairs.forEach(([a, b, val]) => {
        if (drivers.some(d => d.id === a) && drivers.some(d => d.id === b)) {
          map[getRivalryKey(a, b)] = val;
        }
      });
      return map;
    }

    function createInitialState(selectedTeamId) {
      const teams = JSON.parse(JSON.stringify(INITIAL_TEAMS)).map(t => ({
        ...t,
        points: 0,
        wins: 0,
        podiums: 0
      }));

      const drivers = JSON.parse(JSON.stringify(INITIAL_DRIVERS)).map((d, idx) => ({
        ...d,
        mood: d.mood ?? (62 + ((idx * 7) % 18)),
        points: 0,
        wins: 0,
        podiums: 0,
        transferRequest: false
      }));

      const freeAgents = JSON.parse(JSON.stringify(FREE_AGENTS_POOL)).map((fa, idx) => ({
        ...fa,
        mood: fa.mood ?? (60 + idx * 3),

      }));

      const state = {
        season: 2026,
        round: 1,
        userTeamId: selectedTeamId,
        activeTab: 'hub',
        hubMediaFilter: 'all',
        paddockPressure: 62,
        budgetCap: 150.0,

          pointsTop12: false,
          extraDegMultiplier: 1.0
        },
        teams,
        drivers,
        freeAgents,
        rivalries: seedInitialRivalries(drivers),
        pendingUpgrades: [],
        pendingUpgradeConfirm: null,
        completedRounds: [],
        mediaFeed: [],
        newsFeed: [
          `Benvenuto nel paddock 2026! Hai assunto il ruolo di Team Principal per ${teams.find(t => t.id === selectedTeamId).name}.`,
          `Weekend strutturato su Venerdi (FP1-FP2), Sabato (FP3-Qualifiche) e Domenica (Pre-Gara-Gara).`
        ],
        weekend: initWeekendState(1, selectedTeamId, drivers)
      };

      gameState = state;
      generatePaddockPressForRound(1);
      return gameState;

    function initWeekendState(roundNum, userTeamId, drivers) {
      const track = CALENDAR_2026[roundNum - 1] || CALENDAR_2026[0];
      const userDrivers = drivers.filter(d => d.teamId === userTeamId);
      const d1 = userDrivers[0];
      const d2 = userDrivers[1];

      const baseSusp = Math.max(1, Math.min(10, Math.round((track.downforce + (10 - track.topSpeed)) / 2)));
      const baseBrake = Math.max(1, Math.min(10, 11 - track.topSpeed));
      const baseRide = Math.max(1, Math.min(10, track.tyreDeg === 3 ? 6 : (track.downforce >= 8 ? 5 : 7)));
      const baseDiff = Math.max(1, Math.min(10, track.tyreDeg === 3 ? 6 : 5));

      const targetD1 = {
        wing: track.downforce,
        susp: baseSusp,
        brake: baseBrake,
        ride: baseRide,
        diff: baseDiff
      };
      const targetD2 = {
        wing: Math.max(1, Math.min(10, track.downforce - (track.downforce > 6 ? 1 : -1))),
        susp: Math.max(1, Math.min(10, baseSusp + (baseSusp < 8 ? 1 : -1))),
        brake: baseBrake,
        ride: Math.max(1, Math.min(10, baseRide + (baseRide < 9 ? 1 : -1))),
        diff: Math.max(1, Math.min(10, baseDiff - (baseDiff > 2 ? 1 : 0)))
      };

      const makeDriverSetup = (initWing = 5, initSusp = 5, initBrake = 5, initRide = 5, initDiff = 5) => ({
        wing: initWing,
        susp: initSusp,
        brake: initBrake,
        ride: initRide,
        diff: initDiff,
        confidence: 35,
        plan: 'race',
        fpRunsDone: 0,
        lastError: null,
        feedback: 'Venerdi/Sabato prove libere: regola i 5 parametri di assetto (Ala, Sospensioni, Freni, Altezza/Gomme, Differenziale) ed esegui i run.'
      });

      return {
        round: roundNum,
        day: 'friday',
        phase: 'fp',
        targets: { wing: targetD1.wing, susp: targetD1.susp, brake: targetD1.brake, ride: targetD1.ride, diff: targetD1.diff },
        driverTargets: { d1: targetD1, d2: targetD2 },
        fp: {
          session: 1,
          runsLeftInSession: 3,
          activeSlot: 'd1',
          d1: d1 ? makeDriverSetup(4, 5, 6, 5, 5) : null,
          d2: d2 ? makeDriverSetup(6, 5, 4, 6, 5) : null
        },
        quali: null,
        preRaceStrategy: null,
        race: null,
        results: null
      };
    }

    function getWeekendDayBadge(weekend) {
      if (!weekend) return 'VENERDI';
      if (weekend.phase === 'fp') {
        if (weekend.session === 1 || weekend.fp?.session === 1) return 'VEN • FP1';
        if (weekend.fp?.session === 2) return 'VEN • FP2';
        return 'SAB • FP3';
      }
      if (weekend.phase === 'quali') return 'SAB • QUALIFICHE';
      if (weekend.phase === 'strategy') return 'DOM • PRE-GARA';
      if (weekend.phase === 'race' || weekend.phase === 'summary') return 'DOM • GARA';
      return 'WEEKEND';
    }

      gameState.hubMediaFilter = flt;

    function setTeamHierarchyMode(mode) {
      const team = getUserTeam();
      const uDrivers = getUserDrivers();
      if (!team || uDrivers.length < 2) return;

      team.hierarchy = mode;
      const [d1, d2] = uDrivers;

      if (mode === 'equal') {
        d1.role = 'co_lead';
        d2.role = 'co_lead';
        adjustDriverMood(d1.id, 3, 'Scuderia impostata su pari livello');
        adjustDriverMood(d2.id, 4, 'Parita di trattamento confermata dal team');
        pushMediaQuote('Team Principal', `${team.name} annuncia pari opportunita in pista tra ${d1.name} e ${d2.name}.`);
        showToast('Gerarchia impostata: Pari Livello per entrambi i piloti.', 'info');
      } else {
        applyRoleAssignments(d1.id, 'lead', d2.id, 'support');
      }

      saveGame();
      renderApp();
    }

    function setLeadDriverSelection(newLeadId) {
      const team = getUserTeam();
      const uDrivers = getUserDrivers();
      if (!team || uDrivers.length < 2) return;
      team.hierarchy = '1st_2nd';
      const leadDrv = uDrivers.find(d => d.id === newLeadId) || uDrivers[0];
      const suppDrv = uDrivers.find(d => d.id !== leadDrv.id) || uDrivers[1];
      applyRoleAssignments(leadDrv.id, 'lead', suppDrv.id, 'support');
      saveGame();
      renderApp();
    }

    function applyRoleAssignments(leadId, leadRole, suppId, suppRole) {
      const team = getUserTeam();
      const lead = gameState.drivers.find(d => d.id === leadId);
      const supp = gameState.drivers.find(d => d.id === suppId);
      if (!lead || !supp) return;

      const prevSuppRole = supp.role;
      lead.role = leadRole;
      supp.role = suppRole;

      adjustDriverMood(lead.id, 6, `Nominato 1a Guida in ${team.name}`);

      if (prevSuppRole !== 'support') {
        const penalty = supp.acceptsSupport ? -6 : -18;
        adjustDriverMood(supp.id, penalty, supp.acceptsSupport ? 'Declassato a 2a Guida ma disposto a collaborare' : 'Non gradisce il ruolo di 2a Guida: tensione alta!');
        bumpRivalry(lead.id, supp.id, supp.acceptsSupport ? 8 : 18, `Gerarchia 1a/2a guida in casa ${team.name}`);
        if (!supp.acceptsSupport) {
          pushMediaQuote('Pilota', `${supp.name} mal digerisce il ruolo di 2a guida in ${team.name} e guarda gia al mercato.`);
        } else {

    function getPitLaneCoord(car) {
      const m = car.pitAnim?.mode;
      const t = Math.min(1, car.pitAnim?.t || 0);
      if (m === 'pit_in') {
        return {
          x: 224 + (150 - 224) * t,
          y: 130 + (157 - 130) * t
        };
      }
      if (m === 'pit_out') {
        return {
          x: 150 + (76 - 150) * t,
          y: 157 + (130 - 157) * t
        };
      }
      return null;
    }

    function syncTrackCarPositions(svgElementId = 'fm-circuit-svg') {
      const svg = document.getElementById(svgElementId);
      const pathEl = svg?.querySelector('#active-track-path');
      if (!svg || !pathEl || typeof pathEl.getTotalLength !== 'function') return;

      const totalLen = pathEl.getTotalLength();
      if (!totalLen) return;

      const dots = svg.querySelectorAll('[data-track-progress]');
      dots.forEach(dot => {
        const mode = dot.getAttribute('data-pit-mode') || 'none';
        if (mode === 'pit_in' || mode === 'pit_out') return;
        const p = parseFloat(dot.getAttribute('data-track-progress') || '0');
        const normalized = ((p % 1) + 1) % 1;
        const pt = pathEl.getPointAtLength(normalized * totalLen);
        dot.setAttribute('cx', pt.x.toFixed(1));
        dot.setAttribute('cy', pt.y.toFixed(1));
      });
    }

    function runPracticeSession() {
      const fp = gameState.weekend.fp;
      if (fp.session > 3) return;
      const targetsMap = gameState.weekend.driverTargets || {
        d1: gameState.weekend.targets,
        d2: gameState.weekend.targets
      };

      ['d1', 'd2'].forEach(slot => {
        const data = fp[slot];
        if (!data) return;
        const t = targetsMap[slot] || gameState.weekend.targets;
        const diffWing = data.wing - t.wing;
        const diffSusp = data.susp - t.susp;
        const diffBrake = data.brake - t.brake;
        const diffRide = (data.ride ?? 5) - (t.ride ?? 5);
        const diffDiff = (data.diff ?? 5) - (t.diff ?? 5);

        const totalError = Math.abs(diffWing) + Math.abs(diffSusp) + Math.abs(diffBrake) + Math.abs(diffRide) + Math.abs(diffDiff);
        const rawConf = Math.max(30, Math.min(100, 100 - totalError * 4.5));
        const improved = rawConf > data.confidence || (data.lastError !== null && totalError < data.lastError);
        data.confidence = Math.max(data.confidence, rawConf);
        data.lastError = totalError;
        data.fpRunsDone += 1;

        const userDrivers = getUserDrivers();
        const drvObj = slot === 'd1' ? userDrivers[0] : userDrivers[1];
        if (drvObj) {
          adjustDriverMood(drvObj.id, improved ? 2 : -1, improved ? 'Progresso assetto nelle prove libere' : 'Assetto ancora da sistemare nelle FP');
        }

        const sentences = [];
        if (diffWing === 0) sentences.push('Ali bilanciate: carico e allungo in linea con la pista.');
        else if (diffWing < -1) sentences.push('Poca deportanza nei curvoni: alza l incidenza delle ali.');
        else if (diffWing < 0) sentences.push('Manca un leggero carico in curva: aggiungi 1 tacca di ala.');
        else if (diffWing > 1) sentences.push('Ali troppo cariche sui rettilinei: scarica l incidenza.');
        else sentences.push('Leggero eccesso di ala: un piccolo scarico aiuta in allungo.');

        if (diffSusp === 0) sentences.push('Sospensioni ben accordate sui cordoli.');
        else if (diffSusp < 0) sentences.push('Sospensioni troppo morbide: irrigidisci per maggiore reattivita.');
        else sentences.push('Sospensioni troppo rigide: ammorbidisci per assorbire meglio i cordoli.');

        if (diffRide < -1) sentences.push('Altezza da terra troppo bassa: rischio toccate sul fondo.');
        else if (diffRide > 1) sentences.push('Altezza/pressioni troppo alte: si perde efficienza aerodinamica.');

        if (diffDiff < -1) sentences.push('Differenziale troppo aperto in uscita curva: chiudilo leggermente.');
        else if (diffDiff > 1) sentences.push('Differenziale troppo chiuso: tende a spingere il muso largo in uscita.');

        if (diffBrake < 0) sentences.push('Freni troppo arretrati: sposta il bilanciamento piu avanti in staccata.');
        else if (diffBrake > 0) sentences.push('Freni troppo sbilanciati sull anteriore: arretra leggermente.');

        data.feedback = sentences.join(' ');
      });

      fp.runsLeftInSession = (fp.runsLeftInSession ?? 3) - 1;
      if (fp.runsLeftInSession <= 0) {
        if (fp.session < 3) {
          fp.session += 1;
          fp.runsLeftInSession = 3;
          const nextDay = fp.session === 3 ? 'Sabato (FP3)' : 'Venerdi (FP2)';
          showToast(`Sessione terminata: si passa a ${nextDay} (3 run)!`, 'info');
        } else {
          fp.session = 4;
          fp.runsLeftInSession = 0;
          showToast('Tutte le sessioni di Prove Libere completate!', 'success');
        }
      } else {
        showToast(`Run completato! Restano ${fp.runsLeftInSession} run.`, 'info');
      }

      saveGame();
      renderApp();
    }

    function startQualifying() {
      stopAllLoops();
      const track = CALENDAR_2026[gameState.round - 1];
      const fp = gameState.weekend.fp;
      const userDrivers = getUserDrivers();
      const weather = Math.random() < track.rainChance * 0.55 ? 'wet' : 'dry';
      const initialGrip = weather === 'wet' ? 54 : 68;

      const entries = gameState.drivers.map(d => {
        const isUser = d.teamId === gameState.userTeamId;
        let confBonus = 0.65;
        let plan = 'race';
        if (isUser) {
          const slot = userDrivers[0]?.id === d.id ? fp.d1 : fp.d2;
          confBonus = (slot?.confidence || 45) / 100;
          plan = slot?.plan || 'race';
        }
        return {
          driverId: d.id,
          name: d.name,
          code: d.code,
          number: d.number,
          teamId: d.teamId,
          isUser,
          bestTime: 999,
          eliminated: false,
          eliminatedIn: null,
          status: 'BOX',
          runTimer: 0,
          trackPos: 0,
          selectedTyre: weather === 'wet' ? 'I' : 'S',
          confBonus,
          plan,
          aiRunsLeft: isUser ? 0 : 2
        };
      });

      gameState.weekend.day = 'saturday';
      gameState.weekend.phase = 'quali';
      gameState.weekend.quali = {
        roundName: 'Q1',
        cutoff: 16,
        timeLeft: 1080,
        speed: 1,
        weather,
        trackGrip: initialGrip,
        entries
      };

      saveGame();
      renderApp();
    }

    function setQualiSpeed(spd) {
      if (!gameState.weekend?.quali) return;
      gameState.weekend.quali.speed = spd;
      saveGame();
      renderApp();
    }

    function selectQualiTyre(driverId, tyreCode) {
      const q = gameState.weekend?.quali;
      if (!q) return;
      const entry = q.entries.find(e => e.driverId === driverId);
      if (!entry || entry.status !== 'BOX') return;
      entry.selectedTyre = tyreCode;
      saveGame();
      renderApp();
    }

    function sendDriverOutQuali(driverId) {
      const q = gameState.weekend?.quali;
      if (!q || q.timeLeft <= 60) return;
      const entry = q.entries.find(e => e.driverId === driverId);
      if (!entry || entry.eliminated || entry.status !== 'BOX') return;
      entry.status = 'OUT_LAP';
      entry.runTimer = 0;
      entry.trackPos = 0.01;
      showToast(`${entry.code} esce dai box con gomma ${TYRE_COMPOUNDS[entry.selectedTyre].name}!`, 'info');
      saveGame();
      renderApp();
    }

    function tickQualiSecond() {
      const q = gameState.weekend?.quali;
      if (!q || gameState.weekend.phase !== 'quali' || q.speed === 0) return;
      const track = CALENDAR_2026[gameState.round - 1];
      const step = q.speed * 4;
      q.timeLeft = Math.max(0, q.timeLeft - step);

      q.entries.forEach(entry => {
        if (entry.eliminated || entry.isUser) return;
        if (entry.status === 'BOX' && entry.aiRunsLeft > 0) {
          if ((q.timeLeft < 860 && entry.aiRunsLeft === 2) || (q.timeLeft < 340 && entry.aiRunsLeft === 1)) {
            if (Math.random() < 0.25) {
              entry.aiRunsLeft -= 1;
              entry.selectedTyre = q.weather === 'wet' ? 'I' : 'S';
              entry.status = 'OUT_LAP';
              entry.runTimer = 0;
              entry.trackPos = 0.01;
            }
          }
        }
      });

      const activeCarsOnTrack = q.entries.filter(e => !e.eliminated && e.status !== 'BOX').length;
      const currentGrip = q.trackGrip ?? (q.weather === 'wet' ? 54 : 68);
      const gripGain = activeCarsOnTrack * 0.035 * (q.weather === 'wet' ? 0.35 : 1.0);
      const weatherGripDelta = q.weather === 'wet' ? -0.06 : 0.01;
      q.trackGrip = Math.max(38, Math.min(100, Number((currentGrip + gripGain + weatherGripDelta).toFixed(1))));

      q.entries.forEach(entry => {
        if (entry.eliminated || entry.status === 'BOX') return;
        entry.runTimer += step;

        if (entry.status === 'OUT_LAP') {
          if (entry.runTimer >= 85) {
            entry.status = 'HOT_LAP';
            entry.runTimer = 0;
          }
        } else if (entry.status === 'HOT_LAP') {
          if (entry.runTimer >= track.baseLap) {
            const driver = gameState.drivers.find(d => d.id === entry.driverId);
            const team = getTeam(entry.teamId);
            const moodMeta = getMoodMeta(driver.mood ?? 65);
            const comp = TYRE_COMPOUNDS[entry.selectedTyre];
            const carPerf = (team.aero * 0.42 + team.pu * 0.35 + team.chassis * 0.23);
            const carDelta = (90 - carPerf) * 0.09;
            const driverDelta = (90 - driver.pace) * 0.06;
            const setupDelta = entry.isUser ? -(entry.confBonus * 0.42) - (entry.plan === 'quali' ? 0.28 : 0) : -0.25;
            const gripDelta = ((82 - q.trackGrip) * 0.024);
            const trafficPenalty = Math.max(0, (activeCarsOnTrack - 6) * 0.06);
            let weatherPenalty = 0;
            if (q.weather === 'wet' && comp.wet === 0) weatherPenalty = driver.trait === 'wet_ace' ? 6.2 : 8.5;
            if (q.weather === 'dry' && comp.wet > 0) weatherPenalty = 4.2;

            const lap = track.baseLap + carDelta + driverDelta + setupDelta + moodMeta.paceDelta + comp.paceBonus + gripDelta + trafficPenalty + weatherPenalty + (Math.random() - 0.5) * 0.28;
            if (lap < entry.bestTime) entry.bestTime = lap;

            entry.status = 'IN_LAP';
            entry.runTimer = 0;
          }
        } else if (entry.status === 'IN_LAP') {
          if (entry.runTimer >= 80) {
            entry.status = 'BOX';
            entry.runTimer = 0;
            entry.trackPos = 0;
          }
        }
      });

      if (q.timeLeft <= 0) {
        q.speed = 0;
        const active = q.entries.filter(e => !e.eliminated).sort((a, b) => a.bestTime - b.bestTime);
        if (q.roundName === 'Q1') {
          active.slice(16).forEach(e => { e.eliminated = true; e.eliminatedIn = 'Q1'; e.status = 'BOX'; e.trackPos = 0; });
        } else if (q.roundName === 'Q2') {
          active.slice(10).forEach(e => { e.eliminated = true; e.eliminatedIn = 'Q2'; e.status = 'BOX'; e.trackPos = 0; });
        }
      }

      saveGame();
      renderApp();
    }

    function advanceQualiSession() {
      const q = gameState.weekend?.quali;
      if (!q) return;
      q.entries.forEach(e => { e.status = 'BOX'; e.runTimer = 0; e.trackPos = 0; });
      if (q.roundName === 'Q1') {
        q.roundName = 'Q2';
        q.cutoff = 10;
        q.timeLeft = 900;
        q.speed = 1;
        q.trackGrip = Math.min(100, Number(((q.trackGrip ?? 75) + 4.5).toFixed(1)));
        q.entries.filter(e => !e.eliminated).forEach(e => { e.bestTime = 999; e.aiRunsLeft = e.isUser ? 0 : 2; });
      } else if (q.roundName === 'Q2') {
        q.roundName = 'Q3';
        q.cutoff = 10;
        q.timeLeft = 720;
        q.speed = 1;
        q.trackGrip = Math.min(100, Number(((q.trackGrip ?? 82) + 4.0).toFixed(1)));
        q.entries.filter(e => !e.eliminated).forEach(e => { e.bestTime = 999; e.aiRunsLeft = e.isUser ? 0 : 2; });
      }
      saveGame();
      renderApp();
    }

    function startQualiSmoothLoop() {
      stopAllLoops();
      const q = gameState?.weekend?.quali;
      if (!q || gameState.weekend.phase !== 'quali') return;

      const track = CALENDAR_2026[gameState.round - 1];
      syncTrackCarPositions('fm-quali-svg');
      lastAnimTimestamp = performance.now();

      const animateQuali = (now) => {
        const dt = Math.min(0.1, (now - lastAnimTimestamp) / 1000);
        lastAnimTimestamp = now;

        const curQ = gameState?.weekend?.quali;
        if (curQ && curQ.speed > 0 && gameState.weekend.phase === 'quali') {
          const simSec = dt * curQ.speed * 4;
          curQ.entries.forEach(entry => {
            if (entry.eliminated || entry.status === 'BOX') return;
            const segDur = entry.status === 'HOT_LAP' ? track.baseLap : (entry.status === 'OUT_LAP' ? 85 : 80);
            entry.trackPos = (entry.trackPos || 0.01) + (simSec / segDur);
            const dot = document.getElementById(`quali-dot-${entry.driverId}`);
            if (dot) dot.setAttribute('data-track-progress', (entry.trackPos % 1).toFixed(4));
          });
          syncTrackCarPositions('fm-quali-svg');
        }
        animFrameId = requestAnimationFrame(animateQuali);
      };
      animFrameId = requestAnimationFrame(animateQuali);

      const ms = q.speed > 0 ? Math.max(250, 1000 / q.speed) : 1000;
      simTimer = setInterval(() => {
        if (gameState?.weekend?.quali && gameState.weekend.quali.speed > 0 && gameState.weekend.phase === 'quali') {
          tickQualiSecond();
        }
      }, ms);
    }

              return `

    function openPreRaceStrategy() {
      stopAllLoops();
      const q = gameState.weekend.quali;
      const track = CALENDAR_2026[gameState.round - 1];
      let gridOrder = [];
      if (q && q.entries) {
        const active = q.entries.filter(e => !e.eliminated).sort((a, b) => a.bestTime - b.bestTime);
        const elimQ2 = q.entries.filter(e => e.eliminatedIn === 'Q2').sort((a, b) => a.bestTime - b.bestTime);
        const elimQ1 = q.entries.filter(e => e.eliminatedIn === 'Q1').sort((a, b) => a.bestTime - b.bestTime);
        gridOrder = [...active, ...elimQ2, ...elimQ1];
        generatePostSessionPress('quali', { gridOrder });
      } else {
        gridOrder = [...gameState.drivers].sort((a, b) => b.ovr - a.ovr).map(d => ({ driverId: d.id }));
      }

      const makePlanForDriver = (driverId) => {
        const gridIdx = gridOrder.findIndex(e => e.driverId === driverId);
        const gridPos = gridIdx >= 0 ? gridIdx + 1 : 12;
        const stops = track.tyreDeg === 3 ? 2 : (track.laps >= 68 ? 2 : 1);
        const pit1 = Math.max(5, Math.min(track.laps - 8, Math.round(track.laps / (stops + 1))));
        const pit2 = Math.max(pit1 + 6, Math.min(track.laps - 4, Math.round((track.laps * 2) / (stops + 1))));
        const pit3 = Math.max(pit2 + 5, Math.min(track.laps - 2, Math.round((track.laps * 3) / (stops + 1))));
        const startTyre = track.tyreDeg === 3 ? 'M' : 'S';
        const stintTyres = [startTyre === 'S' ? 'H' : 'H', 'M', 'S', 'H'];
        return {
          driverId,
          gridPos,
          startTyre,
          stopsCount: stops,
          pitLaps: [pit1, pit2, pit3],
          stintTyres,
          initialPace: 'balanced'
        };
      };

      const userDrivers = getUserDrivers();
      gameState.weekend.day = 'sunday';
      gameState.weekend.preRaceStrategy = {
        d1: userDrivers[0] ? makePlanForDriver(userDrivers[0].id) : null,
        d2: userDrivers[1] ? makePlanForDriver(userDrivers[1].id) : null
      };
      gameState.weekend.phase = 'strategy';
      saveGame();
      renderApp();
    }

    function updateStrategyField(slot, field, val) {
      const strat = gameState.weekend.preRaceStrategy?.[slot];
      if (!strat) return;
      strat[field] = val;
      saveGame();
      renderApp();
    }

    function updateStrategyPitLap(slot, stopIdx, val) {
      const strat = gameState.weekend.preRaceStrategy?.[slot];
      if (!strat) return;
      const track = CALENDAR_2026[gameState.round - 1];
      strat.pitLaps[stopIdx] = Math.max(2, Math.min(track.laps - 1, parseInt(val, 10) || 10));
      saveGame();
      renderApp();
    }

    function updateStrategyStintTyre(slot, stintIdx, tyreCode) {
      const strat = gameState.weekend.preRaceStrategy?.[slot];
      if (!strat) return;
      strat.stintTyres[stintIdx] = tyreCode;
      saveGame();
      renderApp();
    }

      for (let i = 0; i < stopsCount; i++) {
        txt += ` -> ${stintTyres[i] || 'H'} (G${pitLaps[i] || 15})`;
      }
      return txt;
    }

    function openLiveRaceStrategyScreen() {
      const r = gameState.weekend?.race;

      r.speed = 0;

      gameState.weekend.liveDraft = null;
      saveGame();
      renderApp();
    }

    function closeLiveRaceStrategyScreen(resume = true) {
      const r = gameState.weekend?.race;
      if (!r) return;
      gameState.weekend.phase = 'race';
      gameState.weekend.liveDraft = null;
      if (resume && r.speed === 0) {
        r.speed = 1;
      }
      saveGame();
      renderApp();
    }

    function ensureLiveDraft() {
      const r = gameState.weekend?.race;
      if (!r) return null;
      if (!gameState.weekend.liveDraft) {
        const draft = {};
        r.cars.filter(c => c.isUser).forEach(c => {
          const remainingPlanned = Math.max(0, (c.plannedStops || 0) - (c.pitStops || 0));
          const upcomingLaps = [];
          const upcomingTyres = [];
          for (let i = c.pitStops || 0; i < (c.plannedStops || 0); i++) {
            upcomingLaps.push(c.pitLaps?.[i] || Math.min(r.totalLaps - 2, r.lap + 10));
            upcomingTyres.push(c.stintTyres?.[i] || 'H');
          }
          draft[c.driverId] = {
            remainingStops: remainingPlanned,
            upcomingLaps,
            upcomingTyres,
            paceMode: c.paceMode
          };
        });
        gameState.weekend.liveDraft = draft;
      }
      return gameState.weekend.liveDraft;
    }

    function setLiveDraftStops(driverId, count) {
      const draft = ensureLiveDraft();
      const r = gameState.weekend?.race;
      if (!draft || !draft[driverId] || !r) return;
      const n = Math.max(0, Math.min(3, parseInt(count, 10) || 0));
      draft[driverId].remainingStops = n;
      while (draft[driverId].upcomingLaps.length < n) {
        const lastLap = draft[driverId].upcomingLaps[draft[driverId].upcomingLaps.length - 1] || r.lap;
        draft[driverId].upcomingLaps.push(Math.min(r.totalLaps - 1, Math.max(r.lap + 2, lastLap + 12)));
      }
      while (draft[driverId].upcomingTyres.length < n) {
        draft[driverId].upcomingTyres.push('H');
      }
      saveGame();
      renderApp();
    }

    function setLiveDraftLap(driverId, idx, val) {
      const draft = ensureLiveDraft();
      const r = gameState.weekend?.race;
      if (!draft || !draft[driverId] || !r) return;
      const minLap = Math.min(r.totalLaps - 1, r.lap + 1);
      draft[driverId].upcomingLaps[idx] = Math.max(minLap, Math.min(r.totalLaps - 1, parseInt(val, 10) || minLap));
      saveGame();
      renderApp();
    }

    function setLiveDraftTyre(driverId, idx, tyreCode) {
      const draft = ensureLiveDraft();
      if (!draft || !draft[driverId]) return;
      draft[driverId].upcomingTyres[idx] = tyreCode;
      saveGame();
      renderApp();
    }

    function setLiveDraftPace(driverId, mode) {
      const draft = ensureLiveDraft();
      if (!draft || !draft[driverId]) return;
      draft[driverId].paceMode = mode;
      saveGame();
      renderApp();
    }

    function applyLiveStrategyChanges(driverId) {
      const draft = ensureLiveDraft();
      const r = gameState.weekend?.race;
      if (!draft || !draft[driverId] || !r) return;
      const car = r.cars.find(c => c.driverId === driverId);
      if (!car) return;

      const dPlan = draft[driverId];
      const alreadyDone = car.pitStops || 0;
      const newLaps = [...(car.pitLaps || [])];
      const newTyres = [...(car.stintTyres || [])];

      for (let k = 0; k < dPlan.remainingStops; k++) {
        newLaps[alreadyDone + k] = dPlan.upcomingLaps[k];
        newTyres[alreadyDone + k] = dPlan.upcomingTyres[k];
      }

      car.plannedStops = alreadyDone + dPlan.remainingStops;
      car.pitLaps = newLaps;
      car.stintTyres = newTyres;
      car.paceMode = dPlan.paceMode;

      const summary = formatPlanSummaryText(car.tyre, dPlan.remainingStops, dPlan.upcomingLaps, dPlan.upcomingTyres);
      r.logs.unshift(`G${r.lap} • Piano residuo ${car.code} aggiornato: ${summary}.`);
      showToast(`Piano residuo salvato per ${car.code}!`, 'success');
      saveGame();
      renderApp();
    }

    function pitNowFromLiveStrategy(driverId, tyreCode) {
      const r = gameState.weekend?.race;
      if (!r) return;
      const car = r.cars.find(c => c.driverId === driverId && !c.retired);
      if (!car) return;

      car.pitAnim = { mode: 'pit_in', t: 0, targetTyre: tyreCode };
      const alreadyDone = car.pitStops || 0;
      const remAfterThis = Math.max(0, (car.plannedStops || 0) - (alreadyDone + 1));
      car.plannedStops = alreadyDone + 1 + remAfterThis;
      car.stintTyres[alreadyDone] = tyreCode;
      car.pitLaps[alreadyDone] = r.lap;

      r.logs.unshift(`G${r.lap} • BOX IMMEDIATO per ${car.code} (${TYRE_COMPOUNDS[tyreCode].name}): scala il piano residuo.`);
      gameState.weekend.liveDraft = null;
      showToast(`${car.code} richiamato ai box questo giro (${TYRE_COMPOUNDS[tyreCode].short})!`, 'info');
      saveGame();
      renderApp();
    }
