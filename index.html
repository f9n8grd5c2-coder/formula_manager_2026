    function formatLapTime(sec) {
      if (!sec || typeof sec !== 'number' || !isFinite(sec) || sec >= 890 || sec <= 0) return '--:--.---';
      const totalMs = Math.round(sec * 1000);
      const mins = Math.floor(totalMs / 60000);
      const remMs = totalMs % 60000;
      const wholeSecs = Math.floor(remMs / 1000);
      const millis = remMs % 1000;
      return `${mins}:${String(wholeSecs).padStart(2, '0')}.${String(millis).padStart(3, '0')}`;
    }

    function getEstimatedStints(track, rules) {
      const trackDegMult = track.tyreDeg === 3 ? 1.24 : track.tyreDeg === 2 ? 1.0 : 0.84;
      const ruleMult = (rules && rules.extraDegMultiplier) ? rules.extraDegMultiplier : 1.0;

      const calcRange = (compoundKey) => {
        const comp = TYRE_COMPOUNDS[compoundKey];
        const rate = comp.degRate * trackDegMult * ruleMult;
        const avgLaps = Math.max(5, Math.round(66 / rate));
        const minLaps = Math.max(4, Math.min(Math.max(6, track.laps - 4), avgLaps - 2));
        const maxLaps = Math.max(minLaps + 2, Math.min(Math.max(8, track.laps - 3), avgLaps + 2));
        return `${minLaps}-${maxLaps}`;
      };

      return { S: calcRange('S'), M: calcRange('M'), H: calcRange('H') };
    }

    function getMoodMeta(moodValue) {
      const val = Math.max(0, Math.min(100, Number(moodValue ?? 65)));
      if (val >= 82) return { label: 'Euforico', emoji: '🔥', color: 'text-emerald-400', bg: 'bg-emerald-950/50 border-emerald-500/40', paceDelta: -0.35, degMult: 0.90 };
      if (val >= 62) return { label: 'Motivato', emoji: '😄', color: 'text-sky-300', bg: 'bg-sky-950/40 border-sky-500/35', paceDelta: -0.15, degMult: 0.96 };
      if (val >= 42) return { label: 'Neutro', emoji: '😐', color: 'text-slate-300', bg: 'bg-slate-800/70 border-slate-600/40', paceDelta: 0.0, degMult: 1.0 };
      if (val >= 22) return { label: 'Teso', emoji: '😟', color: 'text-amber-300', bg: 'bg-amber-950/50 border-amber-500/40', paceDelta: 0.22, degMult: 1.07 };
      return { label: 'Frustrato', emoji: '😡', color: 'text-red-400', bg: 'bg-red-950/60 border-red-500/45', paceDelta: 0.45, degMult: 1.15 };
    }

    function getRivalryKey(idA, idB) {
      return [idA, idB].sort().join('__');
    }

    function getRivalryValue(idA, idB) {
      if (!gameState || !gameState.rivalries || !idA || !idB || idA === idB) return 0;
      return gameState.rivalries[getRivalryKey(idA, idB)] || 0;
    }

    function bumpRivalry(idA, idB, delta, note = '') {
      if (!gameState || !idA || !idB || idA === idB) return;
      gameState.rivalries = gameState.rivalries || {};
      const key = getRivalryKey(idA, idB);
      const prev = gameState.rivalries[key] || 0;
      const next = Math.max(0, Math.min(100, Math.round(prev + delta)));
      gameState.rivalries[key] = next;

      const dA = gameState.drivers.find(d => d.id === idA);
      const dB = gameState.drivers.find(d => d.id === idB);
      if (dA && dB && next - prev >= 6 && note) {
        pushMediaQuote('Rivalita', `${dA.code} vs ${dB.code} (${next}/100): ${note}`);
      }
    }

    function pushMediaQuote(sourceTag, text) {
      if (!gameState) return;
      gameState.mediaFeed = gameState.mediaFeed || [];
      gameState.mediaFeed.unshift({
        id: `m_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
        round: gameState.round,
        season: gameState.season,
        source: sourceTag,
        text
      });
      if (gameState.mediaFeed.length > 60) gameState.mediaFeed.length = 60;
      gameState.newsFeed.unshift(`[${sourceTag}] ${text}`);
    }

    function adjustDriverMood(driverId, delta, reasonText = '') {
      if (!gameState) return;
      const driver = gameState.drivers.find(d => d.id === driverId);
      if (!driver) return;
      const prev = driver.mood ?? 65;
      const next = Math.max(0, Math.min(100, Math.round(prev + delta)));
      driver.mood = next;
      const diff = next - prev;
      if (driver.teamId === gameState.userTeamId && Math.abs(diff) >= 2 && reasonText) {
        const sign = diff > 0 ? `+${diff}` : `${diff}`;
        gameState.newsFeed.unshift(`UMORE ${driver.code} (${sign} -> ${next}/100): ${reasonText}`);
      }
    }

    function createInitialGaragePartsForTeam(team) {
      const basePerf = Math.round(((team.aero + team.pu + team.chassis) / 3) * 40);
      const baseRel = Math.min(96, Math.max(70, team.rel));
      return [
        { id: `${team.id}_pu_1`, slot: 'pu', name: `${team.short} Power Unit v1`, perf: basePerf + 40, rel: baseRel, assignedCar: 1 },
        { id: `${team.id}_pu_2`, slot: 'pu', name: `${team.short} Power Unit v1-B`, perf: basePerf + 15, rel: Math.min(98, baseRel + 3), assignedCar: 2 },
        { id: `${team.id}_ch_1`, slot: 'chassis', name: `${team.short} Telaio Monoscocca v1`, perf: basePerf, rel: baseRel + 1, assignedCar: 1 },
        { id: `${team.id}_ch_2`, slot: 'chassis', name: `${team.short} Telaio Monoscocca v1-B`, perf: basePerf - 10, rel: Math.min(98, baseRel + 2), assignedCar: 2 },
        { id: `${team.id}_st_1`, slot: 'steer', name: `${team.short} Sterzo & Aero Front v1`, perf: basePerf - 15, rel: Math.max(68, baseRel - 2), assignedCar: 1 },
        { id: `${team.id}_st_2`, slot: 'steer', name: `${team.short} Sterzo & Aero Front v1-B`, perf: basePerf - 30, rel: baseRel, assignedCar: 2 }
      ];
    }

    function syncTeamStatsFromGarage(teamId) {
      const team = getTeam(teamId);
      const parts = gameState.garageParts?.[teamId] || [];
      if (!team || !parts.length) return;
      const avgOfSlot = (slot, field, fallback) => {
        const list = parts.filter(p => p.slot === slot);
        if (!list.length) return fallback;
        return list.reduce((acc, p) => acc + p[field], 0) / list.length;
      };
      const puPerf = avgOfSlot('pu', 'perf', team.pu * 40);
      const chPerf = avgOfSlot('chassis', 'perf', team.chassis * 40);
      const stPerf = avgOfSlot('steer', 'perf', team.aero * 40);
      const avgRel = parts.reduce((acc, p) => acc + p.rel, 0) / parts.length;

      team.pu = Number(Math.max(65, Math.min(99, puPerf / 40)).toFixed(1));
      team.chassis = Number(Math.max(65, Math.min(99, chPerf / 40)).toFixed(1));
      team.aero = Number(Math.max(65, Math.min(99, stPerf / 40)).toFixed(1));
      team.rel = Number(Math.max(65, Math.min(99, avgRel)).toFixed(1));
    }

    function generatePaddockPressForRound(roundNum) {
      if (!gameState) return;
      const track = CALENDAR_2026[roundNum - 1] || CALENDAR_2026[0];
      const userTeam = getUserTeam();
      const uDrivers = getUserDrivers();
      const sortedTeams = [...gameState.teams].sort((a, b) => b.points - a.points);
      const rivalTeam = sortedTeams.find(t => t.id !== userTeam.id) || sortedTeams[0];
      const rivalDriver = gameState.drivers.find(d => d.teamId === rivalTeam.id);

      const pressureLvl = Math.min(100, Math.max(25, Math.round(userTeam.fanPassion * 0.65 + (11 - userTeam.objective) * 3.5)));
      gameState.paddockPressure = pressureLvl;

      const sprintNote = track.hasSprint ? ' (Weekend Sprint: Venerdi Qualifica Sprint, Sabato FP2 + Sprint + Qualifiche GP)' : '';
      pushMediaQuote('Stampa Pre-GP', `Vigilia GP ${track.name} (${track.dateLabel})${sprintNote}: pressione paddock al ${pressureLvl}%, obiettivo Top ${userTeam.objective}.`);

      if (rivalTeam && rivalDriver) {
        pushMediaQuote('Team Principal', `${rivalTeam.tpName} (${rivalTeam.name}): "A ${track.name} metteremo pressione a ${userTeam.name} in pista."`);
        bumpRivalry(uDrivers[0]?.id, rivalDriver.id, 4, `Dichiarazioni pre-GP a ${track.name}`);
      }
    }

    function generatePostSessionPress(sessionType, payload = {}) {
      if (!gameState) return;
      const track = CALENDAR_2026[gameState.round - 1] || CALENDAR_2026[0];
      const userTeam = getUserTeam();
      const uDrivers = getUserDrivers();

      if (sessionType === 'quali' && payload.gridOrder) {
        const bestUserIdx = payload.gridOrder.findIndex(e => e.teamId === userTeam.id);
        const bestPos = bestUserIdx >= 0 ? bestUserIdx + 1 : 15;
        if (bestPos <= 3) {
          gameState.paddockPressure = Math.max(20, (gameState.paddockPressure || 65) - 8);
          pushMediaQuote('Stampa Qualifiche', `Grande sabato per ${userTeam.name} a ${track.name}: miglior auto in P${bestPos}!`);
          uDrivers.forEach(d => adjustDriverMood(d.id, 3, 'Ottima qualifica'));
        } else if (bestPos > userTeam.objective * 2 + 4) {
          gameState.paddockPressure = Math.min(100, (gameState.paddockPressure || 65) + 10);
          pushMediaQuote('Stampa Qualifiche', `Qualifiche in salita per ${userTeam.name} (P${bestPos}): la stampa chiede risposte.`);
          uDrivers.forEach(d => adjustDriverMood(d.id, -3, 'Qualifica sotto le attese'));
        }
      }

      if (sessionType === 'race' && payload.classification) {
        const uRows = payload.classification.filter(r => r.isUser);
        const bestRow = uRows[0];
        const bestPos = typeof bestRow?.pos === 'number' ? bestRow.pos : 22;

        if (bestPos === 1) {
          gameState.paddockPressure = Math.max(15, (gameState.paddockPressure || 65) - 15);
          pushMediaQuote('Stampa Post-GP', `VITTORIA ${userTeam.name}! ${bestRow.name} trionfa a ${track.name}.`);
        } else if (bestPos <= 3) {
          gameState.paddockPressure = Math.max(20, (gameState.paddockPressure || 65) - 10);
          pushMediaQuote('Stampa Post-GP', `Podio per ${userTeam.name} con ${bestRow.name} (P${bestPos}) a ${track.name}.`);
        } else if (bestPos <= 10) {
          pushMediaQuote('Stampa Post-GP', `A punti con ${bestRow.name} (P${bestPos}) a ${track.name}: bottino utile per la classifica.`);
        } else {
          gameState.paddockPressure = Math.min(100, (gameState.paddockPressure || 65) + 12);
          pushMediaQuote('Stampa Post-GP', `Domenica difficile per ${userTeam.name} fuori dai punti a ${track.name}: sale la pressione.`);
        }
      }
    }

      return Number((getBudgetCapLimit() - getCapSpent()).toFixed(1));
    }

    function getDriversWageBill(teamId) {
      return Number((gameState?.drivers || [])
        .filter(d => d.teamId === teamId)
        .reduce((sum, d) => sum + Number(d.salary || 0), 0)
        .toFixed(1));
    }

    function chargeTeamExpense(amount, countsTowardCap = true, label = '') {
      const team = getUserTeam();
      if (!team) return false;
      const cost = Number(amount.toFixed(1));

      if (team.budget < cost) {
        showToast(`Cassa insufficiente (€${team.budget.toFixed(1)}M disponibili, servono €${cost.toFixed(1)}M).`, 'danger');
        return false;
      }

      if (countsTowardCap) {
        const remCap = getRemainingBudgetCap();
        if (remCap < cost) {
          showToast(`Budget Cap FIA esaurito! Restano €${Math.max(0, remCap).toFixed(1)}M su €${getBudgetCapLimit().toFixed(1)}M.`, 'danger');
          return false;
        }
        gameState.capSpent = Number((getCapSpent() + cost).toFixed(1));
      }

      team.budget = Number((team.budget - cost).toFixed(1));
      if (label) {
        const tag = countsTowardCap ? 'Dentro Cap' : 'Fuori Cap';
        gameState.newsFeed.unshift(`FINANZE (-€${cost.toFixed(1)}M • ${tag}): ${label}`);
      }
      return true;
    }

    function refundTeamExpense(amount, refundedCap = true, label = '') {
      const team = getUserTeam();
      if (!team) return;
      const ref = Number(amount.toFixed(1));
      team.budget = Number((team.budget + ref).toFixed(1));
      if (refundedCap) {
        gameState.capSpent = Math.max(0, Number((getCapSpent() - ref).toFixed(1)));
      }
      if (label) {
        gameState.newsFeed.unshift(`RIMBORSO (+€${ref.toFixed(1)}M): ${label}`);
      }
    }

    function showToast(msg, type = 'info') {
      const existing = document.getElementById('fm-toast');
      if (existing) existing.remove();
      const colors = {
        info: 'bg-slate-800 border-sky-500/60 text-sky-100',
        success: 'bg-emerald-950 border-emerald-500/70 text-emerald-100',
        danger: 'bg-red-950 border-red-500/70 text-red-100'
      };
      const div = document.createElement('div');
      div.id = 'fm-toast';
      div.className = `fixed top-3 left-1/2 -translate-x-1/2 z-50 px-3.5 py-2 rounded-xl border text-xs font-bold shadow-xl max-w-[92vw] text-center ${colors[type] || colors.info}`;
      div.textContent = msg;
      document.body.appendChild(div);
      setTimeout(() => div.remove(), 3200);
    }

    function seedInitialRivalries(drivers) {
      const map = {};
      const pairs = [
        ['lec', 'ham', 28],
        ['ver', 'nor', 45],
        ['nor', 'pia', 34],
        ['rus', 'ant', 22],
        ['alo', 'str', 20],
        ['gas', 'oco', 48],
        ['sai', 'alb', 18],
        ['tsu', 'had', 20]
      ];
      pairs.forEach(([a, b, val]) => {
        if (drivers.some(d => d.id === a) && drivers.some(d => d.id === b)) {
          map[getRivalryKey(a, b)] = val;
        }
      });
      return map;
    }

    function initWeekendState(roundNum, userTeamId, drivers) {
      const track = CALENDAR_2026[roundNum - 1] || CALENDAR_2026[0];
      const userDrivers = drivers.filter(d => d.teamId === userTeamId);
      const d1 = userDrivers[0];
      const d2 = userDrivers[1];

      const baseSusp = Math.max(1, Math.min(10, Math.round((track.downforce + (10 - track.topSpeed)) / 2)));
      const baseBrake = Math.max(1, Math.min(10, 11 - track.topSpeed));
      const baseRide = Math.max(1, Math.min(10, track.tyreDeg === 3 ? 6 : (track.downforce >= 8 ? 5 : 7)));
      const baseDiff = Math.max(1, Math.min(10, track.tyreDeg === 3 ? 6 : 5));

      const targetD1 = { wing: track.downforce, susp: baseSusp, brake: baseBrake, ride: baseRide, diff: baseDiff };
      const targetD2 = {
        wing: Math.max(1, Math.min(10, track.downforce - (track.downforce > 6 ? 1 : -1))),
        susp: Math.max(1, Math.min(10, baseSusp + (baseSusp < 8 ? 1 : -1))),
        brake: baseBrake,
        ride: Math.max(1, Math.min(10, baseRide + (baseRide < 9 ? 1 : -1))),
        diff: Math.max(1, Math.min(10, baseDiff - (baseDiff > 2 ? 1 : 0)))
      };

      const makeDriverSetup = (initWing = 5, initSusp = 5, initBrake = 5, initRide = 5, initDiff = 5) => ({
        wing: initWing, susp: initSusp, brake: initBrake, ride: initRide, diff: initDiff,
        confidence: 35, plan: 'race', fpRunsDone: 0, lastError: null,
        feedback: 'Regola i 5 parametri di assetto ed esegui i run in pista.'
      });

      return {
        round: roundNum,
        hasSprint: !!track.hasSprint,
        day: 'friday',
        phase: 'fp',
        targets: { wing: targetD1.wing, susp: targetD1.susp, brake: targetD1.brake, ride: targetD1.ride, diff: targetD1.diff },
        driverTargets: { d1: targetD1, d2: targetD2 },
        fp: {
          session: 1,
          runsLeftInSession: 3,
          activeSlot: 'd1',
          d1: d1 ? makeDriverSetup(4, 5, 6, 5, 5) : null,
          d2: d2 ? makeDriverSetup(6, 5, 4, 6, 5) : null
        },
        sprintQuali: null,
        sprintRace: null,
        quali: null,
        preRaceStrategy: null,
        race: null,
        results: null
      };
    }

    function getWeekendDayBadge(weekend) {
      if (!weekend) return 'GIORNO';
      if (weekend.phase === 'fp') {
        if (weekend.hasSprint) return weekend.fp?.session === 2 ? 'SAB • FP2' : 'VEN • FP1';
        if (weekend.fp?.session === 1) return 'VEN • FP1';
        if (weekend.fp?.session === 2) return 'VEN • FP2';
        return 'SAB • FP3';
      }
      if (weekend.phase === 'sprint_quali') return 'VEN • QUAL. SPRINT';
      if (weekend.phase === 'sprint_race') return 'SAB • SPRINT';
      if (weekend.phase === 'quali') return 'SAB • QUALIFICHE';
      if (weekend.phase === 'strategy') return 'DOM • PRE-GARA';
      if (weekend.phase === 'race' || weekend.phase === 'live_strategy' || weekend.phase === 'summary') return 'DOM • GARA';
      return 'WEEKEND';
    }

    function advanceSingleDay(silent = false) {
      if (!gameState) return;
      gameState.careerDay = (gameState.careerDay || 1) + 1;

      const remainingUpgrades = [];
      (gameState.pendingUpgrades || []).forEach(upg => {
        upg.daysLeft = (upg.daysLeft ?? 4) - 1;
        if (upg.daysLeft <= 0) {
          const tm = getTeam(gameState.userTeamId);
          tm[upg.area] = Number((tm[upg.area] + upg.gain).toFixed(1));
          if (gameState.garageParts?.[tm.id]) {
            const targetSlot = upg.area === 'pu' ? 'pu' : (upg.area === 'chassis' ? 'chassis' : 'steer');
            const part = gameState.garageParts[tm.id].find(p => p.slot === targetSlot);
            if (part) {
              part.perf += Math.round(upg.gain * 35);
              part.rel = Math.min(99, part.rel + 2);
              part.name = `${part.name.split(' v')[0]} +${upg.gain}`;
            }
            syncTeamStatsFromGarage(tm.id);
          }
          gameState.newsFeed.unshift(`AGGIORNAMENTO PRONTO: +${upg.gain} ${upg.area.toUpperCase()} completato in fabbrica!`);
          if (!silent) showToast(`Aggiornamento ${upg.area.toUpperCase()} completato!`, 'success');
        } else {
          remainingUpgrades.push(upg);
        }
      });
      gameState.pendingUpgrades = remainingUpgrades;

      gameState.drivers.forEach(d => {
        d.fatigue = Math.max(0, Math.min(100, (d.fatigue ?? 15) - 4));
        const boostMult = (d.trainingBoost || 0) > 0 ? 1.65 : 1.0;
        if ((d.trainingBoost || 0) > 0) d.trainingBoost = Math.max(0, d.trainingBoost - 1);

        const cap = d.potential ?? d.ovr;
        if (d.age <= 25 && d.ovr < cap && d.fatigue < 65) {
          if (Math.random() < 0.055 * boostMult) {
            d.ovr = Math.min(cap, d.ovr + 1);
            d.pace = Math.min(99, d.pace + 1);
          }
        } else if (d.age >= 36 && d.ovr > 72) {
          const slowFactor = (d.trainingBoost || 0) > 0 ? 0.35 : 1.0;
          if (Math.random() < 0.025 * slowFactor) {
            d.ovr = Math.max(72, d.ovr - 1);
            d.pace = Math.max(70, d.pace - 1);
          }
        }
      });

      if (!silent) {
        saveGame();
        renderApp();
      }
    }

    function advanceToNextWeekend() {
      if (!gameState) return;
      const startDay = gameState.weekendStartDay || 8;
      const daysToJump = Math.max(1, startDay - (gameState.careerDay || 1));
      for (let i = 0; i < daysToJump; i++) {
        advanceSingleDay(true);
      }
      gameState.activeTab = 'weekend';
      showToast(`Arrivati al weekend del GP ${gameState.round}!`, 'info');
      saveGame();
      renderApp();
    }

    function runExtraActivity(kind) {
      const team = getUserTeam();
      const uDrivers = getUserDrivers();
      if (!team || !uDrivers.length) return;

      if (kind === 'simulator') {
        const cost = 2.5;
        if (!chargeTeamExpense(cost, true, 'Sessione Simulatore Tecnico')) return;
        uDrivers.forEach(d => {
          d.fatigue = Math.min(100, (d.fatigue ?? 15) + 14);
          d.trainingBoost = (d.trainingBoost || 0) + 5;
          adjustDriverMood(d.id, 3, 'Sessione intensa al simulatore e analisi dati');
        });
        pushMediaQuote('Attivita Extra', `Simulatore attivato per ${uDrivers.map(x => x.code).join(' e ')}: -€${cost}M (nel Cap), +fatica.`);
        showToast('Simulatore completato (-€2.5M nel Cap, +fatica)!', 'success');
      } else if (kind === 'media_sponsor') {
        const sponsor = getActiveSponsor();
        const gain = Number((sponsor.perRace * 0.6).toFixed(1));
        team.budget = Number((team.budget + gain).toFixed(1));
        gameState.paddockPressure = Math.min(100, (gameState.paddockPressure || 62) + 5);
        uDrivers.forEach(d => {
          d.fatigue = Math.min(100, (d.fatigue ?? 15) + 6);
          adjustDriverMood(d.id, 2, 'Evento sponsor e incontro con la stampa');
        });
        pushMediaQuote('Sponsor & Media Day', `${sponsor.name} e ${team.name} protagonisti dell evento media: +€${gain.toFixed(1)}M in cassa.`);
        showToast(`Media Day completato: +€${gain.toFixed(1)}M in cassa!`, 'success');
      } else if (kind === 'team_building') {
        const cost = 2.0;
        if (!chargeTeamExpense(cost, false, 'Team Building Scuderia')) return;
        uDrivers.forEach(d => {
          d.fatigue = Math.max(0, (d.fatigue ?? 15) - 6);
          adjustDriverMood(d.id, 7, 'Ritiro di team building e confronto costruttivo');
        });
        if (uDrivers.length === 2) {
          const curRiv = getRivalryValue(uDrivers[0].id, uDrivers[1].id);
          gameState.rivalries[getRivalryKey(uDrivers[0].id, uDrivers[1].id)] = Math.max(0, curRiv - 10);
        }
        pushMediaQuote('Paddock', `Team building per ${team.name}: -€${cost}M (fuori Cap), morale su e rivalita interna piu calma.`);
        showToast('Team building riuscito (-€2.0M fuori Cap)!', 'success');
      } else if (kind === 'wind_tunnel') {
        const cost = 4.0;
        if (!chargeTeamExpense(cost, true, 'Giornata in Galleria del Vento')) return;
        team.aero = Number(Math.min(99, team.aero + 0.4).toFixed(1));
        if (gameState.garageParts?.[team.id]) {
          gameState.garageParts[team.id].filter(p => p.slot === 'steer' || p.slot === 'chassis').forEach(p => {
            p.perf += 18;
          });
          syncTeamStatsFromGarage(team.id);
        }
        pushMediaQuote('Reparto Tecnico', `${team.name} in galleria del vento: -€${cost}M (nel Cap), +0.4 Aerodinamica.`);
        showToast('Galleria del vento completata (-€4.0M nel Cap, +0.4 Aero)!', 'success');
      }

      saveGame();
      renderApp();
    }

    function setTeamHierarchyMode(mode) {
      const team = getUserTeam();
      const uDrivers = getUserDrivers();
      if (!team || uDrivers.length < 2) return;
      team.hierarchy = mode;
      const [d1, d2] = uDrivers;
      if (mode === 'equal') {
        d1.role = 'co_lead';
        d2.role = 'co_lead';
        adjustDriverMood(d1.id, 3, 'Scuderia impostata su pari livello');
        adjustDriverMood(d2.id, 4, 'Parita di trattamento confermata dal team');
        showToast('Gerarchia impostata: Pari Livello.', 'info');
      } else {
        applyRoleAssignments(d1.id, 'lead', d2.id, 'support');
      }
      saveGame();
      renderApp();
    }

    function setLeadDriverSelection(newLeadId) {
      const team = getUserTeam();
      const uDrivers = getUserDrivers();
      if (!team || uDrivers.length < 2) return;
      team.hierarchy = '1st_2nd';
      const leadDrv = uDrivers.find(d => d.id === newLeadId) || uDrivers[0];
      const suppDrv = uDrivers.find(d => d.id !== leadDrv.id) || uDrivers[1];
      applyRoleAssignments(leadDrv.id, 'lead', suppDrv.id, 'support');
      saveGame();
      renderApp();
    }

    function applyRoleAssignments(leadId, leadRole, suppId, suppRole) {
      const team = getUserTeam();
      const lead = gameState.drivers.find(d => d.id === leadId);
      const supp = gameState.drivers.find(d => d.id === suppId);
      if (!lead || !supp) return;
      const prevSuppRole = supp.role;
      lead.role = leadRole;
      supp.role = suppRole;
      adjustDriverMood(lead.id, 6, `Nominato 1a Guida in ${team.name}`);
      if (prevSuppRole !== 'support') {
        const penalty = supp.acceptsSupport ? -6 : -18;
        adjustDriverMood(supp.id, penalty, supp.acceptsSupport ? 'Declassato a 2a Guida' : 'Non gradisce il ruolo di 2a Guida');
        bumpRivalry(lead.id, supp.id, supp.acceptsSupport ? 8 : 18, `Gerarchia 1a/2a guida in casa ${team.name}`);
      }
      showToast(`${lead.code} 1a Guida • ${supp.code} 2a Guida`, 'info');
    }

    function setRndSection(sec) {
      if (!gameState) return;
      gameState.rndSection = sec;
      saveGame();
      renderApp();
    }

    function setGarageCarTab(carNum) {
      if (!gameState) return;
      gameState.garageCarTab = carNum;
      saveGame();
      renderApp();
    }

    function boostSinglePart(partId) {
      const team = getUserTeam();
      const parts = gameState.garageParts?.[team.id] || [];
      const part = parts.find(p => p.id === partId);
      if (!part) return;
      const cost = 2.0;
      if (!chargeTeamExpense(cost, true, `Revisione & affinamento ${part.name}`)) return;
      part.perf += 16;
      part.rel = Math.min(99, part.rel + 2);
      syncTeamStatsFromGarage(team.id);
      showToast(`${part.name}: +16 Perf, +2% Affidabilità (-€2.0M nel Cap)`, 'success');
      saveGame();
      renderApp();
    }

    function buildNewGaragePart(slot) {
      const team = getUserTeam();
      const cost = 6.5;
      if (!chargeTeamExpense(cost, true, `Nuovo componente ${slot.toUpperCase()} in fabbrica`)) return;
      const list = gameState.garageParts[team.id] || [];
      const carTab = gameState.garageCarTab || 1;
      const basePerf = Math.round(((team.aero + team.pu + team.chassis) / 3) * 40) + 25;
      const slotLabels = { pu: 'Power Unit Spec-Evo', chassis: 'Telaio Leggero', steer: 'Sterzo & Aero Spec-Evo' };
      list.push({
        id: `${team.id}_${slot}_${Date.now().toString(36)}`,
        slot,
        name: `${slotLabels[slot] || slot.toUpperCase()} v2`,
        perf: basePerf,
        rel: Math.min(97, Math.max(82, team.rel + 2)),
        assignedCar: carTab
      });
      gameState.garageParts[team.id] = list;
      syncTeamStatsFromGarage(team.id);
      showToast(`Nuovo componente ${slot.toUpperCase()} costruito (-€6.5M nel Cap)!`, 'success');
      saveGame();
      renderApp();
    }

    function requestUpgradeConfirm(area, tierKey) {
      const tier = RND_TIERS[tierKey];
      if (!tier) return;
      const labels = { aero: 'Aerodinamica', pu: 'Power Unit', chassis: 'Telaio' };
      gameState.pendingUpgradeConfirm = {
        area,
        areaLabel: labels[area] || area.toUpperCase(),
        tierKey,
        tierLabel: tier.label,
        cost: tier.cost,
        days: tier.days,
        gain: tier.gain
      };
      renderApp();
    }

    function cancelUpgradeConfirm() {
      gameState.pendingUpgradeConfirm = null;
      renderApp();
    }

    function confirmAndBuyUpgrade() {
      const pending = gameState.pendingUpgradeConfirm;
      if (!pending) return;
      if (!chargeTeamExpense(pending.cost, true, `Sviluppo ${pending.areaLabel} (${pending.tierLabel})`)) {
        gameState.pendingUpgradeConfirm = null;
        renderApp();
        return;
      }
      gameState.pendingUpgrades = gameState.pendingUpgrades || [];
      gameState.pendingUpgrades.push({
        id: `upg_${Date.now()}`,
        area: pending.area,
        gain: pending.gain,
        daysLeft: pending.days,
        totalDays: pending.days,
        cost: pending.cost
      });
      gameState.pendingUpgradeConfirm = null;
      showToast(`Avviato sviluppo ${pending.areaLabel} (${pending.days} gg, -€${pending.cost.toFixed(1)}M nel Cap)!`, 'success');
      saveGame();
      renderApp();
    }

    function cancelPendingUpgradeWithRefund(upgId) {
      const idx = (gameState.pendingUpgrades || []).findIndex(u => u.id === upgId);
      if (idx === -1) return;
      const [removed] = gameState.pendingUpgrades.splice(idx, 1);
      const refundAmount = Number(((removed.cost || 4.5) * 0.8).toFixed(1));
      refundTeamExpense(refundAmount, true, `Annullato sviluppo ${removed.area.toUpperCase()}`);
      showToast(`Sviluppo annullato: rimborsati €${refundAmount.toFixed(1)}M (cassa e Cap).`, 'info');
      saveGame();
      renderApp();
    }

    function renewDriverContract(driverId) {
      const drv = gameState.drivers.find(d => d.id === driverId);
      const team = getUserTeam();
      if (!drv || !team) return;
      const signingFee = Number((drv.salary * 0.4).toFixed(1));
      if (!chargeTeamExpense(signingFee, false, `Rinnovo biennale ${drv.name}`)) return;
      drv.contract = (drv.contract || 1) + 2;
      adjustDriverMood(drv.id, 8, 'Rinnovo contrattuale firmato');
      showToast(`Contratto di ${drv.name} esteso (+2 anni, firma €${signingFee}M fuori Cap)!`, 'success');
      saveGame();
      renderApp();
    }

    function signFreeAgent(agentId) {
      const idx = (gameState.freeAgents || []).findIndex(a => a.id === agentId);
      if (idx === -1) return;
      const agent = gameState.freeAgents[idx];
      const team = getUserTeam();
      const uDrivers = getUserDrivers();
      const signingBonus = Number((agent.salary * 0.5).toFixed(1));
      if (!chargeTeamExpense(signingBonus, false, `Ingaggio pilota svincolato ${agent.name}`)) return;

      if (uDrivers.length >= 2) {
        const outgoing = uDrivers[uDrivers.length - 1];
        outgoing.teamId = null;
        outgoing.role = 'support';
        gameState.freeAgents.push(outgoing);
      }

      gameState.freeAgents.splice(idx, 1);
      agent.teamId = team.id;
      agent.role = team.hierarchy === '1st_2nd' ? 'support' : 'co_lead';
      gameState.drivers.push(agent);
      pushMediaQuote('Mercato', `${team.name} ingaggia ${agent.name} (OVR ${agent.ovr}, ingaggio €${agent.salary.toFixed(1)}M/anno fuori Cap).`);
      showToast(`${agent.name} ingaggiato!`, 'success');
      saveGame();
      renderApp();
    }

    function getDriverTargetSetup(weekend, slotKey) {
      if (weekend.driverTargets && weekend.driverTargets[slotKey]) {
        return weekend.driverTargets[slotKey];
      }
      return weekend.targets;
    }

    function updateFpSlider(param, val) {
      const w = gameState.weekend;
      if (!w || w.phase !== 'fp') return;
      const slot = w.fp.activeSlot || 'd1';
      const setup = w.fp[slot];
      if (!setup) return;
      setup[param] = Number(val);
      saveGame();
      renderApp();
    }

    function setFpActiveSlot(slot) {
      const w = gameState.weekend;
      if (!w || !w.fp[slot]) return;
      w.fp.activeSlot = slot;
      saveGame();
      renderApp();
    }

    function setFpPlan(plan) {
      const w = gameState.weekend;
      if (!w || w.phase !== 'fp') return;
      const slot = w.fp.activeSlot || 'd1';
      if (w.fp[slot]) {
        w.fp[slot].plan = plan;
        saveGame();
        renderApp();
      }
    }

    function runFpStint() {
      const w = gameState.weekend;
      if (!w || w.phase !== 'fp') return;
      const slot = w.fp.activeSlot || 'd1';
      const setup = w.fp[slot];
      const uDrivers = getUserDrivers();
      const drv = slot === 'd1' ? uDrivers[0] : uDrivers[1];
      if (!setup || !drv) return;

      if ((w.fp.runsLeftInSession ?? 0) <= 0) {
        showToast('Run esauriti in questa sessione: passa alla sessione successiva!', 'info');
        return;
      }

      const target = getDriverTargetSetup(w, slot);
      const diffWing = setup.wing - target.wing;
      const diffSusp = setup.susp - target.susp;
      const diffBrake = setup.brake - target.brake;
      const diffRide = setup.ride - target.ride;
      const diffDiff = setup.diff - target.diff;

      const totalErr = Math.abs(diffWing) + Math.abs(diffSusp) + Math.abs(diffBrake) + Math.abs(diffRide) + Math.abs(diffDiff);
      const gain = Math.max(8, Math.min(28, 28 - totalErr * 2));
      setup.confidence = Math.min(100, setup.confidence + gain);
      setup.fpRunsDone = (setup.fpRunsDone || 0) + 1;
      setup.lastError = totalErr;
      w.fp.runsLeftInSession = Math.max(0, w.fp.runsLeftInSession - 1);

      const hints = [];
      if (Math.abs(diffWing) >= 2) hints.push(diffWing > 0 ? 'ala troppo carica' : 'ala troppo scarica');
      if (Math.abs(diffSusp) >= 2) hints.push(diffSusp > 0 ? 'sospensioni troppo rigide' : 'sospensioni troppo morbide');
      if (Math.abs(diffBrake) >= 2) hints.push(diffBrake > 0 ? 'freni troppo aggressivi' : 'freni troppo conservativi');
      if (Math.abs(diffRide) >= 2) hints.push(diffRide > 0 ? 'assetto troppo alto' : 'assetto troppo basso');
      if (Math.abs(diffDiff) >= 2) hints.push(diffDiff > 0 ? 'differenziale troppo chiuso' : 'differenziale troppo aperto');

      setup.feedback = hints.length
        ? `${drv.code}: feeling ${setup.confidence}% — segnalato: ${hints.slice(0, 2).join(' e ')}.`
        : `${drv.code}: assetto quasi perfetto (${setup.confidence}% feeling)!`;

      saveGame();
      renderApp();
    }

    function advanceFpSession() {
      const w = gameState.weekend;
      if (!w || w.phase !== 'fp') return;
      const maxSessions = w.hasSprint ? 2 : 3;
      if (w.fp.session < maxSessions) {
        w.fp.session += 1;
        w.fp.runsLeftInSession = 3;
        showToast(`Passati a FP${w.fp.session}!`, 'info');
      } else {
        w.phase = w.hasSprint ? 'sprint_quali' : 'quali';
        showToast(w.hasSprint ? 'Venerdi sera: Qualifiche Sprint!' : 'Sabato: Qualifiche GP!', 'info');
      }
      saveGame();
      renderApp();
    }

    function computeCarPaceScore(driver, team, track, setupConf = 65, isWet = false) {
      const mood = getMoodMeta(driver.mood);
      const baseCar = (team.aero * 0.36 + team.pu * 0.34 + team.chassis * 0.30);
      const trackDnaBonus = (
        (track.downforce - 5) * ((team.aero - 80) * 0.04) +
        (track.topSpeed - 5) * ((team.pu - 80) * 0.04)
      );
      const driverSkill = (driver.pace * 0.45 + driver.cons * 0.35 + driver.tyreMgmt * 0.20);
      const confBonus = ((setupConf - 50) / 50) * 1.4;
      const wetBonus = isWet && driver.trait === 'wet_ace' ? 2.4 : 0;
      const fatiguePen = Math.max(0, ((driver.fatigue ?? 15) - 55) * 0.05);
      return baseCar * 0.58 + driverSkill * 0.42 + trackDnaBonus + confBonus + wetBonus - (mood.paceDelta * 2.2) - fatiguePen;
    }

    function buildGridFromQuali(track, isWet) {
      const w = gameState.weekend;
      const uDrivers = getUserDrivers();
      const entries = gameState.drivers.filter(d => d.teamId).map(d => {
        const tm = getTeam(d.teamId);
        let conf = 65;
        if (d.id === uDrivers[0]?.id) conf = w.fp?.d1?.confidence ?? 55;
        if (d.id === uDrivers[1]?.id) conf = w.fp?.d2?.confidence ?? 55;
        const score = computeCarPaceScore(d, tm, track, conf, isWet) + (Math.random() * 2.4 - 1.2);
        const rawSec = track.baseLap - (score - 82) * 0.14 + (Math.random() * 0.35);
        return {
          driverId: d.id,
          name: d.name,
          code: d.code,
          teamId: tm.id,
          teamName: tm.name,
          teamColor: tm.color,
          isUser: tm.id === gameState.userTeamId,
          score,
          bestLap: Math.max(58.0, Number(rawSec.toFixed(3)))
        };
      });
      entries.sort((a, b) => b.score - a.score);
      entries.forEach((e, i) => { e.gridPos = i + 1; });
      return entries;
    }

    function simulateSprintWeekendSequence() {
      const w = gameState.weekend;
      const track = CALENDAR_2026[gameState.round - 1] || CALENDAR_2026[0];
      const isWet = Math.random() < track.rainChance * 0.7;
      const sqGrid = buildGridFromQuali(track, isWet);
      w.sprintQuali = { grid: sqGrid, isWet };

      const sprintPointsMap = [8, 7, 6, 5, 4, 3, 2, 1];
      const sprintOrder = [...sqGrid].sort((a, b) => (b.score + (Math.random() * 1.8 - 0.9)) - (a.score + (Math.random() * 1.8 - 0.9)));
      const sprintRows = sprintOrder.map((e, idx) => {
        const pos = idx + 1;
        const pts = sprintPointsMap[idx] || 0;
        const drv = gameState.drivers.find(x => x.id === e.driverId);
        const tm = getTeam(e.teamId);
        if (drv) drv.points = (drv.points || 0) + pts;
        if (tm) tm.points = (tm.points || 0) + pts;
        if (e.isUser && pts > 0) {
          tm.budget = Number((tm.budget + pts * 0.2).toFixed(1));
        }
        return { ...e, pos, pts };
      });
      w.sprintRace = { classification: sprintRows, isWet };
      w.phase = 'quali';
      showToast('Qualifiche Sprint e Gara Sprint completate! Ora Qualifiche GP.', 'success');
      saveGame();
      renderApp();
    }

    function simulateQualifying() {
      const w = gameState.weekend;
      const track = CALENDAR_2026[gameState.round - 1] || CALENDAR_2026[0];
      const isWet = Math.random() < track.rainChance;
      const grid = buildGridFromQuali(track, isWet);
      w.quali = { grid, isWet, poleLap: grid[0]?.bestLap || track.baseLap };
      w.phase = 'strategy';
      generatePostSessionPress('quali', { gridOrder: grid });
      showToast(`Qualifiche completate! Pole: ${grid[0]?.name} (${formatLapTime(grid[0]?.bestLap)})`, 'success');
      saveGame();
      renderApp();
    }

    function setPreRaceChoice(slotKey, field, val) {
      const w = gameState.weekend;
      if (!w) return;
      w.preRaceStrategy = w.preRaceStrategy || {
        d1: { tyre: 'M', push: 'balanced', pitLap: Math.round((CALENDAR_2026[gameState.round - 1]?.laps || 56) * 0.45) },
        d2: { tyre: 'H', push: 'balanced', pitLap: Math.round((CALENDAR_2026[gameState.round - 1]?.laps || 56) * 0.52) }
      };
      w.preRaceStrategy[slotKey][field] = field === 'pitLap' ? Number(val) : val;
      saveGame();
      renderApp();
    }

    function startLiveRace() {
      const w = gameState.weekend;
      const track = CALENDAR_2026[gameState.round - 1] || CALENDAR_2026[0];
      const uDrivers = getUserDrivers();
      const baseGrid = w.quali?.grid || buildGridFromQuali(track, false);
      const strat = w.preRaceStrategy || {
        d1: { tyre: 'M', push: 'balanced', pitLap: Math.round(track.laps * 0.45) },
        d2: { tyre: 'H', push: 'balanced', pitLap: Math.round(track.laps * 0.52) }
      };

      const cars = baseGrid.map((g, idx) => {
        const drv = gameState.drivers.find(d => d.id === g.driverId);
        const tm = getTeam(g.teamId);
        const isD1 = drv?.id === uDrivers[0]?.id;
        const isD2 = drv?.id === uDrivers[1]?.id;
        const myStrat = isD1 ? strat.d1 : (isD2 ? strat.d2 : null);
        const initTyre = myStrat ? myStrat.tyre : (idx % 2 === 0 ? 'M' : 'H');
        const pitLap = myStrat ? myStrat.pitLap : Math.round(track.laps * (0.42 + (idx % 5) * 0.04));
        const pushMode = myStrat ? myStrat.push : 'balanced';
        return {
          driverId: drv.id,
          name: drv.name,
          code: drv.code,
          teamId: tm.id,
          teamName: tm.name,
          teamColor: tm.color,
          isUser: tm.id === gameState.userTeamId,
          gridPos: g.gridPos,
          pos: g.gridPos,
          lap: 0,
          progress: 0,
          totalTime: idx * 0.25,
          tyre: initTyre,
          tyreWear: 0,
          pitStops: 0,
          pitLap,
          pushMode,
          retired: false,
          lastLapSec: g.bestLap,
          bestLapSec: g.bestLap
        };
      });

      w.race = {
        totalLaps: track.laps,
        currentLap: 0,
        finished: false,
        weather: w.quali?.isWet ? 'Pioggia' : 'Asciutto',
        isWet: !!w.quali?.isWet,
        cars,
        events: [`Via al GP ${track.name} (${track.laps} giri)!`]
      };
      w.phase = 'race';
      saveGame();
      renderApp();
    }

    function setLiveCarPush(driverId, mode) {
      const car = gameState.weekend?.race?.cars?.find(c => c.driverId === driverId);
      if (car) {
        car.pushMode = mode;
        saveGame();
        renderApp();
      }
    }

    function pitUserCarNow(driverId, compound = 'H') {
      const car = gameState.weekend?.race?.cars?.find(c => c.driverId === driverId);
      if (!car || car.retired) return;
      car.tyre = compound;
      car.tyreWear = 0;
      car.pitStops = (car.pitStops || 0) + 1;
      car.totalTime += 21.5;
      gameState.weekend.race.events.unshift(`BOX ${car.code}: sosta anticipata per gomme ${compound}!`);
      saveGame();
      renderApp();
    }

    function stepRaceOneLap() {
      const w = gameState.weekend;
      const race = w?.race;
      if (!race || race.finished) return;
      const track = CALENDAR_2026[gameState.round - 1] || CALENDAR_2026[0];
      const nextLap = race.currentLap + 1;
      race.currentLap = nextLap;

      if (!race.isWet && Math.random() < (track.rainChance * 0.04)) {
        race.isWet = true;
        race.weather = 'Pioggia';
        race.events.unshift(`Giro ${nextLap}: inizia a piovere sul tracciato!`);
      }

      const degTrackMult = track.tyreDeg === 3 ? 1.24 : (track.tyreDeg === 2 ? 1.0 : 0.84);
      const ruleDegMult = gameState.rules?.extraDegMultiplier || 1.0;

      race.cars.forEach(car => {
        if (car.retired) return;
        const drv = gameState.drivers.find(d => d.id === car.driverId);
        const tm = getTeam(car.teamId);
        const comp = TYRE_COMPOUNDS[car.tyre] || TYRE_COMPOUNDS.M;

        const relRisk = Math.max(0.001, (100 - (tm?.rel || 82)) * 0.00055);
        if (Math.random() < relRisk) {
          car.retired = true;
          race.events.unshift(`Giro ${nextLap}: RITIRO per ${car.name} (${tm.short})!`);
          return;
        }

        if (race.isWet && comp.wet === 0 && nextLap > 2) {
          car.tyre = 'I';
          car.tyreWear = 0;
          car.pitStops += 1;
          car.totalTime += 21.0;
          race.events.unshift(`Giro ${nextLap}: ${car.code} monta Intermedie.`);
        } else if (!race.isWet && comp.wet > 0 && nextLap > 3) {
          car.tyre = 'M';
          car.tyreWear = 0;
          car.pitStops += 1;
          car.totalTime += 21.0;
          race.events.unshift(`Giro ${nextLap}: ${car.code} torna su Slick Medium.`);
        } else if (nextLap === car.pitLap && car.pitStops === 0 && nextLap < track.laps - 2) {
          car.tyre = car.tyre === 'S' ? 'M' : (car.tyre === 'M' ? 'H' : 'M');
          car.tyreWear = 0;
          car.pitStops += 1;
          car.totalTime += 21.5;
          race.events.unshift(`Giro ${nextLap}: pit-stop per ${car.code} (${car.tyre}).`);
        }

        const pushFactor = car.pushMode === 'push' ? -0.55 : (car.pushMode === 'conserve' ? 0.45 : 0.0);
        const wearRate = comp.degRate * degTrackMult * ruleDegMult * (car.pushMode === 'push' ? 1.28 : (car.pushMode === 'conserve' ? 0.78 : 1.0));
        car.tyreWear = Math.min(100, Number((car.tyreWear + wearRate).toFixed(1)));
        const wearPenalty = Math.max(0, (car.tyreWear - 45) * 0.045);

        const paceScore = computeCarPaceScore(drv, tm, track, 65, race.isWet);
        const lapSec = Math.max(58.0, track.baseLap - (paceScore - 82) * 0.13 + comp.paceBonus + pushFactor + wearPenalty + (Math.random() * 0.55 - 0.25));
        car.lastLapSec = Number(lapSec.toFixed(3));
        if (car.lastLapSec < car.bestLapSec) car.bestLapSec = car.lastLapSec;
        car.totalTime = Number((car.totalTime + car.lastLapSec).toFixed(3));
        car.lap = nextLap;
      });

      const active = race.cars.filter(c => !c.retired).sort((a, b) => b.lap - a.lap || a.totalTime - b.totalTime);
      const retired = race.cars.filter(c => c.retired);
      [...active, ...retired].forEach((c, idx) => { c.pos = idx + 1; });

      if (nextLap >= track.laps) {
        finalizeRaceResults();
        return;
      }

      saveGame();
      renderApp();
    }

    function finalizeRaceResults() {
      const w = gameState.weekend;
      const race = w.race;
      const track = CALENDAR_2026[gameState.round - 1] || CALENDAR_2026[0];
      const sponsor = getActiveSponsor();
      const userTeam = getUserTeam();
      const pointsTable = [25, 18, 15, 12, 10, 8, 6, 4, 2, 1];

      race.finished = true;
      const ordered = [...race.cars].sort((a, b) => {
        if (a.retired && !b.retired) return 1;
        if (!a.retired && b.retired) return -1;
        return a.pos - b.pos;
      });

      let gpIncome = Number(sponsor.perRace.toFixed(1));
      const classification = ordered.map((c, idx) => {
        const pos = c.retired ? 'RIT' : idx + 1;
        const pts = (!c.retired && typeof pos === 'number' && pointsTable[pos - 1]) ? pointsTable[pos - 1] : 0;
        const drv = gameState.drivers.find(d => d.id === c.driverId);
        const tm = getTeam(c.teamId);

        if (drv) {
          drv.points = (drv.points || 0) + pts;
          if (pos === 1) drv.wins = (drv.wins || 0) + 1;
          if (typeof pos === 'number' && pos <= 3) drv.podiums = (drv.podiums || 0) + 1;
          drv.fatigue = Math.min(100, (drv.fatigue ?? 15) + (c.retired ? 8 : 16));
        }
        if (tm) {
          tm.points = (tm.points || 0) + pts;
          if (pos === 1) tm.wins = (tm.wins || 0) + 1;
          if (typeof pos === 'number' && pos <= 3) tm.podiums = (tm.podiums || 0) + 1;
        }

        if (c.isUser && !c.retired && typeof pos === 'number') {
          if (pts > 0) gpIncome = Number((gpIncome + pts * sponsor.pointsBonus).toFixed(1));
          if (pos <= 3) gpIncome = Number((gpIncome + sponsor.podiumBonus).toFixed(1));
          if (pos === 1) gpIncome = Number((gpIncome + sponsor.winBonus).toFixed(1));
          adjustDriverMood(c.driverId, pos <= 3 ? 7 : (pos <= 10 ? 3 : -4), `Gara chiusa in P${pos}`);
        } else if (c.isUser && c.retired) {
          adjustDriverMood(c.driverId, -6, 'Ritiro in gara');
        }

        return {
          pos,
          driverId: c.driverId,
          name: c.name,
          code: c.code,
          teamId: c.teamId,
          teamName: c.teamName,
          teamColor: c.teamColor,
          isUser: c.isUser,
          pitStops: c.pitStops,
          bestLap: c.bestLapSec,
          pts
        };
      });

      userTeam.budget = Number((userTeam.budget + gpIncome).toFixed(1));
      gameState.completedRounds = gameState.completedRounds || [];
      gameState.completedRounds.push({
        season: gameState.season,
        round: gameState.round,
        gpName: track.name,
        winner: classification[0]?.name || '',
        gpIncome
      });

      w.results = { classification, gpIncome, trackName: track.name };
      w.phase = 'summary';
      generatePostSessionPress('race', { classification });
      showToast(`Bandiera a scacchi! Incasso GP: +€${gpIncome.toFixed(1)}M`, 'success');
      saveGame();
      renderApp();
    }

    function continueAfterRaceSummary() {
      if (gameState.round < CALENDAR_2026.length) {
        gameState.round += 1;
        gameState.careerDay = (gameState.careerDay || 1) + 14;
        gameState.weekendStartDay = gameState.careerDay + 7;
        gameState.weekend = initWeekendState(gameState.round, gameState.userTeamId, gameState.drivers);
        generatePaddockPressForRound(gameState.round);
        gameState.activeTab = 'hub';
        showToast(`Avanzati al GP ${gameState.round}: ${CALENDAR_2026[gameState.round - 1].name}!`, 'info');
      } else {
        applyEndOfSeasonPrizesAndReset();
      }
      saveGame();
      renderApp();
    }

    function applyEndOfSeasonPrizesAndReset() {
      const sortedTeams = [...gameState.teams].sort((a, b) => (b.points || 0) - (a.points || 0) || (b.wins || 0) - (a.wins || 0));
      sortedTeams.forEach((t, idx) => {
        const prize = FOM_PRIZE_POOL[idx] || 60.0;
        const wages = getDriversWageBill(t.id);
        t.budget = Number((t.budget + prize - wages).toFixed(1));
        if (t.id === gameState.userTeamId) {
          pushMediaQuote('Fine Stagione FOM', `Chiusa la stagione ${gameState.season} in P${idx + 1} Costruttori: premio FOM +€${prize.toFixed(1)}M, monte ingaggi -€${wages.toFixed(1)}M.`);
        }
      });

      if (gameState.season < gameState.maxSeasons) {
        gameState.season += 1;
        gameState.round = 1;
        gameState.capSpent = 0.0;
        gameState.completedRounds = [];
        gameState.teams.forEach(t => {
          t.points = 0;
          t.wins = 0;
          t.podiums = 0;
        });
        gameState.drivers.forEach(d => {
          d.points = 0;
          d.wins = 0;
          d.podiums = 0;
          d.age = (d.age || 25) + 1;
          d.contract = Math.max(1, (d.contract || 1) - 1);
          d.fatigue = 10;
        });
        gameState.weekend = initWeekendState(1, gameState.userTeamId, gameState.drivers);
        generatePaddockPressForRound(1);
        gameState.activeTab = 'hub';
        showToast(`Benvenuti nella stagione ${gameState.season}! Budget Cap FIA azzerato a €${getBudgetCapLimit().toFixed(0)}M.`, 'success');
      } else {
        showToast('Ciclo di 7 stagioni completato! Puoi avviare una nuova carriera dal tasto Reset.', 'info');
      }
    }

    function renderWeekendView() {
      const w = gameState.weekend;
      const track = CALENDAR_2026[gameState.round - 1] || CALENDAR_2026[0];
      const uDrivers = getUserDrivers();

      return `
        <div class="p-4 space-y-3.5 pb-6">
          <div class="bg-f1card border border-f1border rounded-2xl p-4 space-y-2">
            <div class="flex items-center justify-between">
              <span class="text-[10px] font-extrabold uppercase tracking-wider text-f1red">${getWeekendDayBadge(w)} • GP ${track.round}/24</span>
              <span class="text-[10px] font-mono-num text-slate-400">${track.laps} Giri • Degrado ${track.tyreDeg}/3</span>
            </div>
            <h2 class="text-lg font-extrabold text-white">${track.flag} ${track.name} — ${track.circuit}</h2>
            <svg viewBox="0 0 300 160" class="w-full h-24 bg-f1bg rounded-xl border border-f1border/60 p-2">
              <path d="${track.path}" fill="none" stroke="#334155" stroke-width="8" stroke-linejoin="round" />
              <path d="${track.path}" fill="none" stroke="#e10600" stroke-width="3" stroke-linejoin="round" stroke-dasharray="14 6" />
            </svg>
          </div>

          ${w.phase === 'fp' ? renderFpPhase(w, uDrivers) : ''}
          ${w.phase === 'sprint_quali' || w.phase === 'sprint_race' ? `
            <div class="bg-f1card border border-f1border rounded-2xl p-4 space-y-3">
              <div class="text-sm font-extrabold text-white">⚡ Weekend Sprint: Qualifiche & Gara Sprint</div>
              <p class="text-xs text-slate-400">Simula la sequenza Sprint e assegna i punti Sprint (8-1) prima delle Qualifiche del Gran Premio.</p>
              <button onclick="simulateSprintWeekendSequence()" class="w-full py-3 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-black text-xs">
                SIMULA QUALIFICHE + GARA SPRINT →
              </button>
            </div>
          ` : ''}
          ${w.phase === 'quali' ? `
            <div class="bg-f1card border border-f1border rounded-2xl p-4 space-y-3">
              <div class="text-sm font-extrabold text-white">⏱️ Qualifiche Ufficiali GP ${track.name}</div>
              <p class="text-xs text-slate-400">Il feeling dell'assetto raccolto nelle prove libere influenza il giro secco in qualifica.</p>
              <button onclick="simulateQualifying()" class="w-full py-3 rounded-xl bg-f1red hover:bg-red-600 font-black text-xs text-white">
                SCENDI IN PISTA PER LE QUALIFICHE →
              </button>
            </div>
          ` : ''}
          ${w.phase === 'strategy' ? renderPreRaceStrategy(w, track, uDrivers) : ''}
          ${w.phase === 'race' ? renderLiveRacePhase(w, track) : ''}
          ${w.phase === 'summary' ? renderRaceSummaryPhase(w) : ''}
        </div>
      `;
    }

    function renderFpPhase(w, uDrivers) {
      const slot = w.fp.activeSlot || 'd1';
      const setup = w.fp[slot] || w.fp.d1;
      const drv = slot === 'd1' ? uDrivers[0] : uDrivers[1];
      const maxSessions = w.hasSprint ? 2 : 3;
      const sliders = [
        { key: 'wing', label: 'Ala / Carico Aero' },
        { key: 'susp', label: 'Sospensioni' },
        { key: 'brake', label: 'Bilanciamento Freni' },
        { key: 'ride', label: 'Altezza da Terra' },
        { key: 'diff', label: 'Differenziale' }
      ];

      return `
        <div class="bg-f1card border border-f1border rounded-2xl p-4 space-y-3">
          <div class="flex items-center justify-between">
            <div>
              <div class="text-xs font-extrabold uppercase tracking-wider text-sky-300">Prove Libere FP${w.fp.session}/${maxSessions}</div>
              <div class="text-[11px] font-mono-num text-slate-400">Run rimasti: ${w.fp.runsLeftInSession} • Feeling ${drv?.code || ''}: <strong class="text-emerald-400">${setup?.confidence || 0}%</strong></div>
            </div>
            <div class="flex gap-1 bg-f1bg p-1 rounded-xl border border-f1border">
              ${uDrivers.map((ud, i) => {
                const k = i === 0 ? 'd1' : 'd2';
                return `<button onclick="setFpActiveSlot('${k}')" class="px-2.5 py-1 rounded-lg text-xs font-extrabold ${slot === k ? 'bg-f1red text-white' : 'text-slate-400'}">${ud.code}</button>`;
              }).join('')}
            </div>
          </div>

          <div class="text-xs bg-f1bg p-2.5 rounded-xl border border-f1border/70 text-slate-200">${setup?.feedback || ''}</div>

          <div class="space-y-2.5">
            ${sliders.map(sl => `
              <div class="space-y-1">
                <div class="flex justify-between text-xs font-mono-num">
                  <span class="text-slate-300">${sl.label}</span>
                  <span class="font-extrabold text-white">${setup?.[sl.key] ?? 5}/10</span>
                </div>
                <input type="range" min="1" max="10" step="1" value="${setup?.[sl.key] ?? 5}" oninput="updateFpSlider('${sl.key}', this.value)" class="w-full" />
              </div>
            `).join('')}
          </div>

          <div class="grid grid-cols-2 gap-2 pt-1">
            <button onclick="runFpStint()" class="py-2.5 px-3 rounded-xl bg-emerald-600 hover:bg-emerald-500 font-extrabold text-xs text-white">
              ▶ ESEGUI RUN (${w.fp.runsLeftInSession})
            </button>
            <button onclick="advanceFpSession()" class="py-2.5 px-3 rounded-xl bg-slate-800 hover:bg-slate-700 border border-f1border font-extrabold text-xs text-white">
              ${w.fp.session < maxSessions ? `AVANTI A FP${w.fp.session + 1} →` : 'VAI ALLE QUALIFICHE →'}
            </button>
          </div>
        </div>
      `;
    }

    function renderPreRaceStrategy(w, track, uDrivers) {
      const strat = w.preRaceStrategy || {
        d1: { tyre: 'M', push: 'balanced', pitLap: Math.round(track.laps * 0.45) },
        d2: { tyre: 'H', push: 'balanced', pitLap: Math.round(track.laps * 0.52) }
      };
      return `
        <div class="bg-f1card border border-f1border rounded-2xl p-4 space-y-3">
          <div class="text-xs font-extrabold uppercase tracking-wider text-amber-300">Strategia Pre-Gara</div>
          ${uDrivers.map((ud, idx) => {
            const sk = idx === 0 ? 'd1' : 'd2';
            const st = strat[sk];
            return `
              <div class="bg-f1bg p-3 rounded-xl border border-f1border/70 space-y-2">
                <div class="flex justify-between text-xs font-extrabold text-white">
                  <span>${ud.name} (${ud.code})</span>
                  <span class="font-mono-num text-sky-300">Gomma iniziale: ${st.tyre} • Box Giro ${st.pitLap}</span>
                </div>
                <div class="grid grid-cols-3 gap-1.5">
                  ${['S', 'M', 'H'].map(c => `
                    <button onclick="setPreRaceChoice('${sk}', 'tyre', '${c}')" class="py-1.5 rounded-lg text-xs font-black border ${st.tyre === c ? 'border-white bg-slate-700 text-white' : 'border-f1border bg-f1card text-slate-400'}">${c}</button>
                  `).join('')}
                </div>
                <div class="flex items-center justify-between text-[11px] font-mono-num text-slate-300">
                  <span>Giro Sosta: ${st.pitLap} / ${track.laps}</span>
                  <input type="range" min="5" max="${Math.max(8, track.laps - 4)}" value="${st.pitLap}" onchange="setPreRaceChoice('${sk}', 'pitLap', this.value)" class="w-36" />
                </div>
              </div>
            `;
          }).join('')}
          <button onclick="startLiveRace()" class="w-full py-3 rounded-xl bg-f1red hover:bg-red-600 font-black text-sm text-white">
            🚦 SEMAFORI VERDI — AL VIA DEL GP!
          </button>
        </div>
      `;
    }

    function renderLiveRacePhase(w, track) {
      const race = w.race;
      const ordered = [...race.cars].sort((a, b) => a.pos - b.pos);
      const userCars = ordered.filter(c => c.isUser);

      return `
        <div class="space-y-3">
          <div class="bg-f1card border border-f1border rounded-2xl p-3.5 flex items-center justify-between">
            <div>
              <div class="text-xs font-extrabold text-white">Giro ${race.currentLap} / ${track.laps} • ${race.weather}</div>
              <div class="text-[10px] text-slate-400 truncate max-w-[230px]">${race.events[0] || ''}</div>
            </div>
            <button onclick="stepRaceOneLap()" class="px-3.5 py-2 rounded-xl bg-f1red hover:bg-red-600 font-black text-xs text-white shrink-0">
              +1 GIRO →
            </button>
          </div>

          <div class="grid grid-cols-1 gap-2">
            ${userCars.map(uc => `
              <div class="bg-f1card border border-f1border rounded-2xl p-3 space-y-2">
                <div class="flex items-center justify-between text-xs">
                  <span class="font-extrabold text-white">P${uc.pos} • ${uc.name}</span>
                  <span class="font-mono-num text-amber-300">Gomma ${uc.tyre} (${uc.tyreWear}% usura) • Box ${uc.pitStops}</span>
                </div>
                <div class="grid grid-cols-4 gap-1.5">
                  <button onclick="setLiveCarPush('${uc.driverId}', 'conserve')" class="py-1 rounded-lg text-[10px] font-bold ${uc.pushMode === 'conserve' ? 'bg-sky-600 text-white' : 'bg-f1bg text-slate-400'}">Risparmio</button>
                  <button onclick="setLiveCarPush('${uc.driverId}', 'balanced')" class="py-1 rounded-lg text-[10px] font-bold ${uc.pushMode === 'balanced' ? 'bg-slate-600 text-white' : 'bg-f1bg text-slate-400'}">Neutro</button>
                  <button onclick="setLiveCarPush('${uc.driverId}', 'push')" class="py-1 rounded-lg text-[10px] font-bold ${uc.pushMode === 'push' ? 'bg-f1red text-white' : 'bg-f1bg text-slate-400'}">Spingi</button>
                  <button onclick="pitUserCarNow('${uc.driverId}', 'H')" class="py-1 rounded-lg text-[10px] font-extrabold bg-amber-500/20 border border-amber-400/50 text-amber-200">Box H</button>
                </div>
              </div>
            `).join('')}
          </div>

          <div class="bg-f1card border border-f1border rounded-2xl p-3 space-y-1.5">
            <div class="text-[10px] font-extrabold uppercase tracking-wider text-slate-400">Live Timing</div>
            ${ordered.slice(0, 12).map(c => `
              <div class="flex items-center justify-between text-xs bg-f1bg px-2.5 py-1.5 rounded-lg ${c.isUser ? 'border border-f1red/70' : ''}">
                <div class="flex items-center gap-2">
                  <span class="font-mono-num font-black w-5 text-slate-400">${c.retired ? 'R' : c.pos}</span>
                  <span class="w-2 h-2 rounded-full" style="background:${c.teamColor}"></span>
                  <span class="font-bold text-white">${c.name}</span>
                </div>
                <div class="font-mono-num text-[11px] text-slate-300">
                  <span>${c.tyre}</span>
                  <span class="ml-2 text-sky-300">${formatLapTime(c.lastLapSec)}</span>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function renderRaceSummaryPhase(w) {
      const res = w.results;
      if (!res) return '';
      return `
        <div class="bg-f1card border border-f1border rounded-2xl p-4 space-y-3">
          <div class="flex items-center justify-between">
            <div>
              <div class="text-xs font-extrabold uppercase tracking-wider text-emerald-400">Ordine d'Arrivo • GP ${res.trackName}</div>
              <div class="text-xs font-mono-num text-amber-300">Incasso netto GP da sponsor/risultati: +€${Number(res.gpIncome || 0).toFixed(1)}M</div>
            </div>
          </div>
          <div class="space-y-1.5 max-h-64 overflow-y-auto no-scrollbar">
            ${res.classification.map(r => `
              <div class="flex items-center justify-between text-xs bg-f1bg px-3 py-1.5 rounded-xl border ${r.isUser ? 'border-f1red' : 'border-f1border/50'}">
                <div class="flex items-center gap-2">
                  <span class="font-mono-num font-black w-6 text-slate-400">${r.pos}</span>
                  <span class="font-extrabold text-white">${r.name}</span>
                  <span class="text-[10px] text-slate-400">${r.teamName}</span>
                </div>
                <span class="font-mono-num font-bold text-amber-300">+${r.pts} pt</span>
              </div>
            `).join('')}
          </div>
          <button onclick="continueAfterRaceSummary()" class="w-full py-3 rounded-xl bg-emerald-600 hover:bg-emerald-500 font-black text-xs text-white">
            PROSEGUI →
          </button>
        </div>
      `;
    }

    function renderApp() {
      const root = document.getElementById('app');
      if (!root) return;

      if (!gameState) {
        root.innerHTML = renderTeamSelectScreen();
        return;
      }

      let bodyHtml = '';
      switch (gameState.activeTab) {
        case 'hub':
          bodyHtml = renderHubView();
          break;
        case 'weekend':
          bodyHtml = renderWeekendView();
          break;
        case 'calendar':
          bodyHtml = renderCalendarView();
          break;
        case 'rnd':
          bodyHtml = renderRndView();
          break;
        case 'market':
          bodyHtml = renderMarketView();
          break;
        case 'standings':
          bodyHtml = renderStandingsView();
          break;
        default:
          bodyHtml = renderHubView();
      }

      root.innerHTML = `
        ${renderTopHeader()}
        <main class="flex-1 overflow-y-auto no-scrollbar">${bodyHtml}</main>
        ${renderBottomNav()}
      `;
    }

    (function boot() {
      const saved = loadGame();
      if (saved && saved.teams && saved.drivers) {
        gameState = saved;
        window.gameState = gameState;
        if (typeof gameState.capSpent !== 'number') gameState.capSpent = 0.0;
        if (!gameState.budgetCap) gameState.budgetCap = BUDGET_CAP_2026;
      }
      renderApp();
    })();
  </script>
</body>
</html>
