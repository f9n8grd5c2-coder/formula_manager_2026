<!DOCTYPE html>
<html lang="it" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0b0e14" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Formula Manager 2026</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          },
          colors: {
            f1bg: '#0b0e14',
            f1card: '#131822',
            f1border: '#232b3b',
            f1red: '#e10600'
          }
        }
      }
    };
  </script>
  <style>
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    body {
      background-color: #0b0e14;
      color: #f1f5f9;
      font-family: 'Inter', system-ui, sans-serif;
      overscroll-behavior-y: none;
    }
    .font-mono-num {
      font-family: 'JetBrains Mono', monospace;
      font-variant-numeric: tabular-nums;
    }
    input[type="range"] {
      accent-color: #e10600;
      height: 6px;
      border-radius: 999px;
      background: #1e293b;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-f1bg text-slate-100 min-h-screen flex flex-col items-center">
  <div id="app" class="w-full max-w-md min-h-screen flex flex-col bg-f1bg relative shadow-2xl border-x border-f1border/40"></div>

  <script>
    const STORAGE_KEY = 'formula_manager_2026_save_v9';
    const BASE_CAREER_YEARS = 7;

    const BUDGET_CAP_2026 = 200.0;

    const FOM_PRIZE_POOL = [135.0, 122.0, 112.0, 102.0, 94.0, 86.0, 79.0, 73.0, 68.0, 64.0, 60.0];

    const SPONSOR_OPTIONS = [
      {
        id: 'apex_tech',
        name: 'Apex Global Tech',
        tagline: 'Contratto bilanciato: buona firma iniziale, rata costante e premi a punti',
        upfront: 18.0,
        perRace: 2.2,
        podiumBonus: 3.5,
        winBonus: 6.0,
        pointsBonus: 0.9
      },
      {
        id: 'solaris_bank',
        name: 'Solaris Private Bank',
        tagline: 'Massima liquidita garantita subito e a ogni GP (ideale per coprire il Budget Cap)',
        upfront: 30.0,
        perRace: 2.8,
        podiumBonus: 2.0,
        winBonus: 4.0,
        pointsBonus: 0.5
      },
      {
        id: 'veloce_fuel',
        name: 'Veloce Energy & Fuel',
        tagline: 'Fisso piu basso, ma premi altissimi su punti, podi e vittorie (da Top Team)',
        upfront: 12.0,
        perRace: 1.6,
        podiumBonus: 5.5,
        winBonus: 9.5,
        pointsBonus: 1.4
      }
    ];

    const INITIAL_TEAMS = [
      { id: 'ferrari', name: 'Scuderia Rossa', short: 'ROS', color: '#e10600', budget: 226.0, aero: 89, pu: 88, chassis: 88, rel: 86, objective: 2, prestige: 94, dna: 'balanced', hierarchy: 'equal', fanPassion: 96, tpName: 'F. Vasseurini' },
      { id: 'redbull', name: 'Toro Alato Racing', short: 'TAR', color: '#1e41ff', budget: 228.0, aero: 91, pu: 90, chassis: 89, rel: 88, objective: 1, prestige: 95, dna: 'downforce', hierarchy: '1st_2nd', fanPassion: 85, tpName: 'C. Hornerino' },
      { id: 'mclaren', name: 'Papaia Racing', short: 'PAP', color: '#ff8000', budget: 218.0, aero: 90, pu: 89, chassis: 89, rel: 87, objective: 2, prestige: 91, dna: 'balanced', hierarchy: 'equal', fanPassion: 88, tpName: 'A. Stellone' },
      { id: 'mercedes', name: 'Argento GP', short: 'ARG', color: '#00d2be', budget: 222.0, aero: 87, pu: 90, chassis: 88, rel: 89, objective: 3, prestige: 93, dna: 'topSpeed', hierarchy: '1st_2nd', fanPassion: 86, tpName: 'T. Wolffini' },
      { id: 'aston', name: 'Verde Britannico', short: 'VER', color: '#006f62', budget: 192.0, aero: 84, pu: 86, chassis: 84, rel: 84, objective: 5, prestige: 80, dna: 'downforce', hierarchy: '1st_2nd', fanPassion: 74, tpName: 'M. Kracko' },
      { id: 'audi', name: 'Quattro Anelli Audi', short: 'AUD', color: '#c0c0c0', budget: 188.0, aero: 82, pu: 81, chassis: 83, rel: 80, objective: 6, prestige: 84, dna: 'balanced', hierarchy: '1st_2nd', fanPassion: 82, tpName: 'M. Binottini' },
      { id: 'williams', name: 'Grove Azzurra', short: 'GRO', color: '#005aff', budget: 172.0, aero: 79, pu: 85, chassis: 79, rel: 81, objective: 7, prestige: 77, dna: 'topSpeed', hierarchy: '1st_2nd', fanPassion: 79, tpName: 'J. Vowlesi' },
      { id: 'alpine', name: 'Blu Alpino F1', short: 'ALP', color: '#ff69b4', budget: 170.0, aero: 80, pu: 82, chassis: 81, rel: 80, objective: 7, prestige: 75, dna: 'topSpeed', hierarchy: '1st_2nd', fanPassion: 72, tpName: 'O. Oakesi' },
      { id: 'cadillac', name: 'Stella Cadillac', short: 'CAD', color: '#eab308', budget: 168.0, aero: 77, pu: 79, chassis: 78, rel: 77, objective: 8, prestige: 76, dna: 'topSpeed', hierarchy: 'equal', fanPassion: 77, tpName: 'G. Lowdoni' },
      { id: 'vcarb', name: 'Faenza Toro', short: 'FAE', color: '#2b4562', budget: 154.0, aero: 78, pu: 84, chassis: 78, rel: 82, objective: 8, prestige: 70, dna: 'balanced', hierarchy: 'equal', fanPassion: 66, tpName: 'L. Mekkiesi' },
      { id: 'haas', name: 'Stella Americana', short: 'AME', color: '#b6babd', budget: 148.0, aero: 76, pu: 83, chassis: 76, rel: 79, objective: 9, prestige: 66, dna: 'balanced', hierarchy: 'equal', fanPassion: 64, tpName: 'A. Komatsui' }
    ];

    function getBudgetCapLimit() {
      return Number((gameState?.budgetCap || BUDGET_CAP_2026).toFixed(1));
    }

    function getCapSpent() {
      return Number((gameState?.capSpent || 0).toFixed(1));
    }

    function getRemainingBudgetCap() {
      return Number((getBudgetCapLimit() - getCapSpent()).toFixed(1));
    }

    function getDriversWageBill(teamId) {
      return Number((gameState?.drivers || [])
        .filter(d => d.teamId === teamId)
        .reduce((sum, d) => sum + Number(d.salary || 0), 0)
        .toFixed(1));
    }

    function chargeTeamExpense(amount, countsTowardCap = true, label = '') {
      const team = getUserTeam();
      if (!team) return false;
      const cost = Number(amount.toFixed(1));

      if (team.budget < cost) {
        showToast(`Cassa insufficiente (€${team.budget.toFixed(1)}M disponibili, servono €${cost.toFixed(1)}M).`, 'danger');
        return false;
      }

      if (countsTowardCap) {
        const remCap = getRemainingBudgetCap();
        if (remCap < cost) {
          showToast(`Budget Cap FIA esaurito! Restano €${Math.max(0, remCap).toFixed(1)}M su €${getBudgetCapLimit().toFixed(1)}M.`, 'danger');
          return false;
        }
        gameState.capSpent = Number((getCapSpent() + cost).toFixed(1));
      }

      team.budget = Number((team.budget - cost).toFixed(1));
      if (label) {
        const tag = countsTowardCap ? 'Dentro Cap' : 'Fuori Cap';
        gameState.newsFeed.unshift(`FINANZE (-€${cost.toFixed(1)}M • ${tag}): ${label}`);
      }
      return true;
    }

    function refundTeamExpense(amount, refundedCap = true, label = '') {
      const team = getUserTeam();
      if (!team) return;
      const ref = Number(amount.toFixed(1));
      team.budget = Number((team.budget + ref).toFixed(1));
      if (refundedCap) {
        gameState.capSpent = Math.max(0, Number((getCapSpent() - ref).toFixed(1)));
      }
      if (label) {
        gameState.newsFeed.unshift(`RIMBORSO (+€${ref.toFixed(1)}M): ${label}`);
      }
    }

    function createInitialState(selectedTeamId, selectedSponsorId = 'apex_tech') {
      const teams = JSON.parse(JSON.stringify(INITIAL_TEAMS)).map(t => ({
        ...t,
        points: 0,
        wins: 0,
        podiums: 0
      }));

      const sponsor = SPONSOR_OPTIONS.find(s => s.id === selectedSponsorId) || SPONSOR_OPTIONS[0];
      const userTm = teams.find(t => t.id === selectedTeamId) || teams[0];
      userTm.budget = Number((userTm.budget + sponsor.upfront).toFixed(1));

      const drivers = JSON.parse(JSON.stringify(INITIAL_DRIVERS)).map((d, idx) => ({
        ...d,
        mood: d.mood ?? (62 + ((idx * 7) % 18)),
        fatigue: d.fatigue ?? 15,
        trainingBoost: 0,
        points: 0,
        wins: 0,
        podiums: 0,
        transferRequest: false
      }));

      const freeAgents = JSON.parse(JSON.stringify(FREE_AGENTS_POOL)).map((fa, idx) => ({
        ...fa,
        mood: fa.mood ?? (60 + idx * 3),
        fatigue: fa.fatigue ?? 12,
        trainingBoost: 0,
        transferRequest: false
      }));

      const garageParts = {};
      teams.forEach(t => {
        garageParts[t.id] = createInitialGaragePartsForTeam(t);
      });

      const state = {
        season: 2026,
        maxSeasons: 2026 + BASE_CAREER_YEARS - 1,
        careerDay: 1,
        weekendStartDay: 8,
        round: 1,
        userTeamId: selectedTeamId,
        sponsorId: sponsor.id,
        activeTab: 'hub',
        hubMediaFilter: 'all',
        rndSection: 'garage',
        garageCarTab: 1,
        paddockPressure: 62,
        budgetCap: BUDGET_CAP_2026,
        capSpent: 0.0,
        rules: {
          pointsTop12: false,
          extraDegMultiplier: 1.0
        },
        teams,
        drivers,
        freeAgents,
        garageParts,
        rivalries: seedInitialRivalries(drivers),
        pendingUpgrades: [],
        pendingUpgradeConfirm: null,
        completedRounds: [],
        mediaFeed: [],
        newsFeed: [
          `Stagione 2026 avviata con ${userTm.name} e sponsor ${sponsor.name} (+€${sponsor.upfront.toFixed(1)}M alla firma).`,
          `Budget Cap FIA 2026: €${BUDGET_CAP_2026.toFixed(1)}M per sviluppo e componenti (stipendi piloti e team building fuori Cap).`
        ],
        weekend: initWeekendState(1, selectedTeamId, drivers)
      };

      gameState = state;
      generatePaddockPressForRound(1);
      return gameState;
    }

    function runExtraActivity(kind) {
      const team = getUserTeam();
      const uDrivers = getUserDrivers();
      if (!team || !uDrivers.length) return;

      if (kind === 'simulator') {
        const cost = 2.5;
        if (!chargeTeamExpense(cost, true, 'Sessione Simulatore Tecnico')) return;
        uDrivers.forEach(d => {
          d.fatigue = Math.min(100, (d.fatigue ?? 15) + 14);
          d.trainingBoost = (d.trainingBoost || 0) + 5;
          adjustDriverMood(d.id, 3, 'Sessione intensa al simulatore e analisi dati');
        });
        pushMediaQuote('Attivita Extra', `Simulatore attivato per ${uDrivers.map(x => x.code).join(' e ')}: -€${cost}M (nel Cap), +fatica.`);
        showToast('Simulatore completato (-€2.5M nel Cap, +fatica)!', 'success');
      } else if (kind === 'media_sponsor') {
        const sponsor = getActiveSponsor();
        const gain = Number((sponsor.perRace * 0.6).toFixed(1));
        team.budget = Number((team.budget + gain).toFixed(1));
        gameState.paddockPressure = Math.min(100, (gameState.paddockPressure || 62) + 5);
        uDrivers.forEach(d => {
          d.fatigue = Math.min(100, (d.fatigue ?? 15) + 6);
          adjustDriverMood(d.id, 2, 'Evento sponsor e incontro con la stampa');
        });
        pushMediaQuote('Sponsor & Media Day', `${sponsor.name} e ${team.name} protagonisti dell evento media: +€${gain.toFixed(1)}M in cassa.`);
        showToast(`Media Day completato: +€${gain.toFixed(1)}M in cassa!`, 'success');
      } else if (kind === 'team_building') {
        const cost = 2.0;
        if (!chargeTeamExpense(cost, false, 'Team Building Scuderia')) return;
        uDrivers.forEach(d => {
          d.fatigue = Math.max(0, (d.fatigue ?? 15) - 6);
          adjustDriverMood(d.id, 7, 'Ritiro di team building e confronto costruttivo');
        });
        if (uDrivers.length === 2) {
          const curRiv = getRivalryValue(uDrivers[0].id, uDrivers[1].id);
          gameState.rivalries[getRivalryKey(uDrivers[0].id, uDrivers[1].id)] = Math.max(0, curRiv - 10);
        }
        pushMediaQuote('Paddock', `Team building per ${team.name}: -€${cost}M (fuori Cap), morale su e rivalita interna piu calma.`);
        showToast('Team building riuscito (-€2.0M fuori Cap)!', 'success');
      } else if (kind === 'wind_tunnel') {
        const cost = 4.0;
        if (!chargeTeamExpense(cost, true, 'Giornata in Galleria del Vento')) return;
        team.aero = Number(Math.min(99, team.aero + 0.4).toFixed(1));
        if (gameState.garageParts?.[team.id]) {
          gameState.garageParts[team.id].filter(p => p.slot === 'steer' || p.slot === 'chassis').forEach(p => {
            p.perf += 18;
          });
          syncTeamStatsFromGarage(team.id);
        }
        pushMediaQuote('Reparto Tecnico', `${team.name} in galleria del vento: -€${cost}M (nel Cap), +0.4 Aerodinamica.`);
        showToast('Galleria del vento completata (-€4.0M nel Cap, +0.4 Aero)!', 'success');
      }

      saveGame();
      renderApp();
    }

    function boostSinglePart(partId) {
      const team = getUserTeam();
      const parts = gameState.garageParts?.[team.id] || [];
      const part = parts.find(p => p.id === partId);
      const cost = 3.0;
      if (!part) return;
      if (!chargeTeamExpense(cost, true, `Potenziamento ${part.name}`)) return;
      part.perf += 45;
      part.rel = Math.max(55, Math.min(99, part.rel - 2));
      syncTeamStatsFromGarage(team.id);
      showToast(`${part.name} potenziato (-€3.0M nel Cap)!`, 'success');
      saveGame();
      renderApp();
    }

    function buildNewGaragePart(slot) {
      const team = getUserTeam();
      const cost = 6.5;
      const slotLabel = slot === 'pu' ? 'PU' : (slot === 'chassis' ? 'Telaio' : 'Sterzo');
      if (!chargeTeamExpense(cost, true, `Costruzione nuova parte ${slotLabel}`)) return;
      gameState.garageParts[team.id] = gameState.garageParts[team.id] || [];
      const count = gameState.garageParts[team.id].filter(p => p.slot === slot).length + 1;
      const basePerf = Math.round(((team.aero + team.pu + team.chassis) / 3) * 40) + 60;
      gameState.garageParts[team.id].push({
        id: `${team.id}_${slot}_${Date.now().toString(36)}`,
        slot,
        name: `${team.short} ${slotLabel} Evo #${count}`,
        perf: basePerf,
        rel: 92,
        assignedCar: gameState.garageCarTab || 1
      });
      syncTeamStatsFromGarage(team.id);
      showToast(`Nuova parte ${slotLabel} costruita (-€6.5M nel Cap)!`, 'success');
      saveGame();
      renderApp();
    }

    function confirmAndBuyUpgrade() {
      const p = gameState.pendingUpgradeConfirm;
      if (!p) return;
      if (!chargeTeamExpense(p.cost, true, `Sviluppo ${p.area.toUpperCase()} (${p.label})`)) return;
      gameState.pendingUpgrades.push({
        id: `upg_${Date.now()}`, area: p.area, tierLabel: p.label, cost: p.cost, daysLeft: p.days, gain: p.gain
      });
      gameState.pendingUpgradeConfirm = null;
      showToast(`Ordine ${p.label} avviato (${p.days} gg, nel Cap)!`, 'success');
      saveGame();
      renderApp();
    }

    function cancelPendingUpgradeWithRefund(id) {
      const idx = gameState.pendingUpgrades.findIndex(u => u.id === id);
      if (idx < 0) return;
      const upg = gameState.pendingUpgrades[idx];
      const refund = Number((upg.cost * 0.5).toFixed(1));
      refundTeamExpense(refund, true, `Annullamento sviluppo ${upg.area.toUpperCase()}`);
      gameState.pendingUpgrades.splice(idx, 1);
      showToast(`Annullato: rimborso 50% (+€${refund.toFixed(1)}M).`, 'info');
      saveGame();
      renderApp();
    }

    function renewDriverContract(driverId) {
      const team = getUserTeam();
      const drv = gameState.drivers.find(d => d.id === driverId && d.teamId === team.id);
      if (!drv) return;
      const fee = Number((drv.salary * 0.3).toFixed(1));
      if (!chargeTeamExpense(fee, false, `Rinnovo contratto ${drv.name}`)) return;
      drv.contract = (drv.contract || 1) + 2;
      adjustDriverMood(drv.id, 6, 'Contratto prolungato di 2 anni');
      showToast(`${drv.name} rinnovato (+2 anni, -€${fee}M fuori Cap)!`, 'success');
      saveGame();
      renderApp();
    }

    function signFreeAgent(agentId, replaceDriverId) {
      const team = getUserTeam();
      const agentIdx = (gameState.freeAgents || []).findIndex(a => a.id === agentId);
      const oldIdx = gameState.drivers.findIndex(d => d.id === replaceDriverId && d.teamId === team.id);
      if (agentIdx < 0 || oldIdx < 0) return;
      const agent = gameState.freeAgents[agentIdx];
      const oldDriver = gameState.drivers[oldIdx];
      const fee = Number((agent.salary * 0.4).toFixed(1));
      if (!chargeTeamExpense(fee, false, `Ingaggio pilota ${agent.name}`)) return;
      gameState.freeAgents.splice(agentIdx, 1);
      gameState.drivers[oldIdx] = { ...agent, teamId: team.id, role: oldDriver.role || 'co_lead', points: 0, wins: 0, podiums: 0 };
      gameState.freeAgents.push({ ...oldDriver, teamId: null, role: 'co_lead' });
      showToast(`${agent.name} ingaggiato (-€${fee}M fuori Cap)!`, 'success');
      saveGame();
      renderApp();
    }

    function advanceToNextRound() {
      const team = getUserTeam();
      if (gameState.round < 24) {
        gameState.round += 1;
        gameState.weekendStartDay = (gameState.careerDay || 1) + 7;
        gameState.weekend = initWeekendState(gameState.round, gameState.userTeamId, gameState.drivers);
        gameState.activeTab = 'hub';
        generatePaddockPressForRound(gameState.round);
        saveGame();
        renderApp();
        return;
      }

      const sortedByPts = [...gameState.teams].sort((a, b) => (b.points || 0) - (a.points || 0));
      const userRankIdx = Math.max(0, sortedByPts.findIndex(t => t.id === gameState.userTeamId));
      const fomPrize = FOM_PRIZE_POOL[userRankIdx] ?? 60.0;
      const userWages = getDriversWageBill(gameState.userTeamId);
      const sponsor = getActiveSponsor();
      const netEndSeasonCash = Number((fomPrize + sponsor.upfront - userWages).toFixed(1));

      if (gameState.season < gameState.maxSeasons) {
        gameState.season += 1;
        gameState.round = 1;
        gameState.careerDay = 1;
        gameState.weekendStartDay = 8;
        gameState.capSpent = 0.0;

        gameState.teams.forEach(t => {
          const rankIdx = Math.max(0, sortedByPts.findIndex(x => x.id === t.id));
          const prize = FOM_PRIZE_POOL[rankIdx] ?? 60.0;
          const wages = getDriversWageBill(t.id);
          t.points = 0;
          t.wins = 0;
          t.podiums = 0;
          if (t.id === gameState.userTeamId) {
            t.budget = Number((t.budget + prize + sponsor.upfront - wages).toFixed(1));
          } else {
            t.budget = Number((t.budget + prize * 0.5 - wages * 0.5).toFixed(1));
          }
        });

        gameState.drivers.forEach(d => {
          d.age += 1;
          d.points = 0;
          d.wins = 0;
          d.podiums = 0;
          d.contract = Math.max(0, (d.contract || 1) - 1);
          const cap = d.potential ?? d.ovr;
          if (d.age <= 25 && d.ovr < cap) d.ovr = Math.min(cap, d.ovr + 1);
          else if (d.age >= 36 && d.ovr > 72) d.ovr = Math.max(72, d.ovr - 1);
        });

        gameState.weekend = initWeekendState(1, gameState.userTeamId, gameState.drivers);
        gameState.activeTab = 'hub';
        pushMediaQuote('Chiusura Stagione', `Fine anno: premio FOM P${userRankIdx + 1} (+€${fomPrize}M), sponsor (+€${sponsor.upfront}M), ingaggi (-€${userWages}M). Budget Cap azzerato a €${BUDGET_CAP_2026}M.`);
        generatePaddockPressForRound(1);
        saveGame();
        renderApp();
        return;
      }

      if (confirm(`Hai completato il ciclo di ${BASE_CAREER_YEARS} stagioni (P${userRankIdx + 1} Costruttori, bilancio netto fine anno €${netEndSeasonCash >= 0 ? '+' : ''}${netEndSeasonCash}M)! Vuoi prolungare la carriera di altri 3 anni?`)) {
        gameState.maxSeasons += 3;
        gameState.season += 1;
        gameState.round = 1;
        gameState.capSpent = 0.0;
        team.budget = Number((team.budget + fomPrize + sponsor.upfront - userWages).toFixed(1));
        gameState.drivers.forEach(d => { d.age += 1; d.points = 0; d.contract = Math.max(1, d.contract); });
        gameState.teams.forEach(t => { t.points = 0; });
        gameState.weekend = initWeekendState(1, gameState.userTeamId, gameState.drivers);
        gameState.activeTab = 'hub';
        saveGame();
        renderApp();
      } else {
        resetCareer();
      }
    }

    function renderTopHeader() {
      const team = getUserTeam();
      const track = CALENDAR_2026[gameState.round - 1] || CALENDAR_2026[23];
      const dayTag = getWeekendDayBadge(gameState.weekend);
      const remCap = getRemainingBudgetCap();
      const capLimit = getBudgetCapLimit();
      return `
        <header class="sticky top-0 z-30 bg-f1bg/95 backdrop-blur border-b border-f1border px-4 py-2.5 flex items-center justify-between">
          <div class="flex items-center gap-2">
            <span class="w-2.5 h-6 rounded-full" style="background:${team.color}"></span>
            <div>
              <div class="text-xs font-extrabold text-white leading-tight">${team.name} <span class="text-[9px] px-1.5 py-0.5 rounded bg-slate-800 text-amber-300 ml-1">${dayTag}</span></div>
              <div class="text-[10px] text-slate-400 font-mono-num">Anno ${gameState.season}/${gameState.maxSeasons} • G${gameState.careerDay || 1} • GP${gameState.round}/24 ${track.flag}</div>
            </div>
          </div>
          <div class="flex items-center gap-2">
            <div class="text-right font-mono-num">
              <div class="text-xs font-extrabold text-emerald-400">Cassa €${team.budget.toFixed(1)}M</div>
              <div class="text-[9px] ${remCap < 15 ? 'text-amber-300 font-bold' : 'text-sky-300'}">Cap: €${remCap.toFixed(1)}M / €${capLimit.toFixed(0)}M</div>
            </div>
            <button onclick="if(confirm('Vuoi azzerare la carriera?')) resetCareer()" class="px-2 py-1 rounded-lg bg-slate-800 text-[10px] text-slate-400 hover:text-white">Reset</button>
          </div>

    function seedInitialRivalries(drivers) {
      const map = {};
      const pairs = [
        ['lec', 'ham', 28],
        ['ver', 'nor', 45],
        ['nor', 'pia', 34],
        ['rus', 'ant', 22],
        ['alo', 'str', 20],
        ['gas', 'oco', 48],
        ['sai', 'alb', 18],
        ['tsu', 'had', 20]
      ];
      pairs.forEach(([a, b, val]) => {
        if (drivers.some(d => d.id === a) && drivers.some(d => d.id === b)) {
          map[getRivalryKey(a, b)] = val;
        }
      });
      return map;
    }

    function createInitialState(selectedTeamId, selectedSponsorId = 'apex_tech') {
      const teams = JSON.parse(JSON.stringify(INITIAL_TEAMS)).map(t => ({
        ...t,
        points: 0,
        wins: 0,
        podiums: 0
      }));

      const sponsor = SPONSOR_OPTIONS.find(s => s.id === selectedSponsorId) || SPONSOR_OPTIONS[0];
      const userTm = teams.find(t => t.id === selectedTeamId) || teams[0];
      userTm.budget = Number((userTm.budget + sponsor.upfront).toFixed(1));

      const drivers = JSON.parse(JSON.stringify(INITIAL_DRIVERS)).map((d, idx) => ({
        ...d,
        mood: d.mood ?? (62 + ((idx * 7) % 18)),
        fatigue: d.fatigue ?? 15,
        trainingBoost: 0,
        points: 0,
        wins: 0,
        podiums: 0,
        transferRequest: false
      }));

      const freeAgents = JSON.parse(JSON.stringify(FREE_AGENTS_POOL)).map((fa, idx) => ({
        ...fa,
        mood: fa.mood ?? (60 + idx * 3),
        fatigue: fa.fatigue ?? 12,
        trainingBoost: 0,
        transferRequest: false
      }));

      const garageParts = {};
      teams.forEach(t => {
        garageParts[t.id] = createInitialGaragePartsForTeam(t);
      });

      const state = {
        season: 2026,
        maxSeasons: 2026 + BASE_CAREER_YEARS - 1,
        careerDay: 1,
        weekendStartDay: 8,
        round: 1,
        userTeamId: selectedTeamId,
        sponsorId: sponsor.id,
        activeTab: 'hub',
        hubMediaFilter: 'all',
        rndSection: 'garage',
        garageCarTab: 1,
        paddockPressure: 62,
        budgetCap: 150.0,
        rules: {
          pointsTop12: false,
          extraDegMultiplier: 1.0
        },
        teams,
        drivers,
        freeAgents,
        garageParts,
        rivalries: seedInitialRivalries(drivers),
        pendingUpgrades: [],
        pendingUpgradeConfirm: null,
        completedRounds: [],
        mediaFeed: [],
        newsFeed: [
          `Stagione 2026 avviata con ${userTm.name} e sponsor ${sponsor.name} (+€${sponsor.upfront.toFixed(1)}M quota fissa).`,
          `Puoi avanzare giorno per giorno o saltare direttamente al prossimo weekend di gara.`
        ],
        weekend: initWeekendState(1, selectedTeamId, drivers)
      };

      gameState = state;
      generatePaddockPressForRound(1);
      return gameState;
    }

    function initWeekendState(roundNum, userTeamId, drivers) {
      const track = CALENDAR_2026[roundNum - 1] || CALENDAR_2026[0];
      const userDrivers = drivers.filter(d => d.teamId === userTeamId);
      const d1 = userDrivers[0];
      const d2 = userDrivers[1];

      const baseSusp = Math.max(1, Math.min(10, Math.round((track.downforce + (10 - track.topSpeed)) / 2)));
      const baseBrake = Math.max(1, Math.min(10, 11 - track.topSpeed));
      const baseRide = Math.max(1, Math.min(10, track.tyreDeg === 3 ? 6 : (track.downforce >= 8 ? 5 : 7)));
      const baseDiff = Math.max(1, Math.min(10, track.tyreDeg === 3 ? 6 : 5));

      const targetD1 = {
        wing: track.downforce,
        susp: baseSusp,
        brake: baseBrake,
        ride: baseRide,
        diff: baseDiff
      };
      const targetD2 = {
        wing: Math.max(1, Math.min(10, track.downforce - (track.downforce > 6 ? 1 : -1))),
        susp: Math.max(1, Math.min(10, baseSusp + (baseSusp < 8 ? 1 : -1))),
        brake: baseBrake,
        ride: Math.max(1, Math.min(10, baseRide + (baseRide < 9 ? 1 : -1))),
        diff: Math.max(1, Math.min(10, baseDiff - (baseDiff > 2 ? 1 : 0)))
      };

      const makeDriverSetup = (initWing = 5, initSusp = 5, initBrake = 5, initRide = 5, initDiff = 5) => ({
        wing: initWing,
        susp: initSusp,
        brake: initBrake,
        ride: initRide,
        diff: initDiff,
        confidence: 35,
        plan: 'race',
        fpRunsDone: 0,
        lastError: null,
        feedback: 'Regola i 5 parametri di assetto ed esegui i run in pista.'
      });

      return {
        round: roundNum,
        hasSprint: !!track.hasSprint,
        day: 'friday',
        phase: 'fp',
        targets: { wing: targetD1.wing, susp: targetD1.susp, brake: targetD1.brake, ride: targetD1.ride, diff: targetD1.diff },
        driverTargets: { d1: targetD1, d2: targetD2 },
        fp: {
          session: 1,
          runsLeftInSession: 3,
          activeSlot: 'd1',
          d1: d1 ? makeDriverSetup(4, 5, 6, 5, 5) : null,
          d2: d2 ? makeDriverSetup(6, 5, 4, 6, 5) : null
        },
        sprintQuali: null,
        sprintRace: null,
        quali: null,
        preRaceStrategy: null,
        race: null,
        results: null
      };
    }

    function getWeekendDayBadge(weekend) {
      if (!weekend) return 'GIORNO';
      if (weekend.phase === 'fp') {
        if (weekend.hasSprint) {
          return weekend.fp?.session === 2 ? 'SAB • FP2' : 'VEN • FP1';
        }
        if (weekend.fp?.session === 1) return 'VEN • FP1';
        if (weekend.fp?.session === 2) return 'VEN • FP2';
        return 'SAB • FP3';
      }
      if (weekend.phase === 'sprint_quali') return 'VEN • QUAL. SPRINT';
      if (weekend.phase === 'sprint_race') return 'SAB • SPRINT';
      if (weekend.phase === 'quali') return 'SAB • QUALIFICHE';
      if (weekend.phase === 'strategy') return 'DOM • PRE-GARA';
      if (weekend.phase === 'race' || weekend.phase === 'live_strategy' || weekend.phase === 'summary') return 'DOM • GARA';
      return 'WEEKEND';
    }

    function selectTeamAndStart(teamId, sponsorId = 'apex_tech') {
      gameState = createInitialState(teamId, sponsorId);
      saveGame();
      renderApp();
    }

    function setActiveTab(tab) {
      if (!gameState) return;
      gameState.activeTab = tab;
      saveGame();
      renderApp();
    }

    function setHubMediaFilter(flt) {
      if (!gameState) return;
      gameState.hubMediaFilter = flt;

      renderApp();
    }

    function advanceSingleDay(silent = false) {
      if (!gameState) return;
      gameState.careerDay = (gameState.careerDay || 1) + 1;

      const remainingUpgrades = [];
      (gameState.pendingUpgrades || []).forEach(upg => {
        upg.daysLeft = (upg.daysLeft ?? 4) - 1;
        if (upg.daysLeft <= 0) {
          const tm = getTeam(gameState.userTeamId);
          tm[upg.area] = Number((tm[upg.area] + upg.gain).toFixed(1));
          if (gameState.garageParts?.[tm.id]) {
            const targetSlot = upg.area === 'pu' ? 'pu' : (upg.area === 'chassis' ? 'chassis' : 'steer');
            const part = gameState.garageParts[tm.id].find(p => p.slot === targetSlot);
            if (part) {
              part.perf += Math.round(upg.gain * 35);
              part.rel = Math.min(99, part.rel + 2);
              part.name = `${part.name.split(' v')[0]} +${upg.gain}`;
            }
            syncTeamStatsFromGarage(tm.id);
          }
          gameState.newsFeed.unshift(`AGGIORNAMENTO PRONTO: +${upg.gain} ${upg.area.toUpperCase()} completato in fabbrica!`);
          if (!silent) showToast(`Aggiornamento ${upg.area.toUpperCase()} completato!`, 'success');
        } else {
          remainingUpgrades.push(upg);
        }
      });
      gameState.pendingUpgrades = remainingUpgrades;

      gameState.drivers.forEach(d => {
        const prevFatigue = d.fatigue ?? 15;
        d.fatigue = Math.max(0, Math.min(100, prevFatigue - 4));

        const boostMult = (d.trainingBoost || 0) > 0 ? 1.65 : 1.0;
        if ((d.trainingBoost || 0) > 0) d.trainingBoost = Math.max(0, d.trainingBoost - 1);

        const cap = d.potential ?? d.ovr;
        if (d.age <= 25 && d.ovr < cap && d.fatigue < 65) {
          if (Math.random() < 0.055 * boostMult) {
            d.ovr = Math.min(cap, d.ovr + 1);
            d.pace = Math.min(99, d.pace + 1);
            if (d.teamId === gameState.userTeamId && !silent) {
              gameState.newsFeed.unshift(`CRESCITA PILOTA: ${d.name} sale a OVR ${d.ovr} (Pot. ${cap})!`);
            }
          }
        } else if (d.age >= 36 && d.ovr > 72) {
          const slowFactor = (d.trainingBoost || 0) > 0 ? 0.35 : 1.0;
          if (Math.random() < 0.025 * slowFactor) {
            d.ovr = Math.max(72, d.ovr - 1);
            d.pace = Math.max(70, d.pace - 1);
            if (d.teamId === gameState.userTeamId && !silent) {
              gameState.newsFeed.unshift(`CALO ETA: ${d.name} (${d.age}a) scende a OVR ${d.ovr}.`);
            }
          }
        }
      });

      if (!silent) {
        saveGame();
        renderApp();
      }
    }

    function advanceToNextWeekend() {
      if (!gameState) return;
      const startDay = gameState.weekendStartDay || 8;
      const daysToJump = Math.max(1, startDay - (gameState.careerDay || 1));
      for (let i = 0; i < daysToJump; i++) {
        advanceSingleDay(true);
      }
      gameState.activeTab = 'weekend';
      showToast(`Arrivati al weekend del GP ${gameState.round}!`, 'info');
      saveGame();
      renderApp();
    }

    function runExtraActivity(kind) {
      const team = getUserTeam();
      const uDrivers = getUserDrivers();
      if (!team || !uDrivers.length) return;

      if (kind === 'simulator') {
        const cost = 2.5;
        if (team.budget < cost) return showToast('Budget insufficiente per il simulatore (€2.5M).', 'danger');
        team.budget = Number((team.budget - cost).toFixed(1));
        uDrivers.forEach(d => {
          d.fatigue = Math.min(100, (d.fatigue ?? 15) + 14);
          d.trainingBoost = (d.trainingBoost || 0) + 5;
          adjustDriverMood(d.id, 3, 'Sessione intensa al simulatore e analisi dati');
        });
        pushMediaQuote('Attivita Extra', `Simulatore attivato per ${uDrivers.map(x => x.code).join(' e ')}: crescita/tenuta potenziata (-€${cost}M, +fatica).`);
        showToast('Simulatore completato (-€2.5M, +fatica, spinta sviluppo/tenuta)!', 'success');
      } else if (kind === 'media_sponsor') {
        const sponsor = getActiveSponsor();
        const gain = Number((sponsor.perRace * 0.6).toFixed(1));
        team.budget = Number((team.budget + gain).toFixed(1));
        gameState.paddockPressure = Math.min(100, (gameState.paddockPressure || 62) + 5);
        uDrivers.forEach(d => {
          d.fatigue = Math.min(100, (d.fatigue ?? 15) + 6);
          adjustDriverMood(d.id, 2, 'Evento sponsor e incontro con la stampa');
        });
        pushMediaQuote('Sponsor & Media Day', `${sponsor.name} e ${team.name} protagonisti dell evento media: +€${gain.toFixed(1)}M al budget.`);
        showToast(`Media Day completato: +€${gain.toFixed(1)}M allo sponsor!`, 'success');
      } else if (kind === 'team_building') {
        const cost = 2.0;
        if (team.budget < cost) return showToast('Budget insufficiente per il team building (€2.0M).', 'danger');
        team.budget = Number((team.budget - cost).toFixed(1));
        uDrivers.forEach(d => {
          d.fatigue = Math.max(0, (d.fatigue ?? 15) - 6);
          adjustDriverMood(d.id, 7, 'Ritiro di team building e confronto costruttivo');
        });
        if (uDrivers.length === 2) {
          const curRiv = getRivalryValue(uDrivers[0].id, uDrivers[1].id);
          gameState.rivalries[getRivalryKey(uDrivers[0].id, uDrivers[1].id)] = Math.max(0, curRiv - 10);
        }
        pushMediaQuote('Paddock', `Giornata di team building per ${team.name}: morale in crescita e spogliatoio piu compatto (-€${cost}M).`);
        showToast('Team building riuscito: morale su e rivalita interna piu calma!', 'success');
      } else if (kind === 'wind_tunnel') {
        const cost = 4.0;
        if (team.budget < cost) return showToast('Budget insufficiente per la galleria del vento (€4.0M).', 'danger');
        team.budget = Number((team.budget - cost).toFixed(1));
        team.aero = Number(Math.min(99, team.aero + 0.4).toFixed(1));
        if (gameState.garageParts?.[team.id]) {
          gameState.garageParts[team.id].filter(p => p.slot === 'steer' || p.slot === 'chassis').forEach(p => {
            p.perf += 18;
          });
          syncTeamStatsFromGarage(team.id);
        }
        pushMediaQuote('Reparto Tecnico', `${team.name} in galleria del vento: +0.4 Aerodinamica e dati utili sui flussi (-€${cost}M).`);
        showToast('Galleria del vento completata: +0.4 Aerodinamica!', 'success');
      }

      saveGame();
      renderApp();
    }

    function setTeamHierarchyMode(mode) {
      const team = getUserTeam();
      const uDrivers = getUserDrivers();
      if (!team || uDrivers.length < 2) return;

      team.hierarchy = mode;
      const [d1, d2] = uDrivers;

      if (mode === 'equal') {
        d1.role = 'co_lead';
        d2.role = 'co_lead';
        adjustDriverMood(d1.id, 3, 'Scuderia impostata su pari livello');
        adjustDriverMood(d2.id, 4, 'Parita di trattamento confermata dal team');
        pushMediaQuote('Team Principal', `${team.name} annuncia pari opportunita in pista tra ${d1.name} e ${d2.name}.`);
        showToast('Gerarchia impostata: Pari Livello per entrambi i piloti.', 'info');
      } else {
        applyRoleAssignments(d1.id, 'lead', d2.id, 'support');
      }

      saveGame();
      renderApp();
    }

    function setLeadDriverSelection(newLeadId) {
      const team = getUserTeam();
      const uDrivers = getUserDrivers();
      if (!team || uDrivers.length < 2) return;
      team.hierarchy = '1st_2nd';
      const leadDrv = uDrivers.find(d => d.id === newLeadId) || uDrivers[0];
      const suppDrv = uDrivers.find(d => d.id !== leadDrv.id) || uDrivers[1];
      applyRoleAssignments(leadDrv.id, 'lead', suppDrv.id, 'support');
      saveGame();
      renderApp();
    }

    function applyRoleAssignments(leadId, leadRole, suppId, suppRole) {
      const team = getUserTeam();
      const lead = gameState.drivers.find(d => d.id === leadId);
      const supp = gameState.drivers.find(d => d.id === suppId);
      if (!lead || !supp) return;

      const prevSuppRole = supp.role;
      lead.role = leadRole;
      supp.role = suppRole;

      adjustDriverMood(lead.id, 6, `Nominato 1a Guida in ${team.name}`);

      if (prevSuppRole !== 'support') {
        const penalty = supp.acceptsSupport ? -6 : -18;
        adjustDriverMood(supp.id, penalty, supp.acceptsSupport ? 'Declassato a 2a Guida ma disposto a collaborare' : 'Non gradisce il ruolo di 2a Guida: tensione alta!');
        bumpRivalry(lead.id, supp.id, supp.acceptsSupport ? 8 : 18, `Gerarchia 1a/2a guida in casa ${team.name}`);
      }

      showToast(`${lead.code} 1a Guida • ${supp.code} 2a Guida`, 'info');
    }

    function getPitLaneCoord(car) {
      const m = car.pitAnim?.mode;
      const t = Math.min(1, car.pitAnim?.t || 0);
      if (m === 'pit_in') {
        return { x: 224 + (150 - 224) * t, y: 130 + (157 - 130) * t };
      }
      if (m === 'pit_out') {
        return { x: 150 + (76 - 150) * t, y: 157 + (130 - 157) * t };
      }
      return null;
    }

    function syncTrackCarPositions(svgElementId = 'fm-circuit-svg') {
      const svg = document.getElementById(svgElementId);
      const pathEl = svg?.querySelector('#active-track-path');
      if (!svg || !pathEl || typeof pathEl.getTotalLength !== 'function') return;

      const totalLen = pathEl.getTotalLength();
      if (!totalLen) return;

      const dots = svg.querySelectorAll('[data-track-progress]');
      dots.forEach(dot => {
        const mode = dot.getAttribute('data-pit-mode') || 'none';
        if (mode === 'pit_in' || mode === 'pit_out') return;
        const p = parseFloat(dot.getAttribute('data-track-progress') || '0');
        const normalized = ((p % 1) + 1) % 1;
        const pt = pathEl.getPointAtLength(normalized * totalLen);
        dot.setAttribute('cx', pt.x.toFixed(1));
        dot.setAttribute('cy', pt.y.toFixed(1));
      });
    }

    function runPracticeSession() {
      const w = gameState.weekend;
      const fp = w.fp;
      const targetsMap = w.driverTargets || { d1: w.targets, d2: w.targets };

      ['d1', 'd2'].forEach(slot => {
        const data = fp[slot];
        if (!data) return;
        const t = targetsMap[slot] || w.targets;
        const err = Math.abs(data.wing - t.wing) + Math.abs(data.susp - t.susp) + Math.abs(data.brake - t.brake) + Math.abs((data.ride ?? 5) - (t.ride ?? 5)) + Math.abs((data.diff ?? 5) - (t.diff ?? 5));
        const rawConf = Math.max(30, Math.min(100, 100 - err * 4.5));
        data.confidence = Math.max(data.confidence, rawConf);
        data.fpRunsDone += 1;
        data.feedback = err <= 2
          ? 'Ottimo equilibrio trovato: la vettura risponde in modo preciso su questo tracciato.'
          : (err <= 6 ? 'Assetto discreto, ancora qualche decimo da estrarre sul bilanciamento.' : 'Assetto distante dal riferimento: correggi ali, sospensioni o differenziale.');
      });

      fp.runsLeftInSession = Math.max(0, (fp.runsLeftInSession ?? 3) - 1);
      if (fp.runsLeftInSession === 0 && !w.hasSprint && fp.session < 3) {
        fp.session += 1;
        fp.runsLeftInSession = 3;
        showToast(`Passati a FP${fp.session} (3 run disponibili)!`, 'info');
      } else {
        showToast(`Run completato (${fp.runsLeftInSession} run rimasti)!`, 'info');
      }

      saveGame();
      renderApp();
    }

      stopAllLoops();

        const isUser = d.teamId === gameState.userTeamId;
        let confBonus = 0.65;
        let plan = 'race';
        if (isUser) {
          const slot = userDrivers[0]?.id === d.id ? fp.d1 : fp.d2;
          confBonus = (slot?.confidence || 45) / 100;
          plan = slot?.plan || 'race';
        }
        return {
          driverId: d.id,
          name: d.name,
          code: d.code,
          number: d.number,
          teamId: d.teamId,

          bestTime: 999,

          eliminatedIn: null,
          status: 'BOX',
          runTimer: 0,
          trackPos: 0,

    function selectQualiTyre(driverId, tyreCode) {
      const q = gameState.weekend?.quali;

    function sendDriverOutQuali(driverId) {
      const q = gameState.weekend?.quali;
      if (!q || q.timeLeft <= 60) return;
      const entry = q.entries.find(e => e.driverId === driverId);
      if (!entry || entry.eliminated || entry.status !== 'BOX') return;
      entry.status = 'OUT_LAP';
      entry.runTimer = 0;
      entry.trackPos = 0.01;
      saveGame();
      renderApp();

    function tickQualiSecond() {
      const q = gameState.weekend?.quali;
      if (!q || gameState.weekend.phase !== 'quali' || q.speed === 0) return;
      const track = CALENDAR_2026[gameState.round - 1];
      const step = q.speed * 4;
      q.timeLeft = Math.max(0, q.timeLeft - step);

      q.entries.forEach(entry => {
        if (entry.eliminated || entry.isUser) return;
        if (entry.status === 'BOX' && entry.aiRunsLeft > 0) {
          if ((q.timeLeft < 860 && entry.aiRunsLeft === 2) || (q.timeLeft < 340 && entry.aiRunsLeft === 1)) {
            if (Math.random() < 0.25) {
              entry.aiRunsLeft -= 1;
              entry.selectedTyre = q.weather === 'wet' ? 'I' : 'S';
              entry.status = 'OUT_LAP';
              entry.runTimer = 0;
              entry.trackPos = 0.01;
            }
          }
        }
      });

      const activeCarsOnTrack = q.entries.filter(e => !e.eliminated && e.status !== 'BOX').length;
      q.trackGrip = Math.max(38, Math.min(100, Number(((q.trackGrip ?? 70) + activeCarsOnTrack * 0.035).toFixed(1))));

      q.entries.forEach(entry => {
        if (entry.eliminated || entry.status === 'BOX') return;
        entry.runTimer += step;

        if (entry.status === 'OUT_LAP') {
          if (entry.runTimer >= 85) {
            entry.status = 'HOT_LAP';
            entry.runTimer = 0;
          }
        } else if (entry.status === 'HOT_LAP') {
          if (entry.runTimer >= track.baseLap) {
            const driver = gameState.drivers.find(d => d.id === entry.driverId);
            const team = getTeam(entry.teamId);
            const comp = TYRE_COMPOUNDS[entry.selectedTyre];
            const carPerf = (team.aero * 0.42 + team.pu * 0.35 + team.chassis * 0.23);
            const lap = track.baseLap + (90 - carPerf) * 0.09 + (90 - driver.pace) * 0.06 - (entry.isUser ? entry.confBonus * 0.4 : 0.2) + comp.paceBonus + (Math.random() - 0.5) * 0.28;
            if (lap < entry.bestTime) entry.bestTime = lap;
            entry.status = 'IN_LAP';
            entry.runTimer = 0;
          }
        } else if (entry.status === 'IN_LAP') {
          if (entry.runTimer >= 80) {
            entry.status = 'BOX';
            entry.runTimer = 0;
            entry.trackPos = 0;
          }
        }
      });

      if (q.timeLeft <= 0) {
        q.speed = 0;
        const active = q.entries.filter(e => !e.eliminated).sort((a, b) => a.bestTime - b.bestTime);
        if (q.roundName === 'Q1') active.slice(16).forEach(e => { e.eliminated = true; e.eliminatedIn = 'Q1'; e.status = 'BOX'; e.trackPos = 0; });
        else if (q.roundName === 'Q2') active.slice(10).forEach(e => { e.eliminated = true; e.eliminatedIn = 'Q2'; e.status = 'BOX'; e.trackPos = 0; });
      }

      saveGame();
      renderApp();
    }

    function advanceQualiSession() {
      const q = gameState.weekend?.quali;
      if (!q) return;
      q.entries.forEach(e => { e.status = 'BOX'; e.runTimer = 0; e.trackPos = 0; });
      if (q.roundName === 'Q1') {
        q.roundName = 'Q2';
        q.cutoff = 10;
        q.timeLeft = 900;
        q.speed = 1;
        q.entries.filter(e => !e.eliminated).forEach(e => { e.bestTime = 999; e.aiRunsLeft = e.isUser ? 0 : 2; });

      saveGame();
      renderApp();
    }

    function startQualiSmoothLoop() {
      stopAllLoops();
      const q = gameState?.weekend?.quali;
      if (!q || gameState.weekend.phase !== 'quali') return;
      const track = CALENDAR_2026[gameState.round - 1];
      syncTrackCarPositions('fm-quali-svg');
      lastAnimTimestamp = performance.now();

      const animateQuali = (now) => {
        const dt = Math.min(0.1, (now - lastAnimTimestamp) / 1000);
        lastAnimTimestamp = now;
        const curQ = gameState?.weekend?.quali;
        if (curQ && curQ.speed > 0 && gameState.weekend.phase === 'quali') {
          const simSec = dt * curQ.speed * 4;
          curQ.entries.forEach(entry => {
            if (entry.eliminated || entry.status === 'BOX') return;
            const segDur = entry.status === 'HOT_LAP' ? track.baseLap : 82;
            entry.trackPos = (entry.trackPos || 0.01) + (simSec / segDur);
            const dot = document.getElementById(`quali-dot-${entry.driverId}`);
            if (dot) dot.setAttribute('data-track-progress', (entry.trackPos % 1).toFixed(4));
          });
          syncTrackCarPositions('fm-quali-svg');
        }
        animFrameId = requestAnimationFrame(animateQuali);
      };
      animFrameId = requestAnimationFrame(animateQuali);

      simTimer = setInterval(() => {
        if (gameState?.weekend?.quali && gameState.weekend.quali.speed > 0 && gameState.weekend.phase === 'quali') {
          tickQualiSecond();
        }
      }, q.speed > 0 ? Math.max(250, 1000 / q.speed) : 1000);
    }

    function openPreRaceStrategy() {
      stopAllLoops();
      const q = gameState.weekend.quali;
      const track = CALENDAR_2026[gameState.round - 1];
      let gridOrder = [];
      if (q && q.entries) {
        const active = q.entries.filter(e => !e.eliminated).sort((a, b) => a.bestTime - b.bestTime);
        const elimQ2 = q.entries.filter(e => e.eliminatedIn === 'Q2').sort((a, b) => a.bestTime - b.bestTime);
        const elimQ1 = q.entries.filter(e => e.eliminatedIn === 'Q1').sort((a, b) => a.bestTime - b.bestTime);
        gridOrder = [...active, ...elimQ2, ...elimQ1];
        generatePostSessionPress('quali', { gridOrder });
      } else {
        gridOrder = [...gameState.drivers].sort((a, b) => b.ovr - a.ovr).map(d => ({ driverId: d.id }));
      }

      const makePlan = (driverId) => {
        const gridPos = Math.max(1, gridOrder.findIndex(e => e.driverId === driverId) + 1);
        const stops = track.tyreDeg === 3 ? 2 : 1;
        const pit1 = Math.max(5, Math.min(track.laps - 8, Math.round(track.laps / (stops + 1))));
        const pit2 = Math.max(pit1 + 6, Math.min(track.laps - 4, Math.round((track.laps * 2) / (stops + 1))));
        const pit3 = Math.max(pit2 + 5, Math.min(track.laps - 2, Math.round((track.laps * 3) / (stops + 1))));
        return {
          driverId,
          gridPos,
          startTyre: track.tyreDeg === 3 ? 'M' : 'S',
          stopsCount: stops,
          pitLaps: [pit1, pit2, pit3],
          stintTyres: ['H', 'M', 'S', 'H'],
          initialPace: 'balanced'
        };
      };

      const userDrivers = getUserDrivers();
      gameState.weekend.day = 'sunday';
      gameState.weekend.preRaceStrategy = {
        d1: userDrivers[0] ? makePlan(userDrivers[0].id) : null,
        d2: userDrivers[1] ? makePlan(userDrivers[1].id) : null
      };
      gameState.weekend.phase = 'strategy';
      saveGame();
      renderApp();
    }

    function updateStrategyField(slot, field, val) {
      if (!gameState.weekend.preRaceStrategy?.[slot]) return;
      gameState.weekend.preRaceStrategy[slot][field] = val;
      saveGame();
      renderApp();
    }

    function updateStrategyPitLap(slot, idx, val) {
      const strat = gameState.weekend.preRaceStrategy?.[slot];
      if (!strat) return;
      const track = CALENDAR_2026[gameState.round - 1];
      strat.pitLaps[idx] = Math.max(2, Math.min(track.laps - 1, parseInt(val, 10) || 10));
      saveGame();
      renderApp();
    }

    function updateStrategyStintTyre(slot, idx, tyreCode) {
      if (!gameState.weekend.preRaceStrategy?.[slot]) return;
      gameState.weekend.preRaceStrategy[slot].stintTyres[idx] = tyreCode;
      saveGame();
      renderApp();
    }

    function formatPlanSummaryText(startTyre, stopsCount, pitLaps, stintTyres) {
      let txt = `${startTyre}`;
      for (let i = 0; i < stopsCount; i++) {
        txt += ` -> ${stintTyres[i] || 'H'} (G${pitLaps[i] || 15})`;
      }
      return txt;
    }

    function renderPreRaceStrategyView() {
      const stratObj = gameState.weekend.preRaceStrategy;
      if (!stratObj) { openPreRaceStrategy(); return ''; }
      const track = CALENDAR_2026[gameState.round - 1];
      const userDrivers = getUserDrivers();

      return `
        <div class="p-4 space-y-3.5">
          <div class="bg-f1card border border-f1border rounded-2xl p-3.5">
            <span class="text-[10px] font-bold uppercase text-f1red">Domenica • Strategia Pre-Gara</span>
            <h2 class="text-lg font-extrabold text-white mt-0.5">${track.flag} ${track.name} (${track.laps} Giri)</h2>
          </div>

          ${['d1', 'd2'].map((slot, idx) => {
            const drv = userDrivers[idx];
            const plan = stratObj[slot];

    function openLiveRaceStrategyScreen() {
      const r = gameState.weekend?.race;
      if (!r) return;
      r.speed = 0;
      stopAllLoops();
      gameState.weekend.phase = 'live_strategy';
      gameState.weekend.liveDraft = null;
      saveGame();
      renderApp();
    }

    function closeLiveRaceStrategyScreen(resume = true) {
      const r = gameState.weekend?.race;
      if (!r) return;
      gameState.weekend.phase = 'race';
      gameState.weekend.liveDraft = null;
      if (resume && r.speed === 0) r.speed = 1;
      saveGame();
      renderApp();
    }

    function ensureLiveDraft() {
      const r = gameState.weekend?.race;
      if (!r) return null;
      if (!gameState.weekend.liveDraft) {
        const draft = {};
        r.cars.filter(c => c.isUser).forEach(c => {
          const rem = Math.max(0, (c.plannedStops || 0) - (c.pitStops || 0));
          const upcomingLaps = [];
          const upcomingTyres = [];
          for (let i = c.pitStops || 0; i < (c.plannedStops || 0); i++) {
            upcomingLaps.push(c.pitLaps?.[i] || Math.min(r.totalLaps - 1, r.lap + 8));
            upcomingTyres.push(c.stintTyres?.[i] || 'H');
          }
          draft[c.driverId] = { remainingStops: rem, upcomingLaps, upcomingTyres, paceMode: c.paceMode };
        });
        gameState.weekend.liveDraft = draft;
      }
      return gameState.weekend.liveDraft;
    }

    function setLiveDraftStops(driverId, count) {
      const draft = ensureLiveDraft();
      const r = gameState.weekend?.race;
      if (!draft?.[driverId] || !r) return;
      const n = Math.max(0, Math.min(3, parseInt(count, 10) || 0));
      draft[driverId].remainingStops = n;
      while (draft[driverId].upcomingLaps.length < n) {
        draft[driverId].upcomingLaps.push(Math.min(r.totalLaps - 1, r.lap + 10));
      }
      while (draft[driverId].upcomingTyres.length < n) {
        draft[driverId].upcomingTyres.push('H');
      }
      saveGame();
      renderApp();
    }

    function setLiveDraftLap(driverId, idx, val) {
      const draft = ensureLiveDraft();
      const r = gameState.weekend?.race;
      if (!draft?.[driverId] || !r) return;
      draft[driverId].upcomingLaps[idx] = Math.max(r.lap + 1, Math.min(r.totalLaps - 1, parseInt(val, 10) || (r.lap + 5)));
      saveGame();
      renderApp();
    }

    function setLiveDraftTyre(driverId, idx, tk) {
      const draft = ensureLiveDraft();
      if (!draft?.[driverId]) return;
      draft[driverId].upcomingTyres[idx] = tk;
      saveGame();
      renderApp();
    }

    function applyLiveStrategyChanges(driverId) {
      const draft = ensureLiveDraft();
      const r = gameState.weekend?.race;
      if (!draft?.[driverId] || !r) return;
      const car = r.cars.find(c => c.driverId === driverId);
      if (!car) return;
      const dPlan = draft[driverId];
      const done = car.pitStops || 0;
      for (let k = 0; k < dPlan.remainingStops; k++) {
        car.pitLaps[done + k] = dPlan.upcomingLaps[k];
        car.stintTyres[done + k] = dPlan.upcomingTyres[k];
      }
      car.plannedStops = done + dPlan.remainingStops;
      r.logs.unshift(`G${r.lap} • Piano residuo ${car.code} aggiornato.`);
      showToast(`Piano salvato per ${car.code}!`, 'success');
      saveGame();
      renderApp();
    }

    function pitNowFromLiveStrategy(driverId, tk) {
      const r = gameState.weekend?.race;
      if (!r) return;
      const car = r.cars.find(c => c.driverId === driverId && !c.retired);
      if (!car) return;
      car.pitAnim = { mode: 'pit_in', t: 0, targetTyre: tk };
      const done = car.pitStops || 0;
      car.stintTyres[done] = tk;
      car.pitLaps[done] = r.lap;
      r.logs.unshift(`G${r.lap} • Pit immediato ordinato per ${car.code} (${TYRE_COMPOUNDS[tk].short}).`);
      gameState.weekend.liveDraft = null;
      showToast(`${car.code} ai box questo giro!`, 'info');
      saveGame();
      renderApp();
    }

    function launchRaceFromStrategy() {
      stopAllLoops();
      const track = CALENDAR_2026[gameState.round - 1];
      const stratObj = gameState.weekend.preRaceStrategy || {};
      const userDrivers = getUserDrivers();
      const q = gameState.weekend.quali;
      let gridOrder = [];
      if (q && q.entries) {
        gridOrder = [
          ...q.entries.filter(e => !e.eliminated).sort((a, b) => a.bestTime - b.bestTime),
          ...q.entries.filter(e => e.eliminatedIn === 'Q2').sort((a, b) => a.bestTime - b.bestTime),
          ...q.entries.filter(e => e.eliminatedIn === 'Q1').sort((a, b) => a.bestTime - b.bestTime)
        ];
      } else {
        gridOrder = [...gameState.drivers].sort((a, b) => b.ovr - a.ovr).map(d => ({ driverId: d.id }));
      }

      const weather = q?.weather || (Math.random() < track.rainChance ? 'wet' : 'dry');
      const cars = gridOrder.map((gEntry, idx) => {
        const driver = gameState.drivers.find(d => d.id === gEntry.driverId) || gameState.drivers[idx];
        const team = getTeam(driver.teamId);
        const isUser = team.id === gameState.userTeamId;
        const gridPos = idx + 1;
        let tyre = weather === 'wet' ? 'I' : (track.tyreDeg === 3 ? 'M' : 'S');
        let paceMode = 'balanced';
        let plannedStops = track.tyreDeg === 3 ? 2 : 1;
        let pitLaps = [Math.round(track.laps * 0.42), Math.round(track.laps * 0.74), Math.round(track.laps * 0.90)];
        let stintTyres = ['H', 'M', 'S', 'H'];

        if (isUser) {
          const sObj = userDrivers[0]?.id === driver.id ? stratObj.d1 : stratObj.d2;
          if (sObj) {
            if (weather !== 'wet') tyre = sObj.startTyre || tyre;
            paceMode = sObj.initialPace || 'balanced';
            plannedStops = sObj.stopsCount ?? plannedStops;
            pitLaps = [...(sObj.pitLaps || pitLaps)];
            stintTyres = [...(sObj.stintTyres || stintTyres)];
          }
        }

        const gap = Number((idx * 0.5).toFixed(1));
        return {
          driverId: driver.id, name: driver.name, code: driver.code, number: driver.number,
          teamId: team.id, isUser, gridPos, pos: gridPos, lap: 1, progress: 0,
          totalRaceTime: gap, gapToLeader: gap, lastLapTime: 0, bestLapTime: 999,
          tyre, tyreWear: 0, paceMode, plannedStops, pitLaps, stintTyres, pitStops: 0, pitAnim: null, retired: false
        };
      });

      gameState.weekend.day = 'sunday';
      gameState.weekend.phase = 'race';
      gameState.weekend.liveDraft = null;
      gameState.weekend.race = {
        lap: 1, totalLaps: track.laps, weather, safetyCar: 'none', speed: 1,
        fastestLap: { code: '-', time: 999 }, cars,
        logs: [`Via al GP ${track.name}! Piano strategico salvato e attivo.`]
      };
      saveGame();
      renderApp();
    }

    function setRaceSpeed(spd) {
      const r = gameState.weekend?.race;
      if (!r) return;
      r.speed = spd;
      if (spd === 0) stopAllLoops();
      else startRaceSmoothLoop();
      saveGame();
      renderApp();
    }

    function setRacePace(driverId, mode) {
      const car = gameState.weekend?.race?.cars.find(c => c.driverId === driverId && !c.retired);
      if (!car) return;
      car.paceMode = mode;
      saveGame();
      renderApp();
    }

    function computeVisualRaceProgresses(cars) {
      const active = cars.filter(c => !c.retired).sort((a, b) => a.pos - b.pos);
      const map = new Map();
      if (!active.length) return map;
      const leader = active[0];
      let prevVis = leader.progress || 0;
      map.set(leader.driverId, prevVis);
      for (let i = 1; i < active.length; i++) {
        const cur = active[i];
        const gapSec = Math.max(0, (cur.gapToLeader || 0) - (leader.gapToLeader || 0));
        const rawVis = (leader.progress || 0) - gapSec * 0.012;
        const clamped = Math.min(rawVis, prevVis - 0.017);
        map.set(cur.driverId, clamped);
        prevVis = clamped;
      }
      return map;
    }

    function simulateRaceLapStep() {
      const r = gameState.weekend?.race;
      if (!r || gameState.weekend.phase !== 'race') return;
      const track = CALENDAR_2026[gameState.round - 1];

      r.cars.filter(c => !c.retired).forEach(car => {
        const driver = gameState.drivers.find(d => d.id === car.driverId);
        const team = getTeam(car.teamId);
        const comp = TYRE_COMPOUNDS[car.tyre] || TYRE_COMPOUNDS.M;
        const moodMeta = getMoodMeta(driver.mood ?? 65);

        const carPerf = team.aero * 0.4 + team.pu * 0.35 + team.chassis * 0.25;
        const paceDelta = car.paceMode === 'push' ? -0.35 : (car.paceMode === 'conserve' ? 0.32 : 0);
        const wearPenalty = Math.max(0, (car.tyreWear - 45) * 0.022);
        const lapTime = Math.max(55, Number((track.baseLap + (90 - carPerf) * 0.075 + (90 - driver.pace) * 0.055 + paceDelta + moodMeta.paceDelta + comp.paceBonus + wearPenalty + (Math.random() - 0.5) * 0.4).toFixed(3)));
        car.lastLapTime = lapTime;
        if (lapTime < car.bestLapTime) car.bestLapTime = lapTime;
        if (lapTime < r.fastestLap.time) r.fastestLap = { code: car.code, time: lapTime };

        car.totalRaceTime = Number((car.totalRaceTime + lapTime).toFixed(3));
        car.lap += 1;
        car.tyreWear = Math.min(100, Number((car.tyreWear + comp.degRate * (car.paceMode === 'push' ? 1.2 : 1.0)).toFixed(1)));

        const wantsPit = car.pitAnim?.mode === 'pit_in';
        const hasPlanned = (car.pitStops || 0) < (car.plannedStops || 0);
        const schedLap = car.pitLaps?.[car.pitStops || 0] || 999;
        const dueByPlan = hasPlanned && car.lap >= schedLap;
        const aiNeedsPit = !car.isUser && car.tyreWear >= 82 && car.lap < r.totalLaps - 2;

        if ((wantsPit || dueByPlan || aiNeedsPit) && car.lap < r.totalLaps) {
          car.pitStops = (car.pitStops || 0) + 1;
          car.totalRaceTime = Number((car.totalRaceTime + 21.0).toFixed(3));
          car.tyreWear = 0;
          const nextTyre = car.pitAnim?.targetTyre || car.stintTyres?.[car.pitStops - 1] || 'H';
          car.tyre = nextTyre;
          car.pitAnim = { mode: 'pit_out', t: 0 };
          r.logs.unshift(`G${car.lap} • Pit #${car.pitStops} ${car.code} -> ${nextTyre}`);
        }
      });

      const running = r.cars.filter(c => !c.retired).sort((a, b) => (b.lap - a.lap) || (a.totalRaceTime - b.totalRaceTime));
      const leaderTime = running[0]?.totalRaceTime || 0;
      running.forEach((c, i) => {
        c.pos = i + 1;
        c.gapToLeader = Number(Math.max(0, c.totalRaceTime - leaderTime).toFixed(1));
      });

      r.lap = Math.min(r.totalLaps, Math.min(...running.map(c => c.lap)));
      if (Math.min(...running.map(c => c.lap)) > r.totalLaps) finishRaceAndAwardPoints();
    }

    function startRaceSmoothLoop() {
      stopAllLoops();
      const r = gameState?.weekend?.race;
      if (!r || gameState.weekend.phase !== 'race' || r.speed === 0) return;
      lastAnimTimestamp = performance.now();

      const animateRace = (now) => {
        const dt = Math.min(0.1, (now - lastAnimTimestamp) / 1000);
        lastAnimTimestamp = now;
        const curR = gameState?.weekend?.race;
        if (curR && curR.speed > 0 && gameState.weekend.phase === 'race') {
          const adv = dt * curR.speed * 0.22;
          let lapDone = false;
          curR.cars.forEach(c => {
            if (c.retired) return;
            c.progress = (c.progress || 0) + adv;
            if (c.pitAnim) {
              c.pitAnim.t = Math.min(1, (c.pitAnim.t || 0) + dt * curR.speed * 0.75);
              if (c.pitAnim.t >= 1 && c.pitAnim.mode === 'pit_out') c.pitAnim = null;
            }
            if (c.progress >= 1) {
              c.progress -= 1;
              if (c.isUser || c.pos <= 3) lapDone = true;
            }
          });
          const visMap = computeVisualRaceProgresses(curR.cars);
          curR.cars.forEach(c => {
            if (c.retired) return;
            const pitCoords = getPitLaneCoord(c);
            const dot = document.getElementById(`race-dot-${c.driverId}`);
            if (dot) {
              if (pitCoords) {
                dot.setAttribute('data-pit-mode', c.pitAnim.mode);
                dot.setAttribute('cx', pitCoords.x.toFixed(1));
                dot.setAttribute('cy', pitCoords.y.toFixed(1));
              } else {
                dot.setAttribute('data-pit-mode', 'none');
                dot.setAttribute('data-track-progress', (visMap.get(c.driverId) ?? c.progress).toFixed(4));
              }
            }
          });
          syncTrackCarPositions('fm-race-svg');
          if (lapDone) {
            simulateRaceLapStep();
            saveGame();
            renderApp();
            return;
          }
        }
        animFrameId = requestAnimationFrame(animateRace);
      };
      animFrameId = requestAnimationFrame(animateRace);
    }

    function renderRaceView() {

      const ordered = [...r.cars].sort((a, b) => a.pos - b.pos);

      }).join('');

      return `
        <div class="p-4 space-y-3">

            <div>
              <span class="text-[10px] font-bold uppercase text-f1red">${track.flag} ${track.name} • Giro ${Math.min(r.lap, r.totalLaps)}/${r.totalLaps}</span>
              <div class="text-[10px] text-slate-400 font-mono-num">Giro veloce: ${r.fastestLap.code} (${formatLapTime(r.fastestLap.time)})</div>
            </div>

          <div class="space-y-2">
            ${userCars.map(car => {
              const comp = TYRE_COMPOUNDS[car.tyre] || TYRE_COMPOUNDS.M;
              const rem = Math.max(0, (car.plannedStops || 0) - (car.pitStops || 0));
              const nextPit = rem > 0 ? `G${car.pitLaps?.[car.pitStops || 0]}->${car.stintTyres?.[car.pitStops || 0]}` : 'Fine';

                <div class="bg-f1card border border-f1border rounded-xl p-2.5 space-y-2">

                      <span class="text-xs font-extrabold text-white ml-1">${car.name}</span>
                      <span class="text-[10px] text-slate-400 font-mono-num ml-1">(${car.pitStops}/${car.plannedStops} pit • ${nextPit})</span>
                    </div>
                    <span class="px-2 py-0.5 rounded text-[10px] font-extrabold font-mono-num" style="background:${comp.color}; color:${comp.text}">${comp.short} ${Math.round(car.tyreWear)}%</span>
                  </div>
                  <div class="grid grid-cols-3 gap-1">
                    ${['conserve', 'balanced', 'push'].map(pm => `<button onclick="setRacePace('${car.driverId}', '${pm}')" class="py-1 rounded-lg text-[10px] font-bold border ${car.paceMode === pm ? 'bg-sky-600 border-sky-400 text-white' : 'bg-f1bg border-f1border text-slate-400'}">${pm === 'conserve' ? 'Conserva' : (pm === 'balanced' ? 'Bilanciato' : 'Attacco')}</button>`).join('')}

          <div class="bg-f1card border border-f1border rounded-2xl p-2.5 max-h-48 overflow-y-auto no-scrollbar space-y-1">
            ${ordered.map((c, idx) => {
              const comp = TYRE_COMPOUNDS[c.tyre] || TYRE_COMPOUNDS.M;
              const prev = idx > 0 ? ordered[idx - 1] : null;
              const gapLabel = idx === 0 ? 'LEADER' : `+${c.gapToLeader.toFixed(1)}s (+${Math.max(0.1, c.gapToLeader - (prev?.gapToLeader || 0)).toFixed(1)}s)`;
              return `
                <div class="flex items-center justify-between text-[11px] px-2 py-1 rounded-lg ${c.isUser ? 'bg-slate-800/90 font-bold text-white' : 'text-slate-200'}">

                  </div>
                  <span class="font-mono-num text-[10px] text-slate-300">${gapLabel}</span>
                </div>
              `;
            }).join('')}

        </div>
      `;
    }

    function finishRaceAndAwardPoints() {
      stopAllLoops();
      const r = gameState.weekend.race;
      const track = CALENDAR_2026[gameState.round - 1];
      const sponsor = getActiveSponsor();
      const ptsTable = [25, 18, 15, 12, 10, 8, 6, 4, 2, 1];
      const ordered = [...r.cars].sort((a, b) => a.pos - b.pos);

      let sponsorPayout = Number(sponsor.perRace || 0);
      const classification = ordered.map((c, idx) => {
        const pts = idx < ptsTable.length ? ptsTable[idx] : 0;
        const d = gameState.drivers.find(x => x.id === c.driverId);
        const tm = getTeam(c.teamId);
        d.points = (d.points || 0) + pts;
        tm.points = (tm.points || 0) + pts;
        if (idx === 0) { d.wins = (d.wins || 0) + 1; tm.wins = (tm.wins || 0) + 1; }
        if (idx < 3) { d.podiums = (d.podiums || 0) + 1; tm.podiums = (tm.podiums || 0) + 1; }

        if (c.isUser) {
          if (pts > 0) sponsorPayout += sponsor.pointsBonus * 2;
          if (idx < 3) sponsorPayout += sponsor.podiumBonus;
          if (idx === 0) sponsorPayout += sponsor.winBonus;
          adjustDriverMood(d.id, idx < 3 ? 5 : (idx < 10 ? 2 : -3), `Gara a ${track.name} chiusa in P${idx + 1}`);
        }
        return { driverId: c.driverId, pos: idx + 1, name: c.name, code: c.code, teamId: c.teamId, isUser: c.isUser, pitStops: c.pitStops, pts };
      });

      const uTeam = getUserTeam();
      uTeam.budget = Number((uTeam.budget + sponsorPayout).toFixed(1));
      gameState.completedRounds.push({ season: gameState.season, round: gameState.round, winnerCode: classification[0]?.code || '-' });
      gameState.weekend.results = classification;
      gameState.weekend.phase = 'summary';
      generatePostSessionPress('race', { classification });
      saveGame();
      renderApp();
    }

    function renderRaceSummaryView() {
      const res = gameState.weekend.results || [];
      const track = CALENDAR_2026[gameState.round - 1];
      return `
        <div class="p-4 space-y-3.5">
          <div class="bg-f1card border border-f1border rounded-2xl p-4">
            <span class="text-[10px] font-bold uppercase text-emerald-400">Post-Gara • Sponsor Pagato</span>
            <h2 class="text-lg font-extrabold text-white mt-0.5">${track.flag} Risultati GP ${track.name}</h2>
          </div>

          <div class="bg-f1card border border-f1border rounded-2xl p-3 max-h-64 overflow-y-auto no-scrollbar space-y-1">
            ${res.map(row => `
              <div class="flex items-center justify-between text-xs px-2 py-1.5 rounded-lg ${row.isUser ? 'bg-slate-800/90 font-bold text-white' : 'text-slate-200'}">
                <div class="flex items-center gap-2">
                  <span class="font-mono-num w-5 text-amber-300">${row.pos}</span>
                  <span class="w-2 h-2 rounded-full" style="background:${getTeam(row.teamId).color}"></span>

            ${gameState.round < 24 ? `PROSSIMO GP (${gameState.round + 1}/24) →` : (gameState.season < gameState.maxSeasons ? `CHIUDI ${gameState.season} & PASSA AL ${gameState.season + 1} →` : 'FINE CICLO 7 ANNI →')}
          </button>
        </div>
      `;
    }

    function advanceToNextRound() {
      const team = getUserTeam();
      if (gameState.round < 24) {
        gameState.round += 1;
        gameState.weekendStartDay = (gameState.careerDay || 1) + 7;
        gameState.weekend = initWeekendState(gameState.round, gameState.userTeamId, gameState.drivers);
        gameState.activeTab = 'hub';
        generatePaddockPressForRound(gameState.round);
        saveGame();
        renderApp();
        return;
      }

      if (gameState.season < gameState.maxSeasons) {
        gameState.season += 1;
        gameState.round = 1;
        gameState.careerDay = 1;
        gameState.weekendStartDay = 8;
        const sponsor = getActiveSponsor();
        gameState.teams.forEach(t => {
          t.points = 0;
          t.wins = 0;
          t.podiums = 0;
          if (t.id === gameState.userTeamId) t.budget = Number((t.budget + sponsor.upfront + 12.0).toFixed(1));
        });
        gameState.drivers.forEach(d => {
          d.age += 1;
          d.points = 0;
          d.wins = 0;
          d.podiums = 0;
          d.contract = Math.max(0, (d.contract || 1) - 1);
          const cap = d.potential ?? d.ovr;
          if (d.age <= 25 && d.ovr < cap) d.ovr = Math.min(cap, d.ovr + 1);
          else if (d.age >= 36 && d.ovr > 72) d.ovr = Math.max(72, d.ovr - 1);
        });
        gameState.weekend = initWeekendState(1, gameState.userTeamId, gameState.drivers);
        gameState.activeTab = 'hub';
        pushMediaQuote('Nuova Stagione', `Inizia la stagione ${gameState.season}! Contratti aggiornati e +€${sponsor.upfront}M sponsor.`);
        generatePaddockPressForRound(1);
        saveGame();
        renderApp();
        return;
      }

      if (confirm(`Hai completato il ciclo di ${BASE_CAREER_YEARS} stagioni (${team.name}, ${team.points} pt)! Vuoi prolungare la carriera di altri 3 anni?`)) {
        gameState.maxSeasons += 3;
        gameState.season += 1;
        gameState.round = 1;
        gameState.drivers.forEach(d => { d.age += 1; d.points = 0; d.contract = Math.max(1, d.contract); });
        gameState.teams.forEach(t => { t.points = 0; });
        gameState.weekend = initWeekendState(1, gameState.userTeamId, gameState.drivers);
        gameState.activeTab = 'hub';
        saveGame();
        renderApp();
      } else {
        resetCareer();
      }
    }

    function setGarageCarTab(carNum) {
      gameState.garageCarTab = carNum;
      saveGame();
      renderApp();
    }

    function assignGaragePartToCar(partId, carNum) {
      const team = getUserTeam();
      const parts = gameState.garageParts?.[team.id] || [];
      const part = parts.find(p => p.id === partId);
      if (!part) return;
      part.assignedCar = carNum;
      syncTeamStatsFromGarage(team.id);
      showToast(`${part.name} assegnato a Monoposto ${carNum}!`, 'info');
      saveGame();
      renderApp();
    }

    function boostSinglePart(partId) {
      const team = getUserTeam();
      const parts = gameState.garageParts?.[team.id] || [];
      const part = parts.find(p => p.id === partId);
      const cost = 3.0;
      if (!part) return;
      if (team.budget < cost) return showToast('Budget insufficiente (€3.0M).', 'danger');
      team.budget = Number((team.budget - cost).toFixed(1));
      part.perf += 45;
      part.rel = Math.max(55, Math.min(99, part.rel - 2));
      syncTeamStatsFromGarage(team.id);
      showToast(`${part.name} potenziato (-€3.0M)!`, 'success');
      saveGame();
      renderApp();
    }

    function buildNewGaragePart(slot) {
      const team = getUserTeam();
      const cost = 6.5;
      if (team.budget < cost) return showToast('Budget insufficiente per costruire nuova parte (€6.5M).', 'danger');
      team.budget = Number((team.budget - cost).toFixed(1));
      gameState.garageParts[team.id] = gameState.garageParts[team.id] || [];
      const count = gameState.garageParts[team.id].filter(p => p.slot === slot).length + 1;
      const slotLabel = slot === 'pu' ? 'PU' : (slot === 'chassis' ? 'Telaio' : 'Sterzo');
      const basePerf = Math.round(((team.aero + team.pu + team.chassis) / 3) * 40) + 60;
      gameState.garageParts[team.id].push({
        id: `${team.id}_${slot}_${Date.now().toString(36)}`,
        slot,
        name: `${team.short} ${slotLabel} Evo #${count}`,
        perf: basePerf,
        rel: 92,
        assignedCar: gameState.garageCarTab || 1
      });
      syncTeamStatsFromGarage(team.id);
      showToast(`Nuova parte ${slotLabel} costruita (-€6.5M)!`, 'success');
      saveGame();
      renderApp();
    }

    function requestUpgradeConfirm(area, tierKey) {
      const team = getUserTeam();
      const tier = RND_TIERS[tierKey];
      if (!team || !tier) return;
      if (team.budget < tier.cost) return showToast('Budget insufficiente!', 'danger');
      gameState.pendingUpgradeConfirm = {
        area, tierKey, label: tier.label, cost: tier.cost, days: tier.days, gain: tier.gain,
        refund50: Number((tier.cost * 0.5).toFixed(1))
      };
      saveGame();
      renderApp();
    }

    function confirmAndBuyUpgrade() {
      const p = gameState.pendingUpgradeConfirm;
      const team = getUserTeam();
      if (!p || !team || team.budget < p.cost) return;
      team.budget = Number((team.budget - p.cost).toFixed(1));
      gameState.pendingUpgrades.push({
        id: `upg_${Date.now()}`, area: p.area, tierLabel: p.label, cost: p.cost, daysLeft: p.days, gain: p.gain
      });
      gameState.pendingUpgradeConfirm = null;
      showToast(`Ordine ${p.label} avviato (${p.days} gg)!`, 'success');
      saveGame();
      renderApp();
    }

    function cancelPendingUpgradeWithRefund(id) {
      const team = getUserTeam();
      const idx = gameState.pendingUpgrades.findIndex(u => u.id === id);
      if (idx < 0 || !team) return;
      const refund = Number((gameState.pendingUpgrades[idx].cost * 0.5).toFixed(1));
      team.budget = Number((team.budget + refund).toFixed(1));
      gameState.pendingUpgrades.splice(idx, 1);
      showToast(`Annullato: rimborso 50% (+€${refund.toFixed(1)}M).`, 'info');
      saveGame();
      renderApp();
    }

    function renewDriverContract(driverId) {
      const team = getUserTeam();
      const drv = gameState.drivers.find(d => d.id === driverId && d.teamId === team.id);
      if (!drv) return;
      const fee = Number((drv.salary * 0.3).toFixed(1));
      if (team.budget < fee) return showToast('Budget insufficiente per il rinnovo.', 'danger');
      team.budget = Number((team.budget - fee).toFixed(1));
      drv.contract = (drv.contract || 1) + 2;
      adjustDriverMood(drv.id, 6, 'Contratto prolungato di 2 anni');
      showToast(`${drv.name} rinnovato (+2 anni, -€${fee}M)!`, 'success');
      saveGame();
      renderApp();
    }

    function signFreeAgent(agentId, replaceDriverId) {
      const team = getUserTeam();
      const agentIdx = (gameState.freeAgents || []).findIndex(a => a.id === agentId);
      const oldIdx = gameState.drivers.findIndex(d => d.id === replaceDriverId && d.teamId === team.id);
      if (agentIdx < 0 || oldIdx < 0) return;
      const agent = gameState.freeAgents[agentIdx];
      const oldDriver = gameState.drivers[oldIdx];
      const fee = Number((agent.salary * 0.4).toFixed(1));
      if (team.budget < fee) return showToast('Budget insufficiente!', 'danger');
      team.budget = Number((team.budget - fee).toFixed(1));
      gameState.freeAgents.splice(agentIdx, 1);
      gameState.drivers[oldIdx] = { ...agent, teamId: team.id, role: oldDriver.role || 'co_lead', points: 0, wins: 0, podiums: 0 };
      gameState.freeAgents.push({ ...oldDriver, teamId: null, role: 'co_lead' });
      showToast(`${agent.name} ingaggiato!`, 'success');
      saveGame();
      renderApp();
    }

                </div>
                <div class="grid grid-cols-2 gap-2">
                  ${uDrivers.map(ud => `<button onclick="signFreeAgent('${fa.id}', '${ud.id}')" class="py-1.5 px-2 rounded-xl bg-f1bg hover:bg-slate-800 border border-f1border text-[10px] font-bold">Sostituisci ${ud.code}</button>`).join('')}
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    function renderStandingsView() {
      const sortedDrivers = [...gameState.drivers].sort((a, b) => (b.points || 0) - (a.points || 0));
      const sortedTeams = [...gameState.teams].sort((a, b) => (b.points || 0) - (a.points || 0));

      return `
        <div class="p-4 space-y-4">
          <div class="bg-f1card border border-f1border rounded-2xl p-3.5 space-y-1.5">
            <h2 class="text-sm font-extrabold uppercase text-amber-300">Costruttori ${gameState.season}</h2>
            ${sortedTeams.map((t, idx) => `
              <div class="flex items-center justify-between text-xs py-1 px-2 rounded-lg ${t.id === gameState.userTeamId ? 'bg-slate-800/90 font-extrabold text-white' : 'text-slate-200'}">
                <div class="flex items-center gap-2"><span class="font-mono-num w-5 text-slate-400">${idx + 1}</span><span class="w-2.5 h-2.5 rounded-full" style="background:${t.color}"></span><span>${t.name}</span></div>
                <span class="font-mono-num font-bold text-emerald-400">${t.points || 0} pt</span>
              </div>
            `).join('')}
          </div>

          <div class="bg-f1card border border-f1border rounded-2xl p-3.5 space-y-1.5">
            <h2 class="text-sm font-extrabold uppercase text-sky-300">Piloti ${gameState.season}</h2>
            ${sortedDrivers.map((d, idx) => {
              const tm = getTeam(d.teamId);
              return `
                <div class="flex items-center justify-between text-xs py-1 px-2 rounded-lg ${d.teamId === gameState.userTeamId ? 'bg-slate-800/90 font-bold text-white' : 'text-slate-200'}">
                  <div class="flex items-center gap-2"><span class="font-mono-num w-5 text-slate-400">${idx + 1}</span><span class="w-2 h-2 rounded-full" style="background:${tm.color}"></span><span>${d.name}</span></div>
                  <span class="font-mono-num font-bold text-amber-300">${d.points || 0} pt</span>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function renderApp() {
      const root = document.getElementById('app');
      if (!root) return;

      if (!gameState) {
        const saved = loadGame();
        if (saved && saved.teams && saved.drivers) {
          gameState = saved;
        } else {
          root.innerHTML = renderTeamSelectScreen();
          return;
        }
      }

      let bodyHtml = '';
      if (gameState.activeTab === 'hub') bodyHtml = renderHubView();
      else if (gameState.activeTab === 'weekend') bodyHtml = renderWeekendView();
      else if (gameState.activeTab === 'calendar') bodyHtml = renderCalendarView();
      else if (gameState.activeTab === 'rnd') bodyHtml = renderRndView();
      else if (gameState.activeTab === 'market') bodyHtml = renderMarketView();
      else if (gameState.activeTab === 'standings') bodyHtml = renderStandingsView();
      else bodyHtml = renderHubView();

      root.innerHTML = `
        ${renderTopHeader()}
        <main class="flex-1 overflow-y-auto pb-4">${bodyHtml}</main>
        ${renderBottomNav()}
      `;

      if (gameState.activeTab === 'weekend' && gameState.weekend.phase === 'quali') {
        startQualiSmoothLoop();
      } else if (gameState.activeTab === 'weekend' && gameState.weekend.phase === 'race') {
        startRaceSmoothLoop();
      } else {
        stopAllLoops();
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderApp();
    });
  </script>
</body>
</html>
