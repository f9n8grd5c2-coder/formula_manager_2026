    function getEstimatedStints(track, rules) {
      const trackDegMult = track.tyreDeg === 3 ? 1.24 : track.tyreDeg === 2 ? 1.0 : 0.84;
      const ruleMult = (rules && rules.extraDegMultiplier) ? rules.extraDegMultiplier : 1.0;

      const calcRange = (compoundKey) => {
        const comp = TYRE_COMPOUNDS[compoundKey];
        const rate = comp.degRate * trackDegMult * ruleMult;
        const avgLaps = Math.max(5, Math.round(66 / rate));
        const minLaps = Math.max(4, Math.min(Math.max(6, track.laps - 4), avgLaps - 2));
        const maxLaps = Math.max(minLaps + 2, Math.min(Math.max(8, track.laps - 3), avgLaps + 2));
        return `${minLaps}-${maxLaps}`;
      };

      return { S: calcRange('S'), M: calcRange('M'), H: calcRange('H') };
    }

    function getMoodMeta(moodValue) {
      const val = Math.max(0, Math.min(100, Number(moodValue ?? 65)));
      if (val >= 82) return { label: 'Euforico', emoji: '🔥', color: 'text-emerald-400', bg: 'bg-emerald-950/50 border-emerald-500/40', paceDelta: -0.35, degMult: 0.90 };

      if (val >= 42) return { label: 'Neutro', emoji: '😐', color: 'text-slate-300', bg: 'bg-slate-800/70 border-slate-600/40', paceDelta: 0.0, degMult: 1.0 };

      return { label: 'Frustrato', emoji: '😡', color: 'text-red-400', bg: 'bg-red-950/60 border-red-500/45', paceDelta: 0.45, degMult: 1.15 };
    }

    function adjustDriverMood(driverId, delta, reasonText = '') {
      if (!gameState) return;
      const driver = gameState.drivers.find(d => d.id === driverId);
      if (!driver) return;
      const prev = driver.mood ?? 65;
      const next = Math.max(0, Math.min(100, Math.round(prev + delta)));
      driver.mood = next;
      const diff = next - prev;
      if (driver.teamId === gameState.userTeamId && Math.abs(diff) >= 2 && reasonText) {
        const sign = diff > 0 ? `+${diff}` : `${diff}`;
        gameState.newsFeed.unshift(`UMORE ${driver.code} (${sign} -> ${next}/100): ${reasonText}`);
      }
    }

    let lastAnimTimestamp = 0;

      if (!gameState) return;
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(gameState));
      } catch (e) {
        console.warn('Errore salvataggio locale:', e);
      }
    }

    function loadGame() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return null;
        return JSON.parse(raw);
      } catch (e) {
        return null;
      }
    }

    function resetCareer() {
      stopAllLoops();
      localStorage.removeItem(STORAGE_KEY);
      gameState = null;
      renderApp();
    }

    function stopAllLoops() {
      if (simTimer) {
        clearInterval(simTimer);
        simTimer = null;
      }
      if (animFrameId) {
        cancelAnimationFrame(animFrameId);
        animFrameId = null;
      }

      return getTeam(gameState.userTeamId);
    }

      return gameState.drivers.filter(d => d.teamId === gameState.userTeamId);

      const mins = Math.floor(sec / 60);
      const rem = (sec % 60).toFixed(3).padStart(6, '0');
      return `${mins}:${rem}`;
    }

    function initWeekendState(roundNum, userTeamId, drivers) {
      const track = CALENDAR_2026[roundNum - 1] || CALENDAR_2026[0];
      const userDrivers = drivers.filter(d => d.teamId === userTeamId);
      const d1 = userDrivers[0];
      const d2 = userDrivers[1];

      const targetD1 = {
        wing: track.downforce,
        susp: Math.max(1, Math.min(10, Math.round((track.downforce + (10 - track.topSpeed)) / 2))),
        brake: Math.max(1, Math.min(10, 11 - track.topSpeed))
      };
      const targetD2 = {
        wing: Math.max(1, Math.min(10, track.downforce - (track.downforce > 6 ? 1 : -1))),
        susp: Math.max(1, Math.min(10, targetD1.susp + (targetD1.susp < 8 ? 1 : -1))),
        brake: Math.max(1, Math.min(10, targetD1.brake))
      };

      const makeDriverSetup = (initWing = 5, initSusp = 5, initBrake = 5) => ({
        wing: initWing,
        susp: initSusp,
        brake: initBrake,
        confidence: 45,
        plan: 'race',
        fpRunsDone: 0,
        feedback: 'Nessun dato telemetrico ancora raccolto per questo pilota. Regola ala, sospensioni e bilanciamento freni ed esegui il run in pista per ottenere il feedback dedicato.'
      });

      return {
        round: roundNum,
        phase: 'fp',
        targets: { wing: targetD1.wing, susp: targetD1.susp, brake: targetD1.brake },
        driverTargets: { d1: targetD1, d2: targetD2 },
        fp: {
          session: 1,
          activeSlot: 'd1',
          d1: d1 ? makeDriverSetup(4, 5, 6) : null,
          d2: d2 ? makeDriverSetup(6, 5, 4) : null
        },
        quali: null,
        preRaceStrategy: null,
        race: null,
        results: null
      };
    }

    function getPitLaneCoord(car) {
      const m = car.pitAnim?.mode;
      const t = Math.min(1, car.pitAnim?.t || 0);
      if (m === 'pit_in') {
        return {
          x: 224 + (150 - 224) * t,
          y: 130 + (157 - 130) * t
        };
      }
      if (m === 'pit_out') {
        return {
          x: 150 + (76 - 150) * t,
          y: 157 + (130 - 157) * t
        };
      }
      return null;
    }

    function syncTrackCarPositions(svgElementId = 'fm-circuit-svg') {
      const svg = document.getElementById(svgElementId);
      const pathEl = svg?.querySelector('#active-track-path');
      if (!svg || !pathEl || typeof pathEl.getTotalLength !== 'function') return;

      const totalLen = pathEl.getTotalLength();
      if (!totalLen) return;

      const dots = svg.querySelectorAll('[data-track-progress]');
      dots.forEach(dot => {
        const mode = dot.getAttribute('data-pit-mode') || 'none';
        if (mode === 'pit_in' || mode === 'pit_out') return;
        const p = parseFloat(dot.getAttribute('data-track-progress') || '0');
        const normalized = ((p % 1) + 1) % 1;
        const pt = pathEl.getPointAtLength(normalized * totalLen);
        dot.setAttribute('cx', pt.x.toFixed(1));
        dot.setAttribute('cy', pt.y.toFixed(1));
      });
    }

                    <span class="text-slate-400">Bilanciamento Freni & Cambio (${activeDriver.code})</span>

                  </div>

                    const selected = fpData.plan === k;

                        <div class="text-[11px] leading-tight">${info.title}</div>
                        <div class="text-[9px] opacity-80 mt-0.5 leading-tight">${info.desc}</div>

          <div class="grid grid-cols-2 gap-2.5 pt-1">
            ${fp.session <= 3 ? `
              <button onclick="runPracticeSession()" class="py-3.5 px-3 rounded-xl bg-sky-600 hover:bg-sky-500 active:scale-[0.99] font-bold text-xs text-white shadow-lg">
                ESEGUI RUN FP${fp.session} (ENTRAMBI)
              </button>
            ` : `
              <div class="py-3.5 px-3 rounded-xl bg-slate-800 text-slate-400 text-center text-xs font-semibold">
                Prove Libere Complete
              </div>
            `}
            <button onclick="startQualifying()" class="py-3.5 px-3 rounded-xl bg-f1red hover:bg-red-600 active:scale-[0.99] font-bold text-xs text-white shadow-lg">
              VAI ALLE QUALIFICHE →
            </button>
          </div>
        </div>
      `;
    }

    function runPracticeSession() {
      const fp = gameState.weekend.fp;
      const targetsMap = gameState.weekend.driverTargets || {
        d1: gameState.weekend.targets,
        d2: gameState.weekend.targets
      };

      ['d1', 'd2'].forEach(slot => {
        const data = fp[slot];
        if (!data) return;
        const t = targetsMap[slot] || gameState.weekend.targets;
        const diffWing = data.wing - t.wing;
        const diffSusp = data.susp - t.susp;
        const diffBrake = data.brake - t.brake;
        const totalError = Math.abs(diffWing) + Math.abs(diffSusp) + Math.abs(diffBrake);

        const rawConf = Math.max(30, Math.min(100, 100 - totalError * 6));
        const improved = rawConf > data.confidence;
        data.confidence = Math.max(data.confidence, rawConf);
        data.fpRunsDone += 1;

        const userDrivers = getUserDrivers();
        const drvObj = slot === 'd1' ? userDrivers[0] : userDrivers[1];
        if (drvObj) {
          adjustDriverMood(drvObj.id, improved ? 2 : -1, improved ? 'Assetto migliorato nelle prove libere' : 'Assetto ancora da affinare in FP');
        }

        const sentences = [];
        if (diffWing === 0) {
          sentences.push('Il carico aerodinamico delle ali è centrato al millimetro: ottima velocità di punta e aderenza nei curvoni veloci.');
        } else if (diffWing < -2) {
          sentences.push('In curva veloce e nei cambi di direzione l’anteriore scivola troppo per mancanza di deportanza: serve aumentare decisamente l’incidenza delle ali.');
        } else if (diffWing < 0) {
          sentences.push('Manca ancora un pizzico di carico aerodinamico in percorrenza di curva: prova ad aggiungere 1 o 2 tacche di ala.');
        } else if (diffWing > 2) {
          sentences.push('Abbiamo troppa resistenza aerodinamica sui rettilinei e veniamo sverniciati in allungo: bisogna scaricare sensibilmente le ali.');
        } else {
          sentences.push('La macchina è ben piantata ma siamo leggermente lenti sul dritto: prova a ridurre di poco l’incidenza dell’ala.');
        }

        if (diffSusp === 0) {
          sentences.push('Le sospensioni assorbono perfettamente i cordoli garantendo trazione immediata in uscita.');
        } else if (diffSusp < 0) {
          sentences.push('L’assetto meccanico risulta troppo morbido e la vettura rolla nei cambi di direzione: irrigidisci un po’ le sospensioni per renderla più reattiva.');
        } else {
          sentences.push('Le sospensioni sono troppo rigide e la monoposto saltella sui cordoli perdendo trazione: prova ad ammorbidirle leggermente.');
        }

        if (diffBrake === 0) {
          sentences.push('Bilanciamento freni e rapporti del cambio sono impeccabili in ogni staccata.');
        } else if (diffBrake < 0) {
          sentences.push('In ingresso curva il posteriore tende a scappare in staccata: sposta il bilanciamento freni più in avanti (valore più alto).');
        } else {
          sentences.push('Tendo a bloccare l’anteriore nelle frenate più violente: arretra leggermente il bilanciamento freni (valore più basso).');
        }

        data.feedback = sentences.join(' ');
      });

      if (fp.session < 3) {
        fp.session += 1;
        showToast(`Run completato! Feedback separati aggiornati per FP${fp.session}.`, 'info');
      } else {
        fp.session = 4;
        showToast('Tutte le sessioni di Prove Libere completate!', 'success');
      }

      saveGame();
      renderApp();
    }

    function startQualifying() {
      stopAllLoops();
      const track = CALENDAR_2026[gameState.round - 1];
      const fp = gameState.weekend.fp;
      const userDrivers = getUserDrivers();
      const weather = Math.random() < track.rainChance * 0.55 ? 'wet' : 'dry';

      const entries = gameState.drivers.map(d => {
        const isUser = d.teamId === gameState.userTeamId;
        let confBonus = 0.65;
        let plan = 'race';
        if (isUser) {
          const slot = userDrivers[0]?.id === d.id ? fp.d1 : fp.d2;
          confBonus = (slot?.confidence || 50) / 100;
          plan = slot?.plan || 'race';
        }
        return {
          driverId: d.id,
          name: d.name,
          code: d.code,
          number: d.number,
          teamId: d.teamId,
          isUser,
          bestTime: 999,
          eliminated: false,
          eliminatedIn: null,
          status: 'BOX',
          runTimer: 0,
          progress: 0,
          selectedTyre: weather === 'wet' ? 'I' : 'S',
          confBonus,
          plan,
          aiRunsLeft: isUser ? 0 : 2
        };
      });

      gameState.weekend.phase = 'quali';
      gameState.weekend.quali = {
        roundName: 'Q1',
        cutoff: 16,
        timeLeft: 1080,
        speed: 1,
        weather,
        entries
      };

      saveGame();
      renderApp();
    }

    function setQualiSpeed(spd) {
      if (!gameState.weekend?.quali) return;
      gameState.weekend.quali.speed = spd;
      saveGame();
      renderApp();
    }

    function selectQualiTyre(driverId, tyreCode) {
      const q = gameState.weekend?.quali;
      if (!q) return;
      const entry = q.entries.find(e => e.driverId === driverId);
      if (!entry || entry.status !== 'BOX') return;
      entry.selectedTyre = tyreCode;
      saveGame();
      renderApp();
    }

    function sendDriverOutQuali(driverId) {
      const q = gameState.weekend?.quali;
      if (!q || q.timeLeft <= 60) return;
      const entry = q.entries.find(e => e.driverId === driverId);
      if (!entry || entry.eliminated || entry.status !== 'BOX') return;
      entry.status = 'OUT_LAP';
      entry.runTimer = 0;
      entry.progress = 0.02;
      showToast(`${entry.code} esce dai box con gomma ${TYRE_COMPOUNDS[entry.selectedTyre].name}!`, 'info');
      saveGame();
      renderApp();
    }

    function tickQualiSecond() {
      const q = gameState.weekend?.quali;
      if (!q || gameState.weekend.phase !== 'quali' || q.speed === 0) return;
      const track = CALENDAR_2026[gameState.round - 1];
      const step = q.speed * 4;
      q.timeLeft = Math.max(0, q.timeLeft - step);

      q.entries.forEach(entry => {
        if (entry.eliminated || entry.isUser) return;
        if (entry.status === 'BOX' && entry.aiRunsLeft > 0) {
          if ((q.timeLeft < 860 && entry.aiRunsLeft === 2) || (q.timeLeft < 340 && entry.aiRunsLeft === 1)) {
            if (Math.random() < 0.25) {
              entry.aiRunsLeft -= 1;
              entry.selectedTyre = q.weather === 'wet' ? 'I' : 'S';
              entry.status = 'OUT_LAP';
              entry.runTimer = 0;
            }
          }
        }
      });

      const activeCarsOnTrack = q.entries.filter(e => !e.eliminated && e.status !== 'BOX').length;

      q.entries.forEach(entry => {
        if (entry.eliminated || entry.status === 'BOX') return;
        entry.runTimer += step;

        if (entry.status === 'OUT_LAP') {
          entry.progress = Math.min(0.99, entry.runTimer / 85);
          if (entry.runTimer >= 85) {
            entry.status = 'HOT_LAP';
            entry.runTimer = 0;
            entry.progress = 0.01;
          }
        } else if (entry.status === 'HOT_LAP') {
          entry.progress = Math.min(0.99, entry.runTimer / track.baseLap);
          if (entry.runTimer >= track.baseLap) {
            const driver = gameState.drivers.find(d => d.id === entry.driverId);
            const team = getTeam(entry.teamId);
            const moodMeta = getMoodMeta(driver.mood ?? 65);
            const comp = TYRE_COMPOUNDS[entry.selectedTyre];
            const carPerf = (team.aero * 0.42 + team.pu * 0.35 + team.chassis * 0.23);
            const carDelta = (90 - carPerf) * 0.09;
            const driverDelta = (90 - driver.pace) * 0.06;
            const setupDelta = entry.isUser ? -(entry.confBonus * 0.40) - (entry.plan === 'quali' ? 0.28 : 0) : -0.25;
            const trackEvo = -((1080 - q.timeLeft) / 1080) * 0.45;
            const trafficPenalty = Math.max(0, (activeCarsOnTrack - 6) * 0.06);
            let weatherPenalty = 0;
            if (q.weather === 'wet' && comp.wet === 0) weatherPenalty = 8.5;
            if (q.weather === 'dry' && comp.wet > 0) weatherPenalty = 4.2;

            const lap = track.baseLap + carDelta + driverDelta + setupDelta + moodMeta.paceDelta + comp.paceBonus + trackEvo + trafficPenalty + weatherPenalty + (Math.random() - 0.5) * 0.28;
            if (lap < entry.bestTime) entry.bestTime = lap;

            entry.status = 'IN_LAP';
            entry.runTimer = 0;
            entry.progress = 0.01;
          }
        } else if (entry.status === 'IN_LAP') {
          entry.progress = Math.min(0.99, entry.runTimer / 80);
          if (entry.runTimer >= 80) {
            entry.status = 'BOX';
            entry.runTimer = 0;
            entry.progress = 0;
          }
        }
      });

      if (q.timeLeft <= 0) {
        q.speed = 0;
        const active = q.entries.filter(e => !e.eliminated).sort((a, b) => a.bestTime - b.bestTime);
        if (q.roundName === 'Q1') {
          active.slice(16).forEach(e => { e.eliminated = true; e.eliminatedIn = 'Q1'; e.status = 'BOX'; });
        } else if (q.roundName === 'Q2') {
          active.slice(10).forEach(e => { e.eliminated = true; e.eliminatedIn = 'Q2'; e.status = 'BOX'; });
        }
      }

      saveGame();
      renderApp();
    }

    function advanceQualiSession() {
      const q = gameState.weekend?.quali;
      if (!q) return;
      q.entries.forEach(e => { e.status = 'BOX'; e.runTimer = 0; e.progress = 0; });
      if (q.roundName === 'Q1') {
        q.roundName = 'Q2';
        q.cutoff = 10;
        q.timeLeft = 900;
        q.speed = 1;
        q.entries.filter(e => !e.eliminated).forEach(e => { e.bestTime = 999; e.aiRunsLeft = e.isUser ? 0 : 2; });
      } else if (q.roundName === 'Q2') {
        q.roundName = 'Q3';
        q.cutoff = 10;
        q.timeLeft = 720;
        q.speed = 1;
        q.entries.filter(e => !e.eliminated).forEach(e => { e.bestTime = 999; e.aiRunsLeft = e.isUser ? 0 : 2; });
      }
      saveGame();
      renderApp();
    }

              return `
                <div class="bg-f1card border border-f1border rounded-xl p-2.5 flex items-center justify-between gap-2">
                  <div>
                    <div class="text-xs font-extrabold text-white">${u.name} <span class="font-mono-num text-amber-300">(${formatLapTime(u.bestTime)})</span></div>

                  </div>

                    <div class="flex items-center gap-1.5">

          <div class="bg-f1card border border-f1border rounded-2xl p-2.5 max-h-48 overflow-y-auto no-scrollbar space-y-1">

                  <div class="flex items-center gap-2">

    function openPreRaceStrategy() {
      stopAllLoops();
      const q = gameState.weekend.quali;
      const track = CALENDAR_2026[gameState.round - 1];
      const active = q.entries.filter(e => !e.eliminated).sort((a, b) => a.bestTime - b.bestTime);
      const elimQ2 = q.entries.filter(e => e.eliminatedIn === 'Q2').sort((a, b) => a.bestTime - b.bestTime);
      const elimQ1 = q.entries.filter(e => e.eliminatedIn === 'Q1').sort((a, b) => a.bestTime - b.bestTime);
      const gridOrder = [...active, ...elimQ2, ...elimQ1];

      const makePlanForDriver = (driverId) => {
        const gridIdx = gridOrder.findIndex(e => e.driverId === driverId);
        const gridPos = gridIdx >= 0 ? gridIdx + 1 : 12;
        const stops = track.tyreDeg === 3 ? 2 : (track.laps >= 68 ? 2 : 1);
        const pit1 = Math.max(5, Math.min(track.laps - 8, Math.round(track.laps / (stops + 1))));
        const pit2 = Math.max(pit1 + 6, Math.min(track.laps - 4, Math.round((track.laps * 2) / (stops + 1))));
        const pit3 = Math.max(pit2 + 5, Math.min(track.laps - 2, Math.round((track.laps * 3) / (stops + 1))));
        return {
          driverId,
          gridPos,
          startTyre: track.tyreDeg === 3 ? 'M' : 'S',
          stopsCount: stops,
          pitLaps: [pit1, pit2, pit3],
          stintTyres: ['M', 'H', 'S', 'H'],
          initialPace: 'balanced'
        };
      };

      const userDrivers = getUserDrivers();
      gameState.weekend.preRaceStrategy = {
        d1: userDrivers[0] ? makePlanForDriver(userDrivers[0].id) : null,
        d2: userDrivers[1] ? makePlanForDriver(userDrivers[1].id) : null
      };
      gameState.weekend.phase = 'strategy';
      saveGame();
      renderApp();
    }

    function updateStrategyField(slot, field, val) {
      const strat = gameState.weekend.preRaceStrategy?.[slot];
      if (!strat) return;
      strat[field] = val;
      saveGame();
      renderApp();
    }

    function updateStrategyPitLap(slot, stopIdx, val) {
      const strat = gameState.weekend.preRaceStrategy?.[slot];
      if (!strat) return;
      const track = CALENDAR_2026[gameState.round - 1];
      strat.pitLaps[stopIdx] = Math.max(2, Math.min(track.laps - 1, parseInt(val, 10) || 10));
      saveGame();
      renderApp();
    }

    function updateStrategyStintTyre(slot, stintIdx, tyreCode) {
      const strat = gameState.weekend.preRaceStrategy?.[slot];
      if (!strat) return;
      strat.stintTyres[stintIdx] = tyreCode;
      saveGame();
      renderApp();
    }

      if (!stratObj) {
        openPreRaceStrategy();
        return '';
      }
      const track = CALENDAR_2026[gameState.round - 1];
      const stints = getEstimatedStints(track, gameState.rules);
      const userDrivers = getUserDrivers();

      const renderDriverStrategyCard = (driver, slot) => {
        const plan = stratObj[slot];
        if (!driver || !plan) return '';
        const mood = getMoodMeta(driver.mood);

        return `
          <div class="bg-f1card border border-f1border rounded-2xl p-3.5 space-y-3">
            <div class="flex items-center justify-between">
              <div>
                <span class="text-xs font-mono-num font-extrabold text-amber-300">P${plan.gridPos}</span>

              </span>
            </div>

            <div class="grid grid-cols-2 gap-2.5">
              <div>
                <div class="text-[10px] font-bold uppercase text-slate-400 mb-1">Gomma Partenza</div>
                <div class="grid grid-cols-3 gap-1">
                  ${['S', 'M', 'H'].map(tKey => {
                    const tc = TYRE_COMPOUNDS[tKey];
                    const active = plan.startTyre === tKey;
                    return `
                      <button onclick="updateStrategyField('${slot}', 'startTyre', '${tKey}')" class="py-1.5 rounded-lg text-xs font-extrabold border transition ${active ? 'border-white scale-[1.03]' : 'border-transparent opacity-60'}" style="background-color:${tc.color}; color:${tc.text}">
                        ${tc.short}
                      </button>
                    `;
                  }).join('')}
                </div>
              </div>

              <div>
                <div class="text-[10px] font-bold uppercase text-slate-400 mb-1">Soste Previste</div>
                <div class="grid grid-cols-3 gap-1">
                  ${[1, 2, 3].map(cnt => `
                    <button onclick="updateStrategyField('${slot}', 'stopsCount', ${cnt})" class="py-1.5 rounded-lg text-xs font-mono-num font-bold border ${plan.stopsCount === cnt ? 'bg-f1red border-f1red text-white' : 'bg-f1bg border-f1border text-slate-400'}">
                      ${cnt} Pit
                    </button>
                  `).join('')}
                </div>
              </div>
            </div>

            <div class="space-y-2 pt-1 border-t border-f1border/60">
              ${Array.from({ length: plan.stopsCount }).map((_, idx) => {
                const chosenTyre = plan.stintTyres[idx] || 'H';
                return `
                  <div class="bg-f1bg rounded-xl p-2.5 border border-f1border/70 flex items-center justify-between gap-2">
                    <div class="flex items-center gap-2">
                      <span class="text-[10px] font-bold text-amber-300">PIT ${idx + 1}</span>
                      <span class="text-[10px] text-slate-400">Giro</span>
                      <input type="number" min="2" max="${track.laps - 1}" value="${plan.pitLaps[idx] || 15}" onchange="updateStrategyPitLap('${slot}', ${idx}, this.value)" class="w-14 bg-f1card border border-f1border rounded-lg px-2 py-1 text-xs font-mono-num font-bold text-white text-center"/>
                    </div>
                    <div class="flex items-center gap-1">
                      ${['S', 'M', 'H'].map(tKey => {
                        const tc = TYRE_COMPOUNDS[tKey];
                        const sel = chosenTyre === tKey;
                        return `
                          <button onclick="updateStrategyStintTyre('${slot}', ${idx}, '${tKey}')" class="w-6 h-6 rounded-full text-[10px] font-extrabold border-2 transition ${sel ? 'scale-110 border-white' : 'border-transparent opacity-55'}" style="background-color:${tc.color}; color:${tc.text}">
                            ${tc.short}
                          </button>
                        `;
                      }).join('')}
                    </div>
                  </div>
                `;
              }).join('')}
            </div>

            <div>
              <div class="text-[10px] font-bold uppercase text-slate-400 mb-1">Ritmo Iniziale al Via</div>
              <div class="grid grid-cols-3 gap-1.5">
                ${[
                  { id: 'conserve', lbl: '🐢 Conservativo' },
                  { id: 'balanced', lbl: '⚖️ Bilanciato' },
                  { id: 'push', lbl: '🔥 Attacco' }
                ].map(p => `
                  <button onclick="updateStrategyField('${slot}', 'initialPace', '${p.id}')" class="py-1.5 rounded-lg text-[11px] font-bold border ${plan.initialPace === p.id ? 'bg-sky-600 border-sky-400 text-white' : 'bg-f1bg border-f1border text-slate-400'}">
                    ${p.lbl}
                  </button>
                `).join('')}
              </div>
            </div>
          </div>
        `;
      };

      return `
        <div class="p-4 space-y-3.5">
          <div class="bg-f1card border border-f1border rounded-2xl p-3.5">
            <span class="text-[10px] font-bold uppercase tracking-wider text-f1red">Briefing Pre-Gara</span>
            <h2 class="text-lg font-extrabold text-white mt-0.5">Strategia ${track.flag} ${track.name} (${track.laps} Giri)</h2>
            <div class="flex items-center justify-between text-[11px] font-mono-num mt-2 bg-f1bg p-2 rounded-xl border border-f1border/70">
              <span class="text-slate-400">Durata Stint:</span>
              <span class="text-red-400 font-bold">S: ${stints.S}g</span>
              <span class="text-amber-300 font-bold">M: ${stints.M}g</span>
              <span class="text-slate-200 font-bold">H: ${stints.H}g</span>
            </div>
          </div>

          ${renderDriverStrategyCard(userDrivers[0], 'd1')}
          ${renderDriverStrategyCard(userDrivers[1], 'd2')}

          <button onclick="launchRaceFromStrategy()" class="w-full py-4 rounded-xl bg-f1red hover:bg-red-600 font-extrabold text-sm text-white shadow-lg shadow-f1red/25">
            🚦 CONFERMA STRATEGIA & SPEGNI I SEMAFORI →
          </button>
        </div>
      `;
    }
    function launchRaceFromStrategy() {
      stopAllLoops();
      const q = gameState.weekend.quali;
      const strat = gameState.weekend.preRaceStrategy;
      const track = CALENDAR_2026[gameState.round - 1];
      const active = q.entries.filter(e => !e.eliminated).sort((a, b) => a.bestTime - b.bestTime);
      const elimQ2 = q.entries.filter(e => e.eliminatedIn === 'Q2').sort((a, b) => a.bestTime - b.bestTime);
      const elimQ1 = q.entries.filter(e => e.eliminatedIn === 'Q1').sort((a, b) => a.bestTime - b.bestTime);
      const gridOrder = [...active, ...elimQ2, ...elimQ1];

      const userDrivers = getUserDrivers();
      const startWeather = Math.random() < track.rainChance * 0.45 ? 'light_rain' : 'dry';

      const cars = gridOrder.map((entry, idx) => {
        const driver = gameState.drivers.find(d => d.id === entry.driverId);
        const team = getTeam(entry.teamId);
        let planForCar = null;
        if (entry.isUser) {
          planForCar = userDrivers[0]?.id === driver.id ? strat?.d1 : strat?.d2;
        }

        const startComp = entry.isUser && planForCar
          ? (startWeather === 'dry' ? planForCar.startTyre : 'I')
          : (startWeather === 'dry' ? (idx < 10 && Math.random() > 0.45 ? 'S' : 'M') : 'I');

        const firstPlannedTyre = planForCar?.stintTyres?.[0] || 'H';

        return {
          driverId: driver.id,
          name: driver.name,
          code: driver.code,
          number: driver.number,
          teamId: team.id,
          color: team.color,
          isUser: entry.isUser,
          pos: idx + 1,
          totalTime: idx * 0.45,
          lastLapTime: track.baseLap,
          tyre: startComp,
          tyreWear: 0,
          fuel: 100,
          paceMode: planForCar?.initialPace || 'balanced',
          ersMode: 'balanced',
          teamOrder: 'free',
          pitRequested: false,
          nextTyre: firstPlannedTyre,
          plannedStops: planForCar ? {
            stopsCount: planForCar.stopsCount,
            pitLaps: [...planForCar.pitLaps],
            stintTyres: [...planForCar.stintTyres],
            currentStopIdx: 0
          } : null,
          pitsDone: 0,
          dnf: false,
          dnfReason: '',
          confBonus: entry.confBonus || 0.6,
          plan: entry.plan || 'race',
          progressOnLap: Math.max(0.01, (0.99 - idx * 0.018 + 1) % 1),
          pitAnim: { mode: 'none', t: 0 }
        };
      });

      gameState.weekend.phase = 'race';
      gameState.weekend.race = {
        lap: 1,
        totalLaps: track.laps,
        speed: 1,
        lapFraction: 0,
        teamOrders: {
          noOvertake: false,
          swapDone: false
        },
        weather: startWeather,
        trackWater: startWeather === 'dry' ? 0 : 40,
        safetyCar: 'NONE',
        scLapsRemaining: 0,
        fastestLap: { driverId: null, code: '-', time: 999 },
        radioLog: [`Giro 1/${track.laps}: Semaforo verde a ${track.name}! Strategia impostata dal muretto.`],
        cars
      };

      saveGame();
      renderApp();
    }

    function setRaceSpeed(spd) {
      if (!gameState.weekend?.race) return;
      gameState.weekend.race.speed = spd;
      saveGame();
      renderApp();
    }

    function setCarMode(driverId, modeType, val) {
      const car = gameState.weekend?.race?.cars.find(c => c.driverId === driverId);
      if (!car) return;
      if (modeType === 'pace') car.paceMode = val;
      if (modeType === 'ers') car.ersMode = val;
      saveGame();
      renderApp();
    }

    function requestPitStop(driverId, tyreCode) {
      const car = gameState.weekend?.race?.cars.find(c => c.driverId === driverId);
      if (!car || car.dnf) return;
      car.pitRequested = true;
      car.nextTyre = tyreCode;
      showToast(`Box confermato per ${car.code}: gomme ${TYRE_COMPOUNDS[tyreCode].name}!`, 'info');
      saveGame();
      renderApp();
    }

    function toggleNoOvertakeOrder() {
      const race = gameState.weekend?.race;
      if (!race) return;
      race.teamOrders = race.teamOrders || { noOvertake: false, swapDone: false };
      race.teamOrders.noOvertake = !race.teamOrders.noOvertake;
      const stateLabel = race.teamOrders.noOvertake ? 'ATTIVO: Evita sorpassi tra compagni' : 'DISATTIVATO: Piloti liberi di lottare';
      race.radioLog.unshift(`Giro ${race.lap}: 📋 Ordine di scuderia — ${stateLabel}`);
      showToast(stateLabel, 'info');
      saveGame();
      renderApp();
    }

    function executeTeammateSwap() {
      const race = gameState.weekend?.race;
      if (!race) return;
      const uCars = race.cars.filter(c => c.isUser && !c.dnf).sort((a, b) => a.pos - b.pos);
      if (uCars.length < 2) {
        showToast('Servono entrambi i piloti in gara per lo scambio.', 'danger');
        return;
      }
      const ahead = uCars[0];
      const behind = uCars[1];
      const gap = behind.totalTime - ahead.totalTime;
      if (gap > 6.5) {
        showToast(`Troppo distacco (${gap.toFixed(1)}s) per uno scambio pulito in sicurezza.`, 'danger');
        return;
      }
      const tempTime = ahead.totalTime;
      ahead.totalTime = behind.totalTime + 0.25;
      behind.totalTime = tempTime;

      const activeCars = race.cars.filter(c => !c.dnf).sort((a, b) => a.totalTime - b.totalTime);
      const dnfCars = race.cars.filter(c => c.dnf);
      race.cars = [...activeCars, ...dnfCars];
      race.cars.forEach((c, i) => { c.pos = i + 1; });

      race.radioLog.unshift(`Giro ${race.lap}: 🔄 Scambio posizioni completato: ${behind.code} passa davanti a ${ahead.code}.`);
      showToast(`Scambio effettuato: ${behind.code} ora davanti a ${ahead.code}!`, 'success');
      saveGame();
      renderApp();
    }

    function quickStrategySwitch(driverId, tyreCode, paceMode) {
      const car = gameState.weekend?.race?.cars.find(c => c.driverId === driverId);
      if (!car || car.dnf) return;
      car.paceMode = paceMode;
      car.pitRequested = true;
      car.nextTyre = tyreCode;
      race = gameState.weekend.race;
      race.radioLog.unshift(`Giro ${race.lap}: ⚡ Cambio strategia ${car.code} -> Gomme ${TYRE_COMPOUNDS[tyreCode].name} e ritmo ${paceMode === 'push' ? 'Attacco' : paceMode === 'conserve' ? 'Conservativo' : 'Bilanciato'}.`);
      showToast(`Strategia aggiornata per ${car.code}!`, 'info');
      saveGame();
      renderApp();
    }

    function simulateRaceLap() {
      const race = gameState.weekend?.race;
      if (!race || gameState.weekend.phase !== 'race') return;
      if (race.lap > race.totalLaps) {
        finishRaceAndSeasonCheck();
        return;
      }

      const track = CALENDAR_2026[gameState.round - 1];
      const degMult = gameState.rules?.extraDegMultiplier || 1.0;

      if (Math.random() < track.rainChance * 0.06) {
        race.weather = race.weather === 'dry' ? 'light_rain' : (Math.random() > 0.5 ? 'heavy_rain' : 'dry');
        race.radioLog.unshift(`Giro ${race.lap}: 🌧️ Cambio meteo sul circuito: ${race.weather === 'dry' ? 'Asciutto' : race.weather === 'light_rain' ? 'Pioggia leggera' : 'Pioggia forte'}!`);
      }
      if (race.weather === 'heavy_rain') race.trackWater = Math.min(100, race.trackWater + 18);
      else if (race.weather === 'light_rain') race.trackWater = Math.min(75, race.trackWater + 9);
      else race.trackWater = Math.max(0, race.trackWater - 11);

      if (race.scLapsRemaining > 0) {
        race.scLapsRemaining -= 1;
        if (race.scLapsRemaining === 0) {
          race.safetyCar = 'NONE';
          race.radioLog.unshift(`Giro ${race.lap}: 🟢 Bandiera verde! Riprende la gara piena.`);
        }
      } else if (race.lap > 2 && race.lap < race.totalLaps - 2 && Math.random() < 0.045) {
        race.safetyCar = Math.random() < 0.55 ? 'VSC' : 'SC';
        race.scLapsRemaining = race.safetyCar === 'SC' ? 3 : 2;
        race.radioLog.unshift(`Giro ${race.lap}: ⚠️ ${race.safetyCar === 'SC' ? 'SAFETY CAR IN PISTA' : 'VIRTUAL SAFETY CAR'}!`);
      }

      let doubleStackCounter = 0;

      race.cars.forEach(car => {
        if (car.dnf) return;

        const driver = gameState.drivers.find(d => d.id === car.driverId);
        const team = getTeam(car.teamId);
        const moodMeta = getMoodMeta(driver.mood ?? 65);

        const dnfProb = ((100 - team.rel) * 0.00025) + (car.paceMode === 'push' ? 0.0012 : 0.0003);
        if (Math.random() < dnfProb) {
          car.dnf = true;
          car.dnfReason = Math.random() > 0.5 ? 'Problema Power Unit' : 'Guasto Idraulico';
          race.radioLog.unshift(`Giro ${race.lap}: ❌ Ritiro per ${car.code} (${car.dnfReason})`);
          if (car.isUser) {
            adjustDriverMood(driver.id, -12, `Ritiro in gara a ${track.name}`);
            showToast(`RITIRO! ${car.name} fuori gara (${car.dnfReason})!`, 'danger');
          }
          return;
        }

        if (car.isUser && car.plannedStops && !car.pitRequested) {
          const ps = car.plannedStops;
          const targetLap = ps.pitLaps[ps.currentStopIdx];
          if (targetLap && race.lap === targetLap && race.lap < race.totalLaps) {
            car.pitRequested = true;
            car.nextTyre = ps.stintTyres[ps.currentStopIdx] || 'H';
          }
        }

        if (!car.isUser) {
          if (race.trackWater >= 65 && car.tyre !== 'W') {
            car.pitRequested = true;
            car.nextTyre = 'W';
          } else if (race.trackWater >= 25 && race.trackWater < 65 && car.tyre !== 'I') {
            car.pitRequested = true;
            car.nextTyre = 'I';
          } else if (race.trackWater < 20 && (car.tyre === 'I' || car.tyre === 'W')) {
            car.pitRequested = true;
            car.nextTyre = 'M';
          } else if (car.tyreWear >= 64 && race.lap < race.totalLaps - 2) {
            car.pitRequested = true;
            car.nextTyre = (race.totalLaps - race.lap) <= 13 ? 'S' : 'H';
          }
          car.paceMode = car.tyreWear > 52 ? 'conserve' : 'balanced';
        }

        let pitLoss = 0;
        if (car.pitRequested) {
          pitLoss = race.safetyCar !== 'NONE' ? 12.5 : 21.5;
          if (car.isUser) {
            doubleStackCounter += 1;
            if (doubleStackCounter > 1) pitLoss += 4.5;
            if (car.plannedStops) car.plannedStops.currentStopIdx += 1;
          }
          car.tyre = car.nextTyre;
          car.tyreWear = 0;
          car.pitsDone += 1;
          car.pitRequested = false;
          car.pitAnim = { mode: 'pit_in', t: 0 };

          if (car.isUser) {
            race.radioLog.unshift(`Giro ${race.lap}: 🔧 Pit Stop ${car.code} -> Gomme ${TYRE_COMPOUNDS[car.tyre].name}`);
          }
        }

        const comp = TYRE_COMPOUNDS[car.tyre];
        const carPerf = (team.aero * 0.4 + team.pu * 0.35 + team.chassis * 0.25);
        const carDelta = (90 - carPerf) * 0.085;
        const driverDelta = (90 - driver.ovr) * 0.055;
        const setupDelta = car.isUser ? -(car.confBonus * 0.35) - (car.plan === 'race' ? 0.22 : 0) : -0.22;

        const paceMod = car.paceMode === 'push' ? -0.50 : car.paceMode === 'conserve' ? 0.45 : 0;
        const ersMod = car.ersMode === 'overtake' ? -0.35 : car.ersMode === 'harvest' ? 0.30 : 0;

        const baseWearLoss = car.tyreWear * 0.032;
        const cliffPenalty = car.tyreWear > 55 ? Math.pow((car.tyreWear - 55) * 0.20, 1.55) : 0;
        const wearPenalty = baseWearLoss + cliffPenalty;

        let weatherMismatch = 0;
        if (race.trackWater >= 65 && comp.wet < 2) weatherMismatch = comp.wet === 1 ? 3.5 : 14.0;
        else if (race.trackWater >= 25 && race.trackWater < 65 && comp.wet === 0) weatherMismatch = 7.5;
        else if (race.trackWater < 15 && comp.wet > 0) weatherMismatch = comp.wet === 2 ? 9.0 : 4.5;

        const fuelSaving = -((100 - car.fuel) * 0.015);
        const variance = (Math.random() - 0.5) * 0.35;

        let lapTime = track.baseLap + carDelta + driverDelta + setupDelta + moodMeta.paceDelta + paceMod + ersMod + comp.paceBonus + wearPenalty + weatherMismatch + fuelSaving + pitLoss + variance;

        if (race.safetyCar === 'SC') lapTime = track.baseLap * 1.32 + pitLoss;
        else if (race.safetyCar === 'VSC') lapTime = track.baseLap * 1.18 + pitLoss;

        car.lastLapTime = lapTime;
        car.totalTime += lapTime;

        if (race.safetyCar === 'NONE' && pitLoss === 0 && lapTime < race.fastestLap.time) {
          race.fastestLap = { driverId: car.driverId, code: car.code, time: lapTime };
        }

        const trackDegMult = track.tyreDeg === 3 ? 1.24 : track.tyreDeg === 2 ? 1.0 : 0.84;
        const paceWearMult = car.paceMode === 'push' ? 1.35 : car.paceMode === 'conserve' ? 0.72 : 1.0;
        const planWearMult = (car.isUser && car.plan === 'tyre') ? 0.86 : 1.0;
        const scWearMult = race.safetyCar !== 'NONE' ? 0.35 : 1.0;

        car.tyreWear = Math.min(100, car.tyreWear + (comp.degRate * trackDegMult * paceWearMult * planWearMult * scWearMult * degMult * moodMeta.degMult));
        car.fuel = Math.max(0, car.fuel - (100 / race.totalLaps) * (car.paceMode === 'push' ? 1.04 : 0.98));
      });

      const activeCars = race.cars.filter(c => !c.dnf).sort((a, b) => a.totalTime - b.totalTime);

      // Apply "No Overtake" team order between user teammates if close
      if (race.teamOrders?.noOvertake) {
        const uActive = activeCars.filter(c => c.isUser);
        if (uActive.length === 2) {
          const [firstU, secondU] = uActive;
          const idx1 = activeCars.findIndex(c => c.driverId === firstU.driverId);
          const idx2 = activeCars.findIndex(c => c.driverId === secondU.driverId);
          if (idx2 < idx1 && secondU.totalTime < firstU.totalTime) {
            secondU.totalTime = Number((firstU.totalTime + 0.35).toFixed(2));
            activeCars.sort((a, b) => a.totalTime - b.totalTime);
          }
        }
      }

      const dnfCars = race.cars.filter(c => c.dnf);
      const ordered = [...activeCars, ...dnfCars];
      ordered.forEach((c, idx) => { c.pos = idx + 1; });
      race.cars = ordered;

      race.lap += 1;
      race.lapFraction = 0;

      if (race.lap > race.totalLaps) {
        finishRaceAndSeasonCheck();
        return;
      }

      saveGame();
      renderApp();
    }

    function finishRaceAndSeasonCheck() {
      stopAllLoops();
      const race = gameState.weekend.race;
      const track = CALENDAR_2026[gameState.round - 1];
      const top12 = Boolean(gameState.rules?.pointsTop12);
      const ptsTable = top12
        ? [25, 18, 15, 12, 10, 8, 6, 4, 3, 2, 1, 0.5]
        : [25, 18, 15, 12, 10, 8, 6, 4, 2, 1];

      race.cars.forEach((car, idx) => {
        if (car.dnf) return;
        const pts = ptsTable[idx] || 0;
        const flPt = (race.fastestLap.driverId === car.driverId && idx < 10) ? 1 : 0;
        const totalGain = pts + flPt;

        const drv = gameState.drivers.find(d => d.id === car.driverId);
        const tm = getTeam(car.teamId);
        if (drv) {
          drv.points = Number((drv.points + totalGain).toFixed(1));
          if (idx === 0) drv.wins += 1;
          if (idx < 3) drv.podiums += 1;
        }
        if (tm) {
          tm.points = Number((tm.points + totalGain).toFixed(1));
          if (idx === 0) tm.wins += 1;
          if (idx < 3) tm.podiums += 1;
        }
      });

      const userCars = race.cars.filter(c => c.isUser && !c.dnf);
      const bestUserPos = userCars.length ? Math.min(...userCars.map(c => c.pos)) : 20;
      const raceRevenue = Number((4.5 + Math.max(0, (15 - bestUserPos) * 0.45)).toFixed(1));
      const userTeam = getUserTeam();
      userTeam.budget = Number((userTeam.budget + raceRevenue).toFixed(1));

      const finishedUserCars = race.cars.filter(c => c.isUser);
      if (finishedUserCars.length === 2) {
        const [a, b] = finishedUserCars;
        if (!a.dnf && !b.dnf) {
          const winnerCar = a.pos < b.pos ? a : b;
          const loserCar = a.pos < b.pos ? b : a;
          adjustDriverMood(winnerCar.driverId, 3, `Ha chiuso davanti al compagno di squadra a ${track.name}`);
          adjustDriverMood(loserCar.driverId, -2, `Ha chiuso dietro al compagno di squadra a ${track.name}`);
        }
      }
      finishedUserCars.forEach(c => {
        if (c.dnf) return;
        if (c.pos <= userTeam.objective) {
          adjustDriverMood(c.driverId, 6, `Risultato in linea o sopra l'obiettivo (P${c.pos})`);
        } else if (c.pos > userTeam.objective + 4) {
          adjustDriverMood(c.driverId, -5, `Gara sottotono rispetto alle attese (P${c.pos})`);
        }
      });

      gameState.pendingUpgrades.forEach(up => {
        up.racesLeft -= 1;
        if (up.racesLeft <= 0 && up.teamId === gameState.userTeamId) {
          const t = getTeam(up.teamId);
          t[up.area] = Math.min(99, Number((t[up.area] + up.gain).toFixed(1)));
          gameState.newsFeed.unshift(`R&D COMPLETATO: ${up.label} (+${up.gain}) ora montato sulla monoposto!`);
        }
      });
      gameState.pendingUpgrades = gameState.pendingUpgrades.filter(u => u.racesLeft > 0);

      if (gameState.round >= 6 && Math.random() < 0.25) {
        const otherTeams = gameState.teams.filter(t => t.id !== gameState.userTeamId && t.prestige >= userTeam.prestige - 8);
        if (otherTeams.length > 0 && gameState.jobOffers.length < 2) {
          const offeredTeam = otherTeams[Math.floor(Math.random() * otherTeams.length)];
          gameState.jobOffers.push({
            id: `${offeredTeam.id}_${gameState.round}`,
            teamId: offeredTeam.id,
            teamName: offeredTeam.name,
            budgetOffer: Number((offeredTeam.budget + 6).toFixed(1)),
            note: `Offerta formale come Team Principal per puntare alla Top ${offeredTeam.objective}.`
          });
          gameState.newsFeed.unshift(`📩 OFFERTA TEAM PRINCIPAL: ${offeredTeam.name} ha contattato il tuo management!`);
        }
      }

      gameState.weekend.phase = 'summary';
      gameState.weekend.results = {
        trackName: track.name,
        raceRevenue,
        classification: race.cars.map(c => ({ ...c }))
      };

      saveGame();
      renderApp();
    }

    function computeCarVisualProgress(car, leaderCar, baseLap, lapFraction) {
      if (!leaderCar || car.driverId === leaderCar.driverId) {
        return (((car.progressOnLap || 0) + lapFraction) % 1 + 1) % 1;
      }
      const gapSeconds = Math.max(0, (car.totalTime || 0) - (leaderCar.totalTime || 0));
      // Visual gap scaling so 1s-12s gaps are clearly spaced around the circuit
      const visualLapLag = Math.min(0.62, (gapSeconds / Math.max(60, baseLap)) * 2.4);
      const leaderProg = (((leaderCar.progressOnLap || 0) + lapFraction) % 1 + 1) % 1;
      return (((leaderProg - visualLapLag) % 1) + 1) % 1;
    }

    function renderRaceView() {
      const race = gameState.weekend.race;
      const track = CALENDAR_2026[gameState.round - 1];
      const stints = getEstimatedStints(track, gameState.rules);
      const leaderCar = race.cars.find(c => !c.dnf) || race.cars[0];

    function startRaceAnimationLoop() {
      stopAllLoops();
      const race = gameState?.weekend?.race;
      if (!race || gameState.weekend.phase !== 'race') return;

      const track = CALENDAR_2026[gameState.round - 1];
      syncTrackCarPositions('fm-race-svg');
      lastAnimTimestamp = performance.now();

      const animateStep = (now) => {
        const dt = Math.min(0.1, (now - lastAnimTimestamp) / 1000);
        lastAnimTimestamp = now;

        const r = gameState?.weekend?.race;
        if (r && r.speed > 0 && gameState.weekend.phase === 'race') {
          const leaderCar = r.cars.find(c => !c.dnf) || r.cars[0];
          r.lapFraction = Math.min(0.99, (r.lapFraction || 0) + dt * r.speed * 0.24);

          r.cars.forEach(c => {
            if (c.dnf) return;
            c.progressOnLap = ((c.progressOnLap || 0) + dt * r.speed * 0.24) % 1;
            if (c.pitAnim && c.pitAnim.mode !== 'none') {
              c.pitAnim.t += dt * r.speed * 0.85;
              if (c.pitAnim.mode === 'pit_in' && c.pitAnim.t >= 1) {
                c.pitAnim = { mode: 'pit_out', t: 0 };
              } else if (c.pitAnim.mode === 'pit_out' && c.pitAnim.t >= 1) {
                c.pitAnim = { mode: 'none', t: 0 };
              }
            }

            const dot = document.getElementById(`car-dot-${c.driverId}`);
            if (dot) {
              const pitCoord = getPitLaneCoord(c);
              if (pitCoord) {
                dot.setAttribute('data-pit-mode', c.pitAnim.mode);
                dot.setAttribute('cx', pitCoord.x.toFixed(1));
                dot.setAttribute('cy', pitCoord.y.toFixed(1));
              } else {
                dot.setAttribute('data-pit-mode', 'none');
                const visProg = computeCarVisualProgress(c, leaderCar, track.baseLap, r.lapFraction || 0);
                dot.setAttribute('data-track-progress', visProg.toFixed(4));
              }
            }
          });

          syncTrackCarPositions('fm-race-svg');
        }
        animFrameId = requestAnimationFrame(animateStep);
      };
      animFrameId = requestAnimationFrame(animateStep);

      const intervalMs = race.speed > 0 ? Math.max(450, 2600 / race.speed) : 2600;
      simTimer = setInterval(() => {
        if (gameState?.weekend?.race && gameState.weekend.race.speed > 0 && gameState.weekend.phase === 'race') {
          simulateRaceLap();
        }
      }, intervalMs);
    }

    function signFreeAgent(agentId, slotIdx) {
      const team = getUserTeam();
      const userDrivers = getUserDrivers();
      const targetDriver = userDrivers[slotIdx];
      const agentIdx = gameState.freeAgents.findIndex(f => f.id === agentId);
      const agent = gameState.freeAgents[agentIdx];
      if (!targetDriver || !agent) return;
      if (team.budget < agent.salary) {
        showToast('Budget insufficiente per l’ingaggio!', 'danger');
        return;
      }

      team.budget = Number((team.budget - agent.salary).toFixed(1));
      gameState.freeAgents.splice(agentIdx, 1);
      gameState.freeAgents.push({ ...targetDriver, teamId: null });

      const idxInDrivers = gameState.drivers.findIndex(d => d.id === targetDriver.id);
      if (idxInDrivers >= 0) {
        gameState.drivers[idxInDrivers] = {
          ...agent,
          teamId: team.id,
          points: targetDriver.points || 0,
          wins: targetDriver.wins || 0,
          podiums: targetDriver.podiums || 0
        };
      }

      gameState.weekend = initWeekendState(gameState.round, gameState.userTeamId, gameState.drivers);
      gameState.newsFeed.unshift(`🤝 MERCATO: ${team.name} ingaggia ${agent.name} al posto di ${targetDriver.name}.`);
      showToast(`${agent.name} è ora un pilota di ${team.name}!`, 'success');
      saveGame();
      renderApp();
    }

      const offerIdx = gameState.jobOffers.findIndex(o => o.id === offerId);

      const offer = gameState.jobOffers[offerIdx];
      gameState.jobOffers.splice(offerIdx, 1);
      gameState.userTeamId = offer.teamId;
      const newTeam = getUserTeam();
      newTeam.budget = Math.max(newTeam.budget, offer.budgetOffer);
      gameState.weekend = initWeekendState(gameState.round, gameState.userTeamId, gameState.drivers);
      gameState.newsFeed.unshift(`🔄 CAMBIO PANCHINA: Ora sei il Team Principal di ${newTeam.name}!`);
      showToast(`Benvenuto in ${newTeam.name}!`, 'success');
      saveGame();
      renderApp();
    }

                const mood = getMoodMeta(d.mood);
                return `
                  <div class="flex items-center justify-between text-xs px-2.5 py-2 rounded-xl ${d.teamId === gameState.userTeamId ? 'bg-slate-800 font-bold text-white' : 'bg-f1bg text-slate-300'}">
                    <div class="flex items-center gap-2">
                      <span class="font-mono-num w-5 text-slate-400">${i + 1}</span>
                      <span class="w-2 h-2 rounded-full" style="background:${tm.color}"></span>
                      <span>${d.name}</span>
                      <span class="text-[10px]">${mood.emoji}</span>
                    </div>
                    <span class="font-mono-num font-bold">${d.points} pt</span>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function openEndOfSeasonHub() {
      stopAllLoops();
      gameState.activeTab = 'offseason';
      saveGame();
      renderApp();
    }

    function applyEndOfSeasonVote(voteChoice) {
      const sortedTeams = [...gameState.teams].sort((a, b) => b.points - a.points);
      const prizeMoney = [26.0, 22.0, 19.0, 16.5, 14.0, 11.5, 9.5, 8.0, 6.5, 5.5, 4.5];

      sortedTeams.forEach((t, idx) => {
        t.budget = Number((t.budget + (prizeMoney[idx] || 4.5)).toFixed(1));
        const rankDelta = (t.objective - (idx + 1));
        ['aero', 'pu', 'chassis'].forEach(k => {
          t[k] = Math.max(70, Math.min(99, Number((t[k] + rankDelta * 0.45).toFixed(1))));
        });
        t.points = 0;
        t.wins = 0;
        t.podiums = 0;
      });

      const sortedDrivers = [...gameState.drivers].sort((a, b) => b.points - a.points);
      sortedDrivers.forEach((d, idx) => {
        if (idx < 5) d.ovr = Math.min(99, d.ovr + 1);
        else if (idx > 17) d.ovr = Math.max(72, d.ovr - 1);
        d.mood = Math.max(35, Math.min(85, Math.round(((d.mood ?? 65) + 65) / 2)));
        d.points = 0;
        d.wins = 0;
        d.podiums = 0;
        d.contract = Math.max(1, d.contract - 1);
      });

      if (voteChoice === 'deg') {
        gameState.rules.extraDegMultiplier = Number(((gameState.rules.extraDegMultiplier || 1.0) * 1.15).toFixed(2));
        gameState.newsFeed.unshift('🗳️ FIA APPROVATA: Mescola gomme resa ancora più aggressiva (+15% degrado).');
      } else if (voteChoice === 'points12') {
        gameState.rules.pointsTop12 = true;
        gameState.newsFeed.unshift('🗳️ FIA APPROVATA: Punti assegnati fino alla 12ª posizione.');
      } else {
        gameState.budgetCap = Number((gameState.budgetCap + 10).toFixed(1));
        gameState.teams.forEach(t => { t.budget = Number((t.budget + 8.0).toFixed(1)); });
        gameState.newsFeed.unshift('🗳️ FIA APPROVATA: Budget Cap aumentato di +€10M per la nuova stagione.');
      }

      gameState.season += 1;
      gameState.round = 1;
      gameState.activeTab = 'hub';
      gameState.weekend = initWeekendState(1, gameState.userTeamId, gameState.drivers);
      saveGame();
      renderApp();
    }

    function renderOffseasonView() {
      const sortedTeams = [...gameState.teams].sort((a, b) => b.points - a.points);
      return `
        <div class="p-4 space-y-4">
          <div class="bg-f1card border border-f1border rounded-2xl p-4">
            <span class="text-[10px] font-bold uppercase text-amber-300">Chiusura Stagione ${gameState.season}</span>
            <h2 class="text-lg font-extrabold text-white">Votazione Regolamento FIA & Reset</h2>
            <p class="text-xs text-slate-400 mt-1">Campione Costruttori: <strong class="text-white">${sortedTeams[0]?.name}</strong>. Scegli la modifica regolamentare per la stagione ${gameState.season + 1}:</p>
          </div>

          <button onclick="applyEndOfSeasonVote('deg')" class="w-full text-left bg-f1card hover:bg-slate-800 border border-f1border rounded-2xl p-3.5 space-y-1">
            <div class="text-sm font-extrabold text-amber-300">1. Gomme a Maggiore Degrado (+15%)</div>
            <div class="text-xs text-slate-400">Stint ancora più corti e strategie pit stop più decisive.</div>
          </button>

          <button onclick="applyEndOfSeasonVote('points12')" class="w-full text-left bg-f1card hover:bg-slate-800 border border-f1border rounded-2xl p-3.5 space-y-1">
            <div class="text-sm font-extrabold text-sky-300">2. Punti fino alla 12ª Posizione</div>
            <div class="text-xs text-slate-400">Premia maggiormente le lotte a centro gruppo.</div>
          </button>

          <button onclick="applyEndOfSeasonVote('cap')" class="w-full text-left bg-f1card hover:bg-slate-800 border border-f1border rounded-2xl p-3.5 space-y-1">
            <div class="text-sm font-extrabold text-emerald-400">3. Aumento Budget Cap (+€10M)</div>
            <div class="text-xs text-slate-400">Più margine di manovra economico per lo sviluppo R&D.</div>
          </button>
        </div>
      `;
    }

    function renderApp() {
      const root = document.getElementById('app');
      if (!root) return;

      if (!gameState) {
        stopAllLoops();
        root.innerHTML = renderTeamSelectScreen();
        return;
      }

      let mainHtml = '';
      if (gameState.activeTab === 'hub') mainHtml = renderHubView();
      else if (gameState.activeTab === 'weekend') mainHtml = renderWeekendView();
      else if (gameState.activeTab === 'rnd') mainHtml = renderRndView();
      else if (gameState.activeTab === 'market') mainHtml = renderMarketView();
      else if (gameState.activeTab === 'standings') mainHtml = renderStandingsView();
      else if (gameState.activeTab === 'offseason') mainHtml = renderOffseasonView();

      root.innerHTML = `
        ${renderTopHeader()}
        <main class="flex-1 overflow-y-auto pb-6">${mainHtml}</main>
        ${gameState.activeTab !== 'offseason' ? renderBottomNav() : ''}
      `;

      if (gameState.activeTab === 'weekend' && gameState.weekend.phase === 'quali') {
        stopAllLoops();
        syncTrackCarPositions('fm-quali-svg');
        const q = gameState.weekend.quali;
        const ms = q.speed > 0 ? Math.max(250, 1000 / q.speed) : 1000;
        simTimer = setInterval(() => {
          if (gameState?.weekend?.quali && gameState.weekend.quali.speed > 0 && gameState.weekend.phase === 'quali') {
            tickQualiSecond();
          }
        }, ms);
      } else if (gameState.activeTab === 'weekend' && gameState.weekend.phase === 'race') {
        startRaceAnimationLoop();
      } else {
        stopAllLoops();
      }
    }

    (function init() {
      const saved = loadGame();
      if (saved && saved.teams && saved.drivers) {
        gameState = saved;
      }
      renderApp();
    })();
  </script>
</body>
</html>
