      const track = CALENDAR_2026[gameState.round - 1];
      const stratObj = gameState.weekend.preRaceStrategy || {};
      const userDrivers = getUserDrivers();
      const d1 = userDrivers[0];
      const d2 = userDrivers[1];

      const q = gameState.weekend.quali;
      let gridOrder = [];
      if (q && q.entries) {
        const active = q.entries.filter(e => !e.eliminated).sort((a, b) => a.bestTime - b.bestTime);
        const elimQ2 = q.entries.filter(e => e.eliminatedIn === 'Q2').sort((a, b) => a.bestTime - b.bestTime);
        const elimQ1 = q.entries.filter(e => e.eliminatedIn === 'Q1').sort((a, b) => a.bestTime - b.bestTime);
        gridOrder = [...active, ...elimQ2, ...elimQ1];
      } else {
        gridOrder = [...gameState.drivers].sort((a, b) => b.ovr - a.ovr).map(d => ({ driverId: d.id }));
      }

      const weather = q?.weather || (Math.random() < track.rainChance ? 'wet' : 'dry');

      const cars = gridOrder.map((gEntry, idx) => {
        const driver = gameState.drivers.find(d => d.id === gEntry.driverId) || gameState.drivers[idx];
        const team = getTeam(driver.teamId);
        const isUser = team.id === gameState.userTeamId;
        const gridPos = idx + 1;

        let tyre = weather === 'wet' ? 'I' : (track.tyreDeg === 3 ? 'M' : 'S');
        let paceMode = 'balanced';
        let plannedStops = track.tyreDeg === 3 ? 2 : 1;
        let pitLaps = [Math.round(track.laps * 0.42), Math.round(track.laps * 0.74), Math.round(track.laps * 0.90)];
        let stintTyres = ['H', 'M', 'S', 'H'];

        if (isUser) {
          const sObj = d1?.id === driver.id ? stratObj.d1 : (d2?.id === driver.id ? stratObj.d2 : null);
          if (sObj) {
            if (weather !== 'wet') tyre = sObj.startTyre || tyre;
            paceMode = sObj.initialPace || 'balanced';
            plannedStops = sObj.stopsCount ?? plannedStops;
            pitLaps = [...(sObj.pitLaps || pitLaps)];
            stintTyres = [...(sObj.stintTyres || stintTyres)];
          }
        } else {
          if (weather !== 'wet') {
            tyre = idx < 10 ? 'S' : (track.tyreDeg === 3 ? 'M' : 'H');
          }
          if (driver.trait === 'attacker') paceMode = 'push';
          else if (driver.trait === 'tactician' || driver.trait === 'team_player') paceMode = 'conserve';
        }

        const initialGap = Number((idx * 0.45).toFixed(2));
        return {
          driverId: driver.id,
          name: driver.name,
          code: driver.code,
          number: driver.number,
          teamId: team.id,
          isUser,
          gridPos,
          pos: gridPos,
          lap: 1,
          progress: 0,
          visualProgress: 0,
          totalRaceTime: initialGap,
          gapToLeader: initialGap,
          lastLapTime: 0,
          bestLapTime: 999,
          tyre,
          tyreWear: 0,
          paceMode,
          plannedStops,
          pitLaps,
          stintTyres,
          pitStops: 0,
          pitAnim: null,
          retired: false
        };
      });

      gameState.weekend.day = 'sunday';
      gameState.weekend.phase = 'race';
      gameState.weekend.liveDraft = null;
      gameState.weekend.race = {
        lap: 1,
        totalLaps: track.laps,
        weather,
        safetyCar: 'none',
        speed: 1,
        fastestLap: { driverId: null, code: '-', time: 999 },
        cars,
        logs: [
          `Semafori spenti a ${track.name} (${track.laps} giri)! Meteo: ${weather === 'wet' ? 'Bagnato' : 'Asciutto'}.`,
          `Strategia pre-gara salvata e attiva: premi STRATEGIA per mettere in pausa e ispezionare/modificare il piano.`
        ]
      };

      saveGame();
      renderApp();
    }

    function setRaceSpeed(spd) {
      const r = gameState.weekend?.race;
      if (!r) return;
      r.speed = spd;
      if (spd === 0) stopAllLoops();
      else startRaceSmoothLoop();
      saveGame();
      renderApp();
    }

    function setRacePace(driverId, mode) {
      const r = gameState.weekend?.race;
      if (!r) return;
      const car = r.cars.find(c => c.driverId === driverId && !c.retired);
      if (!car) return;
      car.paceMode = mode;
      saveGame();
      renderApp();
    }

    function computeVisualRaceProgresses(cars) {
      const active = cars.filter(c => !c.retired).sort((a, b) => a.pos - b.pos);
      if (!active.length) return new Map();
      const leader = active[0];
      const map = new Map();

      let prevVis = leader.progress || 0;
      map.set(leader.driverId, prevVis);

      for (let i = 1; i < active.length; i++) {
        const cur = active[i];
        const gapSec = Math.max(0, (cur.gapToLeader || 0) - (leader.gapToLeader || 0));
        const rawVis = (leader.progress || 0) - (gapSec * 0.011);
        const minSeparation = 0.016;
        const clampedVis = Math.min(rawVis, prevVis - minSeparation);
        map.set(cur.driverId, clampedVis);
        prevVis = clampedVis;
      }
      return map;
    }

    function simulateRaceLapStep() {
      const r = gameState.weekend?.race;
      if (!r || gameState.weekend.phase !== 'race') return;
      const track = CALENDAR_2026[gameState.round - 1];
      const degMult = (gameState.rules && gameState.rules.extraDegMultiplier) ? gameState.rules.extraDegMultiplier : 1.0;

      if (r.safetyCar === 'none' && Math.random() < 0.045) {
        r.safetyCar = Math.random() < 0.55 ? 'VSC' : 'SC';
        r.logs.unshift(`G${r.lap} • ${r.safetyCar === 'SC' ? 'SAFETY CAR in pista!' : 'VIRTUAL SAFETY CAR!'}`);
      } else if (r.safetyCar !== 'none' && Math.random() < 0.34) {
        r.logs.unshift(`G${r.lap} • Bandiera verde, ${r.safetyCar} rientrato.`);
        r.safetyCar = 'none';
      }

      if (track.rainChance > 0 && Math.random() < track.rainChance * 0.14) {
        r.weather = r.weather === 'wet' ? 'dry' : 'wet';
        r.logs.unshift(`G${r.lap} • Cambio meteo: pista ora ${r.weather === 'wet' ? 'BAGNATA' : 'ASCIUTTA'}!`);
      }

      const activeCars = r.cars.filter(c => !c.retired);

      activeCars.forEach(car => {
        const driver = gameState.drivers.find(d => d.id === car.driverId);
        const team = getTeam(car.teamId);
        const moodMeta = getMoodMeta(driver.mood ?? 65);
        const comp = TYRE_COMPOUNDS[car.tyre] || TYRE_COMPOUNDS.M;

        const relPerf = team.rel;
        const paceFactor = car.paceMode === 'push' ? 1.25 : (car.paceMode === 'conserve' ? 0.78 : 1.0);
        const relPenalty = (100 - relPerf) * 0.0007 * paceFactor;
        if (car.lap > 2 && Math.random() < 0.004 + relPenalty) {
          car.retired = true;
          r.logs.unshift(`G${r.lap} • RITIRO per ${car.name} (${team.name})!`);
          return;
        }

        const carPerf = (team.aero * 0.40 + team.pu * 0.36 + team.chassis * 0.24);
        const carDelta = (90 - carPerf) * 0.075;
        const driverDelta = (90 - (driver.pace * 0.6 + driver.cons * 0.4)) * 0.055;
        const roleBonus = driver.role === 'lead' ? -0.08 : (driver.role === 'support' ? 0.06 : 0);
        const paceDelta = car.paceMode === 'push' ? -0.35 : (car.paceMode === 'conserve' ? 0.32 : 0);
        const wearPenalty = Math.max(0, (car.tyreWear - 45) * 0.022);

        let weatherPenalty = 0;
        if (r.weather === 'wet' && comp.wet === 0) weatherPenalty = driver.trait === 'wet_ace' ? 5.8 : 8.2;
        if (r.weather === 'dry' && comp.wet > 0) weatherPenalty = 4.0;

        let scMult = 1.0;
        if (r.safetyCar === 'SC') scMult = 1.32;
        else if (r.safetyCar === 'VSC') scMult = 1.16;

        const rawLapTime = (track.baseLap + carDelta + driverDelta + roleBonus + paceDelta + moodMeta.paceDelta + comp.paceBonus + wearPenalty + weatherPenalty + (Math.random() - 0.5) * 0.45) * scMult;
        const lapTime = Math.max(55, Number(rawLapTime.toFixed(3)));
        car.lastLapTime = lapTime;
        if (lapTime < car.bestLapTime) car.bestLapTime = lapTime;
        if (r.safetyCar === 'none' && lapTime < r.fastestLap.time) {
          r.fastestLap = { driverId: car.driverId, code: car.code, time: lapTime };
        }

        car.totalRaceTime = Number((car.totalRaceTime + lapTime).toFixed(3));
        car.lap += 1;

        const traitDegMod = driver.trait === 'attacker' ? 1.12 : (driver.trait === 'tactician' ? 0.90 : 1.0);
        const tyreSkillMod = Math.max(0.75, 1.15 - ((driver.tyreMgmt ?? 82) - 70) * 0.008);
        const trackDegMult = track.tyreDeg === 3 ? 1.24 : (track.tyreDeg === 2 ? 1.0 : 0.84);
        const wearGain = comp.degRate * trackDegMult * degMult * paceFactor * moodMeta.degMult * traitDegMod * tyreSkillMod * (r.safetyCar !== 'none' ? 0.45 : 1.0);
        car.tyreWear = Math.min(100, Number((car.tyreWear + wearGain).toFixed(1)));

        const wantsPitNow = car.pitAnim?.mode === 'pit_in';
        const hasScheduledStop = (car.pitStops || 0) < (car.plannedStops || 0);
        const scheduledLap = car.pitLaps?.[car.pitStops || 0] || 999;
        const dueByPlan = hasScheduledStop && car.lap >= scheduledLap;
        const emergencyWear = !car.isUser && car.tyreWear >= 82 && car.lap < r.totalLaps - 2;
        const emergencyWeather = !car.isUser && ((r.weather === 'wet' && comp.wet === 0) || (r.weather === 'dry' && comp.wet > 0)) && car.lap < r.totalLaps - 1;

        if ((wantsPitNow || dueByPlan || emergencyWear || emergencyWeather) && car.lap < r.totalLaps) {
          car.pitStops = (car.pitStops || 0) + 1;
          car.totalRaceTime = Number((car.totalRaceTime + (r.safetyCar === 'SC' ? 14.5 : 21.5)).toFixed(3));
          car.tyreWear = 0;

          let nextTyre = car.pitAnim?.targetTyre || car.stintTyres?.[car.pitStops - 1] || 'H';
          if (!car.pitAnim?.targetTyre) {
            if (r.weather === 'wet') nextTyre = 'I';
            else if (!car.isUser) {
              const remLaps = r.totalLaps - car.lap;
              nextTyre = remLaps > 22 ? 'H' : (remLaps > 11 ? 'M' : 'S');
            }
          }
          car.tyre = nextTyre;
          car.pitAnim = { mode: 'pit_out', t: 0 };
          r.logs.unshift(`G${car.lap} • Pit #${car.pitStops} per ${car.code} -> gomme ${TYRE_COMPOUNDS[nextTyre].name} (${dueByPlan ? 'da piano' : 'box'}).`);
        }
      });

      const stillRunning = r.cars.filter(c => !c.retired).sort((a, b) => {
        if (b.lap !== a.lap) return b.lap - a.lap;
        return a.totalRaceTime - b.totalRaceTime;
      });
      const leaderTime = stillRunning[0]?.totalRaceTime || 0;
      stillRunning.forEach((c, i) => {
        c.pos = i + 1;
        c.gapToLeader = Number(Math.max(0, c.totalRaceTime - leaderTime).toFixed(1));
      });

      const currentMinLap = Math.min(...stillRunning.map(c => c.lap));
      r.lap = Math.min(r.totalLaps, currentMinLap);

      if (currentMinLap > r.totalLaps) {
        finishRaceAndAwardPoints();
      }
    }

    function startRaceSmoothLoop() {
      stopAllLoops();
      const r = gameState?.weekend?.race;
      if (!r || gameState.weekend.phase !== 'race' || r.speed === 0) return;

      lastAnimTimestamp = performance.now();
      const animateRace = (now) => {
        const dt = Math.min(0.1, (now - lastAnimTimestamp) / 1000);
        lastAnimTimestamp = now;

        const curR = gameState?.weekend?.race;
        if (curR && curR.speed > 0 && gameState.weekend.phase === 'race') {
          const lapAdv = dt * curR.speed * 0.22;
          let completedLapTriggered = false;

          curR.cars.forEach(c => {
            if (c.retired) return;
            c.progress = (c.progress || 0) + lapAdv;
            if (c.pitAnim) {
              c.pitAnim.t = Math.min(1, (c.pitAnim.t || 0) + dt * curR.speed * 0.75);
              if (c.pitAnim.t >= 1 && c.pitAnim.mode === 'pit_out') {
                c.pitAnim = null;
              }
            }
            if (c.progress >= 1) {
              c.progress -= 1;
              if (c.isUser || c.pos <= 3) completedLapTriggered = true;
            }
          });

          const visMap = computeVisualRaceProgresses(curR.cars);
          curR.cars.forEach(c => {
            if (c.retired) return;
            const vp = visMap.get(c.driverId) ?? c.progress;
            c.visualProgress = vp;

            const pitCoords = getPitLaneCoord(c);
            const dot = document.getElementById(`race-dot-${c.driverId}`);
            if (dot) {
              if (pitCoords) {
                dot.setAttribute('data-pit-mode', c.pitAnim.mode);
                dot.setAttribute('cx', pitCoords.x.toFixed(1));
                dot.setAttribute('cy', pitCoords.y.toFixed(1));
              } else {
                dot.setAttribute('data-pit-mode', 'none');
                dot.setAttribute('data-track-progress', vp.toFixed(4));
              }
            }
          });
          syncTrackCarPositions('fm-race-svg');

          if (completedLapTriggered) {
            simulateRaceLapStep();
            saveGame();
            renderApp();
            return;
          }
        }
        animFrameId = requestAnimationFrame(animateRace);
      };
      animFrameId = requestAnimationFrame(animateRace);
    }

    function renderRaceView() {
      const r = gameState.weekend.race;
      const track = CALENDAR_2026[gameState.round - 1];
      const ordered = [...r.cars].sort((a, b) => {
        if (a.retired && !b.retired) return 1;
        if (!a.retired && b.retired) return -1;
        return a.pos - b.pos;
      });
      const userCars = r.cars.filter(c => c.isUser).sort((a, b) => a.gridPos - b.gridPos);
      const visMap = computeVisualRaceProgresses(r.cars);

      const dotsHtml = r.cars.filter(c => !c.retired).map(c => {
        const t = getTeam(c.teamId);
        const vp = visMap.get(c.driverId) ?? c.progress ?? 0;
        const pitCoords = getPitLaneCoord(c);
        const cx = pitCoords ? pitCoords.x.toFixed(1) : '150';
        const cy = pitCoords ? pitCoords.y.toFixed(1) : '130';
        const pitMode = pitCoords ? c.pitAnim.mode : 'none';
        return `<circle id="race-dot-${c.driverId}" cx="${cx}" cy="${cy}" r="${c.isUser ? 5.2 : 3.6}" fill="${t.color}" stroke="${c.isUser ? '#ffffff' : '#0b0e14'}" stroke-width="1.3" data-pit-mode="${pitMode}" data-track-progress="${vp.toFixed(4)}"/>`;
      }).join('');

      return `
        <div class="p-4 space-y-3">
          <div class="bg-f1card border border-f1border rounded-2xl p-3 flex items-center justify-between gap-2">
            <div>
              <span class="text-[10px] font-bold uppercase text-f1red">${track.flag} ${track.name} • Giro ${Math.min(r.lap, r.totalLaps)}/${r.totalLaps}</span>
              <div class="text-xs font-bold text-white mt-0.5">
                ${r.weather === 'wet' ? 'Bagnato' : 'Asciutto'}
                ${r.safetyCar !== 'none' ? `<span class="ml-1 px-1.5 py-0.5 rounded bg-amber-500 text-black text-[10px] font-black">${r.safetyCar}</span>` : ''}
              </div>
              <div class="text-[10px] text-slate-400 font-mono-num">Giro veloce: ${r.fastestLap.code} (${formatLapTime(r.fastestLap.time)})</div>
            </div>
            <div class="flex items-center gap-1">
              <button onclick="openLiveRaceStrategyScreen()" class="px-2.5 py-1.5 rounded-lg bg-amber-500 hover:bg-amber-400 text-black text-[10px] font-black">
                📋 STRATEGIA
              </button>
              ${[0, 1, 2, 4].map(s => `
                <button onclick="setRaceSpeed(${s})" class="px-2 py-1.5 rounded-lg text-[10px] font-mono-num font-bold ${r.speed === s ? 'bg-f1red text-white' : 'bg-f1bg text-slate-400 border border-f1border'}">
                  ${s === 0 ? '⏸' : s + 'x'}
                </button>
              `).join('')}
            </div>
          </div>

          ${buildCircuitSvgMarkup(track, dotsHtml, 'h-36', 'fm-race-svg')}

          <div class="space-y-2">
            ${userCars.map(car => {
              const comp = TYRE_COMPOUNDS[car.tyre] || TYRE_COMPOUNDS.M;
              const remStops = Math.max(0, (car.plannedStops || 0) - (car.pitStops || 0));
              const nextPitLap = remStops > 0 ? (car.pitLaps?.[car.pitStops || 0] || '-') : 'Fine';
              const nextTyre = remStops > 0 ? (car.stintTyres?.[car.pitStops || 0] || '-') : '-';
              return `
                <div class="bg-f1card border border-f1border rounded-xl p-2.5 space-y-2">
                  <div class="flex items-center justify-between">
                    <div>
                      <span class="text-xs font-mono-num font-black text-amber-300">${car.retired ? 'RIT' : 'P' + car.pos}</span>
                      <span class="text-xs font-extrabold text-white ml-1">${car.name}</span>
                      <span class="text-[10px] text-slate-400 font-mono-num ml-1">(${car.pitStops}/${car.plannedStops} pit • prox G${nextPitLap}->${nextTyre})</span>
                    </div>
                    <span class="px-2 py-0.5 rounded text-[10px] font-extrabold font-mono-num" style="background:${comp.color}; color:${comp.text}">
                      ${comp.short} ${Math.round(car.tyreWear)}%
                    </span>
                  </div>
                  ${!car.retired ? `
                    <div class="grid grid-cols-3 gap-1">
                      ${[
                        { id: 'conserve', lbl: 'Conserva' },
                        { id: 'balanced', lbl: 'Bilanciato' },
                        { id: 'push', lbl: 'Attacco' }
                      ].map(pm => `
                        <button onclick="setRacePace('${car.driverId}', '${pm.id}')" class="py-1 rounded-lg text-[10px] font-bold border ${car.paceMode === pm.id ? 'bg-sky-600 border-sky-400 text-white' : 'bg-f1bg border-f1border text-slate-400'}">
                          ${pm.lbl}
                        </button>
                      `).join('')}
                    </div>
                  ` : ''}
                </div>
              `;
            }).join('')}
          </div>

          <div class="bg-f1card border border-f1border rounded-2xl p-2.5 max-h-52 overflow-y-auto no-scrollbar space-y-1">
            ${ordered.map((c, idx) => {
              const comp = TYRE_COMPOUNDS[c.tyre] || TYRE_COMPOUNDS.M;
              const prevCar = idx > 0 ? ordered[idx - 1] : null;
              const intervalText = c.retired
                ? 'RIT'
                : (idx === 0 ? 'LEADER' : `+${c.gapToLeader.toFixed(1)}s (+${Math.max(0.1, c.gapToLeader - (prevCar?.gapToLeader || 0)).toFixed(1)}s)`);
              return `
                <div class="flex items-center justify-between text-[11px] px-2 py-1 rounded-lg ${c.isUser ? 'bg-slate-800/90 font-bold text-white' : 'text-slate-200'}">
                  <div class="flex items-center gap-1.5 min-w-0">
                    <span class="font-mono-num w-4 text-slate-400">${c.retired ? 'R' : idx + 1}</span>
                    <span class="w-2 h-2 rounded-full shrink-0" style="background:${getTeam(c.teamId).color}"></span>
                    <span class="font-bold">${c.code}</span>
                    <span class="px-1 rounded text-[9px] font-extrabold" style="background:${comp.color}; color:${comp.text}">${comp.short}</span>
                  </div>
                  <span class="font-mono-num text-[10px] text-slate-300">${intervalText}</span>
                </div>
              `;
            }).join('')}
          </div>

          <div class="bg-f1card border border-f1border rounded-2xl p-2.5 max-h-24 overflow-y-auto no-scrollbar space-y-1">
            ${r.logs.slice(0, 6).map(line => `<div class="text-[11px] text-slate-300">${line}</div>`).join('')}
          </div>
        </div>
      `;
    }

    function finishRaceAndAwardPoints() {
      stopAllLoops();
      const r = gameState.weekend.race;
      const track = CALENDAR_2026[gameState.round - 1];
      const ptsTable = gameState.rules?.pointsTop12
        ? [25, 18, 15, 12, 10, 8, 6, 5, 4, 3, 2, 1]
        : [25, 18, 15, 12, 10, 8, 6, 4, 2, 1];

      const ordered = [...r.cars].sort((a, b) => {
        if (a.retired && !b.retired) return 1;
        if (!a.retired && b.retired) return -1;
        return a.pos - b.pos;
      });

      const classification = ordered.map((c, idx) => {
        const posNum = c.retired ? 'RIT' : idx + 1;
        const pts = (!c.retired && idx < ptsTable.length) ? ptsTable[idx] : 0;
        const driver = gameState.drivers.find(d => d.id === c.driverId);
        const team = getTeam(c.teamId);

        if (driver && team) {
          driver.points = (driver.points || 0) + pts;
          team.points = (team.points || 0) + pts;
          if (!c.retired && idx === 0) {
            driver.wins = (driver.wins || 0) + 1;
            team.wins = (team.wins || 0) + 1;
          }
          if (!c.retired && idx < 3) {
            driver.podiums = (driver.podiums || 0) + 1;
            team.podiums = (team.podiums || 0) + 1;
          }

          if (c.isUser) {
            if (!c.retired && idx <= 2) adjustDriverMood(driver.id, 6, `Podio in gara a ${track.name}`);
            else if (!c.retired && idx <= 9) adjustDriverMood(driver.id, 2, `A punti a ${track.name}`);
            else adjustDriverMood(driver.id, -4, `Gara difficile fuori dai punti a ${track.name}`);
          }
        }

        return {
          driverId: c.driverId,
          pos: posNum,
          name: c.name,
          code: c.code,
          teamId: c.teamId,
          isUser: c.isUser,
          pitStops: c.pitStops,
          bestLap: c.bestLapTime,
          pts
        };
      });

      const winnerRow = classification[0];
      gameState.completedRounds = gameState.completedRounds || [];
      if (!gameState.completedRounds.some(x => x.round === gameState.round)) {
        gameState.completedRounds.push({
          round: gameState.round,
          name: track.name,
          winnerCode: winnerRow?.code || '-'
        });
      }

      gameState.weekend.results = classification;
      gameState.weekend.phase = 'summary';
      generatePostSessionPress('race', { classification });
      saveGame();
      renderApp();
    }

    function renderRaceSummaryView() {
      const res = gameState.weekend.results || [];
      const track = CALENDAR_2026[gameState.round - 1];
      const postQuotes = (gameState.mediaFeed || []).filter(m => m.round === gameState.round && m.source.includes('Post-GP')).slice(0, 2);

      return `
        <div class="p-4 space-y-3.5">
          <div class="bg-f1card border border-f1border rounded-2xl p-4">
            <span class="text-[10px] font-bold uppercase tracking-wider text-emerald-400">Bandiera a Scacchi • Post-Gara</span>
            <h2 class="text-lg font-extrabold text-white mt-0.5">${track.flag} Risultati GP ${track.name}</h2>
          </div>

          ${postQuotes.length > 0 ? `
            <div class="bg-f1card border border-amber-500/40 rounded-2xl p-3 space-y-1.5">
              <div class="text-[10px] font-extrabold uppercase text-amber-300">Reazioni Stampa & Paddock</div>
              ${postQuotes.map(q => `<div class="text-xs text-slate-200 leading-snug">${q.text}</div>`).join('')}
            </div>
          ` : ''}

          <div class="bg-f1card border border-f1border rounded-2xl p-3 max-h-64 overflow-y-auto no-scrollbar space-y-1">
            ${res.map(row => `
              <div class="flex items-center justify-between text-xs px-2 py-1.5 rounded-lg ${row.isUser ? 'bg-slate-800/90 font-bold text-white' : 'text-slate-200'}">
                <div class="flex items-center gap-2">
                  <span class="font-mono-num w-6 text-amber-300">${row.pos}</span>
                  <span class="w-2 h-2 rounded-full" style="background:${getTeam(row.teamId).color}"></span>
                  <span>${row.name}</span>
                </div>
                <div class="flex items-center gap-3 font-mono-num">
                  <span class="text-[10px] text-slate-400">${row.pitStops} pit</span>
                  <span class="text-emerald-400 font-bold">+${row.pts}</span>
                </div>
              </div>
            `).join('')}
          </div>

          <button onclick="advanceToNextRound()" class="w-full py-4 rounded-xl bg-f1red hover:bg-red-600 font-extrabold text-sm text-white shadow-lg shadow-f1red/25">
            ${gameState.round < 24 ? `PROSSIMO GP (${gameState.round + 1}/24) →` : 'CHIUDI STAGIONE 2026 →'}
          </button>
        </div>
      `;
    }

    function advanceToNextRound() {
      const team = getUserTeam();
      const gpBonus = Math.max(2.5, (12 - team.objective) * 0.55);
      team.budget = Number((team.budget + gpBonus).toFixed(1));

      const remaining = [];
      (gameState.pendingUpgrades || []).forEach(upg => {
        upg.racesLeft -= 1;
        if (upg.racesLeft <= 0) {
          team[upg.area] = Number((team[upg.area] + upg.gain).toFixed(1));
          gameState.newsFeed.unshift(`AGGIORNAMENTO CONSEGNATO: +${upg.gain} ${upg.area.toUpperCase()} per ${team.name}!`);
        } else {
          remaining.push(upg);
        }
      });
      gameState.pendingUpgrades = remaining;
      gameState.pendingUpgradeConfirm = null;

      if (gameState.round >= 24) {
        alert(`Stagione 2026 completata! ${team.name} chiude con ${team.points} punti.`);
        resetCareer();
        return;
      }

      gameState.round += 1;
      gameState.weekend = initWeekendState(gameState.round, gameState.userTeamId, gameState.drivers);
      gameState.activeTab = 'hub';
      generatePaddockPressForRound(gameState.round);
      saveGame();
      renderApp();
    }

    function requestUpgradeConfirm(area, tierKey) {
      const team = getUserTeam();
      const tier = RND_TIERS[tierKey];
      if (!team || !tier) return;
      if (team.budget < tier.cost) {
        showToast('Budget insufficiente per questo pacchetto!', 'danger');
        return;
      }
      gameState.pendingUpgradeConfirm = {
        area,
        tierKey,
        label: tier.label,
        cost: tier.cost,
        races: tier.races,
        gain: tier.gain,
        refund50: Number((tier.cost * 0.5).toFixed(1))
      };
      saveGame();
      renderApp();
    }

    function cancelUpgradeConfirm() {
      gameState.pendingUpgradeConfirm = null;
      saveGame();
      renderApp();
    }

    function confirmAndBuyUpgrade() {
      const pending = gameState.pendingUpgradeConfirm;
      const team = getUserTeam();
      if (!pending || !team || team.budget < pending.cost) return;

      team.budget = Number((team.budget - pending.cost).toFixed(1));
      gameState.pendingUpgrades = gameState.pendingUpgrades || [];
      gameState.pendingUpgrades.push({
        id: `upg_${Date.now()}_${Math.random().toString(36).slice(2, 6)}`,
        area: pending.area,
        tierLabel: pending.label,
        cost: pending.cost,
        racesLeft: pending.races,
        gain: pending.gain
      });
      gameState.pendingUpgradeConfirm = null;
      showToast(`Confermato ${pending.label} (${pending.area.toUpperCase()}) in arrivo in ${pending.races} GP!`, 'success');
      saveGame();
      renderApp();
    }

    function cancelPendingUpgradeWithRefund(upgradeId) {
      const team = getUserTeam();
      const list = gameState.pendingUpgrades || [];
      const idx = list.findIndex(u => u.id === upgradeId);
      if (idx < 0 || !team) return;

      const item = list[idx];
      const refund = Number((item.cost * 0.5).toFixed(1));
      team.budget = Number((team.budget + refund).toFixed(1));
      list.splice(idx, 1);
      showToast(`Sviluppo annullato: rimborsato il 50% (€${refund.toFixed(1)}M).`, 'info');
      saveGame();
      renderApp();
    }

    function renderRndView() {
      const team = getUserTeam();
      const pendingList = gameState.pendingUpgrades || [];
      const confirmBox = gameState.pendingUpgradeConfirm;
      const areas = [
        { key: 'aero', label: 'Aerodinamica', val: team.aero },
        { key: 'pu', label: 'Power Unit', val: team.pu },
        { key: 'chassis', label: 'Telaio', val: team.chassis },
        { key: 'rel', label: 'Affidabilita', val: team.rel }
      ];

      return `
        <div class="p-4 space-y-3.5">
          <div class="bg-f1card border border-f1border rounded-2xl p-4 flex items-center justify-between">
            <div>
              <span class="text-[10px] font-bold uppercase tracking-wider text-f1red">Reparto Tecnico</span>
              <h2 class="text-lg font-extrabold text-white">Sviluppo Vettura</h2>
            </div>
            <div class="text-right font-mono-num">
              <div class="text-sm font-black text-emerald-400">€${team.budget.toFixed(1)}M</div>
              <div class="text-[10px] text-slate-400">Rimborso annullo: 50%</div>
            </div>
          </div>

          ${confirmBox ? `
            <div class="bg-amber-950/60 border border-amber-400 rounded-2xl p-3.5 space-y-2.5">
              <div class="text-xs font-black uppercase text-amber-300">Conferma Aggiornamento Auto</div>
              <div class="text-xs text-slate-100 leading-snug">
                Vuoi avviare <strong>${confirmBox.label} (${confirmBox.area.toUpperCase()})</strong> per <strong>+${confirmBox.gain}</strong> in <strong>${confirmBox.races} GP</strong>?
              </div>
              <div class="text-[11px] font-mono-num text-amber-200">
                Costo: <strong>€${confirmBox.cost.toFixed(1)}M</strong> • Se annulli poi recuperi il 50% (<strong>€${confirmBox.refund50.toFixed(1)}M</strong>).
              </div>
              <div class="grid grid-cols-2 gap-2 pt-1">
                <button onclick="cancelUpgradeConfirm()" class="py-2 rounded-xl bg-slate-800 text-slate-200 text-xs font-bold">
                  Annulla
                </button>
                <button onclick="confirmAndBuyUpgrade()" class="py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-extrabold">
                  Conferma Ordine
                </button>
              </div>
            </div>
          ` : ''}

          ${areas.map(ar => `
            <div class="bg-f1card border border-f1border rounded-2xl p-3.5 space-y-2.5">
              <div class="flex items-center justify-between">
                <span class="text-sm font-extrabold text-white">${ar.label}</span>
                <span class="text-sm font-mono-num font-black text-sky-300">${ar.val.toFixed(1)}</span>
              </div>
              <div class="grid grid-cols-3 gap-1.5">
                ${Object.values(RND_TIERS).map(tier => `
                  <button onclick="requestUpgradeConfirm('${ar.key}', '${tier.id}')" class="p-2 rounded-xl bg-f1bg hover:bg-slate-800 border border-f1border text-left transition">
                    <div class="text-[11px] font-extrabold text-white">${tier.label}</div>
                    <div class="text-[10px] font-mono-num text-emerald-400">€${tier.cost}M • +${tier.gain}</div>
                    <div class="text-[9px] text-slate-400">${tier.races} GP</div>
                  </button>
                `).join('')}
              </div>
            </div>
          `).join('')}

          <div class="bg-f1card border border-f1border rounded-2xl p-3.5 space-y-2">
            <h3 class="text-xs font-bold uppercase tracking-wider text-slate-300">Sviluppi in Corso (${pendingList.length})</h3>
            ${pendingList.length === 0 ? `<div class="text-xs text-slate-500">Nessun aggiornamento in lavorazione.</div>` : ''}
            ${pendingList.map(u => {
              const refundAmt = (u.cost * 0.5).toFixed(1);
              return `
                <div class="flex items-center justify-between gap-2 text-xs bg-f1bg p-2.5 rounded-xl border border-f1border/70">
                  <div>
                    <div class="font-bold text-white">${u.area.toUpperCase()} • ${u.tierLabel} (+${u.gain})</div>
                    <div class="text-[10px] text-amber-300 font-mono-num">Arrivo tra ${u.racesLeft} GP • Pagato €${u.cost.toFixed(1)}M</div>
                  </div>
                  <button onclick="cancelPendingUpgradeWithRefund('${u.id}')" class="px-2.5 py-1.5 rounded-lg bg-red-950 hover:bg-red-900 border border-red-500/50 text-red-200 text-[10px] font-extrabold shrink-0">
                    Annulla (+€${refundAmt}M)
                  </button>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function signFreeAgent(agentId, replaceDriverId) {
      const team = getUserTeam();
      const agentIdx = (gameState.freeAgents || []).findIndex(a => a.id === agentId);
      const oldIdx = gameState.drivers.findIndex(d => d.id === replaceDriverId && d.teamId === team.id);
      if (agentIdx < 0 || oldIdx < 0) return;

      const agent = gameState.freeAgents[agentIdx];
      const oldDriver = gameState.drivers[oldIdx];
      const signingFee = Number((agent.salary * 0.4).toFixed(1));

      if (team.budget < signingFee) {
        showToast('Budget insufficiente per la firma!', 'danger');
        return;
      }

      team.budget = Number((team.budget - signingFee).toFixed(1));
      gameState.freeAgents.splice(agentIdx, 1);

      const newDriverObj = {
        ...agent,
        teamId: team.id,
        role: oldDriver.role || 'co_lead',
        points: 0,
        wins: 0,
        podiums: 0
      };

      gameState.drivers[oldIdx] = newDriverObj;
      gameState.freeAgents.push({
        ...oldDriver,
        teamId: null,
        role: 'co_lead'
      });

      pushMediaQuote('Mercato', `${newDriverObj.name} firma con ${team.name} al posto di ${oldDriver.name}!`);
      showToast(`${newDriverObj.name} ingaggiato per €${signingFee}M!`, 'success');
      saveGame();
      renderApp();
    }

    function renderMarketView() {
      const team = getUserTeam();
      const uDrivers = getUserDrivers();
      const agents = gameState.freeAgents || [];

      return `
        <div class="p-4 space-y-3.5">
          <div class="bg-f1card border border-f1border rounded-2xl p-4 flex items-center justify-between">
            <div>
              <span class="text-[10px] font-bold uppercase tracking-wider text-f1red">Paddock & Contratti</span>
              <h2 class="text-lg font-extrabold text-white">Mercato Piloti</h2>
            </div>
            <div class="text-right font-mono-num text-sm font-black text-emerald-400">€${team.budget.toFixed(1)}M</div>
          </div>

          ${agents.map(fa => {
            const fee = (fa.salary * 0.4).toFixed(1);
            const trait = DRIVER_TRAITS[fa.trait] || DRIVER_TRAITS.tactician;
            return `
              <div class="bg-f1card border border-f1border rounded-2xl p-3.5 space-y-2.5">
                <div class="flex items-center justify-between">
                  <div>
                    <div class="text-sm font-extrabold text-white">#${fa.number} ${fa.name} <span class="text-[10px] text-slate-400">(${fa.age}a)</span></div>
                    <div class="text-[10px] text-slate-400">${trait.icon} ${trait.label} • Ingaggio €${fa.salary}M/anno • Costo firma €${fee}M</div>
                  </div>
                  <div class="font-mono-num text-xs font-black text-sky-300">OVR ${fa.ovr}</div>
                </div>
                <div class="grid grid-cols-2 gap-2">
                  ${uDrivers.map(ud => `
                    <button onclick="signFreeAgent('${fa.id}', '${ud.id}')" class="py-1.5 px-2 rounded-xl bg-f1bg hover:bg-slate-800 border border-f1border text-[10px] font-bold text-slate-200">
                      Sostituisci ${ud.code}
                    </button>
                  `).join('')}
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    function renderStandingsView() {
      const sortedDrivers = [...gameState.drivers].sort((a, b) => (b.points || 0) - (a.points || 0) || (b.wins || 0) - (a.wins || 0));
      const sortedTeams = [...gameState.teams].sort((a, b) => (b.points || 0) - (a.points || 0) || (b.wins || 0) - (a.wins || 0));

      return `
        <div class="p-4 space-y-4">
          <div class="bg-f1card border border-f1border rounded-2xl p-3.5 space-y-1.5">
            <h2 class="text-sm font-extrabold uppercase tracking-wider text-amber-300">Classifica Costruttori</h2>
            ${sortedTeams.map((t, idx) => `
              <div class="flex items-center justify-between text-xs py-1 px-2 rounded-lg ${t.id === gameState.userTeamId ? 'bg-slate-800/90 font-extrabold text-white' : 'text-slate-200'}">
                <div class="flex items-center gap-2">
                  <span class="font-mono-num w-5 text-slate-400">${idx + 1}</span>
                  <span class="w-2.5 h-2.5 rounded-full" style="background:${t.color}"></span>
                  <span>${t.name}</span>
                </div>
                <span class="font-mono-num font-bold text-emerald-400">${t.points || 0} pt</span>
              </div>
            `).join('')}
          </div>

          <div class="bg-f1card border border-f1border rounded-2xl p-3.5 space-y-1.5">
            <h2 class="text-sm font-extrabold uppercase tracking-wider text-sky-300">Classifica Piloti</h2>
            ${sortedDrivers.map((d, idx) => {
              const tm = getTeam(d.teamId);
              return `
                <div class="flex items-center justify-between text-xs py-1 px-2 rounded-lg ${d.teamId === gameState.userTeamId ? 'bg-slate-800/90 font-bold text-white' : 'text-slate-200'}">
                  <div class="flex items-center gap-2">
                    <span class="font-mono-num w-5 text-slate-400">${idx + 1}</span>
                    <span class="w-2 h-2 rounded-full" style="background:${tm.color}"></span>
                    <span>${d.name}</span>
                  </div>
                  <span class="font-mono-num font-bold text-amber-300">${d.points || 0} pt</span>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
    }

    function renderApp() {
      const root = document.getElementById('app');
      if (!root) return;

      if (!gameState) {
        const saved = loadGame();
        if (saved && saved.teams && saved.drivers) {
          gameState = saved;
        } else {
          root.innerHTML = renderTeamSelectScreen();
          return;
        }
      }

      let bodyHtml = '';
      if (gameState.activeTab === 'hub') bodyHtml = renderHubView();
      else if (gameState.activeTab === 'weekend') bodyHtml = renderWeekendView();
      else if (gameState.activeTab === 'calendar') bodyHtml = renderCalendarView();
      else if (gameState.activeTab === 'rnd') bodyHtml = renderRndView();
      else if (gameState.activeTab === 'market') bodyHtml = renderMarketView();
      else if (gameState.activeTab === 'standings') bodyHtml = renderStandingsView();
      else bodyHtml = renderHubView();

      root.innerHTML = `
        ${renderTopHeader()}
        <main class="flex-1 overflow-y-auto pb-4">
          ${bodyHtml}
        </main>
        ${renderBottomNav()}
      `;

      if (gameState.activeTab === 'weekend') {
        if (gameState.weekend.phase === 'quali') {
          startQualiSmoothLoop();
        } else if (gameState.weekend.phase === 'race') {
          startRaceSmoothLoop();
        } else {
          stopAllLoops();
        }
      } else {
        stopAllLoops();
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderApp();
    });
  </script>
</body>
</html>
